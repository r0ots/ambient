<script src="lib.js"></script>

<script>
const f = document.getElementById('f');
f.addEventListener('load', async () => {
  try {
    const w = f.contentWindow, d = f.contentDocument, A = w.AMB, G = A.garden, GV = A.gardenVisual;

      ok(await playing() && !shown() && d.body.classList.contains('coined'), 'barre d\'espace : la musique part (pas aussitôt arrêtée), l\'écran titre s\'en va');

      const box = xs.map((p) => { const lb = GV.label(p, 22, Math.min(Lw.slotW * 0.96, 2 * Math.min(p.roomL, p.roomR) - 2)); return [p.x - lb.width / 2, p.x + lb.width / 2, p.id]; });
      const touch = box.slice(1).filter((b, i) => b[0] < box[i][1]).map((b, i) => box[i][2] + '/' + b[2]);
      ok(!touch.length, 'téléphone (390 px) : les étiquettes ne se touchent pas ' + (touch.join(' ') || box.map((b) => b[2] + ' ' + Math.round(b[1] - b[0])).join(', '))); }
    done();
  } catch (e) { fail(e); }
});
