<!doctype html><html><head><meta charset="utf-8"></head><body style="margin:0">
<!-- S8.7 huge combos (js/city-combos.js, table COMBOS) and their discoveries (js/discoveries.js): the table (≥ 8 combos, one
     with three knobs, one with an effect of the instrument); the mechanics (a zone reached by a hand gesture = « COMBO ×n »,
     a landscape loaded in the zone = nothing; holding fills the charge; notes fill it faster; full = « SUPER ! » with its
     effect for SUPER_BEATS beats, then held = it charges again; let go before = the partial effect falls back; ×2 → ×3
     keeps the charge; Stop drops it); the first SUPER is a discovery (saved, fx('discovery') saying SUPER!, its node
     ready), never twice; out of reach in the Parcours = nothing; free mode = combos and effects, no discovery, no node;
     JUICE 0 / reduced motion: no flash, no shake, a softer effect; each combo transforms the screen (pixels changed);
     cost of a SUPER; older saves (the 15 small combos of S5.10) mapped to the new ids; the notebook. -->
<script src="lib.js"></script>
<script>localStorage.removeItem('ambient.game.combotest');</script>
<iframe id="f" src="../index.html?gamekey=ambient.game.combotest" style="width:1280px;height:800px;border:0"></iframe>
<script>
const f = document.getElementById('f');
f.addEventListener('load', async () => {
  if (f.dataset.ran) return; f.dataset.ran = 1;
  try {
    const w = f.contentWindow, d = f.contentDocument, A = w.AMB, G = A.game, D = A.discoveries, C = A.cityCombos, GV = A.gardenVisual, St = A.store, T = A.tree, GL = A.cityGL; GV.awake = true; // (S9.3: the city stands once the music has been heard)
    w.addEventListener('error', (e) => log('ERROR ' + e.message + ' @' + e.filename + ':' + e.lineno));
    G.setMode('path'); A.garden.welcome(false);
    GV.paused = true; // the mechanics are stepped by hand below (no frame of the app interferes)
    const run0 = D.run; D.run = () => {}; // (the notes played below must not find a gesture)
    const ALL = T.NODES.map((n) => n.id);
    const below = (id) => { const out = new Set([id]); let more = true; while (more) { more = false; for (const n of T.NODES) if (!out.has(n.id) && n.req.some((r) => out.has(r))) { out.add(n.id); more = true; } } return out; };
    const own = (except) => { const no = except ? below(except) : new Set(); G.s.nodes = ALL.filter((n) => !no.has(n)); G.s.ready = []; T.applyLocks(); };
    const fxs = []; const fx0 = A.garden.fx; A.garden.fx = function (k, o) { fxs.push([k, o || {}]); return fx0.apply(this, arguments); };
    let now = 1000; C.clock = () => now;
    const step = (s, each) => { const n = Math.max(1, Math.round(s / 0.05)); for (let i = 0; i < n; i++) { now += s / n; if (each) each(i); C.step(s / n); } };
    const MAC = { light: 0.45, density: 0.35, space: 0.55, nostalgia: 0.25, nature: 0.4 };
    const base = () => { C.stop(); for (const k in MAC) St.set('macro.' + k, MAC[k], 'user'); St.set('fx.echo', 0.3, 'user'); St.set('fx.feedback', 0.55, 'user'); C.touched = {}; GV.shake = null; step(0.2); fxs.length = 0; };
    const turn = (o) => { for (const k in o) St.set(k.includes('.') ? k : 'macro.' + k, o[k], 'user'); };
    const POSE = { orage: { nature: 1, light: 0 }, hyper: { space: 1, nature: 0 }, wire: { nostalgia: 1, light: 1 }, bouchon: { density: 1, space: 1 }, aurore: { nature: 0, light: 0 },
      kaiju: { space: 1, nature: 1 }, disco: { light: 0, density: 1, space: 0 }, miroir: { 'fx.echo': 0.95, light: 1 } };
    const toSuper = () => { let s = 0; while (C.cur && C.cur.phase !== 'super' && s < 30) { step(0.25); s += 0.25; } return s; };

    // --- 1. the table
    const ids = C.COMBOS.map((c) => c.id);
    ok(ids.length >= 8 && new Set(ids).size === ids.length && C.COMBOS.every((c) => c.name && /\.$/.test(c.hint) && c.effect && c.need.every((n) => T.byId[n]) && c.knobs.length >= 2 && POSE[c.id]),
      'table COMBOS : ' + ids.length + ' combos énormes (' + C.COMBOS.map((c) => c.name).join(', ') + '), chacun nom, énigme, effet, nœuds requis, 2 ou 3 réglages');
    ok(C.COMBOS.some((c) => c.n === 3) && C.COMBOS.some((c) => c.knobs.some((k) => k.startsWith('fx.'))), 'un combo à trois réglages (' + C.COMBOS.filter((c) => c.n === 3).map((c) => c.name) + '), un avec un effet de l\'instrument (' + C.COMBOS.filter((c) => c.knobs.some((k) => k.startsWith('fx.'))).map((c) => c.name) + ')');
    const zones = C.COMBOS.map((c) => JSON.stringify(Object.entries(c.zone).sort()));
    ok(new Set(zones).size === zones.length, 'chaque combo sa zone (aucune en double)');
    ok(D.COMBOS.length === C.COMBOS.length && D.COMBOS.every((x) => x.kind === 'combo' && C.byId[x.id]) && D.ALL.length === D.COMBOS.length + 9 && D.GESTES.length === 9, 'découvertes : ' + D.ALL.length + ' = ' + D.COMBOS.length + ' combos énormes + 9 gestes');
    ok(ids.every((id) => T.byId[D.OPENS[id]]) && Object.keys(D.OPENS).every((k) => D.byId[k]), 'table OPENS rebranchée : chaque combo ouvre un nœud (' + ids.map((id) => id + '→' + D.OPENS[id]).join(', ') + ')');
    ok(!GV.COMBO_FX && !GV.drawCombos && !GV.STACK.some((l) => /^combos-/.test(l.id)) && GV.STACK.some((l) => l.id === 'combo-sky') && !D.onStep && !D.on, 'ancien système supprimé : plus de COMBO_FX ni de calques combos-back/front, plus de jugement au pas');

    // --- 2. the mechanics (stopped: the free pulse, 0.75 s a beat)
    own(); base(); step(3);
    ok(!C.cur && !C.any, 'réglages de départ : aucun combo');
    St.setMany({ 'macro.nature': 1, 'macro.light': 0 }, 'preset'); step(3);
    ok(!C.cur, 'un paysage chargé dans la zone (pas de geste) : rien');
    base(); turn(POSE.orage); step(0.1);
    const c1 = fxs.find(([k]) => k === 'combo');
    ok(C.cur && C.cur.id === 'orage' && C.cur.n === 2 && c1 && c1[1].n === 2 && A.garden.FX.combo.pop(c1[1]) === 'COMBO ×2', 'Nature en haut + Lumière en bas à la main : « ' + (c1 && A.garden.FX.combo.pop(c1[1])) + ' » (Orage électrique)');
    step(2); const ch2 = C.cur.charge, l2 = C.L('orage');
    ok(ch2 > 0.25 && ch2 < 0.5 && l2 > 0.2 && C.cur.phase === 'charge', 'tenir : la charge monte (' + ch2.toFixed(2) + ' en 2 s), l\'effet grandit (' + l2.toFixed(2) + ')');
    const tS = 2 + toSuper();
    ok(C.cur && C.cur.phase === 'super' && tS >= 5 && tS <= 7.5, 'pleine : SUPER ! après ' + tS.toFixed(1) + ' s (8 temps), sur un temps');
    const disc = fxs.find(([k]) => k === 'discovery');
    ok(D.has('orage') && disc && disc[1].boom === 'SUPER!' && disc[1].name === 'Orage électrique' && !fxs.some(([k]) => k === 'super'), '1er SUPER = découverte (sauvée, fête « SUPER! · ' + (disc && disc[1].name) + ' »)');
    step(4); ok(C.cur.phase === 'super' && C.L('orage') > 0.95 && C.cur.beats >= 4, 'SUPER : l\'effet en grand, calé sur les temps (temps ' + C.cur.beats + ')');
    step(9.5); ok(C.cur && C.cur.phase === 'charge' && C.cur.rounds === 1 && C.L('orage') >= 0.29, 'après ' + C.SUPER_BEATS + ' temps, tenu : la charge repart (effet soutenu ' + C.L('orage').toFixed(2) + ')');
    fxs.length = 0; toSuper(); ok(fxs.some(([k]) => k === 'super') && !fxs.some(([k]) => k === 'discovery'), '2e SUPER : la fête SUPER, pas de 2e découverte');
    // let go before the end of the charge: the partial effect falls back
    base(); turn(POSE.hyper); step(2.5); const lh = C.L('hyper'); turn({ space: 0.5 }); step(0.05);
    const gone = !C.cur; step(0.3); const mid = C.L('hyper'); step(2.5);
    ok(gone && lh > 0.2 && mid < lh && mid > 0.01 && !C.L('hyper'), 'relâché avant la fin : le combo tombe, l\'effet partiel retombe (' + lh.toFixed(2) + ' → ' + mid.toFixed(2) + ' → 0)');
    // ×2 → ×3: the charge is kept
    base(); turn(POSE.aurore); step(1.5); const a2 = C.cur && C.cur.id === 'aurore' && C.cur.n === 2, chA = C.cur.charge; fxs.length = 0;
    turn({ density: 1, space: 0 }); step(0.05); const p3 = fxs.find(([k]) => k === 'combo');
    ok(a2 && C.cur.id === 'disco' && C.cur.n === 3 && C.cur.charge >= chA && p3 && A.garden.FX.combo.pop(p3[1]) === 'COMBO ×3', 'Aurore (×2) puis Densité haut + Espace bas : « COMBO ×3 » (Blackout disco), la charge gardée (' + chA.toFixed(2) + ')');
    // the notes heard fill it faster
    const charge = (notes) => { base(); turn(POSE.kaiju); step(2, notes ? (i) => { if (i % 5 === 0) A.bus.emit('live', { midi: 60 + i % 12, time: 1, vel: 0.8, raw: null, id: 9000 + i }); } : null); return C.cur ? C.cur.charge : 0; };
    const c0 = charge(false), cN = charge(true);
    const mel = (() => { base(); turn(POSE.kaiju); step(2, (i) => { if (i % 5 === 0) A.bus.emit('note', { layer: 'bells', midi: 72, time: 1, vel: 0.7 }); }); return C.cur.charge; })();
    ok(cN > c0 + 0.25 && mel > c0 + 0.05, 'les notes accélèrent la charge : 2 s sans note ' + c0.toFixed(2) + ', avec tes notes ' + cN.toFixed(2) + ', avec la Mélodie ' + mel.toFixed(2));
    // Stop
    A.bus.emit('panic'); ok(!C.cur, '■ Stop : le combo tombe');
    // out of reach in the Parcours (Grands réglages not open)
    own('t.macros'); base(); turn(POSE.wire); step(1); ok(!C.cur, 'Parcours, Grands réglages pas ouverts : jamais');
    own('e.echo'); base(); turn(POSE.miroir); step(1); ok(!C.cur, 'Ville miroir sans l\'Écho ouvert : jamais');

    // --- 3. each combo: its first SUPER is its discovery, its node ready (or the next one), never a near miss
    const bad = [], rep = [];
    for (const c of C.COMBOS) {
      if (D.has(c.id)) continue;
      const op = D.OPENS[c.id]; own(op); // (the node it opens not owned yet)
      base(); const near = { ...POSE[c.id] }; const k0 = Object.keys(near)[0]; near[k0] = POSE[c.id][k0] > 0.5 ? 0.7 : 0.3; turn(near); step(1);
      const nearOn = C.cur && C.cur.id === c.id;
      base(); turn(POSE[c.id]); step(0.1); const on = C.cur && C.cur.id === c.id; fxs.length = 0; toSuper();
      const found = D.has(c.id), party = fxs.some(([k, o]) => k === 'discovery' && o.name === c.name && o.boom === 'SUPER!'), ready = G.isReady(op) || (D.state().opened || {})[c.id];
      const miss = [nearOn && 'raté-proche', !on && 'pas ON', !found && 'non trouvé', !party && 'pas de fête', !ready && 'nœud pas prêt'].filter(Boolean);
      if (miss.length) bad.push(c.id + ':' + miss.join('+')); else rep.push(c.id + '→' + ((D.state().opened || {})[c.id] || op));
    }
    ok(!bad.length, 'chaque combo : rien sur un raté proche ; ×n, charge, SUPER ; découverte fêtée ; nœud prêt ' + (bad.join(' ') || rep.join(', ')));
    ok(D.foundCount() === C.COMBOS.length && JSON.parse(localStorage.getItem('ambient.game.combotest')).secrets.found.disco, 'toutes les découvertes de combos sauvées (' + D.foundCount() + ')');

    // --- 4. free mode: combos and their effects (the instrument), no discovery, no node, the pop shown
    await wait(20); // (the moments queued above, all in one task, play now: a microtask)
    { G.setMode('free'); GV.paused = true; const f0 = D.foundCount(), r0 = (G.s.ready || []).length; base(); D.state().found = {}; turn(POSE.bouchon); step(0.1); const on = C.cur && C.cur.id === 'bouchon' && fxs.some(([k]) => k === 'combo');
      await wait(30); const pop = A.garden.fxLast && A.garden.fxLast.kind === 'combo';
      toSuper(); step(0.6); const sup = fxs.some(([k]) => k === 'super') && !fxs.some(([k]) => k === 'discovery');
      ok(on && pop && sup && !D.foundCount() && C.L('bouchon') > 0.9 && D.box.hidden, 'mode libre : COMBO ×2 et SUPER joués (l\'instrument), aucune découverte ni nœud, pas de carnet');
      G.setMode('path'); GV.paused = true; }

    // --- 5. JUICE 0 / reduced motion: no flash, no shake, softer
    { own(); D.state().found = Object.fromEntries(ids.map((id) => [id, 1]));
      A.motion.set({ juice: 0 }); base(); turn(POSE.orage); step(0.1); fxs.length = 0; GL.pulses.length = 0; toSuper(); await wait(30);
      const fl = GL.value('flash'), sh = GL.value('shake'), did = (A.garden.fxLast || {}).did || [];
      ok(C.cur.phase === 'super' && fl === 0 && sh === 0 && !did.includes('flash') && !did.includes('boom') && C.soft() < 1 && !GV.shake, 'JUICE 0 : SUPER sans flash ni secousse (flash ' + fl + ', secousse ' + sh + '), effet doux (×' + C.soft() + ')');
      A.motion.set({ juice: 1 }); GV.reduced = true; base(); turn(POSE.wire); step(0.1); const lr = C.L('wire'); fxs.length = 0; GL.pulses.length = 0; const T0 = C.T; toSuper(); await wait(30);
      const did2 = (A.garden.fxLast || {}).did || [];
      ok(lr > 0.09 && GL.value('flash') === 0 && GL.value('shake') === 0 && !did2.includes('flash') && C.T === T0 && C.soft() < 1, 'mouvement réduit : l\'effet est là tout de suite (' + lr.toFixed(2) + '), immobile, sans flash ni secousse');
      GV.reduced = false; }

    // --- 6. each SUPER transforms the screen (pixels that change vs the same city without it), and its cost
    { own(); base(); for (const id of ['drone', 'pad', 'bells', 'texture', 'grains', 'seq', 'bass', 'perc']) St.set(id + '.on', true, 'user'); // (S9.3: a full city = every layer active)
      A.perform.setMode('listen'); A.visual.gardenSync(); GV.active = true; GV.visible = true; GV.post2d = true; // (1984 drawn in 2D: no WebGL here)
      const W0 = 640, H0 = 400, cv = d.createElement('canvas'); cv.width = W0; cv.height = H0; const g = cv.getContext('2d');
      const frame = (n) => { for (let i = 0; i < n; i++) { GV.lastT = GV.now() - 33; GV.paused = false; GV.frame(g, W0, H0); GV.paused = true; } return g.getImageData(0, 0, W0, H0).data; };
      const stepC = C.step.bind(C); let force = null; C.step = function (dt) { if (force) { this.cur = force; this.lvl = { [force.id]: 1 }; this.any = true; this.T = GV.st; return 1; } return stepC(dt); };
      GV.refresh(W0, H0, true); force = null; C.stop(); frame(150); const ref = frame(40); // (the buildings just switched on are built first)
      const rep2 = [], weak = [], wash = [], washed = []; let wire = null;
      for (const c of C.COMBOS) {
        force = { id: c.id, n: c.n, phase: 'super', charge: 1, beats: 9, sp: 0.6, rounds: 0, left: false }; C.bolts.length = 0; if (c.id === 'orage') { C.strike(C.roofs()[0], 1); C.strike(null, 2); }
        const px = frame(12); let n = 0; for (let i = 0; i < px.length; i += 16) if (Math.abs(px[i] - ref[i]) + Math.abs(px[i + 1] - ref[i + 1]) + Math.abs(px[i + 2] - ref[i + 2]) > 30) n++;
        const share = n / (px.length / 16); rep2.push(c.id + ' ' + Math.round(share * 100) + ' %'); if (share < 0.08) weak.push(c.id);
        let wh = 0, dk = 0, gr = 0; for (let i = 0; i < px.length; i += 16) { const r = px[i], gg = px[i + 1], b = px[i + 2]; if (r > 225 && gg > 225 && b > 225) wh++; if (r + gg + b < 60) dk++; if (Math.max(r, gg, b) > 150) gr++; }
        const N = px.length / 16; wash.push(c.id + ' ' + (100 * wh / N).toFixed(1) + ' %'); if (wh / N > 0.04) washed.push(c.id);
        if (c.id === 'wire') wire = { dark: dk / N, green: gr / N };
      }
      ok(!washed.length, 'S8.8 : aucun SUPER ne lave l\'image en blanc (pixels blancs : ' + wash.join(', ') + ')' + (washed.length ? ' — lavés : ' + washed : ''));
      ok(wire && wire.dark > 0.55 && wire.green > 0.002 && wire.green < 0.25, 'S8.8 : 1984 = écran noir (' + Math.round(wire.dark * 100) + ' %) et fines lignes vectorielles (' + (wire.green * 100).toFixed(1) + ' % de pixels allumés), tracées depuis le modèle');
      ok(!weak.length, 'chaque SUPER change l\'écran (part des pixels, 640×400, sans WebGL) : ' + rep2.join(', ') + (weak.length ? ' — trop faibles : ' + weak : ''));
      // cost at 1280×800: each combo in SUPER, frames in a burst, median of the JS of the whole city
      const big = d.createElement('canvas'); big.width = 1280; big.height = 800; const gb = big.getContext('2d');
      const med = () => { for (let i = 0; i < 20; i++) { GV.lastT = GV.now() - 16; GV.paused = false; GV.frame(gb, 1280, 800); GV.paused = true; } GV.times.length = 0; C.times.length = 0; for (let i = 0; i < 40; i++) { GV.lastT = GV.now() - 16; GV.paused = false; GV.frame(gb, 1280, 800); GV.paused = true; } const a = GV.times.slice().sort((x, y) => x - y); return a[a.length >> 1]; };
      force = null; C.stop(); GV.refresh(1280, 800, true); const m0 = med(); const costs = [];
      for (const c of C.COMBOS) { force = { id: c.id, n: c.n, phase: 'super', charge: 1, beats: 9, sp: 0.6, rounds: 0, left: false }; const m = med(); costs.push([c.id, m, C.stats().med]); }
      const worst = costs.reduce((a, b) => (b[1] > a[1] ? b : a));
      ok(worst[1] < m0 + 4, '1280×800 (canevas logiciel) : ville seule ' + m0.toFixed(2) + ' ms ; en SUPER ' + costs.map(([id, m, cc]) => id + ' ' + m.toFixed(2) + ' (combo ' + cc.toFixed(2) + ')').join(', '));
      C.step = stepC; force = null; C.stop(); GV.paused = true; }

    // --- 7. the notebook: combos found (name, effect, node), riddles « ??? » with their hint
    { own(); D.state().found = { orage: 1, tons: 2 }; D.state().opened = { orage: 'e.texture' }; A.garden.showTree(true); await wait(30); const box = d.getElementById('discoveries'), head = box.querySelector('.dc-head');
      if (box.classList.contains('min')) head.click();
      const o = box.querySelector('.dc-item[data-id="orage"]'), h = box.querySelector('.dc-item[data-id="hyper"]');
      ok(/Orage électrique/.test(o.textContent) && /foudre/.test(o.textContent) && /Texture ouvert/.test(o.textContent) && h.querySelector('b').textContent === '???' && h.querySelector('span').textContent === C.byId.hyper.hint && o.classList.contains('combo'),
        'carnet : « ' + head.textContent + ' » ; trouvé = nom, effet, nœud ouvert ; silhouette « ??? » et son énigme');
      A.garden.showTree(false); }

    // --- 8. an older save: the 15 small combos of S5.10 → the huge ones, secrets kept
    localStorage.setItem('ambient.game.combotest', JSON.stringify({ v: 1, mode: 'path', nodes: ['racine', 'm.bells', 'h.pad'], contracts: [], active: [], prog: {}, skipped: [], ended: false, secrets: { found: { tons: 1, jazz: 2, brume: 3, vhs: 4, maree: 5, cathedrale: 6 }, midi: false, opened: { jazz: 'h.prog', brume: 'e.halo' }, gifts: { timbres: [{ sec: 'bells', opt: 'Givre' }] } } }));
    await new Promise((r) => { f.addEventListener('load', r, { once: true }); w.location.reload(); }); await wait(200);
    { const A2 = f.contentWindow.AMB, D2 = A2.discoveries, G2 = A2.game, q = D2.state();
      ok(D2.has('tons') && D2.has('jazz') && D2.has('kaiju') && D2.has('wire') && D2.has('aurore') && D2.foundCount() === 5 && !q.found.brume && !q.found.vhs && q.opened.kaiju === 'e.halo' && G2.isReady('h.prog') && A2.SCHEMA.bells.params.wave.options.includes('Givre'),
        'ancienne sauvegarde (S5.10) : Brume néon → Kaiju, Signal 2089 → 1984, Marée + Cathédrale → Aurore ; ' + D2.foundCount() + ' découvertes, nœuds et Givre gardés');
      G2.reset(); }
    D.run = run0; localStorage.removeItem('ambient.game.combotest');
    done();
  } catch (e) { fail(e); }
});
</script></body></html>
