<!doctype html><html><head><meta charset="utf-8"></head><body>
<!-- 390 px (a phone): in free mode (everything open), no screen mode makes the page wider than the screen
     (the transport bar, the Pulsations grid and the Morceau panel used to push it to ~520 px). -->
<script src="lib.js"></script>
<script>localStorage.removeItem('ambient.game.narrow');</script>
<iframe id="f" src="../index.html?gamekey=ambient.game.narrow" style="width:390px;height:780px"></iframe>
<script>
const f=document.getElementById('f');
f.addEventListener('load', async ()=>{ try{
  const w=f.contentWindow, d=f.contentDocument, A=w.AMB, de=d.documentElement;
  A.game.setMode('free'); A.garden.welcome(false); A.song.add(); A.song.add(); A.song.add(); await wait(300);
  for (const m of ['sculpt','compose']) { A.perform.setMode(m); await wait(200);
    // elements past the right edge, outside a container that scrolls on its own
    const past=[...d.querySelectorAll('body *')].filter(e=>{ if(e.classList.contains('m-wipe')) return false; /* (S7.1: a view change's scan, fixed, click-through, gone after 0.3 s) */ const r=e.getBoundingClientRect(); if(!r.width || r.right<=de.clientWidth+1 || !e.getClientRects().length) return false; const dt=e.parentElement && e.parentElement.closest('details'); if(dt && !dt.open && !e.closest('summary')) return false; /* (a closed menu is not drawn: Chrome still gives its content stale boxes; open, it is checked below) */
      for(let p=e.parentElement;p&&p!==d.body;p=p.parentElement){ const ox=w.getComputedStyle(p).overflowX; if(ox==='auto'||ox==='scroll'||ox==='hidden') return false; } return true; });
    ok(de.scrollWidth<=de.clientWidth+1 && !past.length, '390 px, '+m+' : largeur '+de.scrollWidth+' ≤ '+de.clientWidth+(past.length?' — dépassent : '+past.slice(0,6).map(e=>e.tagName+'.'+String(e.className).split(' ')[0]).join(' '):'')); }
  // the ⋯ menu (and the ▾ of ● Rec) open inside the screen, never past its left or right edge
  for (const sel of ['.more', '.rec-opts']) { const m=d.querySelector(sel); m.open=true; await wait(50);
    const r=m.querySelector('.menu').getBoundingClientRect(); m.open=false;
    ok(r.left>=0 && r.right<=de.clientWidth+1, '390 px : menu '+sel+' dans l\'écran ('+Math.round(r.left)+'–'+Math.round(r.right)+')'); }
  done(); }catch(e){fail(e);} });
</script></body></html>
