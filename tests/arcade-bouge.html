<!doctype html><html><head><meta charset="utf-8"></head><body>
<!-- Mini-game « Qu'est-ce qui a bougé ? » (G9.4): pure engine, injected clock, no real audio (≤ 10 s). -->
<script src="lib.js"></script>
<script>window.AMB_ARCADE_KEY='ambient.arcade.test-bouge'; localStorage.removeItem(window.AMB_ARCADE_KEY); testBus();</script>
<script src="../js/audition.js"></script><script src="../js/arcade.js"></script><script src="../js/arcade/bouge.js"></script>
<script>
window.addEventListener('load', async () => {
  try {
    const A = AMB.arcade; let T = 0; A.clock = { now: () => T };
    ok(!!A, 'moteur d\'arcade chargé');
    const G = A.byId.bouge, P = G.PARAMS, IDS = Object.keys(P);
    ok(G && G.kid === true && typeof G.make === 'function' && typeof G.play === 'function', 'plugin enregistré (kid)');
    // Math.random must never be called
    const mr = Math.random; let mrCalls = 0; Math.random = function () { mrCalls++; return mr(); };
    // store writes: a fake store that counts
    let storeWrites = 0; AMB.store = { set() { storeWrites++; }, setMany() { storeWrites++; }, get() {} };
    const rng = (s) => AMB.audition.rng(s);
    const J = (x) => JSON.stringify(x);

    // --- determinism
    ok(J(G.make(rng(7), 0.6)) === J(G.make(rng(7), 0.6)) && J(G.make(rng(7), 0.6)) !== J(G.make(rng(8), 0.6)), 'make déterministe pour une graine');

    // --- invariants over many challenges, across the whole difficulty range
    let n = 0, bad = { one: 0, inChoices: 0, uniq: 0, min: 0, nch: 0, sameFam: 0, crossFam0: 0, pool: 0, check: 0, ev: 0, rythMs: 0 };
    const seen = { 0: new Set(), 1: new Set() };
    for (let s = 1; s <= 400; s++) {
      const d = (s % 11) / 10 > 1 ? 1 : Math.min(1, (s % 11) / 10);
      const ch = G.make(rng(s), d); n++;
      const df = G.diff(ch.a, ch.b);
      if (df.length !== 1 || df[0] !== ch.answer) { bad.one++; if (bad.one < 3) log('diff ' + J(df) + ' vs ' + ch.answer + ' d=' + d); }
      const cs = G.choices(ch).map((c) => c.value);
      if (!cs.includes(ch.answer)) bad.inChoices++;
      if (new Set(cs).size !== cs.length || cs.some((v) => !P[v])) bad.uniq++;
      if (cs.length !== G.nChoices(d)) bad.nch++;
      if (cs.some((v) => !G.pool(d).includes(v))) bad.pool++;
      // amplitude ≥ inaudible threshold
      const amt = G.amount(ch.answer, d), m = G.MIN[ch.answer];
      const okAmt = ch.answer === 'duree' ? amt >= m : amt >= m;
      if (!okAmt) bad.min++;
      if (ch.answer === 'tempo' && Math.abs(ch.b.beat / ch.a.beat - 1) < G.MIN.tempo - 1e-9 && Math.abs(ch.a.beat / ch.b.beat - 1) < G.MIN.tempo - 1e-9) bad.min++;
      if (ch.answer === 'rythme') { const S = ch.a.mel.some((x, i) => x.b !== ch.b.mel[i].b) ? ch.a : null; const i = ch.a.mel.findIndex((x, k) => x.b !== ch.b.mel[k].b); if (Math.abs(ch.a.mel[i].b - ch.b.mel[i].b) * Math.min(ch.a.beat, ch.b.beat) < 0.09) bad.rythMs++; }
      // same-family decoys at d = 1, other families only at d = 0
      const fam = P[ch.answer].fam, sameAvail = G.pool(d).filter((p) => p !== ch.answer && P[p].fam === fam);
      if (d === 1 && !sameAvail.every((p) => cs.includes(p))) bad.sameFam++;
      if (d === 0 && cs.some((v) => v !== ch.answer && P[v].fam === fam)) bad.crossFam0++;
      if (!G.check(ch, ch.answer).ok || cs.filter((v) => G.check(ch, v).ok).length !== 1) bad.check++;
      const ev = G.stimulus(ch);
      if (!ev.length || ev.some((e) => !(e.dur > 0) || !(e.vel > 0 && e.vel <= 1) || !['sine', 'triangle', 'pluck', 'bell'].includes(e.voice) || e.midi < 28 || e.midi > 110 || !(e.t >= 0))) bad.ev++;
      if (d === 0) seen[0].add(ch.answer); if (d === 1) seen[1].add(ch.answer);
    }
    ok(!bad.one, `exactement un réglage diffère entre A et B (${n} défis)`);
    ok(!bad.inChoices && !bad.check, 'la bonne réponse est toujours parmi les choix, une seule est juste');
    ok(!bad.uniq && !bad.nch && !bad.pool, 'choix distincts, connus, du bon nombre, débloqués au niveau');
    ok(!bad.min && !bad.rythMs, 'amplitude ≥ seuil audible (carte des réglages inaudibles)');
    ok(!bad.sameFam, 'd=1 : tous les leurres de la même famille perceptive sont proposés');
    ok(!bad.crossFam0, 'd=0 : leurres d\'une autre famille (contraste net)');
    ok(!bad.ev, 'stimulus valide (voix d\'audition, vélocités ≤ 1, registres audibles)');
    ok([...seen[0]].every((p) => G.pool(0).includes(p)) && seen[0].size >= 4 && seen[1].size >= 9, `variété : ${seen[0].size} réglages à d=0, ${seen[1].size} à d=1`);

    // --- difficulty range: 2 → 6 choices, amplitudes shrink, MIN respected all along
    ok(G.nChoices(0) === 2 && G.nChoices(1) === 6 && G.nChoices(0.5) === 4, 'choix : 2 (d=0) → 4 (d=0,5) → 6 (d=1)');
    let mono = true, aboveMin = true;
    for (const id of IDS) {
      for (let d = 0; d <= 1.0001; d += 0.05) { const a = G.amount(id, d); if (a < G.MIN[id] - 1e-9) { aboveMin = false; log('sous le seuil ' + id + ' d=' + d.toFixed(2) + ' ' + a); } if (G.amount(id, d + 0.05) > a + 1e-9) mono = false; }
    }
    ok(aboveMin && mono, 'amplitudes décroissantes avec d, jamais sous le seuil');
    const fine = ['transpo', 'tempo', 'volume', 'brillance', 'duree', 'rythme', 'melodie', 'accord', 'densite'];
    ok(fine.every((id) => G.amount(id, 1) < G.amount(id, 0)), 'd=1 plus fin que d=0 : ' + fine.map((id) => id + ' ' + +G.amount(id, 0).toFixed(2) + '→' + +G.amount(id, 1).toFixed(2)).join(', '));
    ok(G.pool(0).length === 5 && G.pool(1).length === IDS.length, `réglages débloqués : ${G.pool(0).length} (d=0) → ${G.pool(1).length} (d=1)`);
    ok(IDS.every((id) => /^\S+ \S/.test(P[id].label)), 'libellés icône + mot');

    // --- a round through the engine: check right / wrong, staircase moves
    A.stats('bouge').d = 0; A.stats('bouge').step = 0.12;
    A.start('bouge', { seed: 11 });
    const r = A.round; let x = A.answer(r.ch.answer); ok(x.ok && x.pts > 0, 'bonne réponse : points');
    const wrong = A.choices().find((c) => c.value !== r.ch.answer).value;
    x = A.answer(wrong); ok(!x.ok && x.pts === 0, 'mauvaise réponse : 0 point');
    for (let i = 0; i < 16; i++) A.answer(r.ch.answer);
    ok(r.stair.d > 0.4 && A.choices().length >= 4, 'escalier : niveau ' + r.stair.d.toFixed(2) + ', ' + A.choices().length + ' choix');
    A.end({ abort: true });

    // --- rendered audio (OfflineAudioContext): the volume and brightness changes are really there
    const render = async (S) => {
      const ctx = new OfflineAudioContext(1, Math.ceil(22050 * (4 * S.beat + 0.5)), 22050);
      AMB.audition.play(G.loop(S, 0), { ctx, when: 0 });
      const buf = (await ctx.startRendering()).getChannelData(0);
      let e = 0, de = 0; for (let i = 1; i < buf.length; i++) { e += buf[i] * buf[i]; de += (buf[i] - buf[i - 1]) ** 2; }
      // rms of the derivative / rms = mean frequency of the spectrum (Hz): a brightness measure
      return { rms: Math.sqrt(e / buf.length), hz: Math.sqrt(de / e) * 22050 / (2 * Math.PI) };
    };
    const find = (id, d) => { for (let s = 1; s < 500; s++) { const ch = G.make(rng(s), d); if (ch.answer === id) return ch; } return null; };
    { const ch = find('volume', 1), ra = await render(ch.a), rb = await render(ch.b), db = Math.abs(20 * Math.log10(ra.rms / rb.rms));
      ok(db >= G.MIN.volume - 0.1, 'rendu : volume à d=1, écart ' + db.toFixed(1) + ' dB ≥ ' + G.MIN.volume); }
    { const ch = find('brillance', 1), ra = await render(ch.a), rb = await render(ch.b), lo = Math.min(ra.hz, rb.hz), hi = Math.max(ra.hz, rb.hz);
      ok(hi / lo >= 1.15, 'rendu : brillance à d=1, fréquence moyenne du spectre ' + lo.toFixed(0) + ' → ' + hi.toFixed(0) + ' Hz (×' + (hi / lo).toFixed(2) + ')'); }
    { const ch = find('transpo', 0), ra = await render(ch.a), rb = await render(ch.b);
      ok(ra.rms > 0.01 && rb.rms > 0.01, 'rendu : la boucle sonne (rms ' + ra.rms.toFixed(3) + ')'); }

    Math.random = mr;
    ok(mrCalls === 0, 'Math.random jamais appelé');
    ok(storeWrites === 0, 'aucune écriture dans le store');
    localStorage.removeItem(window.AMB_ARCADE_KEY);
    done();
  } catch (e) { fail(e); }
});
</script></body></html>
