<!doctype html><html><head><meta charset="utf-8"></head><body style="margin:0">
<!-- Jardin visuel (G11.2): positions from the state (deterministic), reaction to the bus events, no gain, pause off
     screen / hidden tab, Parcours-only mode (free mode intact), reduced motion, cost per frame at 1280×800. No audio. -->
<script src="lib.js"></script>
<script>
window.AMB_GAME_KEY = 'ambient.game.test-gv';
[window.AMB_GAME_KEY, 'ambient.vizMode', 'ambient.vizMode.path'].forEach((k) => localStorage.removeItem(k));
testBus(); AMB.engine = {}; // no audio: the visual's classic modes draw without an analyser
// a slice of the real tree (js/tree.js): a node belongs to a layer through its settings
AMB.tree = { NODES: [['racine', 'drone.on'], ['t.son', 'drone.wave'], ['h.drone', 'drone.follow'], ['h.pad', 'pad.on'], ['h.pad2', 'pad.attack'], ['h.prog', 'pad.prog'],
  ['m.bells', 'bells.on'], ['m.phrase', 'bells.mode'], ['m.grains', 'grains.on'], ['c.seq', 'seq.on'], ['c.rythme', 'bass.*'], ['c.rythme', 'perc.*'], ['e.texture', 'texture.*'], ['e.reverb', '*.send']].map(([id, p]) => ({ id, params: [p] })) };
</script>
<script src="../js/game.js"></script><script src="../js/visual.js"></script><script src="../js/garden-visual.js"></script>
<canvas id="c" width="1280" height="800" style="width:640px;height:400px;display:block"></canvas>
<script>
window.addEventListener('load', async () => {
  try {
    const G = AMB.game, V = AMB.visual, GV = AMB.gardenVisual, cv = document.getElementById('c');
    V.c = cv; V.g = cv.getContext('2d'); V.dpr = 1;
    const frame = () => V.draw();

    // --- mode policy: Parcours only, default there; free mode untouched
    ok(V.mode === 'Orbes' && !V.MODES.includes('Jardin'), 'mode non choisi = libre : Orbes, Jardin absent de la liste classique');
    const seen = new Set(); for (let i = 0; i < 6; i++) seen.add(V.cycleMode());
    ok(!seen.has('Jardin') && localStorage.getItem('ambient.vizMode.path') === null, 'libre : le cycle ne propose jamais Jardin (' + [...seen].join(', ') + ')');
    while (V.mode !== 'Horizon') V.cycleMode();
    G.setMode('path');
    ok(V.mode === 'Jardin', 'Parcours : Jardin par défaut');
    const L = []; for (let i = 0; i < 4; i++) L.push(V.cycleMode());
    ok(L.join() === 'Orbes,Horizon,Spectre,Jardin' && localStorage.getItem('ambient.vizMode') === 'Horizon', 'Parcours : Jardin dans le cycle, préférence à part (le choix du libre reste Horizon)');
    G.setMode('free');
    ok(V.mode === 'Horizon', 'retour au libre : son visuel d\'avant (Horizon)');
    V.mode = 'Jardin'; frame();
    ok(V.mode === 'Horizon' && !GV.active, 'libre : un Jardin forcé retombe sur le choix du libre, rien n\'est dessiné');
    G.setMode('path'); ok(V.mode === 'Jardin', 'Parcours : le Jardin revient');

    // --- state read-only, deterministic positions
    G.s.nodes = ['racine', 'h.pad', 'm.bells'];
    const before = { g: JSON.stringify(G.s), lg: localStorage.getItem(G.key) };
    let st = GV.readState();
    ok(st.layers.join() === 'drone,pad,bells' && st.secrets.length === 0, 'une plante par couche débloquée : ' + st.layers.join(', '));
    ok(JSON.stringify(G.s) === before.g, 'lecture seule de l\'état du jeu');
    const l1 = GV.layout(st, 1280, 800), l2 = GV.layout({ ...st, layers: st.layers.slice().reverse() }, 1280, 800);
    ok(JSON.stringify(l1) === JSON.stringify(l2) && JSON.stringify(l1) === JSON.stringify(GV.layout(GV.readState(), 1280, 800)), 'positions déterministes (même état → mêmes positions, ordre des données indifférent)');
    ok(l1.plants.every((p) => p.x > 0 && p.x < 1280) && l1.plants[0].x < l1.plants[1].x && l1.plants[1].x < l1.plants[2].x, 'plantes réparties dans l\'écran, ordre fixe des couches : ' + l1.plants.map((p) => p.x).join(' / '));
    // advanced: more layers and nodes, secrets
    G.s.nodes = ['racine', 'h.pad', 'm.bells', 'm.phrase', 'm.grains', 'c.seq', 'c.rythme', 'e.texture'];
    G.s.secrets = { found: { jazz: 1, tons: 2 } };
    st = GV.readState();
    ok(st.layers.length === 8 && st.levels.bells === 1 && Math.abs(st.levels.drone - 1 / 3) < 1e-9 && Math.abs(st.levels.pad - 1 / 3) < 1e-9 && st.levels.bass === 1, 'taille = part des nœuds de la couche débloqués (Mélodie 2/2, Drone 1/3, Pad 1/3)');
    { const W = 700, H = 360; st.levels.bass = 1; GV.refresh(W, H, true); const tall = GV.plants.find((p) => p.id === 'bass') || GV.plants[0];
      const top = tall.y - GV.sprite({ ...tall, level: 1 }, GV.px).h;
      ok(top >= H * GV.ceil - GV.px, 'plafond : la plus haute plante (niveau 1) reste sous le HUD (haut ' + top + ' px ≥ ' + Math.round(H * GV.ceil) + ' px)');
      GV.sig = null; }
    const a1 = GV.layout(st, 1280, 800), a2 = GV.layout({ ...st, secrets: ['tons'] }, 1280, 800);
    ok(a1.rares.length === 2 && JSON.stringify(a1.plants) === JSON.stringify(a2.plants) && a1.rares.find((r) => r.id === 'secret:tons').x === a2.rares[0].x, 'plantes rares = secrets (2), un secret de plus ne déplace rien d\'autre');
    const sB = GV.sprite(a1.plants.find((p) => p.id === 'bells'), 4), sD = GV.sprite(a1.plants.find((p) => p.id === 'drone'), 4);
    ok(sB.hC > sD.hC + 15, 'plante plus haute quand plus de nœuds de sa couche sont débloqués (' + sB.hC + ' vs ' + sD.hC + ' cellules)');
    const misses = GV.cacheMisses; GV.sprite(a1.plants.find((p) => p.id === 'bells'), 4);
    ok(GV.cacheMisses === misses, 'sprites en cache (pas de re-rendu)');

    // --- reactions to the bus (spies: no gain, no store, no game write)
    const emitted = []; const be = AMB.bus.emit.bind(AMB.bus);
    AMB.bus.emit = (e, d) => { emitted.push(e); return be(e, d); };
    let earns = 0; const ge = G.earn; G.earn = (...x) => { earns++; return ge.apply(G, x); };
    AMB.store = { set: () => { earns += 100; }, setMany: () => { earns += 100; } };
    GV.sig = null; frame(); frame();
    ok(GV.active && GV.plants.length === 8, 'Jardin actif, 8 plantes dessinées');
    const p0 = GV.parts.length;
    AMB.bus.emit('note', { layer: 'bells', midi: 72, time: 0, vel: 0.9, dur: 0.5 });
    AMB.bus.emit('perc', { track: 0, time: 0, vel: 0.8 });
    AMB.bus.emit('grain', { layer: 'grains', midi: 60, time: 0, vel: 0.5 });
    AMB.bus.emit('chord', { time: 0, deg: 0, midis: [60, 64, 67] });
    AMB.bus.emit('note', { layer: 'bells', midi: 72, time: 1e9, vel: 0.9 }); // far in the future: waits for its time
    frame();
    ok(GV.energy.bells > 0.5 && GV.energy.perc > 0.5 && GV.energy.grains > 0.3 && GV.energy.drone > 0.3 && GV.parts.length >= p0 + 4, 'note / perc / grain / chord : la plante pulse et lâche une feuille (' + GV.parts.length + ' particules)');
    ok(GV.pending.length === 1, 'un événement à venir attend son heure audio');
    GV.pending.length = 0;
    for (let i = 0; i < 6; i++) { await wait(120); frame(); }
    ok(GV.energy.bells < 0.5, 'la pulsation retombe (dt réel)');
    G.s.nodes = ['racine']; GV.sig = null; frame();
    const pp = GV.parts.length; AMB.bus.emit('note', { layer: 'seq', midi: 60, time: 0, vel: 1 }); frame();
    ok(!GV.energy.seq && GV.parts.length <= pp, 'couche non débloquée : aucune réaction');
    G.s.nodes = ['racine', 'h.pad', 'm.bells', 'm.grains', 'c.seq', 'c.rythme', 'e.texture']; GV.sig = null;
    // reduced motion: pulse, but no particles
    GV.reduced = true; GV.parts.length = 0; AMB.bus.emit('note', { layer: 'bells', time: 0, vel: 1 }); frame();
    ok(GV.parts.length === 0 && GV.energy.bells > 0, 'mouvement réduit : lumière seulement, pas de particules ni de balancement');
    GV.reduced = false;

    // --- S4.5w growth: an opening (growAt = its strong beat) makes the new plant grow in ~1.2 s from its root
    G.s.nodes = ['racine', 'h.pad', 'm.bells']; GV.sig = null; frame(); // settled, nothing grows
    ok(!Object.keys(GV.grow).length, 'S4.5w : sans ouverture, aucune croissance (premier dessin, retour d\'état)');
    { const t0 = GV.clock() + 0.3; GV.growAt(t0); G.s.nodes.push('m.grains'); GV.sig = null; frame();
      const e = GV.grow.grains;
      ok(e && e.from === 0 && Math.abs(e.start - t0) < 1e-6 && !GV.grow.bells, 'nouvelle couche : sa plante pousse depuis 0, sur le temps fort annoncé, les autres ne bougent pas');
      const a = GV.growth('grains', t0 - 0.1), b = GV.growth('grains', t0 + 0.3), c = GV.growth('grains', t0 + 0.6), dd = GV.growth('grains', t0 + 1.0);
      ok(a === 0 && b > 0.2 && b < c && c < 1.15 && dd > 0.9, 'croissance animée : 0 avant le temps fort, puis ' + [b, c, dd].map((x) => x.toFixed(2)).join(' → '));
      GV.retime(t0 + 2); ok(GV.grow.grains.start === t0 + 2, 'la carte fermée plus tard : la croissance attend (retime)');
      // mid-growth frame: the sprite is drawn scaled (no new sprite in the cache)
      const m0 = GV.cacheMisses; GV.grow.grains.start = GV.clock() - 0.5; frame();
      ok(GV.cacheMisses === m0, 'mi-croissance : le sprite en cache est mis à l\'échelle (aucun re-rendu)');
      ok(GV.growth('grains', GV.clock() + 5) === 1 && !GV.grow.grains, 'fin de croissance : taille normale');
      // a taller plant (one more node of its layer) grows from its old height
      GV.growAt(null); G.s.nodes.push('m.phrase'); GV.sig = null; frame();
      const t = GV.grow.bells; ok(t && t.from > 0.2 && t.from < 1, 'plante plus haute : pousse depuis son ancienne taille (' + (t && t.from.toFixed(2)) + ')');
      GV.reduced = true; GV.growAt(null); G.s.nodes.push('c.seq'); GV.sig = null; frame();
      ok(!GV.grow.seq, 'mouvement réduit : la plante apparaît sans croître'); GV.reduced = false; GV.grow = {}; }

    // --- S4.5w sky: follows the chord (2 cached skies, cross-faded), the scale; the ground pulses on the beat
    { const px = (x, y) => [...cv.getContext('2d').getImageData(x, y, 1, 1).data.slice(0, 3)];
      AMB.bus.emit('chord', { time: 0, deg: 0, midis: [] }); frame(); GV.skyT = -99; frame();
      const k0 = GV.skyKey, c0 = px(20, GV.ground - 4);
      AMB.bus.emit('chord', { time: 0, deg: 4, midis: [] }); frame();
      ok(k0 === '0|0' && GV.skyKey === '4|0' && GV.skyPrevKey === '0|0', 'accord I puis V : le ciel passe de ' + k0 + ' à ' + GV.skyKey + ' (fondu depuis le précédent)');
      GV.skyT = -99; frame(); const c4 = px(20, GV.ground - 4);
      ok(c0.join() !== c4.join(), 'teinte du ciel différente selon l\'accord (' + c0 + ' / ' + c4 + ')');
      const m = GV.cacheMisses; for (let i = 0; i < 4; i++) { AMB.bus.emit('chord', { time: 0, deg: i % 2 ? 0 : 4 }); frame(); }
      ok(GV.cacheMisses === m && GV.skies.size <= 16, 'ciels en cache : changer d\'accord ne redessine aucun dégradé');
      const sm = AMB.store, th = AMB.theory; AMB.store = { get: () => 'Éolien (mineur)', set: sm.set, setMany: sm.setMany }; AMB.theory = { SCALES: { 'Éolien (mineur)': [0, 2, 3, 5, 7, 8, 10] } };
      ok(GV.chordKey(4) === '4|1', 'gamme mineure : un autre ciel pour le même degré'); AMB.store = sm; AMB.theory = th;
      AMB.bus.emit('chord', { time: 1e9, deg: 2 }); frame(); ok(GV.skyKey !== '2|0' && GV.skyQ.length === 1, 'un accord à venir attend son heure audio'); GV.skyQ.length = 0;
      AMB.seq = { playing: true, step: 64, nextTime: GV.clock() - 0.02, origin: 0, stepDur: () => 0.25 }; GV.pulse = 0; frame();
      ok(GV.pulse > 0.2, 'le sol pulse sur le temps fort (' + GV.pulse.toFixed(2) + ')');
      GV.reduced = true; GV.pulse = 0; frame(); ok(GV.pulse === 0, 'mouvement réduit : le sol ne pulse pas'); GV.reduced = false;
      delete AMB.seq; }

    // --- S4.5w finale: the recorded song lights each plant when its layer plays; night → dawn; live events ignored
    { const now = GV.clock();
      GV.replayStart({ t0: now - 0.5, from: 0, len: 2, ev: [{ layer: 'pad', t: 0.2, vel: 0.8 }, { layer: 'chord', t: 0.3, deg: 5 }, { layer: 'bass', t: 1.8, vel: 0.8 }] });
      AMB.bus.emit('note', { layer: 'seq', time: 0, vel: 1 }); frame();
      ok(GV.lit.pad > 0.9 && !GV.lit.bass && !GV.pending.length && GV.skyKey === '5|0', 'fin : la plante s\'allume quand sa couche joue dans le morceau (Pad oui, Basse pas encore), le ciel suit ses accords, le jeu en direct est ignoré ' + JSON.stringify([GV.lit, GV.pending.length, GV.skyKey]));
      const d1 = GV.dawnLevel(GV.clock()); await wait(400); frame(); const d2 = GV.dawnLevel(GV.clock());
      ok(d1 > 0 && d2 > d1 && d2 < 1, 'nuit → aube pendant la lecture (' + d1.toFixed(2) + ' → ' + d2.toFixed(2) + ')');
      GV.replayStop(); ok(!GV.replay && GV.dawnLevel(GV.clock()) === 0, 'après la lecture : retour au jeu en direct (aube gardée seulement une fois l\'instrument remis)'); }

    // --- pause: off screen (real IntersectionObserver), hidden tab
    const fr = GV.frames;
    cv.style.position = 'absolute'; cv.style.top = '-5000px';
    await wait(300);
    frame(); AMB.bus.emit('note', { layer: 'bells', time: 0, vel: 1 }); AMB.bus.emit('chord', { time: 0, deg: 3 });
    ok(!GV.visible && GV.frames === fr && GV.pending.length === 0 && GV.skyQ.length === 0, 'hors écran : aucune image dessinée, événements (notes, accords) ignorés');
    cv.style.position = ''; cv.style.top = '';
    await wait(300); frame();
    ok(GV.visible && GV.frames === fr + 1, 'de retour à l\'écran : le dessin reprend');
    Object.defineProperty(document, 'hidden', { configurable: true, get: () => true });
    frame(); ok(GV.frames === fr + 1, 'onglet caché : pause');
    delete document.hidden;

    // --- no gain at all
    G.earn = ge; AMB.bus.emit = be;
    const foreign = emitted.filter((e) => !['note', 'perc', 'grain', 'chord'].includes(e));
    ok(earns === 0 && foreign.length === 0, 'aucun gain : ni earn, ni store, ni événement émis par le jardin');
    G.s.nodes = ['racine', 'h.pad', 'm.bells']; delete G.s.secrets;
    ok(localStorage.getItem(G.key) === before.lg, 'aucune sauvegarde du jeu écrite par le jardin');

    // --- cost per frame at 1280×800 (advanced garden, notes every frame), real rAF
    G.s.nodes = ['racine', 'h.pad', 'm.bells', 'm.grains', 'c.seq', 'c.rythme', 'e.texture'];
    G.s.secrets = { found: { jazz: 1, tons: 1, dim: 1, lent: 1 } };
    GV.sig = null; frame(); GV.times.length = 0;
    // S4.5w worst case: every plant growing, the sky always cross-fading (a chord every 20 frames), the ground pulsing
    AMB.seq = { playing: true, step: 64, nextTime: GV.clock(), origin: 0, stepDur: () => 0.25 };
    GV.prevH = {}; GV.growAt(null); GV.stSig = null; GV.sig = null;
    const layers = ['pad', 'bells', 'seq', 'bass'];
    await new Promise((res) => { let n = 0; const step = () => { AMB.bus.emit('note', { layer: layers[n % 4], time: 0, vel: 0.8 }); if (n % 3 === 0) AMB.bus.emit('perc', { time: 0, vel: 0.7 }); if (n % 20 === 0) AMB.bus.emit('chord', { time: 0, deg: n / 20 }); frame(); if (++n < 60) requestAnimationFrame(step); else res(); }; requestAnimationFrame(step); });
    log('S4.5w : ' + Object.keys(GV.grow).length + ' plantes en croissance au départ, ciel ' + GV.skyKey + ', pulsation ' + (GV.pulse || 0).toFixed(2));
    delete AMB.seq;
    const s = GV.stats();
    log('PERF 1280×800 : moyenne ' + s.avg.toFixed(2) + ' ms, p95 ' + s.p95.toFixed(2) + ' ms, max ' + s.max.toFixed(2) + ' ms (' + s.frames + ' images, ' + s.sprites + ' sprites en cache)');
    ok(s.p95 < 4, 'coût par image raisonnable (p95 ' + s.p95.toFixed(2) + ' ms, cible < 2 ms)');
    done();
  } catch (e) { fail(e); }
});
</script></body></html>
