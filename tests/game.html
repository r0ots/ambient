    live(mid(t1[0])); live(mid(t1[1])-1);
    ok(Pz.echoRow.length===2 && Pz.echoRow[0].state==='ok' && Pz.echoRow[1].dir==='up' && !Pz.run(Ec).tries.length && res===null, 'pions après chaque note : ✓ puis ⬆');
    live(mid(t1[2])+2); const t2=Pz.target().degs;
    ok(res && !res.ok && res.row.pegs.map(p=>p.state+':'+p.dir).join()==='ok:null,far:up,far:down' && Pz.run(Ec).tries.length===1 && !Pz.echoRow.length, 'phrase finie : ✓ ⬆ ⬇, 1 essai sur 6');

    ok(res && res.ok && res.first && res.tries===2 && g.s.puzzles.includes(Ec) && g.s.shards===sh0+15 && Pz.current===null && !g.s.runs[Ec], 'phrase entièrement juste : réussite en 2 essais, +15');
    ok(JSON.stringify(AMB.store.stableSnapshot())===snap, 'pendant l\'Écho : l\'ambiance n\'est pas touchée');
    g.earn(50,'test'); T.buy('t.son'); T.buy('h.pad'); T.buy('m.bells'); ok(T.status('t.macros')==='available', 'Écho réussi → la porte Grands réglages s\'ouvre');
    // MIDI: any octave is fine (the pitch class is judged); a wrong note an octave up still points the right way
    { g.s.puzzles=g.s.puzzles.filter(x=>x!==Ec); Pz.start(Ec); const t=Pz.target().degs; res=null;
      live(mid(t[0])+12); live(mid(t[1])-24); live(mid(t[2])+12+1);
      ok(res && res.row.pegs.map(p=>p.state+':'+p.dir).join()==='ok:null,ok:null,far:down', 'MIDI : octave tolérée (✓ ✓ à +12 / −24), la fausse note dit ⬇ : '+res.row.pegs.map(p=>p.state+':'+p.dir).join());
      res=null; Pz.target().degs.forEach(dg=>live(mid(dg)+12)); ok(res && res.ok, 'MIDI : phrase juste une octave plus haut → réussite'); }

    g.s.puzzles=g.s.puzzles.filter(x=>x!==Ec); g.s.opened=(g.s.opened||[]).filter(x=>x!==Ec); evs.length=0; ok(T.status('t.macros')==='gated', 'Écho pas résolu : porte fermée'); Pz.start(Ec); const seen=[]; res=null;

  g.reset();
  g.setMode('free'); ok(T.paramUnlocked('fx.echo') && T.uiUnlocked('song'), 'mode libre : tout ouvert');
  g.reset();
  localStorage.removeItem('ambient.game.test');
  // offline cache: every <script src="js/..."> of index.html is precached by sw.js, in the same order
  Promise.all(['../index.html','../sw.js'].map(u=>fetch(u,{cache:'no-store'}).then(r=>r.text()))).then(([html,sw])=>{
    const scripts=[...html.matchAll(/<script[^>]*\ssrc="(js\/[^"]+)"/g)].map(m=>m[1]);
    const am=sw.match(/const ASSETS\s*=\s*\[([\s\S]*?)\];/), assets=am?[...am[1].matchAll(/'([^']+)'/g)].map(m=>m[1]):[];

    const css=[...html.matchAll(/<link rel="stylesheet" href="(css\/[^"]+)"/g)].map(m=>m[1]);
    ok(css.length>=1 && css.join()===assets.filter(a=>a.startsWith('css/')).join(), 'sw.js précache les feuilles de style de index.html, dans l\'ordre ('+css.length+')');
  }).catch(e=>log('EXC '+e.stack)).finally(()=>log('DONE'));
