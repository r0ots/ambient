<!doctype html><html><head><meta charset="utf-8"></head><body>
<script>
const TAG=location.pathname.split('/').pop().replace('.html','');
const log=(m)=>fetch('/__log?'+encodeURIComponent(TAG+'|'+m)).catch(()=>{});
window.onerror=(m,s,l,c,e)=>log('ERROR '+m+' @'+s+':'+l);
window.addEventListener('unhandledrejection',e=>log('REJECT '+(e.reason&&e.reason.stack||e.reason)));
const oe=console.error;console.error=(...a)=>{log('CONSOLE.ERROR '+a.join(' '));oe(...a)};
window.AMB_GAME_KEY='ambient.game.test';
localStorage.removeItem('ambient.game.test');
</script>
<script src="../js/theory.js"></script><script src="../js/params.js"></script><script src="../js/engine.js"></script><script src="../js/layers.js"></script><script src="../js/sequencer.js"></script><script src="../js/game.js"></script><script src="../js/tree.js"></script><script src="../js/contracts.js"></script><script src="../js/puzzles.js"></script>
<script>
const ok=(c,m)=>log((c?'ok ':'ERROR fail ')+m);
window.addEventListener('load', ()=>{
  try{
  const g=AMB.game, ev=[];
  ['earn','spend','unlock','found','mode'].forEach(e=>AMB.bus.on('game:'+e,d=>ev.push(e)));
  ok(g.s.mode===null && g.isUnlocked('x'), 'mode non choisi = tout ouvert');
  g.setMode('path');
  ok(!g.isUnlocked('x'), 'parcours : nœud fermé');
  ok(g.discover('k1',10) && !g.discover('k1',10) && g.s.shards===10, 'découverte comptée une fois');
  ok(!g.unlock('x',25) && !g.has('x'), 'achat refusé sans éclats');
  g.earn(20,'test'); ok(g.unlock('x',25) && g.s.shards===5 && g.isUnlocked('x'), 'achat');
  ok(!g.unlock('x',1), 'pas de double achat');
  ok(g.complete('c1',3) && g.solve('p1',4) && g.s.shards===12 && g.s.earned===37, 'contrats + énigmes, total cumulé');
  const saved=JSON.parse(localStorage.getItem('ambient.game.test'));
  ok(saved.nodes.includes('x') && saved.shards===12, 'persistant');
  g.setMode('free'); ok(g.isUnlocked('y'), 'mode libre = tout ouvert');
  log('events='+ev.join(','));
  g.setMode('free'); g.reset(); ok(g.s.shards===0 && !g.s.nodes.length && g.s.mode==='free', 'reset (mode gardé)');
  // --- tree (G1.2)
  const T=AMB.tree, ids=T.NODES.map(n=>n.id);
  ok(new Set(ids).size===ids.length, 'ids uniques ('+ids.length+' nœuds)');
  ok(T.NODES.every(n=>n.req.every(r=>T.byId[r]) && T.BRANCHES[n.branch]), 'prérequis et branches valides');
  // cycle check by DFS
  const seen={}, cyc=(id,st)=>{ if(st.has(id)) return true; if(seen[id]) return false; seen[id]=1; st.add(id); const r=T.byId[id].req.some(x=>cyc(x,st)); st.delete(id); return r; };
  ok(!ids.some(id=>cyc(id,new Set())), 'pas de cycle');
  g.setMode('path'); ok(g.has('racine'), 'racine offerte au démarrage du parcours');
  // buy everything, solving gates as they come, with unlimited shards
  g.earn(1e6,'test'); let progress=true;
  while(progress){ progress=false; for(const n of T.NODES){ const st=T.status(n.id); if(st==='gated'){ g.solve(n.gate); progress=true; } else if(st==='available'){ T.buy(n.id); progress=true; } } }
  const missing=ids.filter(id=>!g.has(id)); ok(!missing.length, 'tout atteignable '+missing.join(','));
  const total=T.NODES.reduce((a,n)=>a+n.cost,0); log('coût total='+total+' portes='+T.NODES.filter(n=>n.gate).map(n=>n.gate).join(','));
  const keys=[]; for(const [sec,o] of Object.entries(AMB.SCHEMA)) for(const k of Object.keys(o.params)) keys.push(sec+'.'+k);
  const orphan=keys.filter(k=>!T.nodeFor(k)); ok(!orphan.length, 'tout réglage a un nœud '+orphan.join(','));
  ok(T.nodeFor('pad.send')==='e.reverb' && T.nodeFor('seq.send')==='c.seq' && T.nodeFor('macro.light')==='t.macros', 'résolution exact > suffixe > section');
  g.reset(); ok(g.has('racine'), 'reset en parcours rend la racine'); ok(!T.paramUnlocked('fx.echo') && T.paramUnlocked('drone.vol') && T.status('h.pad')==='available' && T.status('h.scale')==='locked', 'statuts au départ');
  const gr=T.grantsText('c.seq'); ok(/Mélodie écrite/.test(gr) && /Piano roll/.test(gr) && !/Motif( ·|$)/.test(gr), 'ce que débloque un nœud : '+gr);
  ok(/chaque couche/.test(T.grantsText('e.reverb')) && T.dependents('h.pad').includes('c.seq'), 'grantsText *.send, dépendants');
  // --- contracts engine (G4.1)
  { const K0=AMB.contracts, ids=K0.DEFS.map(d=>d.id);
    ok(new Set(ids).size===ids.length && K0.DEFS.every(d=>d.title && d.goal>0 && d.reward>0 && d.need.every(n=>T.byId[n])), 'contrats valides ('+ids.length+')');
    const br={}; K0.DEFS.forEach(d=>{const b=T.byId[d.need[d.need.length-1]].branch; br[b]=(br[b]||0)+1}); log('contrats par branche '+JSON.stringify(br)); }
  const K=AMB.contracts; g.reset(); g.setMode('path'); K.refill();
  ok(g.s.active.length===2 && g.s.active.includes('k.couleur') && g.s.active.includes('k.souffle'), 'contrats actifs = ceux dont les nœuds sont acquis : '+g.s.active.join(','));
  AMB.seq.playing=true;
  AMB.store.set('drone.tone',0.2,'user'); AMB.store.set('drone.tone',0.25,'user'); ok(K.progress('k.couleur')===1, 'un geste = 1 (glisser ne compte qu\'une fois)');
  const kc=g.s.prog['k.couleur']; kc.t_drone_tone=0; kc['t_drone.tone']=0; AMB.store.set('drone.tone',0.5,'user'); kc['t_drone.tone']=0; AMB.store.set('drone.tone',0.6,'user');
  const sh=g.s.shards; ok(g.s.contracts.includes('k.couleur') && g.s.shards===sh, 'contrat accompli (la récompense est déjà comptée)');
  ok(!g.s.active.includes('k.couleur') && g.s.active.length===1, 'remplacé par le suivant éligible : '+g.s.active.join(','));
  g.earn(10,'test'); T.buy('t.son'); ok(g.s.active.includes('k.timbres'), 'nouveau nœud → nouveau contrat');
  ['Creux','Orgue','Sub','Chaud'].forEach(w=>AMB.store.set('drone.wave',w,'user')); ok(g.s.contracts.includes('k.timbres'), 'contrat « valeurs distinctes »');
  K.skip('k.souffle'); ok(g.s.skipped.includes('k.souffle') && g.s.active.includes('k.souffle'), 'passer : remis en fin de file (seul éligible ici)');
  AMB.store.set('drone.on',false,'user'); AMB.store.set('drone.on',true,'user'); ok(g.s.contracts.includes('k.souffle'), 'contrat en deux temps');
  g.earn(200,'test'); ['h.pad','e.reverb','e.salle','h.pad2'].forEach(i=>T.buy(i)); K.refill();
  const force=(id)=>{ if(!g.s.active.includes(id)){ g.s.active=[id].concat(g.s.active).slice(0,3); g.s.prog[id]={n:0}; } };
  force('e.extremes'); AMB.store.set('fx.space',0.95,'user'); AMB.store.set('fx.space',0.05,'user'); AMB.store.set('fx.space',0.95,'user'); ok(g.s.contracts.includes('e.extremes'), 'min puis max');
  force('e.salles'); ['Plate','Cloud','Hall'].forEach(v=>AMB.store.set('fx.revType',v,'user')); ok(g.s.contracts.includes('e.salles'), '3 salles');
  force('h.riches'); AMB.store.set('pad.voicing',1,'user'); AMB.bus.emit('chord',{time:0,deg:0,midis:[60]}); AMB.bus.emit('chord',{time:0,deg:1,midis:[62]}); ok(!g.s.contracts.includes('h.riches') && K.progress('h.riches')===1, 'accords riches : attendre ne suffit pas, il faut le retour');
  AMB.store.set('pad.voicing',0.05,'user'); ok(g.s.contracts.includes('h.riches'), 'accords riches : max puis min');
  ['m.bells','m.tempo','c.seq','c.motifs'].forEach(i=>{ g.solve('p.composer'); T.buy(i); });
  force('m.libre'); AMB.store.set('global.time','Flottant','user'); AMB.store.set('global.time','Pulsé','user'); ok(g.s.contracts.includes('m.libre'), 'libre puis régulier');
  force('c.chaine'); AMB.store.set('seq.chain','A A B','user'); ok(g.s.contracts.includes('c.chaine'), 'chaîne de 2 motifs');
  force('m.notes'); for(let i=0;i<8;i++) AMB.bus.emit('live',{midi:60,time:0,vel:1}); ok(g.s.contracts.includes('m.notes'), '8 notes jouées');
  // G8.3 : gestes aller-retour (chaque contrat ne se remplit que par son geste)
  {
    g.earn(5000,'test'); for(let more=true;more;){ more=false; for(const n of T.NODES){ const st=T.status(n.id); if(st==='gated'){ g.solve(n.gate); more=true; } else if(st==='available'){ T.buy(n.id); more=true; } } }
    const run=(id,steps,wrong)=>{ force(id); const sh=()=>g.s.contracts.includes(id);
      for(const f of wrong) f(); ok(!sh() && K.progress(id)<K.byId[id].goal, id+' : pas rempli sans le geste');
      for(const f of steps) f(); ok(sh(), id+' : rempli par son geste'); };
    const S=(k,v,src)=>()=>AMB.store.set(k,v,src||'user'), tick=(n)=>()=>{ for(let i=0;i<n;i++) K.dispatch('bar',i); };
    run('e.halo',[S('fx.shimmer',0.6),S('fx.shimmer',0.9),S('fx.shimmer',0.1)],[tick(4),S('fx.shimmer',0.9),S('fx.shimmer',0.5),S('fx.shimmer',0.1,'preset')]);
    run('m.derive',[S('global.evolve',0.5),S('global.evolve',0.9),S('global.evolve',0.1)],[tick(6),S('global.evolve',0.1),S('global.evolve',0.9,'preset')]);
    run('c.swing',[S('global.swing',0.5),S('global.swing',0.8),S('global.swing',0.02)],[tick(4),S('global.swing',0.02),S('global.swing',0.8,'macro')]);
    run('k.xy',[1,2,3,4].map(i=>()=>{ K.state().prog['k.xy']['t_xy']=0; AMB.bus.emit('act','xy'); }),[tick(8),()=>AMB.bus.emit('act','dice')]);
    run('c.courbe',[S('auto.curve','i'.repeat(32)),S('auto.curve','0'.repeat(16)+'z'.repeat(16))],[S('auto.curve','i'.repeat(32)),S('auto.curve','0'.repeat(16)+'z'.repeat(16),'preset'),S('auto.on',true)]);
    // phrase : objectif 2 tours
    force('m.phrase'); ok(K.byId['m.phrase'].goal===2,'m.phrase objectif 2'); AMB.store.set('bells.mode','Aléatoire','user'); AMB.bus.emit('phrase',{}); ok(K.progress('m.phrase')===0,'phrase : tours non comptés hors mode Phrase'); AMB.store.set('bells.mode','Phrase','user'); AMB.bus.emit('phrase',{}); ok(K.progress('m.phrase')===1,'1 tour'); AMB.bus.emit('phrase',{}); ok(g.s.contracts.includes('m.phrase'),'2 tours');
    // tirage mélangé, déterministe avec une graine, compatible anciennes sauvegardes
    const draw=(seed)=>{ g.s.active=[]; g.s.skipped=[]; g.s.prog={}; K.seed(seed); K.refill(); return g.s.active.join(','); };
    const a=draw(42), b=draw(42), c=draw(7), d=draw(99), e=draw(12345);
    ok(a===b && g.s.active.length===3, 'tirage déterministe avec une graine : '+a);
    ok(new Set([a,c,d,e]).size>1, 'la graine change le tirage : '+[a,c,d,e].join(' | '));
    ok(g.s.active.every(id=>K.eligible(K.byId[id])), 'tirage : seulement des contrats éligibles');
    delete g.s.rng; g.s.active=[]; K.refill(); ok(typeof g.s.rng==='number' && g.s.active.length===3, 'ancienne sauvegarde (sans graine) : graine créée');
  }
  AMB.seq.playing=false; g.setMode('free'); AMB.store.set('drone.tone',0.1,'user'); ok(true,'libre : pas de suivi');
  g.reset();
  // --- puzzles engine (G5.1)
  const Pz=AMB.puzzles;
  for (const d of Pz.DEFS) {
    // owning `need` (and their ancestors) must unlock every target key; target values must be valid
    const anc=new Set(), add=(id)=>{ if(anc.has(id)) return; anc.add(id); T.byId[id].req.forEach(add); }; d.need.forEach(add);
    const bad=Object.entries(d.target).filter(([k,v])=>{ const sp=AMB.store.spec(k); if(!sp) return true; if(sp.type==='select'&&!sp.options.includes(v)) return true; const n=T.nodeFor(k); return n && !anc.has(n); });
    ok(!bad.length && (!d.opens || T.byId[d.opens].gate===d.id), 'énigme '+d.id+' jouable avec ses prérequis '+bad.map(x=>x[0]).join(','));
  }
  ok(T.NODES.filter(n=>n.gate).every(n=>Pz.byId[n.gate] && Pz.byId[n.gate].opens===n.id), 'chaque porte a son énigme');
  { const def=AMB.store.snapshot(); for (const d of Pz.DEFS) { const sd=Pz.score(d.id, def).total, st=Pz.score(d.id, {...def, ...d.target}).total; ok(sd<0.9 && st===1, d.id+' pas résolue d\'avance ('+sd.toFixed(2)+'), cible = 100 %'); } }
  g.reset(); g.setMode('path'); g.earn(100,'test'); T.buy('t.son'); T.buy('h.pad');
  ok(Pz.available().some(d=>d.id==='p.premier') && Pz.forNode('t.macros').id==='p.premier', 'énigme disponible et liée à sa porte');
  Pz.start('p.premier'); let last=null; AMB.bus.on('game:puzzle',e=>last=e);
  AMB.store.setMany({'drone.wave':'Chaud','drone.tone':0.35,'pad.wave':'Nappe','pad.tone':0.4},'user');
  const s0=Pz.score('p.premier').total; const a0=Pz.attempt();
  ok(s0<0.5 && a0 && !a0.ok && a0.tries===1 && a0.left===Pz.TRIES-1, 'loin de la cible : '+s0.toFixed(2)+', refus (1 essai sur 6)');
  // pegs (G8.1): one per key, right/near/far + which way
  { const pg=Object.fromEntries(a0.row.pegs.map(p=>[p.key,p]));
    ok(a0.row.pegs.length===4 && pg['drone.wave'].state==='far' && pg['drone.wave'].dir==='other' && pg['drone.tone'].state==='far' && pg['drone.tone'].dir==='up' && pg['pad.tone'].dir==='down', 'pions : loin + autre option / plus haut / plus bas');
    const n=Pz.peg('drone.tone',0.6,0.75), j=Pz.peg('drone.tone',0.72,0.75), k=Pz.peg('global.key','D','F'), e=Pz.peg('fx.echoTime','1/2','1/8.');
    ok(n.state==='near' && n.dir==='up' && j.state==='ok' && j.dir===null && k.dir==='up' && e.dir==='down', 'pions : proche, juste, tonalité/écho ⬆⬇'); }
  AMB.store.setMany({'drone.wave':'Orgue','pad.wave':'Verre','drone.tone':0.72,'pad.tone':0.24},'user');
  const s1=Pz.score('p.premier').total; ok(s1>0.9 && last && last.total===s1, 'proche : '+s1.toFixed(2)+', jauge en direct');
  // A/B (G5.2)
  AMB.store.setMany({'drone.wave':'Chaud','drone.tone':0.35,'pad.wave':'Nappe','pad.tone':0.4},'user');
  Pz.listen('target'); ok(AMB.store.get('pad.wave')==='Verre' && Pz.side()==='target' && Pz.currentScore().total<0.5 && !Pz.attempt(), 'écouter la cible : son cible, score = le mien, pas de validation');
  Pz.listen('mine'); ok(AMB.store.get('pad.wave')==='Nappe' && AMB.store.get('drone.tone')===0.35, 'retour à mon son intact');
  Pz.listen('target'); AMB.store.set('drone.tone',0.6,'user'); ok(Pz.side()==='mine' && AMB.store.get('pad.wave')==='Nappe' && AMB.store.get('drone.tone')===0.6, 'toucher pendant la cible : mon son revient + mon geste');
  ok(!g.s.found.includes('p:pad.wave') || true, '');
  AMB.store.setMany({'drone.wave':'Orgue','pad.wave':'Verre','drone.tone':0.72,'pad.tone':0.24},'user');
  const shP=g.s.shards; const aw=Pz.attempt();
  ok(aw && aw.ok && aw.first && g.s.puzzles.includes('p.premier') && g.s.shards===shP+15 && T.status('t.macros')==='available', 'résolue → porte ouverte, +15');
  ok(aw.tries===2 && aw.listens===2 && aw.stars===2 && g.s.stars['p.premier']===2 && !g.s.runs['p.premier'], 'étoiles : 2 essais, 2 écoutes → ★★ mémorisées');
  // replay: 1 try, no listen → 3 stars, no ✧ again
  { const sh=g.s.shards; Pz.start('p.premier'); const r=Pz.attempt(); ok(r.ok && r.stars===3 && !r.first && g.s.shards===sh && Pz.best('p.premier')===3, 'rejouée en 1 essai sans écoute → ★★★, pas de ✧ en plus');
    Pz.start('p.premier'); Pz.listen('target'); Pz.listen('mine'); const r2=Pz.attempt(); ok(r2.stars===3 && r2.record===false && Pz.best('p.premier')===3, 'meilleur score gardé');
    ok(Pz.stars(1,0,false)===3 && Pz.stars(1,5,false)===2 && Pz.stars(5,8,false)===1 && Pz.stars(1,0,true)===0, 'barème des étoiles'); }
  // 6 failures → the gate opens anyway, no ✧, no star, replayable
  { g.earn(200,'test'); T.buy('h.key'); const pe=[]; AMB.bus.on('game:earn',d=>{ if(d.reason==='énigme') pe.push(d.n); }); Pz.start('p.gamme'); AMB.store.set('global.key','D','user');
    let r; for(let i=0;i<6;i++) r=Pz.attempt();
    ok(r.out && !r.ok && r.left===0 && !g.s.puzzles.includes('p.gamme') && Pz.given('p.gamme') && T.status('h.scale')==='available' && !pe.length && !Pz.best('p.gamme') && Pz.current===null, '6 échecs → porte ouverte, sans ✧ ni étoile');
    T.buy('h.scale'); Pz.start('p.gamme'); ok(Pz.run().tries.length===0 && g.has('h.scale'), 'rejouable (essais remis à zéro), nœud acheté');
    AMB.store.setMany(Pz.byId['p.gamme'].target,'user'); const r3=Pz.attempt(); ok(r3.ok && r3.first && pe.join()==='20', 'résolue plus tard : ✧ de la 1re résolution'); }
  // help (live gauge) → no star; attempts survive closing the card; old saves load
  { Pz.start('b.gamme'); Pz.attempt(); Pz.stop(); Pz.start('b.gamme'); ok(Pz.run().tries.length===1, 'fermer puis rouvrir ne rend pas les essais');
    Pz.setHelp(true); AMB.store.setMany(Pz.byId['b.gamme'].target,'user'); const r=Pz.attempt(); ok(r.ok && r.stars===0 && !Pz.best('b.gamme') && g.s.puzzles.includes('b.gamme'), 'aide → résolue sans étoile');
    Pz.setHelp(false);
    localStorage.setItem('ambient.game.test', JSON.stringify({v:1,mode:'path',shards:3,earned:3,nodes:['racine'],found:[],contracts:[],puzzles:['p.premier'],active:[],prog:{},ended:false}));
    g.load(); ok(g.s.puzzles.includes('p.premier') && !Pz.best('p.premier') && Array.isArray(g.s.opened) && Pz.run('p.premier').tries.length===0, 'ancienne sauvegarde : chargée sans étoiles'); }
  ok(Pz.keyScore('drone.tone',0.5,0.5)===1 && Pz.keyScore('drone.tone',0,1)===0 && Pz.keyScore('pad.wave','Verre','Nappe')===0, 'score par réglage');
  g.reset();
  g.setMode('free'); ok(T.paramUnlocked('fx.echo') && T.uiUnlocked('song'), 'mode libre : tout ouvert');
  g.reset();
  localStorage.removeItem('ambient.game.test');
  // offline cache: every <script src="js/..."> of index.html is precached by sw.js, in the same order
  Promise.all(['../index.html','../sw.js'].map(u=>fetch(u,{cache:'no-store'}).then(r=>r.text()))).then(([html,sw])=>{
    const scripts=[...html.matchAll(/<script[^>]*\ssrc="(js\/[^"]+)"/g)].map(m=>m[1]);
    const am=sw.match(/const ASSETS\s*=\s*\[([\s\S]*?)\];/), assets=am?[...am[1].matchAll(/'([^']+)'/g)].map(m=>m[1]):[];
    const miss=scripts.filter(s=>!assets.includes(s)), js=assets.filter(a=>a.startsWith('js/'));
    ok(scripts.length>20 && !miss.length, 'sw.js précache tous les scripts de index.html ('+scripts.length+') '+miss.join(','));
    ok(js.join()===scripts.join(), 'sw.js ASSETS dans le même ordre que index.html');
    const css=[...html.matchAll(/<link rel="stylesheet" href="(css\/[^"]+)"/g)].map(m=>m[1]);
    ok(css.length>=2 && css.join()===assets.filter(a=>a.startsWith('css/')).join(), 'sw.js précache les feuilles de style de index.html, dans l\'ordre ('+css.length+')');
  }).catch(e=>log('EXC '+e.stack)).finally(()=>log('DONE'));
  }catch(e){log('EXC '+e.stack)}
});
</script></body></html>
