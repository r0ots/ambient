<!doctype html><html><head><meta charset="utf-8"></head><body>
<script>
const TAG=location.pathname.split('/').pop().replace('.html','');
const log=(m)=>fetch('/__log?'+encodeURIComponent(TAG+'|'+m)).catch(()=>{});
window.onerror=(m,s,l,c,e)=>log('ERROR '+m+' @'+s+':'+l);
window.addEventListener('unhandledrejection',e=>log('REJECT '+(e.reason&&e.reason.stack||e.reason)));
const oe=console.error;console.error=(...a)=>{log('CONSOLE.ERROR '+a.join(' '));oe(...a)};
window.AMB_GAME_KEY='ambient.game.test';
localStorage.removeItem('ambient.game.test');
</script>
<script src="../js/theory.js"></script><script src="../js/params.js"></script><script src="../js/engine.js"></script><script src="../js/layers.js"></script><script src="../js/sequencer.js"></script><script src="../js/game.js"></script><script src="../js/tree.js"></script>
<script>
const ok=(c,m)=>log((c?'ok ':'ERROR fail ')+m);
window.addEventListener('load', ()=>{
  try{
  const g=AMB.game, ev=[];
  ['earn','spend','unlock','found','mode'].forEach(e=>AMB.bus.on('game:'+e,d=>ev.push(e)));
  ok(g.s.mode===null && g.isUnlocked('x'), 'mode non choisi = tout ouvert');
  g.setMode('path');
  ok(!g.isUnlocked('x'), 'parcours : nœud fermé');
  ok(g.discover('k1',10) && !g.discover('k1',10) && g.s.shards===10, 'découverte comptée une fois');
  ok(!g.unlock('x',25) && !g.has('x'), 'achat refusé sans éclats');
  g.earn(20,'test'); ok(g.unlock('x',25) && g.s.shards===5 && g.isUnlocked('x'), 'achat');
  ok(!g.unlock('x',1), 'pas de double achat');
  ok(g.complete('c1',3) && g.solve('p1',4) && g.s.shards===12 && g.s.earned===37, 'contrats + énigmes, total cumulé');
  const saved=JSON.parse(localStorage.getItem('ambient.game.test'));
  ok(saved.nodes.includes('x') && saved.shards===12, 'persistant');
  g.setMode('free'); ok(g.isUnlocked('y'), 'mode libre = tout ouvert');
  log('events='+ev.join(','));
  g.setMode('free'); g.reset(); ok(g.s.shards===0 && !g.s.nodes.length && g.s.mode==='free', 'reset (mode gardé)');
  // --- tree (G1.2)
  const T=AMB.tree, ids=T.NODES.map(n=>n.id);
  ok(new Set(ids).size===ids.length, 'ids uniques ('+ids.length+' nœuds)');
  ok(T.NODES.every(n=>n.req.every(r=>T.byId[r]) && T.BRANCHES[n.branch]), 'prérequis et branches valides');
  // cycle check by DFS
  const seen={}, cyc=(id,st)=>{ if(st.has(id)) return true; if(seen[id]) return false; seen[id]=1; st.add(id); const r=T.byId[id].req.some(x=>cyc(x,st)); st.delete(id); return r; };
  ok(!ids.some(id=>cyc(id,new Set())), 'pas de cycle');
  g.setMode('path'); ok(g.has('racine'), 'racine offerte au démarrage du parcours');
  // buy everything, solving gates as they come, with unlimited shards
  g.earn(1e6,'test'); let progress=true;
  while(progress){ progress=false; for(const n of T.NODES){ const st=T.status(n.id); if(st==='gated'){ g.solve(n.gate); progress=true; } else if(st==='available'){ T.buy(n.id); progress=true; } } }
  const missing=ids.filter(id=>!g.has(id)); ok(!missing.length, 'tout atteignable '+missing.join(','));
  const total=T.NODES.reduce((a,n)=>a+n.cost,0); log('coût total='+total+' portes='+T.NODES.filter(n=>n.gate).map(n=>n.gate).join(','));
  const keys=[]; for(const [sec,o] of Object.entries(AMB.SCHEMA)) for(const k of Object.keys(o.params)) keys.push(sec+'.'+k);
  const orphan=keys.filter(k=>!T.nodeFor(k)); ok(!orphan.length, 'tout réglage a un nœud '+orphan.join(','));
  ok(T.nodeFor('pad.send')==='e.reverb' && T.nodeFor('seq.send')==='c.seq' && T.nodeFor('macro.light')==='t.macros', 'résolution exact > suffixe > section');
  g.reset(); ok(g.has('racine'), 'reset en parcours rend la racine'); ok(!T.paramUnlocked('fx.echo') && T.paramUnlocked('drone.vol') && T.status('h.pad')==='available' && T.status('h.scale')==='locked', 'statuts au départ');
  const gr=T.grants('c.seq'); ok(gr.includes('Mélodie écrite') && gr.includes('Piano roll') && !gr.some(x=>/Motif$/.test(x)), 'ce que débloque un nœud : '+gr.join(' / '));
  ok(T.grants('e.reverb').some(x=>/chaque couche/.test(x)) && T.dependents('h.pad').includes('c.seq'), 'grants *.send, dépendants');
  g.setMode('free'); ok(T.paramUnlocked('fx.echo') && T.uiUnlocked('song'), 'mode libre : tout ouvert');
  g.reset();
  localStorage.removeItem('ambient.game.test');
  log('DONE');
  }catch(e){log('EXC '+e.stack)}
});
</script></body></html>
