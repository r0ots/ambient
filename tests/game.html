<!doctype html><html><head><meta charset="utf-8"></head><body>
<script src="lib.js"></script>
<script>window.AMB_GAME_KEY='ambient.game.test';
localStorage.removeItem('ambient.game.test');
</script>
<script src="../js/theory.js"></script><script src="../js/params.js"></script><script src="../js/engine.js"></script><script src="../js/layers.js"></script><script src="../js/sequencer.js"></script><script src="../js/game.js"></script><script src="../js/tree.js"></script><script src="../js/contracts.js"></script><script src="../js/puzzles.js"></script>
<script>
const ok=(c,m)=>log((c?'ok ':'ERROR fail ')+m);
window.addEventListener('load', async ()=>{
  try{
  const g=AMB.game, ev=[];
  ['unlock','mode','contracts'].forEach(e=>AMB.bus.on('game:'+e,d=>ev.push(e+(d&&d.by?':'+d.by:''))));
  ok(g.s.mode===null && g.isUnlocked('x'), 'mode non choisi = tout ouvert');
  g.setMode('path');
  ok(!g.isUnlocked('x'), 'parcours : nœud fermé');
  ok(!g.discover && !('found' in g.s) && !('stars' in g.s), 'v1.06 : plus de découvertes ni d\'étoiles dans l\'état');
  ok(!('shards' in g.s) && !('earned' in g.s) && !('puzzles' in g.s) && !g.earn && !g.spend && !g.canAfford && !g.solve, 'S4.3 : plus d\'éclats ✧ (ni solde, ni gain, ni dépense), plus d\'énigmes résolues dans l\'état');
  ok(g.unlock('x','k.test') && g.isUnlocked('x') && !g.unlock('x'), 'un nœud s\'ouvre directement (une fois)');
  ok(g.complete('c1') && !g.complete('c1') && g.s.contracts.join()==='c1', 'un défi réussi est noté une fois');
  const saved=JSON.parse(localStorage.getItem('ambient.game.test'));
  ok(saved.nodes.includes('x') && !('shards' in saved), 'persistant');
  g.setMode('free'); ok(g.isUnlocked('y'), 'mode libre = tout ouvert');
  log('events='+ev.join(','));
  g.reset(); ok(!g.s.nodes.length && g.s.mode==='free', 'reset (mode gardé)');
  // --- tree (G1.2; S4.3: no cost, no gate)
  const T=AMB.tree, ids=T.NODES.map(n=>n.id);
  ok(new Set(ids).size===ids.length, 'ids uniques ('+ids.length+' nœuds)');
  ok(T.NODES.every(n=>n.req.every(r=>T.byId[r]) && T.BRANCHES[n.branch] && !('cost' in n) && !('gate' in n)), 'prérequis et branches valides, ni coût ni porte');
  const seen={}, cyc=(id,st)=>{ if(st.has(id)) return true; if(seen[id]) return false; seen[id]=1; st.add(id); const r=T.byId[id].req.some(x=>cyc(x,st)); st.delete(id); return r; };
  ok(!ids.some(id=>cyc(id,new Set())), 'pas de cycle');
  g.setMode('path'); ok(g.has('racine'), 'racine offerte au démarrage du parcours');
  for(let more=true;more;){ more=false; for(const n of T.NODES) if(T.status(n.id)==='available'){ g.unlock(n.id); more=true; } }
  const missing=ids.filter(id=>!g.has(id)); ok(!missing.length, 'tout atteignable '+missing.join(','));
  const keys=[]; for(const [sec,o] of Object.entries(AMB.SCHEMA)) for(const k of Object.keys(o.params)) keys.push(sec+'.'+k);
  const orphan=keys.filter(k=>!T.nodeFor(k)); ok(!orphan.length, 'tout réglage a un nœud '+orphan.join(','));
  ok(T.nodeFor('pad.send')==='e.reverb' && T.nodeFor('seq.send')==='c.seq' && T.nodeFor('macro.light')==='t.macros', 'résolution exact > suffixe > section');
  g.reset(); ok(g.has('racine'), 'reset en parcours rend la racine'); ok(!T.paramUnlocked('fx.echo') && T.paramUnlocked('drone.vol') && T.status('h.pad')==='available' && T.status('h.scale')==='locked', 'statuts au départ');
  ok(T.uiUnlocked('xy') && !T.paramUnlocked('macro.light'), 'S4.3 : glisser sur l\'écran ouvert dès la Graine, les grands réglages restent fermés');
  const gr=T.grantsText('c.seq'); ok(/Mélodie écrite/.test(gr) && /Piano roll/.test(gr) && !/Motif( ·|$)/.test(gr), 'ce qu\'ouvre un nœud : '+gr);
  ok(/chaque couche/.test(T.grantsText('e.reverb')) && T.dependents('h.pad').includes('c.seq'), 'grantsText *.send, dépendants');
  // --- S4.3 the one table: each node is opened by one challenge (contract or Écho); nothing can block the path
  const K=AMB.contracts, Pz=AMB.puzzles;
  { const anc=(id,set=new Set())=>{ T.byId[id].req.forEach(r=>{ if(!set.has(r)){ set.add(r); anc(r,set); } }); return set; };
    const opened=Object.keys(K.OPENS), notOpened=ids.filter(id=>id!=='racine' && !K.OPENS[id]);
    ok(!notOpened.length && opened.length===ids.length-1 && new Set(Object.values(K.OPENS)).size===opened.length, 'table OPENS : '+opened.length+' nœuds, un défi chacun, sans doublon '+notOpened.join(','));
    ok(K.DEFS.every(d=>d.title && d.hint && d.goal>0 && d.need.every(n=>T.byId[n]) && !('reward' in d)) && K.DEFS.every(d=>d.node ? K.OPENS[d.node]===d.id : d.id==='c.morceau'), 'défis valides ('+K.DEFS.length+'), sans récompense en ✧ ; chacun ouvre son nœud, sauf le dernier');
    // a node waits for its prerequisites and for what its challenge plays with: that graph has no cycle, so at any moment
    // some node not yet open has all it waits for, and its challenge is proposed — whatever was played or passed before
    const dep=(id)=>[...T.byId[id].req, ...(K.OPENS[id] ? K.byId[K.OPENS[id]].need : [])], st={};
    const loop=(id)=>{ if(st[id]===1) return true; if(st[id]===2) return false; st[id]=1; const r=dep(id).some(loop); st[id]=2; return r; };
    ok(!ids.some(loop) && K.byId[K.OPENS['m.bells']].need.join()==='racine', 'nœuds + ce dont leur défi a besoin : sans cycle, aucun ordre ne bloque (le 1er défi ne demande que la Graine)');
    const gone=['k.paysages','h.ecrire','m.scenes','b.gamme','b.pad','b.salle','b.radio','b.grains','b.groove','c.dessin','k.souffle'];
    ok(gone.every(id=>!K.byId[id]) && !Pz.DEFS && !Pz.keyScore && !Pz.listen && !Pz.ab, 'énigmes « régler des boutons sur une cible » et défis sans nœud retirés');
    const ech=K.DEFS.filter(d=>d.kind==='echo'); log('Échos : '+ech.map(d=>d.title+' → '+T.byId[d.node].name+' ('+Pz.echoLen(d.d)+' notes)').join(' · '));
    ok(ech.length===6 && ech.every(d=>d.need.includes('m.bells')) && Pz.echoLen(K.byId['p.premier'].d)===3 && Pz.echoLen(K.byId['p.mouvement'].d)===4, 'Échos : 6 portes, longueur selon la profondeur (3 notes près de la racine, 4 plus haut)'); }
  // --- the queue (one at a time, in the order of the table)
  g.reset(); g.setMode('path'); K.refill(); ev.length=0;
  ok(g.s.active.join()==='k.xy', 'S4.3 : le premier défi = glisser sur l\'écran ('+g.s.active.join()+')');
  for(let i=0;i<4;i++){ g.s.prog['k.xy'].t_xy=0; AMB.bus.emit('act','xy'); }
  ok(g.has('m.bells') && g.s.contracts.includes('k.xy') && ev.includes('unlock:k.xy') && g.s.active.join()==='m.notes', '4 glissés → la Mélodie s\'ouvre directement, défi suivant : '+g.s.active.join());
  K.skip('m.notes'); ok(g.s.active.join()==='k.couleur' && g.s.skipped.includes('m.notes'), 'passer → le suivant');
  AMB.seq.playing=true;
  AMB.store.set('drone.tone',0.2,'user'); AMB.store.set('drone.tone',0.25,'user'); ok(K.progress('k.couleur')===1, 'un geste = 1 (glisser ne compte qu\'une fois)');
  g.s.prog['k.couleur']['t_drone.tone']=0; AMB.store.set('drone.tone',0.5,'user');
  ok(g.has('t.son') && g.s.active.join()==='m.monte', 'Couleur du drone → Timbre du drone ouvert, puis : '+g.s.active.join());
  K.skip('m.monte'); K.skip('m.descend'); ok(g.s.active.join()==='m.pas', 'passer encore : '+g.s.active.join());
  K.skip('m.pas'); K.skip('p.suite'); K.skip('k.timbre'); ok(g.s.active.join()==='m.notes', 'tous passés : le premier passé revient');
  const live=(m,t)=>AMB.bus.emit('live',{midi:m==null?60:m,time:t||0,vel:1}), lives=(n)=>()=>{ for(let i=0;i<n;i++) live(); };
  lives(8)(); ok(g.has('h.pad') && g.s.active.join()==='h.forcer', '6 notes jouées → Pad ouvert, le suivant non passé arrive : '+g.s.active.join());
  ok(!K.eligible(K.byId['m.notes']) && K.eligible(K.byId['h.forcer']) && !K.eligible(K.byId['h.suivre']), 'un défi n\'est proposé que si son nœud peut s\'ouvrir (Pad ouvert : Drone qui suit oui, Tonalité pas encore)');
  // --- each kind of challenge is done by its gesture, not by anything else
  const force=(id)=>{ g.s.active=[id]; g.s.prog[id]={n:0}; };
  for(let more=true;more;){ more=false; for(const n of T.NODES) if(T.status(n.id)==='available' && !['e.tape','e.salle','t.journal','h.pad2','m.evolve','m.grains2','c.rythme','c.song','t.dice'].includes(n.id)){ g.unlock(n.id); more=true; } }
  { const run=(id,steps,wrong)=>{ force(id); const sh=()=>g.s.contracts.includes(id);
      for(const f of wrong) f(); ok(!sh() && K.progress(id)<K.byId[id].goal, id+' : pas réussi sans le geste');
      for(const f of steps) f(); ok(sh() && (!K.byId[id].node || g.has(K.byId[id].node)), id+' : réussi par son geste'+(K.byId[id].node ? ', '+T.byId[K.byId[id].node].name+' ouvert' : '')); };
    const S=(k,v,src)=>()=>AMB.store.set(k,v,src||'user'), notes=(ms,dt)=>()=>ms.forEach((m,i)=>live(m,100+i*dt)), tick=(n)=>()=>{ for(let i=0;i<n;i++) K.dispatch('bar',i); };
    run('e.echo',[S('fx.echo',0.6),lives(6)],[S('fx.echo',0.2),lives(6)]);
    run('m.monte',[notes([60,62,64,65,67],0.4)],[notes([60,62,61,64,65],0.4),notes([64,62,60],0.4)]);
    run('m.descend',[notes([72,71,69,67,65],0.4)],[notes([60,62,64,65,67],0.4)]);
    run('m.respire',[notes([60,62,64,65],2)],[notes([60,62,64,65],0.5)]);
    run('m.pas',[notes([60,62,64,65],0.6)],[notes([60,62,64,65],0.1),()=>[0,0.4,1.4,1.6].forEach((t,i)=>live(60,200+t))]);
    run('m.nuage',[S('grains.density',0.7),lives(4)],[lives(6),S('grains.density',0.65,'preset')]);
    run('e.noyer',[S('pad.send',0.8),...[1].map(()=>()=>{ K.state().prog['e.noyer'].t_chord=0; AMB.bus.emit('act','chord'); })],[()=>AMB.bus.emit('act','chord'),S('pad.send',0.5)]);
    run('k.timbre',[S('drone.wave',AMB.store.spec('drone.wave').options[1]),lives(4)],[lives(6)]);
    // S3.5: the Composer challenges are played (Rec live, a groove that turns, the song recorded), never drawn
    AMB.pianoRoll=AMB.pianoRoll||{roll:{recording:false}}; // this page has no piano roll: its Rec live state is enough
    const R=AMB.pianoRoll.roll, rec0=R.recording;
    run('c.reclive',[()=>{ R.recording=true; }, lives(6), ()=>{ R.recording=rec0; }],[lives(8), S('seq.pattern','0.0.1','user')]);
    const S0=AMB.seq, step0=S0.step, bassNote=(bar)=>()=>{ S0.step=(S0.origin||0)+bar*16+3; AMB.bus.emit('note',{layer:'bass',midi:36,time:0,vel:0.8,dur:0.2}); };
    run('c.groove',[S('bass.pattern','groove-test','user'),bassNote(0),bassNote(1),bassNote(1),bassNote(2),bassNote(3)],[bassNote(0),bassNote(1),bassNote(2),bassNote(3),bassNote(4),S('bass.pattern','preset-test','preset')]);
    S0.step=step0;
    run('c.morceau',[()=>AMB.bus.emit('act','songRec')],[()=>AMB.bus.emit('act','song'),()=>AMB.bus.emit('rec:done',40),()=>AMB.bus.emit('act','section')]);
    ok(K.byId['c.morceau'].first && K.DEFS.filter(d=>d.first).length===1, 'le dernier défi du Parcours : « '+K.byId['c.morceau'].title+' »');
    // an Écho's notes are the Écho's: they never count for a contract
    force('m.notes'); Pz.current='p.premier'; lives(8)(); ok(!K.progress('m.notes'), 'pendant un Écho : les notes jouées ne comptent pas pour les défis');
    Pz.current=null; delete g.s.runs['p.premier']; Pz.echoRow=[];
    force('m.phrase'); AMB.store.set('bells.mode','Aléatoire','user'); AMB.bus.emit('phrase',{}); ok(K.progress('m.phrase')===0,'phrase : tours non comptés hors mode Phrase'); AMB.store.set('bells.mode','Phrase','user'); AMB.bus.emit('phrase',{}); AMB.bus.emit('phrase',{}); ok(g.s.contracts.includes('m.phrase'),'2 tours → réussi');
    ok((()=>{ g.s.active=[]; g.s.skipped=[]; g.s.contracts=[]; K.refill(); return g.s.active.join(); })()==='c.morceau', 'Morceau ouvert : « Enregistre ton morceau » passe avant les autres'); }
  AMB.seq.playing=false; g.setMode('free'); AMB.store.set('drone.tone',0.1,'user'); ok(true,'libre : pas de suivi');
  g.reset();
  // --- S4.3 old saves (✧, costs paid, puzzles solved, gates opened, knob targets): they load, the nodes stay, no error
  { const old={v:1,mode:'path',shards:41,earned:400,nodes:['racine','m.bells','h.pad','t.son','h.key','c.seq','c.arp','c.bass'],found:['p:drone.tone'],stars:{'p.premier':2},
      contracts:['k.couleur','m.notes','c.dessin'],puzzles:['p.premier','p.gamme','b.gamme'],opened:['p.espace'],pzHelp:true,
      runs:{'p.composer':{tries:[{total:0.2,pegs:[]}],target:{'bells.wave':'Verre','bells.range':0.5}},'b.salle':{tries:[],target:{'fx.size':0.4}}},
      active:['k.souffle','b.salle','e.extremes'],prog:{},skipped:['k.paysages'],ended:false};
    localStorage.setItem('ambient.game.test', JSON.stringify(old)); g.load(); K.refill();
    ok(g.s.nodes.join()==='racine,m.bells,h.pad,t.son,h.key,c.seq,c.rythme' && !('shards' in g.s) && !('puzzles' in g.s) && !('opened' in g.s) && !('pzHelp' in g.s) && !('found' in g.s), 'ancienne sauvegarde (✧, énigmes, portes, étoiles) : nœuds gardés ('+g.s.nodes.length+', S3.5 compris), champs retirés ignorés');
    ok(g.s.active.length===1 && K.eligible(K.byId[g.s.active[0]]) && !g.has(K.byId[g.s.active[0]].node), 'ancienne sauvegarde : un seul défi actif, valide ('+g.s.active.join()+')');
    ok(T.status('h.scale')==='available' && T.status('t.macros')==='available' && K.eligible(K.byId['h.tonalite']) && K.eligible(K.byId['p.premier']), 'ancienne porte (Gammes, Grands réglages) : son défi est proposé');
    g.s.runs['p.premier']={tries:[],target:{'drone.wave':'Orgue','drone.tone':0.5}};
    ok(Array.isArray(Pz.target('p.premier').degs) && Pz.target('p.premier').degs.length===3, 'ancienne cible à réglages : une phrase est tirée'); delete g.s.runs['p.premier'];
    localStorage.setItem('ambient.game.test', JSON.stringify({v:1,mode:'path',shards:5,earned:50,nodes:['racine','c.seq','c.groove']})); g.load();
    ok(g.s.nodes.join()==='racine,c.seq,c.rythme', 'migration S3.5 : Groove seul → Rythme'); }
  // --- Écho (S3.1): a phrase on the Melody voice, played back note by note through 'live'; seeded game rng; S4.3: opens its node
  g.reset(); g.setMode('path'); ['m.bells','h.pad','t.son'].forEach(i=>g.unlock(i));
  { const Ec='p.premier', S=AMB.seq, mid=(dg)=>AMB.theory.degreeToMidi(dg,S.root,S.scale,4), lv=(m)=>AMB.bus.emit('live',{midi:m,time:0,vel:0.85,raw:null});
    let res=null, n=0; ev.length=0; AMB.bus.on('game:puzzle',e=>{ if(e&&e.res) res=e.res; });
    const mr=Math.random; Math.random=()=>{ n++; return 0.5; };
    K.seed(1234); const a=Pz.draw(Ec).degs; K.seed(1234); const b=Pz.draw(Ec).degs; Math.random=mr;
    ok(a.join()===b.join() && !n && a.length===3 && a.every(x=>x>=0&&x<9) && a.every((x,i)=>!i||x!==a[i-1]), 'tirage à graine (rng du jeu, jamais Math.random) : '+a.join(' '));
    K.seed(42); Pz.start(Ec); const t1=Pz.target().degs.slice(), snap=JSON.stringify(AMB.store.stableSnapshot());
    lv(mid(t1[0])); lv(mid(t1[1])-1);
    ok(Pz.echoRow.length===2 && Pz.echoRow[0].state==='ok' && Pz.echoRow[1].dir==='up' && !Pz.run(Ec).tries.length && res===null, 'pions après chaque note : ✓ puis ⬆');
    lv(mid(t1[2])+2); const t2=Pz.target().degs;
    ok(res && !res.ok && res.row.pegs.map(p=>p.state+':'+p.dir).join()==='ok:null,far:up,far:down' && Pz.run(Ec).tries.length===1 && !Pz.echoRow.length && !g.has('t.macros'), 'phrase finie : ✓ ⬆ ⬇, 1 essai sur 6, nœud encore fermé');
    ok(t2.length===3 && t2.join()!==t1.join(), 'nouvel essai : nouvelle phrase '+t1.join(' ')+' → '+t2.join(' '));
    res=null; t2.forEach(dg=>lv(mid(dg)));
    ok(res && res.ok && res.tries===2 && g.has('t.macros') && ev.includes('unlock:'+Ec) && g.s.contracts.includes(Ec) && Pz.current===null && !g.s.runs[Ec], 'phrase entièrement juste : réussie en 2 essais, Grands réglages s\'ouvre directement');
    ok(JSON.stringify(AMB.store.stableSnapshot())===snap, 'pendant l\'Écho : l\'ambiance n\'est pas touchée');
    // MIDI: any octave is fine (the pitch class is judged)
    { g.s.nodes=g.s.nodes.filter(x=>x!=='t.macros'); Pz.start(Ec); const t=Pz.target().degs; res=null;
      lv(mid(t[0])+12); lv(mid(t[1])-24); lv(mid(t[2])+12+1);
      ok(res && res.row.pegs.map(p=>p.state+':'+p.dir).join()==='ok:null,ok:null,far:down', 'MIDI : octave tolérée (✓ ✓ à +12 / −24), la fausse note dit ⬇');
      res=null; Pz.target().degs.forEach(dg=>lv(mid(dg)+12)); ok(res && res.ok && g.has('t.macros'), 'MIDI : phrase juste une octave plus haut → réussie'); }
    // 6 failures → its node opens anyway; a new phrase at each attempt
    g.s.nodes=g.s.nodes.filter(x=>x!=='t.macros'); Pz.start(Ec); const seen=[]; res=null;
    for(let i=0;i<6;i++){ const t=Pz.target().degs; seen.push(t.join('')); t.forEach(dg=>lv(mid(dg)+1)); }
    ok(res && res.out && !res.ok && res.left===0 && Pz.current===null && g.has('t.macros'), '6 échecs → Grands réglages s\'ouvre quand même');
    ok(seen.every((x,i)=>!i||x!==seen[i-1]), '6 essais, 6 phrases tirées : '+seen.join(' '));
    // free mode: nothing judged, nothing shown
    g.setMode('free'); Pz.start(Ec); res=null; const tf=Pz.target().degs; tf.forEach(dg=>lv(mid(dg)));
    ok(!Pz.echoRow.length && !Pz.run(Ec).tries.length && res===null && Pz.echoPlay()===0, 'mode libre : rien de détecté ni joué');
    Pz.stop(); delete g.s.runs[Ec]; g.setMode('path'); }
  // while the instrument plays an Écho's phrase, the Melody's own notes keep quiet; they resume right after
  { const L0=AMB.layers, got=[]; AMB.layers={bells:{note:(m,t)=>got.push(t)}}; const f0=Pz.echoFrom, u0=Pz.echoUntil;
    Pz.echoFrom=10; Pz.echoUntil=12; [9.5,10.5,11.9,12.2].forEach(t=>AMB.seq.melodyNote(60,t,0.8));
    const srcOk=await fetch('../js/sequencer.js').then(r=>r.text()).then(t=>!/bells\.note\(/.test(t.replace(/melodyNote\(midi, time, vel\) \{[\s\S]*?\n    \}/,'')) );
    AMB.layers=L0; Pz.echoFrom=f0; Pz.echoUntil=u0;
    ok(got.join()==='9.5,12.2' && srcOk, 'Écho : la Mélodie auto se tait pendant la phrase (notes '+got.join(' ')+'), toutes ses notes passent par melodyNote'); }
  g.reset();
  g.setMode('free'); ok(T.paramUnlocked('fx.echo') && T.uiUnlocked('song'), 'mode libre : tout ouvert');
  g.reset();
  localStorage.removeItem('ambient.game.test');
  // offline cache: every <script src="js/..."> of index.html is precached by sw.js, in the same order
  Promise.all(['../index.html','../sw.js'].map(u=>fetch(u,{cache:'no-store'}).then(r=>r.text()))).then(([html,sw])=>{
    const scripts=[...html.matchAll(/<script[^>]*\ssrc="(js\/[^"]+)"/g)].map(m=>m[1]);
    const am=sw.match(/const ASSETS\s*=\s*\[([\s\S]*?)\];/), assets=am?[...am[1].matchAll(/'([^']+)'/g)].map(m=>m[1]):[];
    const miss=scripts.filter(s=>!assets.includes(s)), js=assets.filter(a=>a.startsWith('js/'));
    ok(scripts.length>20 && !miss.length, 'sw.js précache tous les scripts de index.html ('+scripts.length+') '+miss.join(','));
    ok(js.join()===scripts.join(), 'sw.js ASSETS dans le même ordre que index.html');
    const css=[...html.matchAll(/<link rel="stylesheet" href="(css\/[^"]+)"/g)].map(m=>m[1]);
    ok(css.length>=1 && css.join()===assets.filter(a=>a.startsWith('css/')).join(), 'sw.js précache les feuilles de style de index.html, dans l\'ordre ('+css.length+')');
  }).catch(e=>log('EXC '+e.stack)).finally(()=>log('DONE'));
  }catch(e){log('EXC '+e.stack)}
});
</script></body></html>
