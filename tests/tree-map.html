<!doctype html><html><head><meta charset="utf-8"></head><body style="margin:0">
<!-- Tree screen (v0.99 fixes): narrow-screen opening, refit on width only, legend / zoom buttons, node card, pointers.
     S11.8: a real tree — no node or label overlaps another (partial and full tree, phone and desktop), each piece above
     its main parent, labels on two lines at most and readable (≥ 11 px on screen when the Arbre opens).
     S4.3: a map to look at — touching a node shows what opens it (challenge, Écho, secret), never buys. -->
<script src="lib.js"></script>
<script>localStorage.removeItem('ambient.game.treemap');</script>
<iframe id="f" src="../index.html?gamekey=ambient.game.treemap" style="width:390px;height:780px;border:0"></iframe>
<script>
const f=document.getElementById('f');
f.addEventListener('load', async ()=>{
  try{
  const w=f.contentWindow, d=f.contentDocument, A=w.AMB, G=A.game, Gd=A.garden, T=A.tree;
  w.addEventListener('error',e=>log('ERROR '+e.message+' @'+e.filename+':'+e.lineno));
  G.setMode('path'); Gd.welcome(false); ['m.bells','h.pad','t.son','e.reverb'].forEach(i=>G.unlock(i));
  const map=d.querySelector('#treeDlg .tree-map'), R=(e)=>e.getBoundingClientRect();
  Gd.showTree(true); await wait(60);
  // --- narrow screen (S11.8): what is lit, in sight, labels readable (≥ 11 px), the root at the bottom
  const root=map.querySelector('.tree-node[data-id=racine] .led'), mr=R(map), rr=R(root), fs=()=>parseFloat(w.getComputedStyle(map.querySelector('.tree-node b')).fontSize)*Gd.view.k;
  const leds=[...map.querySelectorAll('.tree-node .led')].map(R).filter(r=>r.width>0);
  ok(fs()>=10.95 && leds.length>=5 && leds.every(r=>r.left>=mr.left-1 && r.right<=mr.right+1 && r.top>=mr.top-1 && r.bottom<=mr.bottom+1), 'écran étroit ('+map.clientWidth+' px) : tout ce qui est allumé en vue, étiquettes de '+fs().toFixed(1)+' px (k='+Gd.view.k.toFixed(2)+')');
  ok(leds.every(r=>r.top<=rr.top+1), 'la racine en bas de l\'arbre, tout pousse au-dessus');
  ok(/conic-gradient/.test(w.getComputedStyle(d.querySelector('.tree-legend i.st-owned')).backgroundImage), 'S5.7 légende : « ouvert » = la couleur de sa branche (pastille aux 5 couleurs), plus « vert »');
  // --- legend on one line, zoom buttons clear of it
  const items=[...d.querySelectorAll('.tree-legend > span:not(.tree-tip)')], tops=new Set(items.map(e=>Math.round(R(e).top)));
  ok(items.length===3 && tops.size===1, 'S9.4 légende : ouvert, prêt, dans le noir, sur une seule ligne');
  const lg=R(d.querySelector('.tree-legend')), zb=R(d.querySelector('.tree-zoom'));
  ok(zb.top>=lg.bottom, 'boutons + − ⤢ sous la légende (pas de recouvrement)');
  // --- ⤢ = whole map
  d.querySelector('[data-zoom=fit]').click(); await wait(20);
  { const m=R(map), lit=[...map.querySelectorAll('.tree-node:not(.dark) .led')].map(R); ok(lit.length>=5 && lit.every((r)=>r.left>=m.left-1 && r.right<=m.right+1 && r.top>=m.top-1 && r.bottom<=m.bottom+1), 'S9.4 ⤢ : tout ce qui est allumé en vue (k='+Gd.view.k.toFixed(2)+')'); }
  // --- resize: refit only when the width changes
  const resized=(set)=>new Promise(r=>{ w.addEventListener('resize',()=>w.requestAnimationFrame(()=>r()),{once:true}); setTimeout(r,3000); set(); }); // (waits for the resize itself, not a delay)
  Gd.fitTree(); Gd.zoomAt(200,400,1.5); const k1=Gd.view.k;
  await resized(()=>{ f.style.height='700px'; });
  ok(Math.abs(Gd.view.k-k1)<1e-9, 'redimensionnement en hauteur seule : zoom gardé (k='+Gd.view.k.toFixed(2)+')');
  await resized(()=>{ f.style.width='360px'; });
  ok(Math.abs(Gd.view.k-k1)>1e-6 && Gd.view.k>=0.45, 'largeur changée : recadrage (k='+Gd.view.k.toFixed(2)+')');
  // --- pointers: never a stale finger
  const pe=(t,id)=>map.dispatchEvent(new w.PointerEvent(t,{bubbles:true,pointerId:id,pointerType:'touch',isPrimary:id===1,clientX:150,clientY:300}));
  pe('pointerdown',1); pe('pointerdown',2); ok(Gd.pointers()===2, 'deux doigts suivis');
  Gd.showTree(false); ok(Gd.pointers()===0, 'fermeture : pointeurs vidés');
  Gd.showTree(true); await wait(30); pe('pointerdown',3); Gd.showTree(false); Gd.showTree(true); ok(Gd.pointers()===0, 'ouverture : pointeurs vidés');
  pe('pointerdown',4); pe('lostpointercapture',4); ok(Gd.pointers()===0, 'lostpointercapture : pointeur oublié');
  pe('pointerdown',5); map.dispatchEvent(new w.PointerEvent('pointerleave',{pointerId:5,pointerType:'mouse'})); ok(Gd.pointers()===0, 'pointerleave : pointeur oublié');
  // --- node card: « Débloque » grouped by layer, deduplicated
  const multi=T.NODES.find(n=>{ const secs=n.params.filter(p=>!p.startsWith('*.')&&!p.endsWith('.*')).map(p=>p.split('.')[0]); return secs.length>=3 && new Set(secs).size<secs.length; });
  Gd.select(multi.id); const txt=d.querySelector('.tree-info .ti-g').textContent;
  const labels=T.grantGroups(multi.id).map(g=>g.label), dupes=labels.filter(l=>txt.split(l).length-1>1);
  ok(!dupes.length && txt.includes(' : '), 'fiche « '+multi.name+' » : '+txt);
  ok(T.NODES.every(n=>{ const g=T.grantGroups(n.id); return new Set(g.map(x=>x.label)).size===g.length && g.every(x=>new Set(x.items).size===x.items.length); }), 'Débloque : un groupe par couche, sans doublon, pour les '+T.NODES.length+' nœuds');
  // S3.5: the Composer branch in 3 nodes (Mélodie écrite → Rythme → Morceau), on the map with their links
  const comp=T.NODES.filter(n=>n.branch==='composer').map(n=>n.id), cn=comp.map(id=>map.querySelector('.tree-node[data-id="'+id+'"]'));
  ok(comp.join()==='c.seq,c.rythme,c.song' && cn.every(Boolean) && map.querySelector('.tree-link[data-from="c.seq"][data-to="c.rythme"]') && map.querySelector('.tree-link[data-from="c.rythme"][data-to="c.song"]') && map.querySelector('.tree-link[data-from="h.prog"][data-to="c.song"]'), 'Composer : 3 nœuds sur la carte ('+cn.map(e=>e&&e.textContent.trim()).join(' · ')+'), '+T.NODES.length+' nœuds en tout');
  Gd.select('c.rythme'); const ti=d.querySelector('.tree-info .ti-g').textContent;
  ok(/Basse/.test(ti) && /Pulsations/.test(ti) && /Swing/.test(ti), 'fiche Rythme : '+ti);
  // --- S4.3 the card says what opens the node; a click (mouse or finger) selects, never opens
  const card=()=>d.querySelector('.tree-info'), op=()=>(card().querySelector('.ti-o')||{}).textContent||'';
  map.querySelector('.tree-node[data-id="h.drone"]').click(); await wait(20);
  ok(!G.has('h.drone') && Gd.sel==='h.drone' && /Pour l'ouvrir :☐ Joue 6 accords.*☐ Joue \d+ notes sur les accords du Pad/.test(op()) && !card().querySelector('.tree-buy'), 'clic sur Drone qui suit : sa fiche, « '+op()+' », rien d\'acheté');
  Gd.select('t.macros');
  ok(/☐ Réponse « Premier reflet » \(4 notes\)☐ Joue pendant/.test(op()) && !card().querySelector('.tree-buy, button'), 'Grands réglages : « '+op()+' », sans bouton (la Réponse se joue dans la musique)');
  Gd.select('m.phrase');
  ok(/Réponse « Suite connue »/.test(op()) && /ou ✦ Découverte : \?\?\?/.test(op()), 'Phrases : une Réponse ou une découverte cachée (« '+op()+' »)');
  const spans=[...map.querySelectorAll('.tree-node')].map(b=>b.querySelector('span').textContent);
  ok(!spans.some(t=>/✧/.test(t)) && spans.every(t=>/^(✓|✦ prêt|✦|◇ \d\/[23]|)$/.test(t)) && spans.some(t=>/^◇ 0\/2$/.test(t)) && spans.includes('✓'), 'S11.1 nœuds : ✓, ◇ objectifs faits / à faire (« ◇ 0/2 »), aucun coût');
  ok(/^\d+ ouverts?$/.test(d.querySelector('.tree-count').textContent), 'en-tête : nœuds ouverts '+d.querySelector('.tree-count').textContent);
  Gd.select(null); Gd.showTree(false);
  // --- S11.8 layout: no overlap between pieces (hexagon, name, state) nor branch names; each piece above its main parent;
  // labels on 1–2 lines; partial tree, a ready piece, the whole tree; phone, then desktop
  const check=async (what)=>{
    Gd.showTree(true); await wait(40); const v=Gd.view; v.k=1; Gd.applyView(); d.getAnimations().forEach(x=>x.cancel()); // (measured at scale 1, still: no entrance nor levitation)
    const lay=Gd.treeLayout(), nodes=[...map.querySelectorAll('.tree-node')].filter(b=>w.getComputedStyle(b).display!=='none');
    const parts=nodes.flatMap(b=>[...b.querySelectorAll('.led, b, span')].map(e=>({id:b.dataset.id,r:R(e)}))).filter(o=>o.r.width>0)
      .concat([...map.querySelectorAll('.tree-bname')].filter(t=>w.getComputedStyle(t).display!=='none').map(t=>({id:'#'+t.dataset.b,r:t.getBoundingClientRect()})));
    const M=3, hit=[]; // (3 px of air at least)
    for (let i=0;i<parts.length;i++) for (let j=i+1;j<parts.length;j++) { const a=parts[i], b=parts[j]; if (a.id===b.id) continue;
      if (a.r.left<b.r.right+M && b.r.left<a.r.right+M && a.r.top<b.r.bottom+M && b.r.top<a.r.bottom+M) hit.push(a.id+'/'+b.id); }
    ok(nodes.length>1 && !hit.length, what+' : '+nodes.length+' pièces, aucun chevauchement'+(hit.length?' — '+[...new Set(hit)].slice(0,6).join(' '):''));
    const bad=nodes.filter(b=>{ const p=lay.prim[b.dataset.id]; if (!p) return false; const a=R(b.querySelector('.led')), c=R(map.querySelector('.tree-node[data-id="'+p+'"] .led')); return !(a.bottom<c.top-40 && lay.pos[b.dataset.id].y<lay.pos[p].y); });
    const two=nodes.filter(b=>{ const e=b.querySelector('b'), lh=parseFloat(w.getComputedStyle(e).lineHeight)||15; return e.querySelectorAll('br').length>1 || R(e).height>lh*2+6; });
    ok(!bad.length && !two.length, what+' : chaque pièce au-dessus de son parent principal, étiquettes sur 2 lignes au plus'+(bad.length?' — sous : '+bad.map(b=>b.dataset.id).join(' '):'')+(two.length?' — longues : '+two.map(b=>b.dataset.id).join(' '):''));
    const solid=map.querySelectorAll('.tree-link:not(.x):not(.gone)').length, dot=map.querySelectorAll('.tree-link.x:not(.gone):not(.dark)');
    ok([...map.querySelectorAll('.tree-link:not(.gone)')].every(p=>/^M[\d.-]+ [\d.-]+(V[\d.-]+(H[\d.-]+V[\d.-]+)?)$/.test(p.getAttribute('d'))) && [...dot].every(p=>parseFloat(w.getComputedStyle(p).strokeWidth)<2), what+' : traces à angle droit, parent principal en trait plein ('+solid+'), autres prérequis en pointillé fin ('+dot.length+')');
    Gd.showTree(false);
  };
  await check('390 px, début (5 pièces)');
  G.ready('h.key','test'); await check('390 px, une pièce prête');
  for (let k=0;k<8;k++) T.NODES.forEach(n=>{ if (T.status(n.id)==='available') G.unlock(n.id); });
  await check('390 px, arbre complet');
  Gd.showTree(true); await wait(40);
  ok(fs()>=10.95, 'arbre complet au téléphone : ouvert lisible (étiquettes '+fs().toFixed(1)+' px), on se déplace');
  d.querySelector('[data-zoom=fit]').click(); { const m=R(map), lit=[...map.querySelectorAll('.tree-node:not(.dark) .led')].map(R); ok(lit.every(r=>r.left>=m.left-1 && r.right<=m.right+1 && r.top>=m.top-1 && r.bottom<=m.bottom+1), '⤢ : tout l\'arbre en vue (k='+Gd.view.k.toFixed(2)+')'); }
  Gd.showTree(false);
  f.style.width='1280px'; f.style.height='800px'; await wait(200);
  await check('1280 px, arbre complet');
  localStorage.removeItem('ambient.game.treemap');
  done();
  }catch(e){ fail(e); }
});
</script></body></html>
