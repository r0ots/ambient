<!doctype html><html><head><meta charset="utf-8"></head><body>
<!-- G11.3 / v1.06 — economy of the Parcours: scripted players run through the path on the REAL data (tree costs and gates,
     contracts drawn one at a time like contracts.refill, puzzles, secrets) with a time model per activity.
     These three are the only sources of ✧ (no discoveries since v1.06; the garden visual pays nothing: checked below).
     Targets (ROADMAP G11.3): typical full path 60–90 min, never more than 5 min without a purchase, margin between the
     ✧ that can be earned and the tree cost 50–80 %, a slow player: first purchase in under 2 min. -->
<script src="lib.js"></script>
<script>localStorage.removeItem('ambient.game.balance');</script>
<iframe id="f" src="../index.html?gamekey=ambient.game.balance&listen" style="width:800px;height:600px"></iframe>
<script>
// seconds per activity (a player exploring at a calm pace; `k` slows everything down for a slower player)
const TIME = { buy: 20, contract: (d) => 40 + 12 * Math.min(d.goal, 8), puzzle: 180, secret: 240 };
const mulberry = (a) => () => { a = (a + 0x6d2b79f5) >>> 0; let t = Math.imul(a ^ (a >>> 15), a | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };

document.getElementById('f').addEventListener('load', async () => {
  try {
    const w = document.getElementById('f').contentWindow, A = w.AMB, T = A.tree, G = A.garden;
    const nodes = T.NODES, cost = nodes.reduce((a, n) => a + n.cost, 0);
    // --- the sources that pay: only contracts, puzzles, secrets call game.earn / complete / solve; no discovery any more
    const src = async (f) => (await (await fetch('../js/' + f)).text()).replace(/\/\/.*$/gm, '');
    ok(!/\.(earn|complete|solve)\(/.test(await src('garden-visual.js')), 'jardin visuel : aucun ✧ versé');
    ok(!A.game.discover && !('found' in A.game.s) && !G.discoverables && !/\.(earn|discover)\(/.test(await src('garden.js')), 'découvertes supprimées : ni état found, ni carnet, l\'interface ne verse rien');

    // --- every income, with its prerequisites
    const inc = [];
    for (const d of A.contracts.DEFS) inc.push({ id: d.id, need: d.need, n: d.reward, t: TIME.contract(d), kind: 'contrat' });
    for (const d of A.puzzles.DEFS) inc.push({ id: d.id, need: d.need, n: d.reward, t: TIME.puzzle, kind: d.opens ? 'porte' : 'énigme', solves: d.id });
    for (const d of A.secrets.DEFS) inc.push({ id: 's:' + d.id, need: [d.node], n: d.reward.n, t: TIME.secret, kind: 'secret', midi: d.midi });
    const total = inc.reduce((a, x) => a + x.n, 0), by = {}; inc.forEach((x) => { by[x.kind] = (by[x.kind] || 0) + x.n; });
    const margin = Math.round(100 * (total / cost - 1));
    log(`économie : coût de l'arbre ${cost} ✧, gagnables ${total} ✧ (${JSON.stringify(by)}), marge ${margin} %`);

    const fmt = (s) => (s / 60).toFixed(1);
    // --- one scripted player. opts: {k (time factor), midi, extra (puzzles without a gate), secrets, seed,
    //     worst (buys first the nodes that open no income: the dead end to avoid since discoveries are gone)}
    function sim(opts) {
      const k = opts.k || 1, rnd = mulberry(opts.seed || 7);
      const own = new Set(['racine']), solved = new Set(), done = new Set();
      const pool = inc.filter((x) => (opts.extra || x.kind !== 'énigme') && (opts.secrets !== false || x.kind !== 'secret') && (opts.midi || !x.midi));
      // contracts: one active, drawn at random among the eligible ones (contracts.refill)
      const active = [];
      const refill = () => {
        const cand = A.contracts.DEFS.filter((d) => !done.has(d.id) && !active.includes(d.id) && d.need.every((r) => own.has(r)));
        while (active.length < 1 && cand.length) active.push(cand.splice(Math.floor(rnd() * cand.length), 1)[0].id);
      };
      let shards = 0, t = 0, gap = 0, gapAt = '', lastBuy = 0, firstBuy = null, earned = 0; const steps = [], waits = [];
      const avail = (n) => !own.has(n.id) && n.req.every((r) => own.has(r)) && (!n.gate || solved.has(n.gate));
      refill();
      for (let guard = 0; guard < 5000 && own.size < nodes.length; guard++) {
        const pays = (n) => inc.some((x) => x.need.includes(n.id)); // a node that opens an income
        const buy = nodes.filter((n) => avail(n) && n.cost <= shards).sort((a, b) => (opts.worst ? pays(a) - pays(b) : 0) || a.cost - b.cost)[0];
        if (buy) {
          shards -= buy.cost; own.add(buy.id); t += TIME.buy * k;
          if (firstBuy == null) firstBuy = t;
          if (t - lastBuy > 4 * 60) waits.push(`${fmt(t - lastBuy)}′→${buy.id}`);
          if (t - lastBuy > gap) { gap = t - lastBuy; gapAt = buy.id; }
          lastBuy = t; steps.push(`${Math.round(t / 60)}′ ${buy.id}`); refill(); continue;
        }
        const todo = pool.filter((x) => !done.has(x.id) && x.need.every((r) => own.has(r)) && (x.kind !== 'contrat' || active.includes(x.id)))
          .sort((a, b) => (b.kind === 'porte') - (a.kind === 'porte') || (a.kind === 'énigme') - (b.kind === 'énigme') || a.t / a.n - b.t / b.n)[0];
        if (!todo) break;
        done.add(todo.id); shards += todo.n; earned += todo.n; t += todo.t * k;
        if (todo.solves) solved.add(todo.solves);
        if (todo.kind === 'contrat') { active.splice(active.indexOf(todo.id), 1); refill(); }
      }
      return { t, gap, gapAt, firstBuy, steps, left: nodes.filter((n) => !own.has(n.id)).map((n) => n.id), earned, waits };
    }

    // typical player (no MIDI, puzzles without a gate last, secrets when the cheaper things are done), 5 contract draws
    const runs = [1, 2, 3, 4, 5].map((seed) => sim({ seed, extra: true }));
    const tMin = Math.min(...runs.map((r) => r.t)), tMax = Math.max(...runs.map((r) => r.t)), gMax = Math.max(...runs.map((r) => r.gap));
    const r1 = runs[0];
    log(`parcours type (5 tirages de contrats) : tout l'arbre en ${fmt(tMin)}–${fmt(tMax)} min, plus longue attente sans achat ${fmt(gMax)} min (avant ${runs.find((r) => r.gap === gMax).gapAt} ; attentes > 4 min, tirage 1 : ${r1.waits.join(' ') || 'aucune'})`);
    log('jalons (tirage 1) : ' + r1.steps.filter((s, i) => i % 6 === 5 || i === r1.steps.length - 1).join(' · '));
    ok(runs.every((r) => !r.left.length), 'aucun blocage, tout l\'arbre est atteignable ' + runs.map((r) => r.left.join(',')).join(''));
    ok(tMin >= 60 * 60 && tMax <= 90 * 60, 'cible : parcours type complet en 60–90 min (' + fmt(tMin) + '–' + fmt(tMax) + ')');
    ok(gMax <= 5 * 60, 'cible : jamais plus de 5 min sans achat possible (' + fmt(gMax) + ' min)');
    ok(margin >= 50 && margin <= 80, 'cible : marge gagnables / coût de 50 à 80 % (' + margin + ' %)');

    // a slower player (the son): 1.3× slower, no MIDI, no puzzle without a gate
    const kid = sim({ seed: 3, k: 1.3 });
    log(`joueur lent : 1er achat à ${Math.round(kid.firstBuy)} s, arbre en ${fmt(kid.t)} min, attente max ${fmt(kid.gap)} min (attentes > 4 min : ${kid.waits.join(' ') || 'aucune'})`);
    ok(kid.firstBuy < 120, 'cible : joueur lent, premier achat en moins de 2 min (' + Math.round(kid.firstBuy) + ' s)');
    ok(kid.gap <= 5 * 60 * 1.3, 'joueur lent : attente max ≤ 6,5 min (5 min × 1,3) (' + fmt(kid.gap) + ')');

    // the worst buying order (nodes opening no income first) never ends in a dead end
    const bad = [1, 2, 3].map((seed) => sim({ seed, worst: true }));
    ok(bad.every((r) => !r.left.length), 'pire ordre d\'achat (nœuds sans revenu d\'abord) : jamais d\'impasse ' + bad.map((r) => r.left.join(',')).join(''));
    // a musician with a MIDI keyboard: every secret reachable, every puzzle
    const mus = sim({ seed: 2, midi: true, extra: true });
    log(`musicien au clavier MIDI : arbre en ${fmt(mus.t)} min, attente max ${fmt(mus.gap)} min (attentes > 4 min : ${mus.waits.join(' ') || 'aucune'})`);
    ok(!mus.left.length && mus.gap <= 5 * 60, 'musicien au clavier MIDI : tout atteignable, jamais plus de 5 min sans achat (' + fmt(mus.gap) + ')');
    done();
  } catch (e) { fail(e); }
});
</script></body></html>
