<!doctype html><html><head><meta charset="utf-8"></head><body>
<!-- Pace of the Parcours (S4.3, no currency): scripted players run through the path on the REAL data (tree, contracts.OPENS,
     contracts.eligible / refill order, Écho lengths, secrets.OPENS) with a time model per activity. Each challenge opens its
     node; a secret opens its own node (or, already owned, the next node of the path).
     Targets: typical full path ≤ 45 min, never more than 3 min without a new node, no dead end whatever the order the
     challenges are played in (↷), the musician who finds the key secrets is faster; the slow player is reported.
     S4.6: a node won is only « prêt »: the player touches « ✦ Ouvrir », reads what it gives and opens it (TIME.open per node,
     one more click). That time is the player's own pace: it counts in the total and in the waits without a new node, the
     45-min target stays on the time spent playing (total minus opening). -->
<script src="lib.js"></script>
<script>localStorage.removeItem('ambient.game.balance');</script>
<iframe id="f" src="../index.html?gamekey=ambient.game.balance&listen" style="width:800px;height:600px"></iframe>
<script>
// seconds per activity, for a player exploring at a calm pace (`k` slows everything down); each run draws 0.75–1.25× per activity
const JITTER = 0.25;
const mulberry = (a) => () => { a = (a + 0x6d2b79f5) >>> 0; let t = Math.imul(a ^ (a >>> 15), a | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };

document.getElementById('f').addEventListener('load', async () => {
  try {
    const w = document.getElementById('f').contentWindow, A = w.AMB, T = A.tree, K = A.contracts, nodes = T.NODES;
    const TIME = { contract: (d) => 40 + 12 * Math.min(d.goal, 8), echo: (d) => 45 + 15 * A.puzzles.respLen(d.d), secret: 45, open: 8 };
    const tOf = (d) => (d.kind === 'reponse' ? TIME.echo(d) : TIME.contract(d));
    const fmt = (s) => (s / 60).toFixed(1);
    // a key secret is reachable once its node is owned (Lenteur céleste also plays Halo and Tempo); MIDI-only ones for the musician
    const SECRET_NEED = { lent: ['e.halo', 'm.tempo'] };
    const SECRETS = A.secrets.DEFS.map((d) => ({ id: d.id, need: [d.node, ...(SECRET_NEED[d.id] || [])], opens: A.secrets.OPENS[d.id], midi: d.midi }));

    // one scripted player. opts: {k, seed, jitter, random (plays any eligible challenge, ↷ at random), secrets, midi}
    function sim(opts) {
      const k = opts.k || 1, rnd = mulberry(opts.seed || 7), jit = () => (opts.jitter ? 1 + JITTER * (2 * rnd() - 1) : 1);
      const own = new Set(['racine']), done = new Set(), found = new Set();
      const g = { has: (id) => own.has(id), s: { contracts: [] } }; // enough of game for tree.status / contracts.eligible
      const status = (id) => T.status(id, g);
      const eligible = (d) => !done.has(d.id) && d.need.every((n) => own.has(n)) && (d.node ? status(d.node) === 'available' : true);
      const openChain = (id) => { if (own.has(id)) return; T.byId[id].req.forEach(openChain); own.add(id); };
      const nextNode = () => { const d = K.ORDER.find((x) => x.node && status(x.node) === 'available'); return d && d.node; };
      let t = 0, tOpen = 0, last = 0, gap = 0, gapAt = '', firstNode = null; const steps = [];
      const opened = (before) => { if (own.size > before) { const o = (own.size - before) * TIME.open * k; t += o; tOpen += o; /* « ✦ Ouvrir », read, « Ouvrir » */ if (firstNode == null) firstNode = t; if (t - last > gap) { gap = t - last; gapAt = [...own].pop(); } last = t; steps.push(`${Math.round(t / 60)}′ ${[...own].pop()}`); } };
      for (let guard = 0; guard < 500; guard++) {
        if (own.size === nodes.length && done.has(A.garden.FINALE)) break;
        const before = own.size;
        const sec = opts.secrets && SECRETS.find((x) => !found.has(x.id) && (opts.midi || !x.midi) && x.need.every((n) => own.has(n)));
        if (sec) { found.add(sec.id); t += TIME.secret * k * jit(); const nid = own.has(sec.opens) ? nextNode() : sec.opens; if (nid) openChain(nid); opened(before); continue; }
        const cand = K.ORDER.filter((d) => d.first).concat(K.ORDER.filter((d) => !d.first)).filter(eligible);
        if (!cand.length) break;
        const d = opts.random ? cand[Math.floor(rnd() * cand.length)] : cand[0];
        done.add(d.id); t += tOf(d) * k * jit();
        if (d.node) own.add(d.node);
        opened(before);
      }
      return { t, play: t - tOpen, tOpen, gap, gapAt, firstNode, steps, left: nodes.filter((n) => !own.has(n.id)).map((n) => n.id), fin: done.has(A.garden.FINALE), secrets: found.size };
    }

    const echoes = K.DEFS.filter((d) => d.kind === 'reponse').map((d) => `${d.title} ${A.puzzles.respLen(d.d)}`);
    const base = K.DEFS.reduce((a, d) => a + tOf(d), 0);
    log(`ouvrir un nœud prêt : ${TIME.open} s (lire la carte, toucher Ouvrir)`);
    log(`${K.DEFS.length} défis (${echoes.length} Échos : ${echoes.join(', ')}), ${nodes.length - 1} nœuds à ouvrir ; somme des temps nominaux ${fmt(base)} min`);

    // typical player: the path's order (the LCD's), 5 jittered runs
    const runs = [1, 2, 3, 4, 5].map((seed) => sim({ seed, jitter: true }));
    const tMin = Math.min(...runs.map((r) => r.t)), tMax = Math.max(...runs.map((r) => r.t)), gMax = Math.max(...runs.map((r) => r.gap));
    const pMin = Math.min(...runs.map((r) => r.play)), pMax = Math.max(...runs.map((r) => r.play));
    log(`parcours type (5 tirages) : tout l'arbre puis « Enregistre ton morceau » en ${fmt(tMin)}–${fmt(tMax)} min dont ${fmt(runs[0].tOpen)} min à ouvrir (jeu : ${fmt(pMin)}–${fmt(pMax)} min), plus longue attente sans nouveau nœud ${fmt(gMax)} min (avant ${runs.find((r) => r.gap === gMax).gapAt})`);
    log('jalons (tirage 1) : ' + runs[0].steps.filter((s, i) => i % 6 === 5 || i === runs[0].steps.length - 1).join(' · '));
    ok(runs.every((r) => !r.left.length && r.fin), 'parcours type : tout l\'arbre ouvert et le dernier défi joué ' + runs.map((r) => r.left.join(',')).join(''));
    ok(pMax <= 45 * 60, 'cible : parcours type joué en ≤ 45 min, ouvertures à part (' + fmt(pMin) + '–' + fmt(pMax) + ' ; avec elles ' + fmt(tMin) + '–' + fmt(tMax) + ')');
    ok(gMax <= 3 * 60, 'cible : jamais plus de 3 min sans nouveau nœud (' + fmt(gMax) + ' min)');

    // any order (↷ at random among the eligible challenges): never a dead end
    const any = Array.from({ length: 40 }, (_, i) => sim({ seed: 100 + i, random: true, jitter: true }));
    ok(any.every((r) => !r.left.length && r.fin), '40 ordres au hasard : jamais d\'impasse, tout l\'arbre et le dernier défi ' + any.map((r) => r.left.join(',')).join(''));
    log(`ordres au hasard : ${fmt(Math.min(...any.map((r) => r.t)))}–${fmt(Math.max(...any.map((r) => r.t)))} min, attente max ${fmt(Math.max(...any.map((r) => r.gap)))} min`);

    // the slow player (the son): 1.3× slower, reported
    const kid = sim({ seed: 3, k: 1.3, jitter: true });
    log(`joueur lent (×1,3) : 1er nœud à ${Math.round(kid.firstNode)} s, arbre en ${fmt(kid.t)} min, attente max ${fmt(kid.gap)} min`);
    ok(!kid.left.length && kid.fin, 'joueur lent : tout l\'arbre et le dernier défi (rapporté, pas de cible de temps)');

    // the musician (MIDI keyboard) who finds the key secrets: each one opens a node, the path is shorter
    const mus = [1, 2, 3, 4, 5].map((seed) => sim({ seed, midi: true, secrets: true, jitter: true }));
    const mMax = Math.max(...mus.map((r) => r.t));
    log(`musicien MIDI qui trouve les secrets-clés (${mus[0].secrets}) : ${fmt(Math.min(...mus.map((r) => r.t)))}–${fmt(mMax)} min, attente max ${fmt(Math.max(...mus.map((r) => r.gap)))} min`);
    ok(mus.every((r) => !r.left.length && r.fin) && mMax < tMin, 'musicien avec secrets : tout l\'arbre, plus rapide que le parcours type (' + fmt(mMax) + ' < ' + fmt(tMin) + ' min)');
    done();
  } catch (e) { fail(e); }
});
</script></body></html>
