<!doctype html><html><head><meta charset="utf-8"><!-- Dev contact sheets of the city engine (S8.1, not in the suite): the city alone (no app around it), a fake
  audio clock, frames rendered at chosen times and tiled on one page; take a screenshot of the page.
  ?w=1280&h=720&dpr=1 (one frame's CSS size and pixel ratio; default 640×360, dpr 1), ?cols=3, ?scale=0.5 (tile scale).
  Sheets (#sheet=…): build (a layer opens: its building is built, then its layer is switched off: deconstructed),
  full (the whole city playing: notes, chords, beat), dawn (the end: replay at dawn), storm (Nature high, Dérive,
  Reverb, Usure), music (S8.5: one bar played — melody, player notes, chords, bass, kick — lasers, ring, grid, sky sweep), grow (the Parcours: one layer after another, the camera framing), single (one frame), empty.
  Prints in the title the real cost of a frame (JS). --><style>body{margin:0;background:#000}canvas{display:block}#out{image-rendering:auto}</style></head><body>
<script>window.__errs = []; window.addEventListener('error', (e) => window.__errs.push(e.message + ' @' + e.lineno)); window.AMB_GAME_KEY = 'ambient.game.shot-city'; localStorage.removeItem(window.AMB_GAME_KEY); localStorage.removeItem('ambient.vizMode');</script>
<script src="lib.js"></script>
<script>testBus(); AMB.engine = {};
AMB.tree = { NODES: [['racine', 'drone.on'], ['t.son', 'drone.wave'], ['h.drone', 'drone.follow'], ['h.pad', 'pad.on'], ['h.pad2', 'pad.attack'], ['h.prog', 'pad.prog'],
  ['m.bells', 'bells.on'], ['m.phrase', 'bells.mode'], ['m.grains', 'grains.on'], ['c.seq', 'seq.on'], ['c.rythme', 'bass.*'], ['c.rythme', 'perc.*'], ['e.texture', 'texture.*'], ['e.reverb', '*.send']].map(([id, p]) => ({ id, params: [p] })) };
</script>
<script src="../js/theory.js"></script><script src="../js/params.js"></script><script src="../js/game.js"></script><script src="../js/visual.js"></script><script src="../js/garden-visual.js"></script><script src="../js/city-music.js"></script>
<canvas id="out"></canvas>
<script>
window.addEventListener('load', () => {
  const Q = new URLSearchParams(location.search), w = +Q.get('w') || 640, h = +Q.get('h') || 360, dpr = +Q.get('dpr') || 1, cols = +Q.get('cols') || 3, sc = +Q.get('scale') || 1;
  const sheet = (/sheet=([a-z]+)/.exec(location.hash) || [, 'single'])[1];
  const G = AMB.game, V = AMB.visual, GV = AMB.gardenVisual, St = AMB.store, cv = document.createElement('canvas');
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); cv.style.width = w + 'px'; cv.style.height = h + 'px'; document.body.appendChild(cv);
  V.c = cv; V.g = cv.getContext('2d'); V.dpr = dpr;
  let T = 100, fake = 1000; GV.clock = () => T; GV.now = () => fake; GV.visible = true;
  const ALL = ['racine', 't.son', 'h.drone', 'h.pad', 'h.pad2', 'h.prog', 'm.bells', 'm.phrase', 'm.grains', 'c.seq', 'c.rythme', 'e.texture', 'e.reverb'];
  G.setMode('path'); G.s.nodes = ALL.slice(); GV.sig = null; St.setMany({ 'seq.on': true, 'bass.on': true, 'perc.on': true, 'texture.on': true, 'grains.on': true }, 'preset');
  AMB.seq = { playing: true, step: 0, nextTime: T, origin: 0, stepDur: () => 0.15 };
  const seqAt = () => { const sd = 0.15, n = Math.floor((T - 100) / sd); AMB.seq.step = n + 1; AMB.seq.nextTime = 100 + (n + 1) * sd; };
  const step = (s, notes) => { const n = Math.max(1, Math.round(s / 0.016)); for (let i = 0; i < n; i++) { T += s / n; fake += s / n * 1000; seqAt(); if (notes) notes(i); const t0 = performance.now(); V.draw(); ms.push(performance.now() - t0); } }, ms = [];
  const tiles = [], snap = (label) => { const c = document.createElement('canvas'); c.width = cv.width; c.height = cv.height; c.getContext('2d').drawImage(cv, 0, 0); tiles.push([c, label]); };
  const music = (i) => { if (i % 9 === 0) AMB.bus.emit('note', { layer: ['bells', 'seq', 'bass'][(i / 9) % 3], midi: 55 + (i * 7) % 24, time: T, vel: 0.8 }); if (i % 6 === 0) AMB.bus.emit('perc', { track: i % 3, time: T, vel: 0.8 }); if (i % 60 === 0) AMB.bus.emit('chord', { time: T, deg: (i / 60) % 7, midis: [52, 55, 59] }); };
  V.draw(); step(0.5);
  if (sheet === 'build') {
    G.s.nodes = ALL.filter((n) => n !== 'c.seq'); GV.sig = null; step(1.2);
    snap('avant'); GV.growAt(T + 0.2); G.s.nodes.push('c.seq'); GV.sig = null;
    for (const t of [0.5, 0.6, 0.6, 0.6, 0.8]) { step(t); snap('construction +' + (T - 100).toFixed(1)); }
    step(1.5); snap('construit'); St.set('seq.on', false, 'user');
    for (const t of [0.3, 0.4, 0.4]) { step(t); snap('déconstruction'); }
    step(1.2); snap('terrain vague'); St.set('seq.on', true, 'user'); step(0.7); snap('reconstruction');
  } else if (sheet === 'grow') { // the Parcours: the city grows one layer at a time, the camera pulls back
    G.s.nodes = ['racine']; GV.sig = null; GV.built = {}; GV.grow = {}; step(3); snap('Allumage');
    for (const n of ['h.pad', 'm.bells', 'm.grains', 'c.rythme', 'e.texture', 'c.seq']) { GV.growAt(T + 0.1); G.s.nodes.push(n); GV.sig = null; step(1.2, music); snap('+ ' + n + ' (chantier)'); step(2.4, music); }
    snap('ville entière');
  } else if (sheet === 'full') {
    for (let k = 0; k < 6; k++) { step(0.35, music); AMB.bus.emit('live', { midi: 64 + k * 3, time: T, vel: 0.9, raw: 0.9, id: k }); step(0.12); snap('ville pleine ' + k); }
  } else if (sheet === 'dawn') {
    GV.replayStart({ t0: T, from: 0, len: 4, ev: ['pad', 'bells', 'bass', 'grains', 'drone', 'seq', 'perc', 'texture'].map((l, i) => ({ layer: l, t: 0.3 + i * 0.4, vel: 0.8 })) });
    for (let k = 0; k < 6; k++) { step(0.8); snap('aube ' + (k * 0.8 + 0.8).toFixed(1)); }
  } else if (sheet === 'storm') {
    St.setMany({ 'texture.vol': 1, 'texture.on': true, 'global.evolve': 1, 'fx.space': 1, 'fx.size': 1, 'fx.tape': 0.8, 'fx.lofi': 0.6 }, 'preset'); step(3);
    for (let k = 0; k < 6; k++) { step(0.4, music); snap('orage ' + k); }
  } else if (sheet === 'music') { // S8.5: one bar (16 steps of 0.15 s): melody in eighths, player notes, chords I → V, bass, kick on 1 and 3
    step(1.2); const t0 = T, ev = [];
    for (let i = 0; i < 8; i++) ev.push([i * 0.3, 'note', { layer: i % 2 ? 'seq' : 'bells', midi: 60 + [0, 4, 7, 12, 16, 12, 7, 19][i], vel: 0.75, dur: 0.25 }]);
    ev.push([0.45, 'live', { midi: 72, vel: 0.95, raw: 0.95, id: 1 }], [0.9, 'liveOff', { id: 1 }], [1.5, 'live', { midi: 55, vel: 0.9, raw: 0.9, id: 2 }], [2.1, 'liveOff', { id: 2 }], [1.95, 'live', { midi: 88, vel: 1, raw: 1, id: 3 }], [2.3, 'liveOff', { id: 3 }]);
    ev.push([0, 'chord', { deg: 0, midis: [48, 52, 55] }], [1.2, 'chord', { deg: 4, midis: [43, 47, 50], forced: true }]);
    for (let b = 0; b < 4; b++) ev.push([b * 0.6, 'note', { layer: 'bass', midi: 36, vel: 0.85, dur: 0.3 }]);
    ev.push([0, 'perc', { track: 0, vel: 0.95 }], [1.2, 'perc', { track: 0, vel: 0.9 }]);
    ev.sort((a, b) => a[0] - b[0]); let k = 0;
    const music2 = () => { while (k < ev.length && t0 + ev[k][0] <= T + 0.001) { const [dt2, n, d] = ev[k++]; AMB.bus.emit(n, { ...d, time: t0 + dt2 }); } };
    for (let f = 0; f < 12; f++) { step(0.2, music2); snap('t ' + (T - t0).toFixed(2) + ' s · temps ' + (1 + Math.floor((T - t0 - 0.001) / 0.6))); }
  } else if (sheet === 'empty') { G.s.nodes = []; GV.sig = null; step(0.5); snap('vide'); }
  else { step(1.5, music); snap('ville'); }
  const out = document.getElementById('out'), tw = Math.round(cv.width * sc), th = Math.round(cv.height * sc), n = tiles.length, c = Math.min(cols, n), rws = Math.ceil(n / c);
  out.width = c * tw; out.height = rws * (th + 16); const o = out.getContext('2d'); o.fillStyle = '#111'; o.fillRect(0, 0, out.width, out.height);
  tiles.forEach(([t, l], i) => { const x = (i % c) * tw, y = Math.floor(i / c) * (th + 16); o.drawImage(t, x, y + 16, tw, th); o.fillStyle = '#ffd36b'; o.font = '12px monospace'; o.fillText(l, x + 4, y + 12); });
  cv.remove(); ms.sort((a, b) => a - b); document.title = 'ready ' + JSON.stringify(GV.stats()) + ' music ' + JSON.stringify(AMB.cityMusic ? AMB.cityMusic.stats() : null) + ' real ms avg ' + (ms.reduce((a, b) => a + b, 0) / ms.length).toFixed(2) + ' p95 ' + ms[Math.floor(ms.length * 0.95)].toFixed(2);
});
</script></body></html>
