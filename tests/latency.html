<!doctype html><html><head><meta charset="utf-8"></head><body>
<!-- G9b.2 global latency calibration (js/latency.js) + MIDI of the arcade: raw velocity, sustain (CC64, onCC), several inputs. Injected clock, no real audio (≤ 10 s). -->
<script src="lib.js"></script>
<script>
// v1.00 migration: Réponds' own calibration is picked up by the global one (default key only)
['ambient.latency.v1', 'ambient.reponds.lat.v1', 'ambient.latency.test'].forEach((k) => localStorage.removeItem(k));
localStorage.setItem('ambient.reponds.lat.v1', JSON.stringify({ v: 1, key: 33, any: 33 }));
window.AMB_ARCADE_KEY = 'ambient.arcade.test-latency'; localStorage.removeItem(window.AMB_ARCADE_KEY);
testBus();
</script>
<script src="../js/audition.js"></script><script src="../js/arcade.js"></script><script src="../js/latency.js"></script><script src="../js/play.js"></script>
<script>
window.addEventListener('load', async () => {
  try {
    const A = AMB.arcade, L = AMB.latency; let T = 0; A.clock = { now: () => T };
    L.manual = true;
    const mr = Math.random; let rCalls = 0; Math.random = function () { rCalls++; return mr(); };
    const storeW = []; AMB.store = { set: (...a) => storeW.push(a), setMany: (...a) => storeW.push(a), get: () => null };

    // --- migration, then an own test key
    ok(L.calibrated() && L.get('key') === 33 && L.get('touch') === 33, 'ancienne calibration de Réponds reprise (clavier 33 ms)');
    window.AMB_LATENCY_KEY = 'ambient.latency.test'; L.reset();
    ok(!L.calibrated() && L.needs() && L.get('midi') === 0 && L.summary() === 'à calibrer', 'clé neuve : à calibrer, latence 0');

    // --- per input, per device, fallbacks
    L.set('key', 20); L.set('touch', 60); L.set('midi', 12, 'Arturia KeyLab');
    ok(L.get('key') === 20 && L.get('touch') === 60 && L.get('midi', 'Arturia KeyLab') === 12, 'mémorisée par entrée : clavier 20, tactile 60, MIDI (Arturia) 12');
    ok(L.get('midi', 'Autre clavier') === 12 && L.get('midi') === 12, 'autre clavier MIDI → latence MIDI générale');
    L.set('midi', 30, 'Autre clavier');
    ok(L.get('midi', 'Arturia KeyLab') === 12 && L.get('midi', 'Autre clavier') === 30, 'deux claviers MIDI : chacun la sienne (12 / 30)');
    const raw = JSON.parse(localStorage.getItem('ambient.latency.test'));
    ok(raw.v === 1 && raw.key === 20 && raw.dev['midi:Arturia KeyLab'] === 12 && !localStorage.getItem('ambient.latency.v1'), 'localStorage sous sa propre clé, par appareil ' + JSON.stringify(raw));
    ok(/clavier \+20 ms/.test(L.summary()) && /tactile \+60/.test(L.summary()), 'résumé pour la borne : ' + L.summary());

    // --- the median, per input
    const C = L.CAL;
    const tap = (k, off, src, input) => ({ time: 1000 + k * C.ms + off, src, input });
    let m = L.measure([2, 3, 4, 5, 6, 7].map((k) => tap(k, k === 5 ? 180 : 40, 'midi', 'Nord')).concat([tap(3, 0, 'key')]), 1000);
    ok(m && m.ms === 40 && m.src === 'midi' && m.input === 'Nord' && m.n === 6, 'médiane de l\'entrée la plus tapée (MIDI Nord 40 ms, aberrante ignorée)');
    ok(L.measure([0, 1].map((k) => tap(k, 20, 'key')), 1000) === null, 'tapes d\'échauffement (2 premiers clics) ignorées → pas assez');
    ok(L.measure([2, 3, 4, 5].map((k) => tap(k, 400, 'key')), 1000) === null || L.measure([2, 3, 4, 5].map((k) => tap(k, 400, 'key')), 1000).ms < 300, 'tapes hors fenêtre ignorées');

    // --- the calibration screen, driven like js/arcade-ui.js prepare(api)
    const stage = document.createElement('div'); document.body.append(stage);
    let played = [], P = {}, cancel = false;
    const api = { stage, play: (ev) => { played = ev; return { t0: 2000 }; }, note() {}, stop() {}, now: () => T, onKey: (f) => { P.key = f; }, onMidi: (f) => { P.midi = f; }, cancelled: () => cancel };
    T = 1900; let res = 'pending';
    L.run(api).then((v) => { res = v; });
    ok(played.length === C.n && played.every((e) => e.voice === 'sine') && stage.querySelector('.lat-pad') && stage.querySelectorAll('.lat-dot').length === C.n, 'calibrage : 8 clics joués, gros bouton TAPE + 8 témoins');
    // a synthetic pointer event carries the real clock's timeStamp: check the routing (source touch), then the progression
    stage.querySelector('.lat-pad').dispatchEvent(new PointerEvent('pointerdown', { bubbles: true }));
    const tp = L.cur.taps[0];
    ok(L.cur.taps.length === 1 && tp.src === 'touch' && Math.abs(tp.time - performance.now()) < 1000, 'gros bouton → tape tactile (horodatage de l\'événement)');
    L.cur.taps = [];
    for (let k = 0; k < C.n; k++) { T = 2000 + k * C.ms + 55; L.cur.taps.push({ time: T, src: 'touch' }); L.tick(); }
    ok(stage.querySelector('.lat-status').textContent === '8/8' && stage.querySelectorAll('.lat-dot.on').length === 8, 'progression affichée 8/8');
    T = 2000 + C.n * C.ms + 400; L.tick(); await new Promise((r) => setTimeout(r, 0));
    ok(res && res.src === 'touch' && res.ms === 55 && L.get('touch') === 55 && /tactile : \+55 ms/.test(L.msg), 'latence tactile mémorisée (55 ms), message « ' + L.msg + ' »');
    // MIDI taps through api.onMidi, with the input's name
    res = 'pending'; T = 1900; L.run(api).then((v) => { res = v; });
    for (let k = 0; k < C.n; k++) { T = 2000 + k * C.ms + 25; P.midi({ midi: 60, vel: 0.7, time: T, input: 'Nord' }); }
    T = 2000 + C.n * C.ms + 400; L.tick(); await new Promise((r) => setTimeout(r, 0));
    ok(res && res.ms === 25 && res.src === 'midi' && res.input === 'Nord' && L.get('midi', 'Nord') === 25 && L.get('midi', 'Arturia KeyLab') === 12, 'calibrage au clavier MIDI « Nord » : 25 ms pour lui seul, Arturia gardé');
    // keys
    res = 'pending'; T = 1900; L.run(api).then((v) => { res = v; });
    ok(P.key({ code: 'KeyQ', timeStamp: 0 }) === false, 'touche hors jeu non prise');
    for (let k = 0; k < C.n; k++) { T = 2000 + k * C.ms - 15; P.key({ code: k % 2 ? 'Space' : 'KeyF', timeStamp: T }); }
    T = 2000 + C.n * C.ms + 400; L.tick(); await new Promise((r) => setTimeout(r, 0));
    ok(res && res.ms === -15 && L.get('key') === -15, 'clavier d\'ordinateur (A–L, Espace) : −15 ms (en avance)');
    // cancelled: nothing stored
    const before = JSON.stringify(L.data); res = 'pending'; T = 1900; L.run(api).then((v) => { res = v; });
    for (let k = 0; k < 4; k++) { T = 2000 + k * C.ms; P.key({ code: 'KeyA', timeStamp: T }); }
    cancel = true; L.tick(); await new Promise((r) => setTimeout(r, 0)); cancel = false;
    ok(res === null && JSON.stringify(L.data) === before && !L.cur, 'Échap pendant le calibrage → rien de changé');
    // ensure / request
    let e1 = 'pending'; L.ensure(api).then((v) => { e1 = v; }); await new Promise((r) => setTimeout(r, 0));
    ok(e1 === null && !L.cur, 'déjà calibré : ensure() ne recalibre pas');
    L.request(); ok(L.needs(), 'request() (⟲ de Réponds) : recalibrage demandé');
    T = 1900; L.ensure(api); ok(!!L.cur && !L.force, 'ensure() lance le calibrage demandé');
    T = 99999; L.tick(); await new Promise((r) => setTimeout(r, 0));
    ok(!L.cur && L.msg.includes('Pas assez'), 'sans tape : message clair, ancienne latence gardée (' + L.get('key') + ' ms)');
    // v1.02: the kid (« découverte ») is never forced to calibrate: « Passer ▸ », then not asked again this session
    { AMB.game = { isKid: () => true }; const before2 = JSON.stringify(L.data); L.request();
      let k1 = 'pending'; T = 1900; L.ensure(api).then((v) => { k1 = v; });
      const sk = stage.querySelector('.lat-skip'); ok(!!L.cur && sk, 'Découverte : calibrage proposé avec « Passer »');
      sk.click(); await new Promise((r) => setTimeout(r, 0));
      let k2 = 'pending'; L.ensure(api).then((v) => { k2 = v; }); await new Promise((r) => setTimeout(r, 0));
      ok(k1 === null && k2 === null && !L.cur && L.skipped && JSON.stringify(L.data) === before2, '« Passer » : la manche continue, latence inchangée, pas redemandé dans la session');
      delete AMB.game; L.skipped = false;
      L.request(); T = 1900; L.ensure(api); ok(L.cur && !stage.querySelector('.lat-skip'), 'musicien : calibrage sans bouton « Passer »'); L.finish(true); }
    stage.remove();

    // --- arcade MIDI: raw velocity, sustain, CCs, several inputs
    const got = { on: [], off: [], cc: [] };
    A.register({ id: 'midiprobe', make: () => ({}), check: () => ({ ok: true }), choices: () => null,
      onMidi: (ch, m) => got.on.push(m), onMidiOff: (ch, m) => got.off.push(m), onCC: (ch, c) => got.cc.push(c) });
    A.start('midiprobe', { seed: 1 });
    AMB.arcade.open = true;
    const msg = (data, name, ts) => ({ data, timeStamp: ts, currentTarget: { name } });
    AMB.play.onMidi(msg([0x90, 60, 127], 'Clavier 1', 10));
    AMB.play.onMidi(msg([0x91, 64, 32], 'Clavier 2', 11));
    ok(got.on.length === 2 && got.on[0].vel === 1 && Math.abs(got.on[1].vel - 32 / 127) < 1e-9 && got.on[0].input === 'Clavier 1' && got.on[1].input === 'Clavier 2' && got.on[0].time === 10, 'deux entrées MIDI à la fois, vélocité brute (1 / 0,25), nom de l\'entrée');
    AMB.play.onMidi(msg([0xb0, 64, 127], 'Clavier 1', 12));
    ok(A.sustain && got.cc.length === 1 && got.cc[0].cc === 64 && got.cc[0].value === 1 && got.cc[0].sustain === true, 'CC64 enfoncé → arcade.sustain, onCC({cc: 64, sustain: true})');
    AMB.play.onMidi(msg([0x90, 67, 90], 'Clavier 1', 13)); AMB.play.onMidi(msg([0x80, 60, 0], 'Clavier 1', 14));
    ok(got.on[2].sustain === true && got.off[0].sustain === true && got.off[0].midi === 60 && got.off[0].vel === undefined, 'notes sous la pédale : sustain sur onMidi / onMidiOff');
    AMB.play.onMidi(msg([0xb0, 64, 0], 'Clavier 1', 15)); AMB.play.onMidi(msg([0x90, 62, 0], 'Clavier 2', 16));
    ok(!A.sustain && got.cc[1].sustain === false && got.off[1].sustain === false && got.off[1].input === 'Clavier 2', 'pédale relâchée → sustain faux ; note-on vélocité 0 = note-off');
    AMB.play.onMidi(msg([0xb0, 1, 64], 'Clavier 1', 17));
    ok(got.cc.length === 3 && got.cc[2].cc === 1 && !A.sustain, 'autre CC (molette) relayé, sans toucher au sustain');
    A.end({ abort: true });
    // prepare() routing keeps the input
    let pm = null; A.prep = { midi: (m) => { pm = m; } }; AMB.play.onMidi(msg([0x90, 72, 100], 'Clavier 2', 20)); A.prep = null;
    ok(pm && pm.input === 'Clavier 2' && pm.time === 20 && pm.sustain === false, 'pendant un prepare() : MIDI routé avec son entrée');
    AMB.arcade.open = false;

    Math.random = mr;
    ok(rCalls === 0, 'Math.random jamais appelé');
    ok(storeW.length === 0, 'aucune écriture dans le store');
    ['ambient.latency.v1', 'ambient.reponds.lat.v1', 'ambient.latency.test', window.AMB_ARCADE_KEY].forEach((k) => localStorage.removeItem(k));
    done();
  } catch (e) { fail(e); }
});
</script></body></html>
