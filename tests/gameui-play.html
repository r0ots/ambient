  { await wait(300); A.ui.stop(); A.game.reset(); d.body.classList.remove('coined'); A.perform.setMode('sculpt'); await wait(50);

    ok(!A.seq.playing && A.game.s.active[0]==='k.allume' && pads.hidden && !A.game.has('m.bells') && shown('#coin') && /ALLUMER/.test(coin.textContent) && !/INSERT COIN/.test(d.body.textContent) && w.getComputedStyle(coin.querySelector('.pw-led')).animationName==='pw-led' && /grayscale/.test(w.getComputedStyle(d.querySelector('.app > .top')).filter) && w.getComputedStyle(d.querySelector('.dust')).opacity>0.5 && !d.getElementById('xyTip') && w.getComputedStyle(d.querySelector('.stage .hint')).display==='none', 'S11.1 : machine éteinte et poussiéreuse, pas de touches, le bouton ⏻ clignote (LED de veille), pas d\'aide sur le visuel');
    A.bus.emit('live',{midi:62,time:0,vel:0.8,raw:null}); ok(!A.seq.playing && !A.game.s.contracts.includes('k.allume'), 'une note MIDI ne réveille rien');
    coin.dispatchEvent(new w.PointerEvent('pointerdown',{bubbles:true})); await wait(300);
    ok(A.seq.playing && d.body.classList.contains('coined') && !shown('#coin') && A.game.s.contracts.includes('k.allume') && (d.body.classList.contains('waking') || !A.motion.on()) && pads.hidden, 'le bouton ⏻ : la machine se réveille (cascade), la musique part, « Allume la machine » coché ; toujours pas de touches');
    { const on=A.motion.on() && !d.documentElement.classList.contains('q-bas'), cl=d.body.classList;
      ok(!on || (cl.contains('waking') && cl.contains('w1') && d.querySelector('.coin-fx .cf-crt')), 'le réveil par étapes : ligne CRT, la poussière se lève (w1)');
      for (let i=0;i<40 && on && !cl.contains('w5');i++) await wait(50);
      ok(!on || (cl.contains('w2') && cl.contains('w5')), 'puis la barre, le widget, les éditeurs grésillent en cascade, la ville s\'éclaire (w5)'); }
    for (let i=0;i<60 && d.body.classList.contains('waking');i++) await wait(50); ok(!d.body.classList.contains('waking') && !/grayscale/.test(w.getComputedStyle(d.querySelector('.app > .top')).filter), 'réveillée : plus de gris, la cascade finie');
    A.ui.stop(); await wait(100); A.game.reset(); d.body.classList.remove('coined'); await wait(30);
    w.dispatchEvent(new w.KeyboardEvent('keydown',{code:'Space',key:' ',bubbles:true})); await wait(200);
    ok(A.seq.playing && A.game.s.contracts.includes('k.allume'), 'la barre d\'espace l\'allume aussi');
    v.dispatchEvent(PE('pointerdown')); await wait(100); v.dispatchEvent(PE('pointerup'));
    ok(w.getComputedStyle(v).cursor!=='crosshair' && !A.game.isReady('m.bells'), 'S6.2 : toucher l\'écran ne compte pas, curseur normal');
    A.ui.stop(); A.game.reset(); }
  // --- sound locking (G1.5)
  const St=A.store, g=A.game;
  g.setMode('free'); St.set('fx.echo',0.6,'user'); St.set('pad.on',true,'user');

  ok(St.get('pad.on')===false && St.get('fx.echo')===0 && St.get('global.evolve')===0 && St.get('drone.on')===true, 'verrouillé = neutre (pad muet, pas d\'écho), drone joue');
  St.set('pad.on',true,'user'); A.ui.applyPatch({'pad.on':true,'fx.echo':0.8,'drone.tone':0.9});
  ok(St.get('pad.on')===false && St.get('fx.echo')===0 && Math.abs(St.get('drone.tone')-0.9)<0.02, 'presets/utilisateur ne touchent pas le verrouillé '+St.get('drone.tone'));
  g.unlock('h.pad'); ok(St.get('pad.on')===true, 'ouvrir le Pad le fait jouer');
  g.setMode('free'); ok(Math.abs(St.get('fx.echo')-0.6)<0.02 && St.get('pad.on')===true, 'retour en libre : son libre rendu');
  St.set('pad.on',false,'user'); ok(St.get('pad.on')===false, 'libre : tout modifiable');
  g.setMode('path'); ok(St.get('fx.echo')===0 && St.get('pad.on')===true, 'retour au parcours : son du parcours rendu');
  // --- S4.3 no currency anywhere: no « +n ✧ » note, no counter, nothing to buy
  g.setMode('path'); await wait(20); A.contracts.finish(A.game.s.active[0]); await settle(400); A.garden.showTree(true); await wait(20);
  ok(!d.getElementById('fx') && !A.juice && !d.getElementById('gainFeed') && !/✧|éclat/.test(d.body.innerText), 'un défi réussi : aucune note « +n ✧ », aucun ✧ ni « éclat » à l\'écran');
  A.garden.showTree(false);
  // S3.8: the path help is short and says how secrets work now (a node opened, hint 2 after 2 secrets, never with time)
  { d.getElementById('help').click(); const hp=d.querySelector('#helpDlg .help-path'), tx=hp.textContent;

    d.querySelector('#helpDlg [data-close]').click(); }
  g.setMode('free'); await wait(400); ok(!shown('#treeBtn') && !shown('#goals') && !d.body.classList.contains('jargon-off'), 'pas d\'arbre ni de défi en libre, l\'écran garde tonalité et tempo');
