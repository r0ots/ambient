<!doctype html><html><head><!-- Dev captures (not in the suite): ?w=390&h=780 for phone width; #free, #pz, #bar, #sel=<node>, #buy=<node>, #arcade (menu), #arcade-play=<id> (round), #arcade-end (end screen); #arcade-daily (défi du jour + classement), #arcade-duel (lien de défi reçu); #arcade* cuts particles and juice for clean captures --><meta charset="utf-8"><style>body{margin:0}iframe{border:0;width:100vw;height:100vh;display:block}</style></head><body>
<script>localStorage.removeItem('ambient.game.shot');</script>
<iframe id="f" src="../index.html?gamekey=ambient.game.shot"></iframe>
<script>{const q=new URLSearchParams(location.search),f=document.getElementById('f');if(q.get('w'))f.style.width=q.get('w')+'px';if(q.get('h'))f.style.height=q.get('h')+'px';}</script>
<script>document.getElementById('f').addEventListener('load',()=>{const A=document.getElementById('f').contentWindow.AMB;if(location.hash.includes('arcade')&&A.juice){const J=A.juice;J.reduced=true;['burst','floatText','flash','shake','hitstop','pulseCombo','chime'].forEach(k=>{J[k]=()=>0;});}if(location.hash.includes('free')){A.game.setMode('free');A.garden.welcome(false);return;}A.game.setMode('path');A.game.earn(200,'x');['t.son','h.pad','e.reverb','m.bells','t.viz'].forEach(i=>A.tree.buy(i));A.game.solve('p.gamme');A.garden.welcome(false);if(location.hash.includes('pz')){A.store.setMany({'drone.wave':'Orgue','pad.wave':'Nappe'},'user');A.game.s.puzzles=A.game.s.puzzles.filter(x=>x!=='p.premier');A.garden.openPuzzle('p.premier');}else if(location.hash.includes('arcade')){const U=A.arcadeUI,h=location.hash,m=/arcade-play=([\w.-]+)/.exec(h),fx=document.getElementById('f').contentDocument.getElementById('fx');if(fx)fx.style.display='none';U.open();if(h.includes('arcade-daily')){const D=A.daily;D.setName('Max');D.addEntry(D.today(),{n:'Léo',s:12400,p:'m',z:0});D.addEntry(D.today(),{n:'Noé',s:7100,p:'k',z:0});D.s.days[D.today()]={c:{s:9800,r:D.rel(9800,'n'),p:'n',at:1}};D.addEntry(D.today(),{n:'Max',s:9800,p:'n',z:0,me:1});D.view='home';D.show();}else if(h.includes('arcade-duel')){const Du=A.duel;Du.incoming=Du.parse({v:1,k:'r',sd:123456,d:0.45,n:'Léo',s:326,p:'m'});Du.view='take';Du.show();}else if(m)U.start(m[1]);else if(h.includes('arcade-end'))U.start('hautbas').then(()=>{const R=A.arcade;for(let i=0;i<7;i++)R.answer(i===3?'nope':R.round.ch.answer);R.end();});}else if(!location.hash.includes('bar')){A.garden.showTree(true);const m=/sel=([\w.]+)/.exec(location.hash);if(m)A.garden.select(m[1]);const b=/buy=([\w.]+)/.exec(location.hash);if(b)setTimeout(()=>A.garden.tryBuy(b[1]),1500);}});</script></body></html>
