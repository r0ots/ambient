<!doctype html><html><head><!-- Dev captures (not in the suite): ?w=390&h=780 for phone width; #free, #pz, #bar, #sel=<node>, #buy=<node>, #arcade (menu), #arcade-play=<id> (round), #arcade-end (end screen), #save-open / #save-confirm (sauvegarde), #save-back (encart « depuis ta dernière visite » dans le menu ⋯); #arcade* cuts particles and juice for clean captures --><meta charset="utf-8"><style>body{margin:0}iframe{border:0;width:100vw;height:100vh;display:block}</style></head><body>
<script>localStorage.removeItem('ambient.game.shot');</script>
<iframe id="f" src="../index.html?gamekey=ambient.game.shot"></iframe>
<script>{const q=new URLSearchParams(location.search),f=document.getElementById('f');if(q.get('w'))f.style.width=q.get('w')+'px';if(q.get('h'))f.style.height=q.get('h')+'px';}</script>
<script>document.getElementById('f').addEventListener('load',()=>{const A=document.getElementById('f').contentWindow.AMB;if(location.hash.includes('arcade')&&A.juice){const J=A.juice;J.reduced=true;['burst','floatText','flash','shake','hitstop','pulseCombo','chime'].forEach(k=>{J[k]=()=>0;});}if(location.hash.includes('free')){A.game.setMode('free');A.garden.welcome(false);return;}A.game.setMode('path');A.game.earn(200,'x');['t.son','h.pad','e.reverb','m.bells','t.viz'].forEach(i=>A.tree.buy(i));A.game.solve('p.gamme');A.garden.welcome(false);if(location.hash.includes('save-')){const S=A.save,h=location.hash;A.garden.showTree(false);A.arcade.stats('hautbas').best['']={score:4200,stars:2,at:1700000000000};A.arcade.stats('modes').best['']={score:2650,stars:3,at:1700000000000};A.arcade.save();if(h.includes('back')){S.refreshCard(Date.now()-26*3600e3);document.getElementById('f').contentDocument.querySelector('.more').open=true;}else if(h.includes('confirm')){const o=S.build();o.game.shards=7;o.game.earned=420;o.game.nodes=o.game.nodes.slice(0,2);o.arcade.profiles.default.games.hautbas.best[''].score=9999;S.confirm(S.check(o));}else S.open();}else if(location.hash.includes('pz')){A.store.setMany({'drone.wave':'Orgue','pad.wave':'Nappe'},'user');A.game.s.puzzles=A.game.s.puzzles.filter(x=>x!=='p.premier');A.garden.openPuzzle('p.premier');}else if(location.hash.includes('arcade')){const U=A.arcadeUI,h=location.hash,m=/arcade-play=([\w.-]+)/.exec(h),fx=document.getElementById('f').contentDocument.getElementById('fx');if(fx)fx.style.display='none';U.open();if(m)U.start(m[1]);else if(h.includes('arcade-end'))U.start('hautbas').then(()=>{const R=A.arcade;for(let i=0;i<7;i++)R.answer(i===3?'nope':R.round.ch.answer);R.end();});}else if(!location.hash.includes('bar')){A.garden.showTree(true);const m=/sel=([\w.]+)/.exec(location.hash);if(m)A.garden.select(m[1]);const b=/buy=([\w.]+)/.exec(location.hash);if(b)setTimeout(()=>A.garden.tryBuy(b[1]),1500);}});</script></body></html>
