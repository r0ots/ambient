<!doctype html><html><head><!-- Dev captures (not in the suite): ?w=390&h=780 for phone width; #free, #pz, #bar, #sel=<node>, #buy=<node>, #arcade (menu), #arcade-play=<id> (round), #arcade-end (end screen); #pf-profile (who plays?), #pf-end (placement result), #pf-kid (« Jouer 2 min » button), #pf-joy (its end); #arcade* cuts particles and juice for clean captures --><meta charset="utf-8"><style>body{margin:0}iframe{border:0;width:100vw;height:100vh;display:block}</style></head><body>
<script>localStorage.removeItem('ambient.game.shot');</script>
<iframe id="f" src="../index.html?gamekey=ambient.game.shot"></iframe>
<script>{const q=new URLSearchParams(location.search),f=document.getElementById('f');if(q.get('w'))f.style.width=q.get('w')+'px';if(q.get('h'))f.style.height=q.get('h')+'px';}</script>
<script>document.getElementById('f').addEventListener('load',()=>{const A=document.getElementById('f').contentWindow.AMB;if(/arcade|pf-/.test(location.hash)&&A.juice){const J=A.juice;J.reduced=true;['burst','floatText','flash','shake','hitstop','pulseCombo','chime'].forEach(k=>{J[k]=()=>0;});}if(location.hash.includes('free')){A.game.setMode('free');A.garden.welcome(false);return;}A.game.setMode('path');A.game.earn(200,'x');['t.son','h.pad','e.reverb','m.bells','t.viz'].forEach(i=>A.tree.buy(i));A.game.solve('p.gamme');A.garden.welcome(false);if(location.hash.includes('pf-')){const P=A.placement,h=location.hash;if(A.juice){A.juice.reduced=true;}if(h.includes('pf-profile'))P.profileScreen(true);else if(h.includes('pf-end'))P.placementDone([{branch:'tronc',game:'accordeur',pass:false,ok:2,miss:2},{branch:'harmonie',game:'modes',pass:true,ok:4,miss:0},{branch:'espace',game:'intrus',pass:true,ok:4,miss:1},{branch:'mouvement',game:'bouge',pass:false,ok:1,miss:2},{branch:'composer',game:'reponds',pass:true,ok:4,miss:1}],false);else if(h.includes('pf-kid'))A.game.setProfile('decouverte');else if(h.includes('pf-joy')){A.game.setProfile('decouverte');P.quickDone([{good:5,stars:3},{good:4,stars:2},{good:6,stars:3},{good:3,stars:1}]);}}else if(location.hash.includes('pz')){A.store.setMany({'drone.wave':'Orgue','pad.wave':'Nappe'},'user');A.game.s.puzzles=A.game.s.puzzles.filter(x=>x!=='p.premier');A.garden.openPuzzle('p.premier');}else if(location.hash.includes('arcade')){const U=A.arcadeUI,h=location.hash,m=/arcade-play=([\w.-]+)/.exec(h),fx=document.getElementById('f').contentDocument.getElementById('fx');if(fx)fx.style.display='none';U.open();if(m)U.start(m[1]);else if(h.includes('arcade-end'))U.start('hautbas').then(()=>{const R=A.arcade;for(let i=0;i<7;i++)R.answer(i===3?'nope':R.round.ch.answer);R.end();});}else if(!location.hash.includes('bar')){A.garden.showTree(true);const m=/sel=([\w.]+)/.exec(location.hash);if(m)A.garden.select(m[1]);const b=/buy=([\w.]+)/.exec(location.hash);if(b)setTimeout(()=>A.garden.tryBuy(b[1]),1500);}});</script></body></html>
