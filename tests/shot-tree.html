<!doctype html><html><head><!-- Dev captures (not in the suite): ?w=390&h=780 for phone width.
  Modes: #free, #bar (barre + LCD au début du Parcours : premier défi, sans jargon), #task-help (aide du défi sur le LCD),
  #reponse (S4.2 : plante Mélodie en attente de réponse, « ↺ À toi »), #reponse-leaves (feuilles justes et fausse), #reponse-score (S5.3 : palier élevé, série et record sur le LCD, repère sur la plante Mélodie), #sel=<node>; #help-path / #help-free (aide du Parcours ; libre), #more (menu ⋯ en Parcours),
  #garden (Jardin visuel débutant : 3 couches), #garden-adv (tout l'arbre, secrets) — notes simulées sur le bus ;
  #composer (arbre, branche Composer en 3 nœuds), #handover (instrument remis : arbre complet, morceau enregistré) ;
  #song (panneau Morceau, mode libre, 3 sections, ● Rec), #song-empty (aucune section : ● Rec désactivé) ;
  #roll (piano roll, mode libre : notes ♯ hors gamme, « ⤓ Garder » actif après des notes jouées) ;
  S4.6 : #ready (« ✦ Ouvrir : Pad » qui pulse, 2 prêts), #ready-card (la carte qui dit ce que le Pad apporte), #new (le Pad vient de s'ouvrir : panneau, halo, « Nouveau ») ;
  S5.9 : #juice-defi / #juice-open / #juice-tier (un moment du juice central en plein effet, figé) ;
  S5.5 : #demande (une demande en direct sur le LCD, son compte à rebours), #demande-parfait (« PARFAIT !!! ×3 », figé) ;
  S5.10 : #combo=<id>,<id> (combos ON dans le Jardin), #discovery=<id> (la fête d'une découverte, figée), #carnet (le carnet des découvertes dans l'Arbre : trouvées, puis silhouettes) ;
  S5.2 : #splash (notes jouées sur la Mélodie, une tenue ; une pastille allumée par la Mélodie auto) ;
  S4.5w : #grow (plante à mi-croissance), #sky=<degré> (ciel d'un accord), #dawn (fin : relecture, aube), #dawn-end (remis, WAV proposé). --><meta charset="utf-8"><style>body{margin:0}iframe{border:0;width:100vw;height:100vh;display:block}</style></head><body>
<script>localStorage.removeItem('ambient.game.shot');</script>
<iframe id="f" src="../index.html?gamekey=ambient.game.shot"></iframe>
<script>{const q=new URLSearchParams(location.search),f=document.getElementById('f');if(q.get('w'))f.style.width=q.get('w')+'px';if(q.get('h'))f.style.height=q.get('h')+'px';}</script>
<script>
document.getElementById('f').addEventListener('load', () => {
  const A = document.getElementById('f').contentWindow.AMB, doc = document.getElementById('f').contentDocument, h = location.hash;
  if (h.includes('help-free')) { A.game.setMode('free'); A.garden.welcome(false); doc.getElementById('help').click(); return; }
  if (h.includes('song')) {
    A.game.setMode('free'); A.garden.welcome(false); doc.querySelector('[data-mode=compose]').click();
    A.song.sections = []; if (!h.includes('empty')) { A.song.add(); A.song.add(); A.song.add(); }
    A.song.render(); setTimeout(() => A.song.panel.scrollIntoView({ block: 'start' }), 300); return;
  }
  if (h.includes('roll')) {
    A.game.setMode('free'); A.garden.welcome(false); doc.querySelector('[data-mode=compose]').click();
    A.store.setMany({ 'global.key': 'C', 'global.scale': 'Ionien (majeur)', 'seq.steps': '32', 'seq.on': true, 'seq.follow': false, 'seq.slot': 'A',
      'seq.pattern': '0.7.4,4.7.2.7.a.1,6.8.2,8.a.4.8.a.1,c.9.4,g.b.6.7.a.2,o.7.8.5' }, 'user');
    [60, 61, 64].forEach((m, i) => A.bus.emit('live', { midi: m, time: i * 0.2, vel: 0.8, raw: null }));
    setTimeout(() => doc.querySelector('.roll-wrap').scrollIntoView({ block: 'start' }), 300); return;
  }
  if (h.includes('free')) { A.game.setMode('free'); A.garden.welcome(false); return; }
  A.game.setMode('path'); A.garden.welcome(false);
  if (h.includes('bar')) return; // S4.3: the very start of the Parcours
  if (h.includes('juice')) { // S5.9: a moment in full swing — #juice-defi (a challenge won), #juice-open (the Pad opens), #juice-tier
    const w = document.getElementById('f').contentWindow, G = A.garden, C = G.confetti;
    ['m.bells', 'h.key', 'm.grains', 'e.texture'].forEach((i) => A.game.unlock(i));
    w.requestAnimationFrame = (fn) => w.setTimeout(() => fn(w.performance.now()), 16); // headless barely runs rAF
    setTimeout(() => {
      G.showTree(false); A.perform.setMode('listen'); A.visual.gardenSync(); doc.getElementById('bigPlay').style.display = 'none';
      A.gardenVisual.sig = null; A.gardenVisual.grow = {}; setInterval(() => A.visual.draw(), 40);
      const fc = G.fxClass; G.fxClass = function (el, c) { return fc.call(this, el, c, 6e5); }; // the effects stay on
      if (h.includes('open')) A.game.unlock('h.pad');
      else if (h.includes('tier')) A.bus.emit('resp:tier', { tier: 3, name: 'Syncopes', lvl: 9 });
      else A.contracts.finish('m.notes');
      setTimeout(() => freeze(C), 300);
    }, 1600);
    return;
  }
  if (h.includes('demande')) { // S5.5: a live ask and its countdown (#demande), then « PARFAIT !!! ×3 » (#demande-parfait); clock fixed
    const w = document.getElementById('f').contentWindow, G = A.garden, C = G.confetti, D = A.demands, K = A.contracts;
    ['m.bells', 'h.pad'].forEach((i) => A.game.unlock(i));
    w.requestAnimationFrame = (fn) => w.setTimeout(() => fn(w.performance.now()), 16);
    setTimeout(() => {
      G.showTree(false); A.perform.setMode('listen'); A.visual.gardenSync(); doc.getElementById('bigPlay').style.display = 'none';
      A.gardenVisual.sig = null; A.gardenVisual.grow = {}; setInterval(() => A.visual.draw(), 40);
      const fc = G.fxClass; G.fxClass = function (el, c) { return fc.call(this, el, c, 6e5); };
      const sd = A.seq.stepDur(); D.now = () => 100; D.at = () => 100;
      if (!h.includes('parfait')) { const d = K.byId[K.state().active[0]]; D.launch(d && d.kind === 'demande' ? { d, gate: d.id, text: d.title } : { d: D.byId.accord, text: D.byId.accord.title }, 0, 100, sd); return; }
      D.st().combo = 2; D.launch({ d: D.byId.accord, text: D.byId.accord.title }, 0, 100 - 32 * sd, sd);
      D.input('chord', [{ deg: 0, forced: true }], 100);
      setTimeout(() => freeze(C), 300);
    }, 1600);
    return;
  }
  function freeze(C) { // freeze a juice moment (headless captures freeze CSS animations at their first frame)
    {
        C.frame = () => {}; doc.querySelectorAll('.fx-pop').forEach((p) => { p.remove = () => {}; });
        const st = doc.createElement('style'); st.textContent = `.fx-flash.on, .stage.fx-shake, .app.fx-quake > *, #viz.fx-punch, #viz.fx-punch-big, .fx-bounce .btn, .fx-bounce .pad, .fx-bounce .chip, .fx-hop, .lcd.lcd-arcade #lcdTop, .lcd.lcd-glitch-big, .fx-pop { animation: none !important; }
          .fx-flash.on { opacity: .4; } .app.fx-quake > .top { translate: -5px 2px; rotate: -.4deg; } .stage.fx-shake { translate: 6px -3px; } #viz.fx-punch, #viz.fx-punch-big { scale: 1.1; rotate: -1deg; }
          .fx-bounce .btn:nth-child(odd), .fx-bounce .pad:nth-child(odd), .fx-bounce .chip, .fx-hop { translate: 0 -8px; scale: 1.08 .92; } .fx-bounce .pad:nth-child(even) { scale: .94 1.06; }
          .fx-pop { opacity: 1; scale: 1.2; rotate: -4deg; }`; // (headless captures freeze CSS animations at their first frame: a mid-flight still instead)
        doc.head.append(st);
    }
  }
  if (/#(combo|discovery)/.test(h)) { // S5.10: combos ON in the Jardin (#combo=brume,soleil), the party of a discovery (#discovery=<id>)
    const w = document.getElementById('f').contentWindow, G = A.garden, GV = A.gardenVisual, D = A.discoveries;
    ['m.bells', 'h.pad', 'h.key', 'm.grains', 'e.texture', 'e.reverb', 'c.seq'].forEach((i) => A.game.unlock(i));
    D.run = () => {}; G.confetti.burst = () => {}; // (the notes played below must not find a gesture; the openings' confetti would hide the scene)
    const ids = ((/(?:combo|discovery)=([\w,]+)/.exec(h) || [])[1] || 'brume').split(',');
    setTimeout(() => {
      G.showTree(false); A.perform.setMode('listen'); A.visual.gardenSync(); doc.getElementById('bigPlay').style.display = 'none';
      GV.sig = null; GV.grow = {}; setInterval(() => A.visual.draw(), 40);
      setInterval(() => { D.on = new Set(ids); }, 100);
      let k = 0, id = 700; setInterval(() => { const n = ++id; A.bus.emit('live', { midi: 60 + [0, 7, 4, 12, 9, 2, 16, 11][k++ % 8], time: GV.clock(), vel: 0.8, raw: null, id: n }); A.bus.emit('liveOff', { id: n, time: GV.clock() + 0.1 }); }, 300);
      if (h.includes('discovery')) {
        const fc = G.fxClass; G.fxClass = function (el, c) { return fc.call(this, el, c, 6e5); }; // the effects stay on
        setTimeout(() => { delete G.confetti.burst; D.state().found = {}; D.find(ids[0]); setTimeout(() => freeze(G.confetti), 350); }, 1200);
      }
    }, 1600);
    return;
  }
  if (h.includes('carnet')) { // S5.10: the notebook in the tree screen, a few found, the others as riddles
    ['m.bells', 'h.pad', 'e.texture', 'e.reverb', 'm.tempo', 'h.key', 'e.echo'].forEach((i) => A.game.unlock(i));
    const D = A.discoveries; Object.assign(D.state().found, { monolithe: 1, soleil: 2, brume: 3, tons: 4, jazz: 5 }); D.state().opened = { monolithe: 't.viz', soleil: 'h.drone', brume: 'e.halo', tons: 'm.phrase', jazz: 'h.prog' };
    setTimeout(() => { A.garden.showTree(true); const b = doc.getElementById('discoveries'); b.classList.remove('min'); D.render(); }, 300);
    return;
  }
  if (/#(ready|new)/.test(h)) { // S4.6: a success waits for the player
    A.game.unlock('m.bells'); A.tree.NEW_MS = 6e5;
    // headless captures freeze CSS animations at their first frame: show the end of the arrivals (the pulses at rest)
    const st = doc.createElement('style'); st.textContent = '.is-appearing, .open-dlg .open-card { animation: none !important; }'; doc.head.append(st);
    setTimeout(() => {
      A.garden.showTree(false); A.perform.setMode('listen'); A.tree.clearNew();
      A.game.ready('h.pad', 'm.notes'); A.game.ready('t.son', 'k.couleur');
      if (h.includes('ready-card')) A.garden.ask('h.pad');
      if (h.includes('new')) { A.garden.openNode('h.pad'); setTimeout(() => { const e = doc.querySelector('.is-new-first'); if (e) e.scrollIntoView({ block: 'center' }); }, 3000); }
    }, 1500);
    return;
  }
  ['t.son', 'h.pad', 'e.reverb', 'm.bells', 't.viz'].forEach(i => A.game.unlock(i));
  if (h.includes('help-path')) { doc.getElementById('help').click(); return; }
  if (h.includes('#more')) {
    A.garden.showTree(false); A.garden.renderSwitch();
    doc.querySelector('.more').open = true;
  } else if (h.includes('task-help')) {
    A.garden.showTree(false); doc.querySelector('#lcdTask .lcd-task-txt').click();
  } else if (h.includes('reponse')) { // S4.2: the Melody plant waits for the answer (« ↺ À toi »); -leaves: right and wrong leaves
    A.garden.showTree(false); A.visual.gardenSync(); doc.getElementById('bigPlay').style.display = 'none';
    const P = A.puzzles, leaves = h.includes('leaves');
    P.cur = { midis: [62, 64, 65, 67, 69], steps: [0, 2, 6, 8, 12], len: leaves ? 5 : 3, timed: leaves, sd: 0.25, t0: -9, from: -1, until: 1e12, ans: 0,
      row: leaves ? [{ state: 'ok' }, { state: 'ok' }, { state: 'far', dir: 'up' }, { state: 'ok' }] : [] };
    const st = A.contracts.state(); st.active = ['p.premier']; st.prog['p.premier'] = { n: 0 }; A.garden.renderContracts();
    const score = h.includes('score'); // S5.3: a high tier (Combinaisons +3), the series and the record on the LCD, the tier mark on the plant
    if (score) { const r = P.st(A.game); r.lvl = 16; r.streak = 12; r.best = 17; A.garden.renderScore(); }
    setInterval(() => { A.garden.lcd(score ? '↑ Palier : Combinaisons' : '↺ À toi', 2000); A.gardenVisual.grow = {}; }, 400); // plants shown grown (headless frames are sparse)
  } else if (h.includes('composer')) { // S3.5: the Composer branch in 3 nodes (Mélodie écrite, Rythme open; Morceau to open)
    ['h.pad2', 'h.key', 'h.scale', 'h.prog', 'c.seq', 'c.rythme'].forEach((i) => A.game.unlock(i));
    A.garden.showTree(true); setTimeout(() => { const G = A.garden, r = doc.querySelector('#treeDlg .tree-map').getBoundingClientRect();
      G.zoomAt(r.right, r.top + r.height / 2, 0.75); G.panToNode('c.song', 0); G.panToNode('c.seq', 0); }, 300);
  } else if (h.includes('handover')) { // S3.7: whole tree, last contract done: the instrument handed over (LCD message, no challenge)
    for (let k = 0; k < 40; k++) A.tree.NODES.forEach((n) => { if (A.tree.status(n.id) === 'available') A.game.unlock(n.id); });
    setTimeout(() => A.bus.emit('act', 'songRec'), 1500);
  } else if (/#(grow|sky|dawn)/.test(h)) { // S4.5w: a plant growing (held mid-animation), the sky of a chord (#sky=<degree>), the finale at dawn (#dawn: replay, #dawn-end: handed over, WAV offered)
    const GV = A.gardenVisual; A.garden.showTree(false); A.visual.gardenSync(); doc.getElementById('bigPlay').style.display = 'none';
    ['h.key', 'm.grains', 'c.seq', 'c.rythme', 'e.texture', 'h.pad2'].forEach((i) => A.game.unlock(i));
    setTimeout(() => {
      A.garden.showTree(false); A.perform.setMode('listen'); GV.sig = null;
      if (h.includes('grow')) { GV.growAt(null); A.game.s.nodes = A.game.s.nodes.filter((n) => n !== 'c.seq'); GV.sig = null; setTimeout(() => { A.game.s.nodes.push('c.seq'); GV.sig = null; }, 200); setInterval(() => { if (GV.grow.seq) GV.grow.seq.start = GV.clock() - 0.45; }, 16); }
      const deg = +((/sky=(\d)/.exec(h) || [])[1] || 0);
      setInterval(() => { if (!GV.replay) A.bus.emit('chord', { time: 0, deg }); GV.skyT = -99; }, 120);
      if (h.includes('dawn')) {
        if (h.includes('dawn-end')) { A.game.s.ended = true; A.garden.offer = new Blob(['x']); A.garden.lcd('✦ L\'instrument est à toi', 60000); A.garden.renderContracts(); }
        else { A.game.s.ended = true; A.game.s.active = []; A.garden.handing = true; A.garden.renderContracts(); GV.replayStart({ t0: GV.clock(), from: 0, len: 10, ev: [] }); A.garden.lcd('♪ Ton morceau', 60000);
          setInterval(() => { GV.replay.t0 = GV.clock() - 8.6; ['pad', 'bells', 'bass', 'grains'].forEach((l) => { GV.lit[l] = 1; }); }, 30); }
      }
      const L = ['pad', 'bells', 'seq', 'bass', 'grains']; let i = 0;
      setInterval(() => A.visual.draw(), 40); // headless captures barely run requestAnimationFrame: draw on a timer
      setInterval(() => { const l = L[i++ % L.length]; if (GV.replay) GV.hit(l, 0.8); else A.bus.emit('note', { layer: l, midi: 60, time: 0, vel: 0.8 }); }, 220);
    }, 1600);
  } else if (h.includes('splash')) { // S5.2: notes played on the Melody (one held high, short ones), the machine lights a pad
    const GV = A.gardenVisual; A.garden.showTree(false); A.visual.gardenSync(); doc.getElementById('bigPlay').style.display = 'none';
    ['m.bells', 'h.key', 'm.grains', 'c.seq', 'c.rythme', 'e.texture'].forEach((i) => A.game.unlock(i));
    setTimeout(() => {
      A.garden.showTree(false); A.perform.setMode('listen'); GV.sig = null; GV.grow = {};
      setInterval(() => A.visual.draw(), 40); // headless captures barely run requestAnimationFrame: draw on a timer
      const T = A.theory, S = A.seq, dm = (d, o) => T.degreeToMidi(d, S.root, S.scale, o); let id = 900, k = 0;
      A.bus.emit('live', { midi: dm(6, 5), time: GV.clock(), vel: 0.9, raw: 0.9, id: 1 }); // held all along
      setInterval(() => { const n = ++id; A.bus.emit('live', { midi: dm([0, 2, 4][k++ % 3], 4), time: GV.clock(), vel: 0.85, raw: 0.8, id: n }); setTimeout(() => A.bus.emit('liveOff', { id: n, time: GV.clock() }), 150); }, 330);
      setInterval(() => { A.bus.emit('note', { layer: 'bells', midi: dm(5, 4), time: 0, vel: 0.7 }); A.bus.emit('note', { layer: 'bass', midi: dm(0, 2), time: 0, vel: 0.8 }); }, 120);
    }, 1600);
  } else if (h.includes('garden')) {
    if (h.includes('garden-adv')) {
      A.game.s.nodes = A.tree.NODES.map((n) => n.id).filter((id, i) => i % 5);
      A.game.s.secrets = Object.assign(A.game.s.secrets || {}, { found: { jazz: 1, tons: 1, dim: 1, lent: 1, pulse: 1 } });
    }
    A.visual.gardenSync(); doc.getElementById('bigPlay').style.display = 'none';
    const L = ['pad', 'bells', 'seq', 'bass', 'grains']; let i = 0;
    setInterval(() => { const l = L[i++ % L.length]; if (l === 'grains') A.bus.emit('grain', { layer: l, time: 0, vel: 0.6 }); else A.bus.emit('note', { layer: l, midi: 60, time: 0, vel: 0.8 }); if (i % 3 === 0) A.bus.emit('chord', { time: 0 }); if (i % 2) A.bus.emit('perc', { time: 0, vel: 0.7 }); }, 180);
  } else {
    A.garden.showTree(true);
    const m = /sel=([\w.]+)/.exec(h); if (m) A.garden.select(m[1]);
  }
});
</script></body></html>
