<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0}iframe{border:0;width:100vw;height:100vh;display:block}</style></head><body>
<script>localStorage.removeItem('ambient.game.shot');</script>
<iframe id="f" src="../index.html?gamekey=ambient.game.shot"></iframe>
<script>{const q=new URLSearchParams(location.search),f=document.getElementById('f');if(q.get('w'))f.style.width=q.get('w')+'px';if(q.get('h'))f.style.height=q.get('h')+'px';}</script>
<script>document.getElementById('f').addEventListener('load',()=>{const A=document.getElementById('f').contentWindow.AMB;if(location.hash.includes('free')){A.game.setMode('free');A.garden.welcome(false);return;}A.game.setMode('path');A.game.earn(200,'x');['t.son','h.pad','e.reverb','m.bells','t.viz'].forEach(i=>A.tree.buy(i));A.game.solve('p.gamme');A.garden.welcome(false);if(location.hash.includes('pz')){A.store.setMany({'drone.wave':'Orgue','pad.wave':'Nappe'},'user');A.game.s.puzzles=A.game.s.puzzles.filter(x=>x!=='p.premier');A.garden.openPuzzle('p.premier');}else if(!location.hash.includes('bar')){A.garden.showTree(true);const m=/sel=([\w.]+)/.exec(location.hash);if(m)A.garden.select(m[1]);const b=/buy=([\w.]+)/.exec(location.hash);if(b)setTimeout(()=>A.garden.tryBuy(b[1]),1500);}});</script></body></html>
