<script>
const params=new URLSearchParams(location.search);
async function measure(label, secs){
  const an=AMB.engine.analyser, buf=new Float32Array(an.fftSize);
  let peak=0,sum=0,n=0; const t0=performance.now();
  while(performance.now()-t0<secs*1000){ an.getFloatTimeDomainData(buf); for(const v of buf){peak=Math.max(peak,Math.abs(v));sum+=v*v;n++;} await new Promise(r=>setTimeout(r,40*S)); }
  log(`${label} rms=${Math.sqrt(sum/n).toFixed(4)} peak=${peak.toFixed(3)} notes=${notes} t=${AMB.engine.ctx.currentTime.toFixed(1)}`);
}
let notes=0;
window.addEventListener('load', async ()=>{
  try{
  await AMB.ui.play();
  await new Promise(r=>setTimeout(r,1000*S));
  AMB.engine.startCapture();
  await new Promise(r=>setTimeout(r,2000*S));
  const blob=AMB.engine.stopCapture();
  const ab=await blob.arrayBuffer();
  const dec=await AMB.engine.ctx.decodeAudioData(ab.slice(0));
  const d=dec.getChannelData(0); let pk=0; for(const v of d) pk=Math.max(pk,Math.abs(v));
  log('wav bytes='+blob.size+' dur='+dec.duration.toFixed(2)+' ch='+dec.numberOfChannels+' peak='+pk.toFixed(3));
  log('DONE');
  }catch(e){log('EXC '+e.stack)}
});
</script></body></html>
