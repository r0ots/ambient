<script>
const params=new URLSearchParams(location.search);
async function measure(label, secs){
  const an=AMB.engine.analyser, buf=new Float32Array(an.fftSize);
  let peak=0,sum=0,n=0; const t0=performance.now();
  while(performance.now()-t0<secs*1000){ an.getFloatTimeDomainData(buf); for(const v of buf){peak=Math.max(peak,Math.abs(v));sum+=v*v;n++;} await new Promise(r=>setTimeout(r,40*S)); }
  log(`${label} rms=${Math.sqrt(sum/n).toFixed(4)} peak=${peak.toFixed(3)} notes=${notes} t=${AMB.engine.ctx.currentTime.toFixed(1)}`);
}
let notes=0;
window.addEventListener('load', async ()=>{
  try{
  localStorage.clear();
  AMB.ui.saveUserPatch('A1', AMB.store.snapshot());
  const blob=new Blob([JSON.stringify({app:'ambient',version:1,patches:{'Imp':AMB.store.snapshot(),'A1':{...AMB.store.snapshot(),'global.tempo':99}},scenes:{A:AMB.store.snapshot(),B:null}})]);
  const file=new File([blob],'p.json');
  // call import through the hidden API by dispatching on a fake input is complex: use window hook
  log('renameDisabled='+document.getElementById('renamePatch').disabled);
  document.getElementById('preset').value='u:A1'; document.getElementById('preset').dispatchEvent(new Event('change'));
  log('renameEnabled='+!document.getElementById('renamePatch').disabled);
  await AMB.ui.importPatches(file);
  const u=JSON.parse(localStorage.getItem('ambient.userPresets.v1'));
  log('afterImport='+Object.keys(u).join('|')+' sceneA='+!!AMB.scenes.A);
  // robustness: malformed values must be ignored, not crash
  const before=AMB.store.get('texture.type');
  AMB.ui.applyPatch({'texture.type':'Neige','global.scale':'Foo','fx.space':'x','pad.on':1});
  log('invalid ignored: texture='+AMB.store.get('texture.type')+' scale='+AMB.store.get('global.scale')+' space='+AMB.store.get('fx.space')+' padOn='+AMB.store.get('pad.on'));
  // forced chord then stop/play must not leave the chord lock behind
  await AMB.ui.play(); AMB.seq.step=5000; AMB.seq.forceChord(2); AMB.ui.stop(); await AMB.ui.play();
  log('lockUntil after restart='+AMB.seq.lockUntil);
  log('DONE');
  }catch(e){log('EXC '+e.stack)}
});
