<script>
const params=new URLSearchParams(location.search);
async function measure(label, secs){
  const an=AMB.engine.analyser, buf=new Float32Array(an.fftSize);
  let peak=0,sum=0,n=0; const t0=performance.now();
  while(performance.now()-t0<secs*1000){ an.getFloatTimeDomainData(buf); for(const v of buf){peak=Math.max(peak,Math.abs(v));sum+=v*v;n++;} await new Promise(r=>setTimeout(r,40*S)); }
  log(`${label} rms=${Math.sqrt(sum/n).toFixed(4)} peak=${peak.toFixed(3)} notes=${notes} t=${AMB.engine.ctx.currentTime.toFixed(1)}`);
}
let notes=0;
window.addEventListener('load', async ()=>{
  try{
  const st=AMB.store, A=AMB.automation;
  const c=document.querySelector('canvas.auto-lane'); log('lane='+!!c+' w='+(c&&c.width));
  document.querySelector('[data-a=ramp]').click();
  log('curve='+st.get('auto.curve')+' on='+st.get('auto.on'));
  st.set('auto.target','fx.space'); st.set('auto.bars','4'); st.set('global.tempo',140);
  await AMB.ui.play();
  const vals=[]; for(let i=0;i<8;i++){ await new Promise(r=>setTimeout(r,700)); vals.push(st.get('fx.space').toFixed(2)); }
  log('space over time='+vals.join(' '));
  st.set('auto.on',false); await new Promise(r=>setTimeout(r,100));
  log('released space='+st.get('fx.space')+' home='+AMB.seq.homes['fx.space']);
  // draw on the canvas
  const r=c.getBoundingClientRect(); st.set('auto.on',true);
  c.dispatchEvent(new PointerEvent('pointerdown',{clientX:r.left+5,clientY:r.top+5,pointerId:1,bubbles:true}));
  c.dispatchEvent(new PointerEvent('pointermove',{clientX:r.right-5,clientY:r.bottom-5,pointerId:1,bubbles:true}));
  c.dispatchEvent(new PointerEvent('pointerup',{pointerId:1,bubbles:true}));
  log('drawn curve='+st.get('auto.curve'));
  log('DONE');
  }catch(e){log('EXC '+e.stack)}
});
