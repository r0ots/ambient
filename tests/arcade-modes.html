<!doctype html><html><head><meta charset="utf-8"></head><body>
<!-- Mini-game « Chasseur de modes » (G9.6): pure engine, injected clock, no real audio (≤ 10 s). -->
<script src="lib.js"></script>
<script>window.AMB_ARCADE_KEY='ambient.arcade.test-modes'; localStorage.removeItem(window.AMB_ARCADE_KEY); testBus();</script>
<script src="../js/theory.js"></script><script src="../js/audition.js"></script><script src="../js/arcade.js"></script><script src="../js/arcade/modes.js"></script>
<script>
window.addEventListener('load', () => {
  try {
    const t00 = performance.now();
    const A = AMB.arcade; let T = 0; A.clock = { now: () => T };
    ok(!!A, 'moteur d\'arcade chargé');
    const G = A.byId['modes'];
    ok(G && G.kid === true && typeof G.validate === 'function', 'plugin enregistré (kid, validateur)');
    // store spy: a mini-game never writes in AMB.store
    let writes = 0; AMB.store = { get() { return null; }, set() { writes++; }, setMany() { writes++; } };
    // Math.random spy
    const mr = Math.random; let mrCalls = 0; Math.random = function () { mrCalls++; return mr(); };
    const R = (s) => AMB.audition.rng(s);
    const SC = AMB.theory.SCALES, FULL = { Ionien: 'Ionien (majeur)', Lydien: 'Lydien', Mixolydien: 'Mixolydien', Dorien: 'Dorien', 'Éolien': 'Éolien (mineur)', Phrygien: 'Phrygien', Hirajoshi: 'Hirajoshi', 'Par tons': 'Par tons' };
    const sc = (n) => SC[FULL[n]];
    // independent copy of the brief's characteristic notes (test oracle, not the plugin's table)
    const CHAR = { Ionien: 4, 'Éolien': 3, Lydien: 6, Dorien: 9, Phrygien: 1, Mixolydien: 10, Hirajoshi: 8, 'Par tons': 6 };
    const INCL = [['Hirajoshi', 'Éolien']]; // documented inclusion pairs (subset, superset)
    const pc = (m, r) => (((m - r) % 12) + 12) % 12;
    const dist = (a, b) => sc(a).filter((p) => !sc(b).includes(p)).length;

    // --- determinism
    const J = (s, d) => JSON.stringify(G.make(R(s), d));
    ok(J(7, 0.5) === J(7, 0.5) && J(7, 0.5) !== J(8, 0.5) && J(3, 1) === J(3, 1), 'make() déterministe pour une graine');

    // --- invariants on 300 seeds × 6 levels
    const DS = [0, 0.3, 0.55, 0.8, 0.95, 1], fails = [], seen = {}, roots = new Set(), pairsSeen = new Set();
    let n = 0, inclCases = 0;
    const stat = {};
    for (const d of DS) {
      stat[d] = { notes: 0, beat: 0, gap: 0, nCh: new Set() };
      for (let s = 1; s <= 300; s++) {
        const ch = G.make(R(s * 7919 + Math.round(d * 1000)), d); n++;
        const S = sc(ch.mode), pcs = ch.notes.map((x) => pc(x.midi, ch.root));
        const strong = new Set(ch.notes.filter((x) => x.strong).map((x) => pc(x.midi, ch.root)));
        const err = (m) => fails.push(`d=${d} s=${s} ${ch.mode} [${ch.choices}] ${m}`);
        roots.add(ch.root % 12); seen[d + ':' + ch.mode] = 1; stat[d].nCh.add(ch.choices.length);
        stat[d].notes += ch.notes.length / 300; stat[d].beat += ch.beat / 300;
        stat[d].gap += Math.min(...ch.choices.filter((c) => c !== ch.mode).map((c) => Math.max(1, Math.min(dist(ch.mode, c), dist(c, ch.mode))))) / 300;
        if (d >= 0.7 && d < 0.9) pairsSeen.add(ch.choices.slice().sort().join('/'));
        if (!ch.choices.includes(ch.mode) || new Set(ch.choices).size !== ch.choices.length) err('choix incohérents');
        if (pcs.some((p) => !S.includes(p))) err('note hors du mode');
        if (pcs[0] !== 0 && pcs[pcs.length - 1] !== 0) err('tonique ni au début ni à la fin');
        if (!strong.has(CHAR[ch.mode])) err('note caractéristique pas sur un temps fort');
        ch.notes.forEach((x) => { if (x.strong !== (Number.isInteger(x.beat) && x.beat % 2 === 0)) err('temps fort mal marqué'); });
        for (const x of ch.choices) {
          if (x === ch.mode) continue;
          const containsAll = pcs.every((p) => sc(x).includes(p));
          const incl = INCL.some(([a, b]) => a === ch.mode && b === x);
          if (containsAll && !incl) err(x + ' contient toutes les notes jouées');
          if (incl) { // documented inclusion rule: whole subset scale played + a hole heard
            inclCases++;
            if (!S.every((p) => pcs.includes(p))) err('inclusion : gamme incomplète');
            const extra = sc(x).filter((p) => !S.includes(p));
            const hole = ch.notes.some((a, i) => { if (!i) return false; const lo = Math.min(a.midi, ch.notes[i - 1].midi), hi = Math.max(a.midi, ch.notes[i - 1].midi); if (hi - lo > 4) return false; let g = false; for (let m = lo + 1; m < hi; m++) { if (S.includes(pc(m, ch.root))) return false; if (extra.includes(pc(m, ch.root))) g = true; } return g; });
            if (!hole) err('inclusion : pas de trou');
          }
          if (!incl && !sc(ch.mode).some((p) => !sc(x).includes(p) && strong.has(p))) err('différence avec ' + x + ' pas sur un temps fort');
        }
        if (G.validate(ch).length) err('validateur du plugin : ' + G.validate(ch).join(', '));
      }
    }
    ok(!fails.length, `invariants sur ${n} phrases (300 graines × ${DS.length} niveaux)` + (fails.length ? ' : ' + fails.length + ' échecs, ex. ' + fails.slice(0, 3).join(' | ') : ''));
    ok(roots.size === 12, 'tonique tirée sur les 12 notes (relatif)');
    ok(inclCases > 20, 'règle d\'inclusion Hirajoshi ⊂ Éolien exercée (' + inclCases + ' cas)');
    ok(pairsSeen.size === 5, 'les 5 paires voisines tirées à d=0.8 (' + [...pairsSeen].join(', ') + ')');
    ok(['Ionien', 'Éolien'].every((m) => seen['0:' + m]) && ['Ionien', 'Lydien', 'Mixolydien', 'Dorien', 'Éolien', 'Phrygien', 'Hirajoshi'].every((m) => seen['0.8:' + m]), 'chaque mode peut être la réponse');
    // --- difficulty curve
    const nc = (d) => [...stat[d].nCh].join('/');
    ok(nc(0) === '2' && nc(0.3) === '3' && nc(0.55) === '4' && nc(0.8) === '2' && nc(0.95) === '3', `nombre de choix : 2 → 3 → 4 → 2 voisins → 3 voisins (${DS.map(nc).join(', ')})`);
    ok(stat[0].gap >= 2.99 && stat[0.3].gap >= 2 && stat[0.55].gap >= 2 && stat[0.8].gap <= 1 && stat[1].gap <= 1, 'écart réponse ↔ leurre le plus proche : ' + DS.map((d) => stat[d].gap.toFixed(1)).join(' → ') + ' notes');
    ok(stat[1].beat < stat[0].beat - 0.2 && stat[1].notes > stat[0].notes, `plus vite et plus dense (${stat[0].beat.toFixed(2)} s/temps, ${stat[0].notes.toFixed(1)} notes → ${stat[1].beat.toFixed(2)} s, ${stat[1].notes.toFixed(1)})`);
    // --- labels and check
    { const g0 = AMB.game; AMB.game = { isKid: () => true }; const c0 = G.make(R(5), 0), L = G.choices(c0); AMB.game = g0;
      ok(L.length === 2 && L[0].label.includes('Joyeux') && L[1].label.includes('Triste') && L[0].value === 'Ionien', 'd=0, profil découverte : « Joyeux / Triste » (majeur / mineur)');
      const Lm = G.choices(G.make(R(5), 0));
      ok(Lm[0].label.includes('Ionien') && Lm[1].label.includes('Éolien'), 'd=0, profil musicien : vrais noms (' + Lm.map((c) => c.label).join(' / ') + ')');
      const c1 = G.make(R(5), 1), L1 = G.choices(c1);
      ok(L1.every((c) => sc(c.value)) && L1.some((c) => c.value === c1.mode), 'd=1 : noms des modes de theory.js');
      ok(G.check(c1, c1.mode).ok && L1.filter((c) => c.value !== c1.mode).every((c) => !G.check(c1, c.value).ok) && !G.check(c1, 'x').ok, 'check() : juste / faux'); }
    // --- the validator rejects bad phrases
    { const base = G.make(R(11), 0.8), mk = (f) => { const c = JSON.parse(JSON.stringify(base)); f(c); return G.validate(c); };
      ok(!G.validate(base).length, 'validateur : phrase tirée acceptée');
      ok(mk((c) => { const out = [...Array(12).keys()].find((q) => !sc(c.mode).includes(q)); c.notes[1].midi = c.root + out; }).some((m) => /hors/.test(m)), 'validateur : note hors du mode rejetée');
      ok(mk((c) => { c.notes[0].midi = c.notes[c.notes.length - 1].midi = c.root + 7; }).some((m) => /tonique/.test(m)), 'validateur : sans tonique au début ni à la fin rejetée');
      ok(mk((c) => { c.notes.forEach((x) => { if (pc(x.midi, c.root) === CHAR[c.mode]) x.midi = c.root; }); }).some((m) => /caractéristique/.test(m)), 'validateur : note caractéristique absente rejetée');
      ok(mk((c) => { c.notes.forEach((x) => { x.strong = false; }); }).some((m) => /temps fort/.test(m)), 'validateur : note caractéristique seulement sur temps faibles rejetée');
      const hira = (() => { for (let s = 1; s < 500; s++) { const c = G.make(R(s), 0.8); if (c.mode === 'Hirajoshi') return c; } })();
      const hv = (f) => { const c = JSON.parse(JSON.stringify(hira)); f(c); return G.validate(c); };
      ok(hira && hv((c) => { c.notes = c.notes.filter((x) => pc(x.midi, c.root) !== 2); if (!c.notes.length) c.notes = [{ beat: 0, midi: c.root, strong: true }]; }).some((m) => /entier/.test(m)), 'validateur : inclusion — gamme incomplète rejetée');
      ok(hira && hv((c) => { c.notes = [0, 2, 3, 2, 0, 7, 8, 7, 0].map((p, i) => ({ beat: i, midi: c.root + p, strong: i % 2 === 0 })); }).some((m) => /trou/.test(m)), 'validateur : inclusion — aucun trou entendu rejeté'); }
    // --- stimulus: drone low, soft and held under the whole phrase; strong beats accented
    { const c = G.make(R(21), 0.6), ev = G.stimulus(c), mel = ev.slice(2), end = Math.max(...mel.map((e) => e.t + e.dur));
      ok(ev[0].t === 0 && ev[0].midi === c.root - 12 && ev[1].midi === c.root - 24 && ev[0].voice === 'sine' && ev[0].vel <= 0.5 && ev[0].dur >= end, 'bourdon : tonique grave, douce, tenue sous toute la phrase');
      ok(mel.length === c.notes.length && mel[0].t >= 0.8 && mel.every((e, i) => !i || e.t > mel[i - 1].t) && mel.every((e) => ['triangle'].includes(e.voice)), 'phrase après le bourdon, ordonnée');
      ok(mel.every((e, i) => e.vel === (c.notes[i].strong ? 0.85 : 0.6)), 'temps forts accentués'); }
    // --- a round in the engine (no audio engine: silent), no store writes
    { A.stats('modes').d = 0; const r = A.start('modes', { seed: 4 }); let good = 0;
      for (let i = 0; i < 6; i++) { const x = A.answer(A.round.ch.answer); if (x && x.ok) good++; }
      const ch = A.choices(); A.end({ abort: true });
      ok(r && good === 6 && ch && ch.length >= 2, 'manche jouable dans le moteur (6 bonnes réponses)'); }
    // render: stage without pitch info
    { const el = document.createElement('div'), c = G.make(R(2), 0.3); G.render(c, el);
      ok(el.querySelectorAll('.arc-modes-dot').length === c.notes.length && !/midi|\d{2,}Hz/.test(el.innerHTML), 'rendu : bande de temps (rythme seulement)'); }
    ok(writes === 0, 'aucune écriture dans AMB.store');
    ok(mrCalls === 0, 'Math.random jamais appelé');
    Math.random = mr;
    log('durée ' + Math.round(performance.now() - t00) + ' ms');
    localStorage.removeItem(window.AMB_ARCADE_KEY);
    done();
  } catch (e) { fail(e); }
});
</script></body></html>
