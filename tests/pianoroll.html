<!doctype html><html><head><meta charset="utf-8"></head><body>
<script src="lib.js"></script>
<div id="scenes"></div><div id="journal"></div><div id="layers"></div><div id="seqrow"></div><div id="macros"></div><div id="globals"></div><button data-mode="listen"></button><button data-mode="sculpt"></button><button data-mode="compose"></button>
<button id="play"></button><button id="bigPlay"></button><div id="chordName"></div><div id="hudInfo"></div><select id="preset"></select><button id="dice"></button><button id="save"></button><button id="rec"></button><select id="recFmt"><option value="wav">w</option></select><select id="recDur"><option value="0">0</option></select><button id="share"></button><div id="toast"></div><select id="sleep"></select><span id="sleepLeft"></span><canvas id="viz" style="width:400px;height:200px"></canvas>
<script src="../js/theory.js"></script><script src="../js/params.js"></script><script src="../js/engine.js"></script><script src="../js/layers.js"></script><script src="../js/sequencer.js"></script><script src="../js/presets.js"></script><script src="../js/generator.js"></script><script src="../js/visual.js"></script><script src="../js/scenes.js"></script><script src="../js/journal.js"></script><script src="../js/pianoroll.js"></script><script src="../js/pulses.js"></script><script src="../js/bass.js"></script><script src="../js/chords.js"></script><script src="../js/midi.js"></script><script src="../js/automation.js"></script><script src="../js/song.js"></script><script src="../js/widgets.js"></script><script src="../js/perform.js"></script><script src="../js/rec.js"></script><script src="../js/ui.js"></script><script src="../js/play.js"></script>
<script>
const params=new URLSearchParams(location.search);
async function measure(label, secs){
  const an=AMB.engine.analyser, buf=new Float32Array(an.fftSize);
  let peak=0,sum=0,n=0; const t0=performance.now();
  while(performance.now()-t0<secs*1000){ an.getFloatTimeDomainData(buf); for(const v of buf){peak=Math.max(peak,Math.abs(v));sum+=v*v;n++;} await new Promise(r=>setTimeout(r,40*S)); }
  log(`${label} rms=${Math.sqrt(sum/n).toFixed(4)} peak=${peak.toFixed(3)} notes=${notes} t=${AMB.engine.ctx.currentTime.toFixed(1)}`);
}
let notes=0;
window.addEventListener('load', async ()=>{
  try{
  const st=AMB.store, PR=AMB.pianoRoll;
  let seqNotes=0, bellNotes=0; AMB.bus.on('note',n=>{ if(n.layer==='seq') seqNotes++; if(n.layer==='bells') bellNotes++; });
  st.set('global.tempo',140); st.set('seq.steps','16');
  const canvas=document.querySelector('canvas.roll');
  log('roll canvas='+!!canvas+' w='+(canvas&&canvas.width));
  // click a cell through pointer events: step 0, row 7
  const r=canvas.getBoundingClientRect(), G=PR.roll.geom();
  const ev=(type,x,y)=>canvas.dispatchEvent(new PointerEvent(type,{clientX:r.left+x,clientY:r.top+y,bubbles:true,pointerId:1}));
  ev('pointerdown', G.labelW+G.cw*0.5, (PR.ROWS-1-7)*G.rowH+5); ev('pointermove', G.labelW+G.cw*3.5, (PR.ROWS-1-7)*G.rowH+5); ev('pointerup',0,0);
  log('after click+drag pattern='+st.get('seq.pattern'));
  // velocity via wheel, probability via right click on the drawn note (step 0, row 7)
  const at=[G.labelW+G.cw*0.5,(PR.ROWS-1-7)*G.rowH+5];
  canvas.dispatchEvent(new WheelEvent('wheel',{clientX:r.left+at[0],clientY:r.top+at[1],deltaY:-100,bubbles:true,cancelable:true}));
  canvas.dispatchEvent(new MouseEvent('contextmenu',{clientX:r.left+at[0],clientY:r.top+at[1],bubbles:true,cancelable:true}));
  const n0=PR.parse(st.get('seq.pattern'))[0];
  log('vel/prob pattern='+st.get('seq.pattern')+' v='+n0.v+' p='+n0.p+' roundtrip='+(PR.encode(PR.parse(st.get('seq.pattern')))===st.get('seq.pattern')));
  const before=st.get('seq.pattern'); PR.mutate(1); PR.mutate(1);
  log('mutated '+before+' -> '+st.get('seq.pattern'));
  document.querySelector('[data-act=restore]').click(); log('restored='+(st.get('seq.pattern')===before));
  // drag-move a note, click-to-delete still works
  st.set('seq.pattern','2.5.2'); st.set('seq.slot','A');
  const cx=(s)=>r.left+G.labelW+G.cw*(s+0.5), cy=(row)=>r.top+(PR.ROWS-1-row)*G.rowH+5;
  const pe=(t,x,y)=>canvas.dispatchEvent(new PointerEvent(t,{clientX:x,clientY:y,pointerId:1,bubbles:true}));
  pe('pointerdown',cx(2),cy(5)); pe('pointermove',cx(6),cy(8)); pe('pointerup',cx(6),cy(8));
  log('moved='+st.get('seq.pattern'));
  pe('pointerdown',cx(7),cy(8)); pe('pointermove',cx(10),cy(8)); pe('pointerup',cx(10),cy(8));
  log('resized='+st.get('seq.pattern'));
  pe('pointerdown',cx(6),cy(8)); pe('pointerup',cx(6),cy(8));
  log('click-deleted='+JSON.stringify(st.get('seq.pattern')));
  // selection + copy/paste/transpose via keyboard
  st.set('seq.pattern','0.7.2,2.8.2,4.9.2'); st.set('seq.slot','A');
  const R=PR.roll; R.setSel(R.notes());
  const key=(k,o={})=>canvas.dispatchEvent(new KeyboardEvent('keydown',{key:k,bubbles:true,cancelable:true,...o}));
  key('ArrowUp'); log('transposed='+st.get('seq.pattern'));
  key('c',{metaKey:true}); R.cursor=8; key('v',{metaKey:true}); log('pasted='+PR.parse(st.get('seq.pattern')).length+' sel='+R.sel.size);
  key('Delete'); log('after delete='+st.get('seq.pattern'));
  // alt-drag rectangle select
  canvas.dispatchEvent(new PointerEvent('pointerdown',{clientX:r.left+G.labelW+1,clientY:r.top+1,altKey:true,pointerId:2,bubbles:true}));
  canvas.dispatchEvent(new PointerEvent('pointermove',{clientX:r.left+G.labelW+G.cw*3.5,clientY:r.bottom-2,pointerId:2,bubbles:true}));
  log('rect sel='+R.sel.size); canvas.dispatchEvent(new PointerEvent('pointerup',{pointerId:2,bubbles:true}));
  st.set('seq.pattern','0.7.4.8.7');
  // chain: A has the drawn note, duplicate to B, edit B, chain "A B B"
  document.querySelector('[data-act=dup]').click();
  log('after dup slot='+st.get('seq.slot')+' B='+st.get('seq.patB'));
  PR.roll.act('up');
  st.set('seq.chain','A B B'); st.set('seq.steps','16');
  log('chain='+PR.chainList().join('')+' slots at steps 0/16/32/48='+[0,16,32,48].map(PR.slotAt).join(''));
  st.set('seq.chain',''); st.set('seq.slot','A');
  // quantised slot launch: latched slot only changes at a pattern boundary
  PR.roll.act('random');
  const pat=st.get('seq.pattern'); log('random notes='+PR.parse(pat).length+' seqOn='+st.get('seq.on')+' roundtrip='+(PR.encode(PR.parse(pat))===pat));
  ['drone','pad','bells','grains','texture'].forEach(l=>st.set(l+'.on',false));
  await AMB.ui.play();
  await new Promise(r=>setTimeout(r,3000*S));
  await measure('seq only notes='+seqNotes,2*S);
  // arpeggiator: count seq notes and check they are chord tones
  const arpMidis=[]; const onN=(n)=>{ if(n.layer==='seq') arpMidis.push(n.midi); }; AMB.bus.on('note',onN);
  st.set('seq.mode','Arpège'); st.set('seq.arpRate','1/16'); st.set('seq.arpDir','Monte');
  await new Promise(r=>setTimeout(r,1500));
  const pcs=new Set(AMB.seq.chordMidis(AMB.seq.chordDeg).map(m=>m%12));
  log('arp notes='+arpMidis.length+' asc='+arpMidis.slice(0,6).join(',')+' allChordTones='+arpMidis.every(m=>pcs.has(m%12)));
  st.set('seq.mode','Piano roll');
  st.set('seq.on',true); st.set('seq.mode','Piano roll'); log('latched next: step5='+(()=>{ AMB.pianoRoll.onStep(0,0,0.1,0); st.set('seq.slot','B'); AMB.pianoRoll.onStep(5,0,0.1,0); const a=AMB.pianoRoll.roll.playSlot; AMB.pianoRoll.onStep(16,0,0.1,0); return a+' step16='+AMB.pianoRoll.roll.playSlot; })());
  st.set('seq.slot','A');
  // live recording from the computer keyboard
  st.set('seq.pattern',''); st.set('seq.slot','A');
  const rb=document.querySelector('[data-act=liverec]'); rb.click();
  for(const code of ['KeyA','KeyD','KeyG']){ document.dispatchEvent(new KeyboardEvent('keydown',{code})); await new Promise(r=>setTimeout(r,250)); }
  rb.click();
  log('live rec notes='+PR.parse(st.get('seq.pattern')).length+' rows='+PR.parse(st.get('seq.pattern')).map(n=>n.r).join(','));
  // S3.3 recorded length = time held, quantised to the step, 1 step min, bounded by the motif (events at chosen times)
  { const sd=AMB.seq.stepDur(), len=parseInt(st.get('seq.steps'),10);
    ok(Math.abs(sd*4-60/st.get('global.tempo'))<1e-9, 'pas = 1/4 de temps ('+st.get('global.tempo')+' BPM)');
    st.set('seq.pattern',''); rb.click();
    const at=(k)=>AMB.seq.nextTime+(k-AMB.seq.step)*sd; // audio time that lands on step k
    const hold=(id,midi,k,secs)=>{ AMB.bus.emit('live',{midi,time:at(k),vel:0.8,id}); AMB.bus.emit('liveOff',{id,midi,time:at(k)+secs}); return PR.parse(st.get('seq.pattern')).find(n=>n.s===k); };
    ok((hold(9001,60,0,4*sd+0.3*sd)||{}).l===4, 'tenue 1 temps (+ un peu) → 4 pas');
    ok((hold(9002,64,4,0.2*sd)||{}).l===1, 'tenue très courte → 1 pas minimum');
    ok((hold(9003,67,len-2,40*sd)||{}).l===2, 'tenue au-delà de la fin du motif → bornée ('+len+' pas)');
    // computer keyboard: keyup ends the note (no stuck key)
    let offs=0; AMB.bus.on('liveOff',()=>offs++);
    const h0=AMB.play.held; document.dispatchEvent(new KeyboardEvent('keydown',{code:'KeyS'})); const h1=AMB.play.held; document.dispatchEvent(new KeyboardEvent('keyup',{code:'KeyS'}));
    ok(offs===1 && h1===h0+1 && AMB.play.held===h0, 'clavier : keydown = note tenue, keyup = fin de note');
    ['KeyA','KeyD','KeyG'].forEach(code=>document.dispatchEvent(new KeyboardEvent('keyup',{code}))); ok(AMB.play.held===0, 'clavier : plus aucune note tenue');
    rb.click(); }
  // capture the generative melody into the roll
  st.set('bells.on',true); st.set('bells.density',0.9);
  const btn=document.querySelector('[data-act=capture]'); PR.roll.act('capture',btn);
  await new Promise(r=>setTimeout(r,5000));
  log('captured notes='+PR.parse(st.get('seq.pattern')).length+' bellNotes='+bellNotes);
  AMB.history && log('undoable='+(AMB.history.past.length>0));
  log('DONE');
  }catch(e){log('EXC '+e.stack)}
});
</script></body></html>
