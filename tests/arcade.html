<!doctype html><html><head><meta charset="utf-8"></head><body>
<script>
const TAG=location.pathname.split('/').pop().replace('.html','');
const log=(m)=>fetch('/__log?'+encodeURIComponent(TAG+'|'+m)).catch(()=>{});
window.onerror=(m,s,l,c,e)=>log('ERROR '+m+' @'+s+':'+l);
window.addEventListener('unhandledrejection',e=>log('REJECT '+(e.reason&&e.reason.stack||e.reason)));
const oe=console.error;console.error=(...a)=>{log('CONSOLE.ERROR '+a.join(' '));oe(...a)};
window.AMB_ARCADE_KEY='ambient.arcade.test';
localStorage.removeItem('ambient.arcade.test');
// pure engine: no audio engine, no DOM app — only a tiny bus to watch the events
window.AMB={ bus:{ fns:{}, on(e,f){(this.fns[e]=this.fns[e]||[]).push(f)}, emit(e,d){(this.fns[e]||[]).forEach(f=>f(d))} } };
</script>
<script src="../js/audition.js"></script><script src="../js/arcade.js"></script><script src="../js/arcade/hautbas.js"></script>
<script>
const ok=(c,m)=>log((c?'ok ':'ERROR fail ')+m);
window.addEventListener('load', async ()=>{
  try{
  const A=AMB.arcade, ev=[]; let T=0;
  A.clock={now:()=>T};
  ['start','answer','end'].forEach(e=>AMB.bus.on('arcade:'+e,d=>ev.push(e)));
  const sessions=[]; const s0=AMB.audition.session; AMB.audition.session=function(on){ sessions.push(!!on); return s0.call(this,on); };
  // --- registry
  ok(A.byId.hautbas && A.byId.hautbas.kid===true && A.games.filter(g=>g.id==='hautbas').length===1, 'mini-jeu de démo enregistré');
  let threw=false; try{ A.register({id:'x'}); }catch(e){ threw=true; } ok(threw, 'register refuse un plugin incomplet');
  // --- determinism: same seed + same answers -> same challenges
  const play=(seed,n,answerFn)=>{ A.stats('hautbas').d=0.3; A.stats('hautbas').step=0.12; const out=[]; A.start('hautbas',{seed}); for(let i=0;i<n;i++){ const ch=A.round.ch; out.push(ch.base+':'+ch.cents); A.answer(answerFn(ch,i)); } A.end({abort:true}); return out.join(','); };
  const right=(ch)=>ch.answer, alt=(ch,i)=>i%3?ch.answer:'nope';
  const a1=play(42,12,alt), a2=play(42,12,alt), a3=play(43,12,alt);
  ok(a1===a2 && a1!==a3, 'même graine → mêmes défis, autre graine → autres');
  const mr=Math.random; A.start('hautbas',{seed:1}); A.end({abort:true}); ok(Math.random===mr, 'Math.random intact');
  ok(A.byId.hautbas.gap(0)===700 && A.byId.hautbas.gap(1)===15 && A.byId.hautbas.gap(0.5)<A.byId.hautbas.gap(0.2), 'écart décroissant avec d (700 → 15 cents)');
  // --- staircase
  A.stats('hautbas').d=0.3; A.stats('hautbas').step=0.12;
  A.start('hautbas',{seed:5}); const R=A.round;
  ok(A.active && R.stair.d===0.3, 'manche active, d de départ = niveau mémorisé');
  A.answer(R.ch.answer); ok(R.stair.d===0.3, '1 réussite : d inchangé');
  A.answer(R.ch.answer); ok(Math.abs(R.stair.d-0.42)<1e-9, '2 réussites → d monte ('+R.stair.d.toFixed(3)+')');
  A.answer('nope'); ok(R.stair.d<0.42 && R.stair.step<0.12, '1 erreur → d baisse, pas réduit à l\'inversion ('+R.stair.d.toFixed(3)+', pas '+R.stair.step.toFixed(3)+')');
  A.end({abort:true});
  // convergence: a listener who hears gaps above 60 cents only
  { const st={d:0, step:0.12, run:0, dir:0}, hb=A.byId.hautbas, ds=[];
    for(let i=0;i<120;i++){ A.stair(st, hb.gap(st.d)>=60); ds.push(st.d); }
    const tail=ds.slice(-30), lo=Math.min(...tail), hi=Math.max(...tail), dT=1-Math.sqrt((60-15)/685);
    ok(hi-lo<0.08 && Math.abs((lo+hi)/2-dT)<0.06 && st.step>=A.STAIR.minStep, 'escalier : converge vers le seuil ('+((lo+hi)/2).toFixed(2)+' ≈ '+dT.toFixed(2)+', amplitude '+(hi-lo).toFixed(3)+')'); }
  { const st={d:0.98,step:0.12,run:0,dir:0}; for(let i=0;i<6;i++) A.stair(st,true); ok(st.d===1, 'plafond 1'); for(let i=0;i<40;i++) A.stair(st,false); ok(st.d===0, 'plancher 0'); }
  // --- score / combo / stars with the clock moved by hand
  localStorage.removeItem('ambient.arcade.test'); A.load(); A.stats('hautbas').d=0;
  ev.length=0; sessions.length=0; T=1000;
  const r=A.start('hautbas',{seed:9}); ok(A.active && ev[0]==='start' && sessions[0]===true, 'start : active, arcade:start, audition.session(true)');
  ok(A.timeLeft()===75000, 'durée 75 s');
  const ans=[]; AMB.bus.on('arcade:answer',d=>ans.push(d));
  let x=A.answer(r.ch.answer); ok(x.ok && x.pts===150 && x.mult===1 && x.combo===1, 'bonne réponse sans réécoute : 100 × 1,5 = '+x.pts);
  A.replay(); A.replay(); ok(r.replays===2 && r.chReplays===2, 'réécoutes comptées');
  x=A.answer(r.ch.answer); ok(x.ok && !x.clean && x.combo===1 && x.pts===100, 'réécoutée : pas de bonus, combo inchangé ('+x.pts+')');
  for(let i=0;i<5;i++) x=A.answer(r.ch.answer);
  ok(x.mult===3 && x.combo===6 && ans.every(a=>'ok' in a && 'd' in a && 'combo' in a), 'combo ×3 après 6 réponses risquées, arcade:answer {ok, d, combo}');
  const before=r.score; x=A.answer('nope'); ok(!x.ok && x.pts===0 && x.mult===1 && x.combo===0 && r.score===before, 'erreur : 0 point, combo à ×1');
  T+=30000; ok(A.timeLeft()===45000 && !A.tick(), 'horloge injectée : 45 s restantes');
  T+=46000; const e1=A.tick();
  ok(e1 && !A.active && !A.round && ev[ev.length-1]==='end' && sessions[sessions.length-1]===false, 'temps écoulé → fin, session(false), arcade:end');
  ok(e1.record && e1.score===before && e1.stars===A.starsFor(before, 0) && e1.total===8 && e1.good===7, 'fin : score '+e1.score+', '+e1.stars+'★, record');
  ok(A.answer('up')===null && A.replay()===null, 'plus de réponse après la fin');
  ok(A.starsFor(0,0)===0 && A.starsFor(A.par(0),0)===2 && A.starsFor(A.par(0)*2,0)===3 && A.starsFor(A.par(0),1)<A.starsFor(A.par(0),0), 'étoiles relatives au niveau (par '+A.par(0)+' à d=0, '+A.par(1)+' à d=1)');
  // --- records (per mini-game, per pacts combination), persisted
  { const rec=A.record('hautbas'); ok(rec && rec.score===before && rec.stars===e1.stars, 'record mémorisé');
    T=0; A.start('hautbas',{seed:3}); A.answer('nope'); A.answer(A.round.ch.answer); const e2=A.end();
    ok(!e2.record && A.record('hautbas').score===before, 'score plus bas : pas de record');
    A.start('hautbas',{seed:3, pacts:['transpose','une-ecoute']}); A.answer(A.round.ch.answer); const e3=A.end();
    ok(e3.record && A.record('hautbas',['une-ecoute','transpose']).score===e3.score && A.record('hautbas').score===before, 'record séparé par combinaison de Pactes (ordre indifférent)');
    A.start('hautbas',{seed:3}); for(let i=0;i<20;i++) A.answer(A.round.ch.answer); const e4=A.end({abort:true});
    ok(!e4.record && A.record('hautbas').score===before && e4.stars===0, 'manche abandonnée : pas de record');
    const saved=JSON.parse(localStorage.getItem('ambient.arcade.test')), g=saved.profiles.default.games.hautbas;
    ok(g.best[''].score===before && g.best['transpose+une-ecoute'] && Math.abs(g.d-A.level('hautbas'))<1e-9 && g.plays===3, 'persistant sous la clé dédiée (d '+g.d.toFixed(2)+', '+g.plays+' manches)');
    ok(A.stats('hautbas').peak>=g.d, 'niveau atteint (pic) mémorisé'); }
  // --- profiles
  { const dDef=A.level('hautbas'); ok(A.setProfile('fils') && A.level('hautbas')===0 && !A.record('hautbas'), 'autre profil : niveau et records à part');
    A.start('hautbas',{seed:1}); ok(!A.setProfile('default'), 'pas de changement de profil pendant une manche'); A.end({abort:true});
    A.setProfile('default'); ok(A.level('hautbas')===dDef, 'retour au profil : niveau retrouvé'); }
  // --- a new start ends the previous round
  A.start('hautbas',{seed:1}); A.start('hautbas',{seed:2}); ok(A.active && A.round.seed===2, 'start pendant une manche : la précédente est abandonnée'); A.end({abort:true});
  ok(!A.active && A.start('nope')===null && !A.active, 'jeu inconnu : rien');
  // --- custom duration + plugin with partial credit and play()
  { let played=0; A.register({id:'t.partial', make:(rng,d)=>({v:rng.int(10)}), play:async(ch,api)=>{ played++; return 0; }, choices:()=>null, check:(ch,a)=>({ok:a===ch.v, partial:a===-1?0.5:0})});
    T=0; A.start('t.partial',{seed:4, duration:10000}); A.replay(); ok(played===1 && A.choices()===null, 'plugin play(ch, api) appelé par replay, choices null');
    const xp=A.answer(-1); ok(!xp.ok && xp.pts===50, 'réponse partielle : '+xp.pts+' pts');
    T=10001; ok(A.answer(1)===null && !A.active, 'durée paramétrable : 10 s'); }
  // --- API v3: api.t0 (real start of the stimulus), api.note (feedback), onMidiOff
  { const oc=new OfflineAudioContext(1,44100,44100); AMB.engine={ctx:oc, audIn:oc.destination};
    const got=[]; let api=null;
    A.register({id:'t.api', make:(rng)=>({v:rng.int(5)}), stimulus:()=>[{t:0,midi:60,dur:0.2,voice:'sine'}], choices:()=>null, check:(ch,a)=>({ok:a===ch.v}),
      onMidi:(ch,n,a)=>{ api=a; got.push('on'+n.midi+'@'+n.time); }, onMidiOff:(ch,n,a)=>got.push('off'+n.midi+'@'+n.time) });
    T=0; A.start('t.api',{seed:7}); const tp=performance.now(), res=A.listen(); api=A.api();
    ok(res && Math.abs(res.dur-0.2)<1e-9 && Math.abs(api.t0-(tp+100))<30, 'api.t0 = départ réel du stimulus (maintenant + avance 100 ms : '+(api.t0-tp).toFixed(0)+' ms)');
    const t0=api.t0, nv=AMB.audition.lastCount, fb=api.note({midi:67}); ok(fb && fb.dur>0 && AMB.audition.lastCount===1 && api.t0===t0, 'api.note : retour sonore immédiat, t0 inchangé');
    ok(A.midi({midi:64,vel:0.5,time:1234}) && A.midiOff({midi:64,time:1300}) && got.join()==='on64@1234,off64@1300' && typeof api.answer==='function', 'onMidi / onMidiOff routés au plugin : '+got.join());
    A.register({id:'t.nooff', make:()=>({}), choices:()=>null, check:()=>({ok:false})}); A.start('t.nooff',{seed:1}); ok(A.midiOff({midi:60})===false, 'sans onMidiOff : ignoré');
    A.end({abort:true}); ok(A.midiOff({midi:60})===false && A.open===false, 'hors manche : rien ; arcade.open déclaré (false)'); delete AMB.engine; }
  // --- v1.00 hooks: reveal (pause after the answer), precision bonus, MIDI routed to a prepare() in progress
  { A.register({id:'t.bonus', reveal:1600, make:(rng)=>({v:rng.int(5)}), choices:()=>null, check:(ch,a)=>({ok:a===ch.v, partial:a===-1?0.5:0, bonus:a===ch.v?0.5:0})});
    T=0; A.stats('t.bonus').d=0; A.start('t.bonus',{seed:2}); const xb=A.answer(A.round.ch.v);
    ok(xb.ok && xb.bonus===0.5 && xb.pts===Math.round(100*(1+A.SCORE.bonus*0.5)*1.5) && xb.reveal===1600, 'bonus 0,5 → +'+(xb.pts-150)+' pts ('+xb.pts+'), reveal du plugin = '+xb.reveal+' ms');
    const xn=A.answer(-1); ok(!xn.ok && xn.pts===75 && xn.bonus===0, 'pas de bonus : partiel inchangé ('+xn.pts+')'); A.end({abort:true});
    A.start('hautbas',{seed:2}); const xd=A.answer(A.round.ch.answer); ok(xd.reveal===A.REVEAL && A.REVEAL===450 && xd.bonus===0, 'sans hook : reveal par défaut '+A.REVEAL+' ms'); A.end({abort:true});
    const pm=[]; A.prep={midi:(n)=>pm.push(n.midi+'@'+n.time)}; ok(A.midi({midi:62,vel:0.4,time:77}) && pm.join()==='62@77', 'prepare en cours (hors manche) : MIDI routé au plugin'); A.prep=null;
    ok(A.midi({midi:62,vel:0.4,time:78})===false, 'sans prepare ni manche : MIDI ignoré'); }
  // --- audition: optional attack ev.atk on the simple voices (default unchanged: min(20 ms, dur / 4))
  { const render=async(atk)=>{ const oc=new OfflineAudioContext(1,22050,44100); AMB.audition.play([{t:0,midi:69,dur:0.4,vel:0.8,voice:'sine',atk}],{ctx:oc,when:0}); const b=(await oc.startRendering()).getChannelData(0);
      const pk=(a,z)=>{ let m=0; for(let i=Math.round(a*44100);i<Math.round(z*44100);i++) m=Math.max(m,Math.abs(b[i])); return m; }; return [pk(0.005,0.01), pk(0.1,0.2)]; };
    const [d0,d1]=await render(undefined), [s0b,s1b]=await render(0.3), [z0]=await render(0.02);
    ok(Math.abs(d0-z0)<1e-6 && d0>d1*0.2, 'attaque par défaut inchangée (= 20 ms explicites)');
    ok(s0b<d0*0.2 && Math.abs(s1b-d1)>d1*0.1, 'ev.atk = 0,3 s : attaque lente ('+s0b.toFixed(3)+' vs '+d0.toFixed(3)+' à 5–10 ms)'); }
  localStorage.removeItem('ambient.arcade.test');
  log('DONE');
  }catch(e){log('EXC '+e.stack)}
});
</script></body></html>
