<!doctype html><html><head><meta charset="utf-8"></head><body>
<script src="lib.js"></script>
<script>localStorage.removeItem('ambient.game.apptest');</script>
<iframe id="f" src="../index.html?autoplay=1&view=expert&gamekey=ambient.game.apptest" style="width:1300px;height:900px"></iframe>
<script>
// Drives the real app (full DOM) through its buttons and reports errors.
const f=document.getElementById('f');
let reloads=0;
f.addEventListener('load', async ()=>{
  try{
  const w=f.contentWindow, d=f.contentDocument, A=w.AMB;
  // under the parallel suite a script of the app can fail to load (busy test server): then whole modules are missing
  // (AMB.pianoRoll → no .roll-wrap → « ui sans élément pianoroll… »). Reload the app once before judging the DOM.
  const missing=['pianoRoll','chords','song','automation','tree','game','seq'].filter(k=>!A||!A[k]);
  if(missing.length && reloads<2){ reloads++; log('reload (modules not loaded: '+missing.join(',')+')'); w.location.reload(); return; }
  w.addEventListener('error',e=>log('ERROR '+e.message+' @'+e.filename+':'+e.lineno+' '+(e.error&&e.error.stack||'').slice(0,300)));
  // Jardin sonore (G1.3): every control and feature is tied to an unlock node
  const untagged=[...d.querySelectorAll('[data-key]:not([data-node])')].map(e=>e.dataset.key);
  log((untagged.length?'ERROR untagged ':'tagged ok ')+untagged.join(','));
  const noEl=Object.entries(A.tree.UI_SEL).filter(([n,sel])=>!d.querySelector(sel)).map(([n])=>n);
  log((noEl.length?'ERROR ui sans élément ':'ui ok ')+noEl.join(',')+' nodes='+d.querySelectorAll('[data-node]').length);
  const noUi=A.tree.NODES.flatMap(n=>n.ui).filter(u=>!A.tree.UI_SEL[u]); log((noUi.length?'ERROR ui sans sélecteur ':'ui map ok ')+noUi.join(','));
  log('loaded knobs='+d.querySelectorAll('.knob').length+' sliders='+d.querySelectorAll('[role=slider]').length);
  await wait(1500);
  log('playing='+A.seq.playing+' chord='+d.getElementById('chordName').textContent);
  d.getElementById('dice').click(); await wait(300);
  log('preset='+d.getElementById('preset').value);
  d.getElementById('rec').click(); await wait(1200*S+800);
  log('rec='+d.getElementById('rec').textContent);
  d.getElementById('rec').click(); await wait(300);
  log('afterRec='+d.getElementById('rec').textContent+' toast='+d.getElementById('toast').textContent);
  d.getElementById('vizMode').click(); d.querySelector('[data-mode=sculpt]').click(); await wait(200);
  log('sculpt='+d.body.classList.contains('mode-sculpt')+' viz='+d.getElementById('vizMode').textContent);
  w.dispatchEvent(new w.KeyboardEvent('keydown',{key:'z',metaKey:true})); d.dispatchEvent(new w.KeyboardEvent('keydown',{key:'z',metaKey:true}));
  await wait(200); log('undo toast='+d.getElementById('toast').textContent);
  // Jardin sonore (G6.4): free mode = the whole app; a round trip through the path leaves it intact
  const ok=(c,m)=>log((c?'ok ':'ERROR fail ')+m);
  ok(!d.body.classList.contains('game') && !d.querySelector('.is-locked') && d.getElementById('lcdTask').hidden && d.getElementById('welcomeDlg').hidden, 'mode libre : rien de verrouillé, pas de jeu à l\'écran');
  const evo=A.seq.evolve, lfo=A.seq.runLfos; A.seq.evolve=A.seq.runLfos=()=>{}; // the Dérive and the Mouvements lents move knobs on their own: off while comparing
  for(const [k,v] of Object.entries(A.seq.homes)) if(JSON.stringify(A.store.get(k))!==JSON.stringify(v)) A.store.set(k,v,'game'); // (back to the player's values: what a round trip keeps)
  await wait(150); // (the macro knobs follow: perform.js syncs them 60 ms later)
  const before=JSON.stringify(A.store.snapshot()), ctrls=d.querySelectorAll('[data-key]').length;
  A.game.setMode('path'); await wait(100);
  ok(d.body.classList.contains('game') && d.querySelectorAll('.is-locked').length>20 && !A.store.get('pad.on'), 'parcours : outil réduit à la graine');
  A.game.setMode('free'); await wait(100);
  const same=(()=>{ const b=JSON.parse(before), a=A.store.snapshot(); const bad=Object.keys(a).filter(k=>typeof a[k]==='number'?Math.abs(a[k]-b[k])>1e-6:JSON.stringify(a[k])!==JSON.stringify(b[k])); if(bad.length) log('diff '+bad.map(k=>k+' '+JSON.stringify(b[k])+'→'+JSON.stringify(a[k])).join(', ')); return !bad.length; })(); // (exact: the drift is off)
  ok(!d.querySelector('.is-locked') && same && d.querySelectorAll('[data-key]').length===ctrls, 'retour au mode libre : son et interface intacts');
  A.seq.evolve=evo; A.seq.runLfos=lfo;
  ok(/Parcours/.test(d.getElementById('helpDlg').textContent), 'aide : section Parcours');
  log('DONE');
  }catch(e){log('EXC '+e.stack)}
});
</script></body></html>
