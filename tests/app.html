<!doctype html><html><head><meta charset="utf-8"></head><body>
<script>
const TAG='app'; const S=+(new URLSearchParams(location.search).get('s')||0.4);
const log=(m)=>fetch('/__log?'+encodeURIComponent(TAG+'|'+m)).catch(()=>{});
const wait=(ms)=>new Promise(r=>setTimeout(r,ms));
</script>
<iframe id="f" src="../index.html?autoplay=1&view=expert" style="width:1300px;height:900px"></iframe>
<script>
// Drives the real app (full DOM) through its buttons and reports errors.
const f=document.getElementById('f');
f.addEventListener('load', async ()=>{
  try{
  const w=f.contentWindow, d=f.contentDocument, A=w.AMB;
  w.addEventListener('error',e=>log('ERROR '+e.message+' @'+e.filename+':'+e.lineno+' '+(e.error&&e.error.stack||'').slice(0,300)));
  log('loaded knobs='+d.querySelectorAll('.knob').length+' sliders='+d.querySelectorAll('[role=slider]').length);
  await wait(1500);
  log('playing='+A.seq.playing+' chord='+d.getElementById('chordName').textContent);
  d.getElementById('dice').click(); await wait(300);
  log('preset='+d.getElementById('preset').value);
  d.getElementById('rec').click(); await wait(1200*S+800);
  log('rec='+d.getElementById('rec').textContent);
  d.getElementById('rec').click(); await wait(300);
  log('afterRec='+d.getElementById('rec').textContent+' toast='+d.getElementById('toast').textContent);
  d.getElementById('vizMode').click(); d.querySelector('[data-mode=listen]').click(); await wait(200);
  log('simple='+d.body.classList.contains('simple')+' viz='+d.getElementById('vizMode').textContent);
  w.dispatchEvent(new w.KeyboardEvent('keydown',{key:'z',metaKey:true})); d.dispatchEvent(new w.KeyboardEvent('keydown',{key:'z',metaKey:true}));
  await wait(200); log('undo toast='+d.getElementById('toast').textContent);
  log('DONE');
  }catch(e){log('EXC '+e.stack)}
});
</script></body></html>
