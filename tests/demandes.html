<!doctype html><html><head><meta charset="utf-8"></head><body style="margin:0">
<!-- S5.5 live asks (js/demands.js), on a simulated clock (the sequencer's grid is driven by hand, no audio): an ask comes
     during the playback with its countdown in the Objectifs widget (S11.1); judged PARFAIT / BIEN / RATÉ on the placement; the combo ×n; an
     interface challenge asked in the music makes its node « prêt » (4 misses: ready anyway); never during a Réponse, nor
     while a node waits, never on a closed control; nothing in free mode. -->
<script src="lib.js"></script>
<script>localStorage.removeItem('ambient.game.demtest');</script>
<iframe id="f" src="../index.html?gamekey=ambient.game.demtest" style="width:1280px;height:800px;border:0"></iframe>
<script>
const f = document.getElementById('f');
f.addEventListener('load', async () => {
  if (f.dataset.ran) return; f.dataset.ran = 1;
  try {
    const w = f.contentWindow, d = f.contentDocument, A = w.AMB, G = A.game, D = A.demands, K = A.contracts, Pz = A.puzzles, St = A.store, T = A.tree;
    w.addEventListener('error', (e) => log('ERROR ' + e.message + ' @' + e.filename + ':' + e.lineno));
    G.setMode('path'); A.garden.welcome(false);
    const SD = 0.25, BEAT = 4 * SD, BAR = 16 * SD;
    let now = 0, step = 0; D.now = () => now; D.at = () => now;
    A.seq.playing = true; // the grid is ours: no timer, no audio
    const fxs = []; const fx0 = A.garden.fx; A.garden.fx = function (k, o) { fxs.push([k, o || {}]); return fx0.apply(this, arguments); };
    const own = (ids) => { G.s.nodes = ['racine', 'k.piano', ...ids]; G.s.ready = []; G.s.contracts = []; G.s.skipped = []; G.s.active = []; T.applyLocks(); };
    const bar = () => { step = Math.ceil(step / 16) * 16; now = step * SD; const r = D.onStep(step, now, SD); step++; return r; }; // a bar line
    const fresh = () => { D.cur = null; D.wait = 0; D.fresh = null; D.last = null; Pz.cur = null; };
    const launch = (id) => { fresh(); step = Math.ceil(step / 16) * 16; now = step * SD; D.launch({ d: D.byId[id], text: D.byId[id].title }, step, now, SD); step++; return D.cur; };
    const lcd = () => [d.querySelector('#goals .gw-dtxt').textContent, d.querySelector('#goals .gw-dn').textContent, !d.querySelector('#goals .gw-demand').hidden && !d.getElementById('goals').hidden];

    // --- an ask comes during the playback, with its countdown in musical time
    own(['m.bells', 'h.pad']); fresh();
    let k = 0; while (!D.cur && k < 3) { bar(); k++; }
    const c = D.cur;
    ok(c && D.reach(c.d, G) && c.tT - now === 2 * BAR, 'pendant la lecture, une demande est proposée sur une barre de mesure : « ' + (c && c.text) + ' », le 1 dans 2 mesures');
    A.garden.renderContracts(); let L = lcd();
    ok(L[2] && /^♪ /.test(L[0]) && L[1] === 'dans 2 mesures', 'S11.1 widget, en grand : « ' + L[0] + ' » · ' + L[1]);
    now = c.tT - 1.5 * BEAT; ok(D.view().n === '2', 'compte à rebours sur les temps : ' + D.view().n);
    now = c.tT - 0.1; ok(D.view().n === 'MAINTENANT !' && D.view().hot, 'sur le 1 : MAINTENANT !');
    D.cancel(); ok(!D.cur, '■ Stop (annulation) : la demande s\'en va');

    // --- judged on the placement: PARFAIT (tolerance of the Réponse), BIEN (within a beat), RATÉ (within two)
    const tol = Pz.tol(SD), st = D.st(G); st.combo = 0;
    const judge = (id, dt, gesture) => { launch(id); now = D.cur.tT + dt; return gesture(); };
    const chordIn = (deg) => () => { D.input('chord', [{ time: now, deg, forced: true }], now); return D.cur ? null : 'judged'; }; // (the bus 'chord' handler, without audio)
    let res = []; A.bus.on('game:demand', (e) => { if (e.phase === 'end') res.push(e.res); });
    res = []; judge('accord', tol * 0.5, chordIn(2)); const r1 = res.pop();
    ok(r1 && r1.grade === 'parfait', 'accord forcé pile sur le 1 (+' + (tol * 0.5).toFixed(2) + ' s) : PARFAIT');
    judge('iv', -0.6 * BEAT, chordIn(3)); const r2 = res.pop();
    ok(r2 && r2.grade === 'bien' && r2.combo === 2, 'accord IV un peu tôt (−0,6 temps) : BIEN, combo ×' + (r2 && r2.combo));
    judge('accord', 1.5 * BEAT, chordIn(0)); const r3 = res.pop();
    ok(r3 && r3.grade === 'rate' && r3.combo === 0 && /tard/.test(r3.why), 'un temps et demi après : RATÉ (' + (r3 && r3.why) + '), le combo retombe');
    launch('iv'); now = D.cur.tT - 0.2; chordIn(0)(); ok(D.cur && !res.length, 'un autre accord que le IV : rien n\'est jugé');
    now = D.cur.tT - 3 * BEAT; chordIn(3)(); ok(D.cur, 'trois temps trop tôt : pas jugé (« Pas encore : sur le 1 ! »)');
    now = D.cur.tT + 2.5 * BEAT; D.check(); const r4 = res.pop();
    ok(!D.cur && r4 === null && st.combo === 0, 'ignorée : la demande passe, rien n\'est perdu');
    // 'notes': 3 notes on the beats from the 1; 'by': before the end of the bar
    const note = (t) => D.input('note', [{ midi: 60, played: t }], t); // (the bus 'live' handler)
    launch('notes'); const t1 = D.cur.tT; [0, 1, 2].forEach((i) => note(t1 + i * BEAT + 0.03)); const r5 = res.pop();
    ok(r5 && r5.grade === 'parfait', '3 notes sur les temps : PARFAIT');
    launch('notes'); const t2 = D.cur.tT; [0, 1, 2].forEach((i) => note(t2 + i * BEAT + (i === 1 ? 0.45 : 0))); const r6 = res.pop();
    ok(r6 && r6.grade === 'bien', 'une des 3 notes à côté du temps (+0,45 s) : BIEN');
    own(['m.bells', 'h.pad', 't.son', 't.macros']); St.set('macro.light', 0.3, 'preset');
    launch('lumiere'); const t3 = D.cur.tT; now = t3 - 1.6 * BAR; St.set('macro.light', 0.9, 'user'); ok(D.cur, 'Lumière montée avant sa mesure : pas encore jugée');
    now = t3 - 0.4 * BAR; St.set('macro.light', 0.95, 'user'); const r7 = res.pop();
    ok(r7 && r7.grade === 'parfait', 'Lumière montée dans la mesure, avant sa fin : PARFAIT');

    // --- the combo ×n and its juice
    st.combo = 0; fxs.length = 0;
    for (let i = 0; i < 3; i++) judge('accord', 0, chordIn(1));
    const last = fxs.filter(([kk]) => kk === 'parfait').pop();
    ok(st.combo === 3 && last && last[1].n === 3 && A.garden.FX.parfait.pop(last[1]) === 'PARFAIT ×3' && /×3/.test(A.garden.FX.parfait.say(last[1])), '3 PARFAIT d\'affilée : combo ×3, « ' + A.garden.FX.parfait.pop(last[1]) + ' » (juice garden.fx)');
    ok(st.best >= 3 && JSON.parse(localStorage.getItem('ambient.game.demtest')).dem.combo === 3, 'combo et record sauvegardés');

    // --- an interface challenge, asked in the music, makes its node « prêt » (the player opens it)
    own(['m.bells', 'h.pad']); G.s.nodes = G.s.nodes.filter((x) => x !== 'k.piano'); G.s.contracts = ['m.ecoute']; G.s.active = ['k.couleur']; // (S11.1: the Piano's last objective)
    G.s.prog = { 'k.couleur': { n: 0 } };
    fresh(); bar(); ok(D.cur && D.cur.gate === 'k.couleur', 'défi d\'interface converti : « ' + K.byId['k.couleur'].title + ' » arrive comme demande');
    now = D.cur.tT + 0.05; fxs.length = 0; St.set('drone.tone', 0.7, 'user'); await wait(0);
    ok(G.isReady('k.piano') && !G.has('k.piano') && G.s.contracts.includes('k.couleur') && fxs.some(([kk, o]) => kk === 'parfait' && /Piano/.test(o.node || '')) && !fxs.some(([kk]) => kk === 'defi'),
      'lumière du drone sur le 1 : Piano « prêt » (pas ouvert), fêté par PARFAIT (pas de 2e fête)');
    ok(!D.cur && !bar() && !D.cur, 'un nœud attend « ✦ Ouvrir » : pas de demande');
    // 4 misses: ready anyway
    own(['m.bells', 'h.pad', 't.son']); G.s.contracts = ['t.deux']; G.s.active = ['k.timbre']; G.s.prog = { 'k.timbre': { n: 0 } }; D.st(G).miss = {};
    const waves = St.spec('drone.wave').options; fxs.length = 0;
    for (let i = 0; i < D.MISSES; i++) { fresh(); bar(); now = D.cur.tT + 1.5 * BEAT; St.set('drone.wave', waves[i % 2 ? 1 : 2], 'user'); }
    await wait(0);
    ok(G.isReady('t.journal') && fxs.some(([kk]) => kk === 'consolation'), D.MISSES + ' ratés : Journal prêt quand même (jamais d\'impasse)');

    // --- never during a Réponse (each waits for the other)
    own(['m.bells', 'h.pad']); fresh(); D.wait = 0;
    Pz.cur = { midis: [60], steps: [0], len: 1, row: [], from: 1e9, until: 1e9, t0: 0, sd: SD };
    for (let i = 0; i < 4; i++) bar();
    ok(!D.cur, 'Réponse en attente : aucune demande');
    Pz.cur = null; launch('accord'); Pz.wait = 0; St.set('bells.on', true, 'preset');
    const s0 = Math.ceil(step / 16) * 16; ok(!Pz.onStep(s0, s0 * SD, SD) && !Pz.cur, 'une demande en cours : la phrase de la Réponse attend');
    D.cancel();

    // --- never on a closed control: whatever the state, the ask only names open nodes and controls
    own(['m.bells']); St.set('bells.on', false, 'preset');
    const seen = new Set(); let bad = [];
    for (let i = 0; i < 300; i++) { D.last = null; const p = D.pick(G); if (!p) continue; seen.add(p.d.id); if (!p.d.need.every((n) => G.has(n)) || (p.d.ask.param && !p.d.ask.param.includes('*') && !T.paramUnlocked(p.d.ask.param))) bad.push(p.d.id); }
    ok(!bad.length && seen.size && [...seen].every((id) => ['notes', 'melodie'].includes(id)), 'Graine + Mélodie auto : seulement ' + [...seen].join(', ') + ' (ni Pad, ni basse, ni grands réglages) ' + bad.join(','));
    own(['m.bells', 'h.pad']); fresh(); D.fresh = 'h.pad'; const pi = D.pick(G);
    ok(pi && /^Nouveau/.test(pi.text) && pi.d.need.includes('h.pad'), 'juste après une ouverture, la demande présente la nouveauté : « ' + (pi && pi.text) + ' »');

    // --- S6.7 ONE table of windows (puzzles.TOL), absolute: tight at the MIDI keyboard, a child's at the fingers
    own(['m.bells', 'h.pad']); st.combo = 0; res = [];
    Pz.midi = false; judge('accord', 0.2, chordIn(2)); const f1 = res.pop();
    Pz.midi = true; judge('accord', 0.04, chordIn(2)); const m1 = res.pop(); judge('accord', 0.1, chordIn(2)); const m2 = res.pop(); judge('accord', 0.3, chordIn(2)); const m3 = res.pop();
    ok(f1.grade === 'parfait' && m1.grade === 'parfait' && m2.grade === 'bien' && m3.grade === 'rate',
      `au doigt +200 ms : PARFAIT ; au clavier MIDI +40 ms PARFAIT, +100 ms ${m2.grade.toUpperCase()}, +300 ms ${m3.grade.toUpperCase()} (fenêtres ${JSON.stringify(Pz.TOL)})`);
    const notesAt = (dt, raw) => { launch('notes'); const t = D.cur.tT; [0, 1, 2].forEach((i) => D.input('note', [{ midi: 60, raw, played: t + i * BEAT + dt }], t + i * BEAT + dt)); return res.pop(); };
    Pz.midi = false; const n1 = notesAt(0.1, 0.8), n2 = notesAt(0.1, null), n3 = notesAt(0.04, 0.8);
    ok(n1.grade === 'bien' && n2.grade === 'parfait' && n3.grade === 'parfait', '3 notes à +100 ms : BIEN au clavier MIDI (sa vélocité), PARFAIT aux pastilles ; à +40 ms au MIDI : PARFAIT');
    Pz.midi = true; launch('accord'); ok(Math.abs(D.tolOf() - Pz.TOL.midi.parfait) < 1e-9, '« MAINTENANT ! » s\'allume sur la fenêtre PARFAIT de la main (MIDI : 60 ms)'); D.cancel(); Pz.midi = false;

    // --- S6.7 never stuck on « ♪ bientôt »: the widget out of view, a challenge whose controls are not there, an ask left alone
    const gateOn = (id) => { G.s.contracts = ['k.xy', 'm.notes']; G.s.active = [id]; G.s.prog = { [id]: { n: 0 } }; };
    own(['m.bells', 'h.pad']); gateOn('k.couleur'); fresh(); const seen0 = D.seen; D.seen = () => false;
    let nb = 0; while (!D.cur && nb < 30) { bar(); nb++; }
    D.seen = seen0;
    ok(D.cur && D.cur.gate === 'k.couleur' && nb > 4 && nb <= D.STALL + 1, `widget Objectifs hors de vue : la demande attend, puis vient quand même après ${nb} mesures (≤ ${D.STALL + 1})`);
    D.cancel();
    own(['m.bells', 'h.pad']); gateOn('k.timbre'); fresh(); nb = 0; while (G.s.active[0] === 'k.timbre' && !D.cur && nb < 30) { bar(); nb++; }
    ok(G.s.active[0] !== 'k.timbre' && G.s.skipped.includes('k.timbre') && nb === D.STALL + 1, `défi demandé dont la commande n'est pas là (Timbre du drone) : remplacé (remis en fin de file) après ${nb} mesures, au suivant : ${G.s.active[0] || '—'}`);
    D.cancel();
    own(['m.bells', 'h.pad']); G.s.skipped = []; gateOn('k.couleur'); D.st(G).idle = {}; let ign = 0;
    while (ign < 6 && !G.s.skipped.includes('k.couleur')) { fresh(); bar(); if (!(D.cur && D.cur.gate === 'k.couleur')) break; now = D.cur.end + 0.01; D.check(); ign++; }
    ok(G.s.skipped.includes('k.couleur') && ign === D.IDLE, `demande laissée ${ign} fois sans geste : remplacée (elle reviendra), actif : ${G.s.active[0] || '—'}`);
    G.s.skipped = [];

    // --- free mode: nothing
    G.setMode('free'); fresh(); fxs.length = 0;
    for (let i = 0; i < 4; i++) bar();
    D.input('chord', [{ deg: 0, forced: true }], now);
    A.garden.renderContracts();
    ok(!D.cur && !fxs.length && (d.getElementById('goals').hidden || d.querySelector('#goals .gw-demand').hidden), 'mode libre : aucune demande, aucun effet, pas de ligne de demande');
    A.seq.playing = false;
    done();
  } catch (e) { fail(e); }
});
</script></body></html>
