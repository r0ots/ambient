<!doctype html><html><head><meta charset="utf-8"></head><body>
<!-- Dark landscapes (v1.14 sound prototype, + Arpège 1983 in S6.1): each one is in the menu, loads, and makes sound (no silence, no NaN, no master clipping),
     with its own bricks (timbres, Métal kit, Montée shape); a note played on the melody voice (keys, pads, MIDI) sounds too. -->
<script src="lib.js"></script>
<div id="scenes"></div><div id="journal"></div><div id="layers"></div><div id="seqrow"></div><div id="macros"></div><div id="globals"></div><button data-mode="sculpt"></button><button data-mode="compose"></button>
<button id="play"></button><button id="bigPlay"></button><div id="chordName"></div><div id="hudInfo"></div><select id="preset"></select><button id="dice"></button><button id="save"></button><button id="rec"></button><select id="recFmt"><option value="wav">w</option></select><select id="recDur"><option value="0">0</option></select><button id="share"></button><div id="toast"></div><select id="sleep"></select><span id="sleepLeft"></span><canvas id="viz" style="width:400px;height:200px"></canvas>
<script src="../js/theory.js"></script><script src="../js/params.js"></script><script src="../js/engine.js"></script><script src="../js/layers.js"></script><script src="../js/sequencer.js"></script><script src="../js/presets.js"></script><script src="../js/generator.js"></script><script src="../js/visual.js"></script><script src="../js/scenes.js"></script><script src="../js/journal.js"></script><script src="../js/pianoroll.js"></script><script src="../js/pulses.js"></script><script src="../js/bass.js"></script><script src="../js/chords.js"></script><script src="../js/midi.js"></script><script src="../js/automation.js"></script><script src="../js/song.js"></script><script src="../js/widgets.js"></script><script src="../js/perform.js"></script><script src="../js/rec.js"></script><script src="../js/ui.js"></script><script src="../js/play.js"></script>
<script>
async function level(secs) {
  const an = AMB.engine.analyser, buf = new Float32Array(an.fftSize);
  let peak = 0, sum = 0, n = 0, nan = false; const t0 = performance.now();
  while (performance.now() - t0 < secs * 1000) { an.getFloatTimeDomainData(buf); for (const v of buf) { if (!Number.isFinite(v)) nan = true; peak = Math.max(peak, Math.abs(v)); sum += v * v; n++; } await wait(40); }
  return { rms: Math.sqrt(sum / n), peak, nan };
}
window.addEventListener('load', async () => {
  try {
    const st = AMB.store, DARK = ['Pluie sur la ville', 'Ruines', 'Menace', 'Arpège 1983'];
    const menu = [...document.querySelectorAll('#preset option')].map((o) => o.value);
    ok(DARK.every((p) => AMB.PRESETS[p] && menu.includes('f:' + p)), 'les 4 paysages sombres sont dans « Paysages prêts »');
    const ev = { note: 0, perc: 0, arp: [] }; AMB.bus.on('note', (e) => { ev.note++; if (e.layer === 'seq') ev.arp.push(e.time); }); AMB.bus.on('perc', () => ev.perc++);
    await AMB.ui.play();
    for (const p of DARK) {
      AMB.ui.applyPatch(AMB.PRESETS[p]);
      // every value of the landscape is accepted by the schema (an unknown option would be silently refused)
      const refused = Object.entries(AMB.PRESETS[p]).filter(([k, v]) => st.get(k) !== v && !(typeof v === 'number' && Math.abs(st.get(k) - v) < 1e-9));
      ok(!refused.length, p + ' : tous les réglages acceptés ' + refused.map(([k]) => k).join(', '));
      ev.note = ev.perc = 0;
      await wait(2500 * S);
      const m = await level(Math.max(1, 2500 * S / 1000));
      ok(!m.nan && m.rms > 0.01 && m.peak < 0.999, `${p} : du son (rms ${m.rms.toFixed(3)}, crête ${m.peak.toFixed(3)}, notes ${ev.note}, coups ${ev.perc})`);
      if (p === 'Arpège 1983') { // the arpeggio never stops: one note every sixteenth (audio clock), filter opened by a Montée
        const t = ev.arp.slice(1), gaps = t.slice(1).map((v, i) => v - t[i]).sort((a, b) => a - b), six = 60 / st.get('global.tempo') / 4;
        const med = gaps[gaps.length >> 1] || 0, maxGap = gaps[gaps.length - 1] || 0;
        ok(gaps.length >= 4 && Math.abs(med - six) < 0.15 * six && maxGap < 1.6 * six && st.get('seq.mode') === 'Arpège' && st.get('mod.l1target') === 'seq.tone' && st.get('mod.l1shape') === 'Montée' && st.get('bass.on'),
          `Arpège 1983 : l'arpège tourne en doubles croches sans trou (${t.length} notes, écart médian ${(med * 1000).toFixed(0)} ms pour ${(six * 1000).toFixed(0)}, max ${(maxGap * 1000).toFixed(0)}), filtre qui s'ouvre (Montée), basse pulsée`);
      }
    }
    // the bricks are really there: Métal kit hits, Montée shape on both slow movements, melody voice Lame plays a held note
    AMB.ui.applyPatch(AMB.PRESETS.Menace);
    ok(st.get('perc.kit') === 'Métal' && st.get('mod.l1shape') === 'Montée' && st.get('bass.wave') === 'Saturée' && st.get('drone.wave') === 'Abîmé', 'Menace : kit Métal, basse Saturée, drone Abîmé, Mouvement en Montée');
    const h = AMB.seq.playMidi(62, 0.8, 0.7, true); const h2 = AMB.seq.playMidi(65, 0.8, 0.7, true);
    ok(h && typeof h.release === 'function' && h2, 'Lame : une note jouée (clavier, pastilles, MIDI) tient et glisse, puis se relâche');
    AMB.seq.endLive(h); AMB.seq.endLive(h2);
    for (const k of [0, 1, 2, 3]) AMB.layers.perc.hit(k, AMB.engine.ctx.currentTime + 0.05, 0.8);
    AMB.layers.bass.note(36, AMB.engine.ctx.currentTime + 0.05, 0.3);
    st.set('pad.wave', 'Cuivres', 'user'); AMB.layers.pad.playChord([50, 57, 62], AMB.engine.ctx.currentTime + 0.05, 1);
    await wait(300);
    const m = await level(0.5);
    ok(!m.nan && m.peak < 0.999, 'coups Métal, basse Saturée et accord Cuivres joués à la main : pas de NaN ni de saturation (crête ' + m.peak.toFixed(3) + ')');
    { // S11.7: a new Pad timbre is heard at once — the held chord crossfades to it (not only from the next chord)
      const P = AMB.layers.pad, t0 = AMB.engine.ctx.currentTime; P.playChord([50, 57, 62], t0 + 0.02, 6); await wait(200);
      const live = () => [...P.active_].filter((r) => !r.gone && r.end > AMB.engine.ctx.currentTime).length, before = live();
      st.set('pad.wave', 'Verre', 'user'); await wait(50);
      ok(before >= 3 && live() >= 3 && [...P.active_].filter((r) => r.gone).length >= before, 'Pad : changer le timbre fait basculer l\'accord tenu tout de suite (' + before + ' voix → ' + live() + ' neuves)'); }
    AMB.ui.stop();
    done();
  } catch (e) { fail(e); }
});
</script></body></html>
