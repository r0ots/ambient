<!doctype html><html><head><meta charset="utf-8"></head><body>
<script src="lib.js"></script>
<div id="scenes"></div><div id="journal"></div><div id="layers"></div><div id="seqrow"></div><div id="macros"></div><div id="globals"></div><button data-mode="listen"></button><button data-mode="sculpt"></button><button data-mode="compose"></button>
<button id="play"></button><button id="bigPlay"></button><div id="chordName"></div><div id="hudInfo"></div><select id="preset"></select><button id="dice"></button><button id="save"></button><button id="rec"></button><select id="recFmt"><option value="wav">w</option></select><select id="recDur"><option value="0">0</option></select><button id="share"></button><div id="toast"></div><select id="sleep"></select><span id="sleepLeft"></span><canvas id="viz" style="width:400px;height:200px"></canvas>
<script src="../js/theory.js"></script><script src="../js/params.js"></script><script src="../js/engine.js"></script><script src="../js/layers.js"></script><script src="../js/sequencer.js"></script><script src="../js/presets.js"></script><script src="../js/generator.js"></script><script src="../js/visual.js"></script><script src="../js/scenes.js"></script><script src="../js/journal.js"></script><script src="../js/pianoroll.js"></script><script src="../js/pulses.js"></script><script src="../js/bass.js"></script><script src="../js/chords.js"></script><script src="../js/midi.js"></script><script src="../js/automation.js"></script><script src="../js/song.js"></script><script src="../js/widgets.js"></script><script src="../js/perform.js"></script><script src="../js/rec.js"></script><script src="../js/ui.js"></script><script src="../js/play.js"></script>
<script>
const params=new URLSearchParams(location.search);
async function measure(label, secs){
  const an=AMB.engine.analyser, buf=new Float32Array(an.fftSize);
  let peak=0,sum=0,n=0; const t0=performance.now();
  while(performance.now()-t0<secs*1000){ an.getFloatTimeDomainData(buf); for(const v of buf){peak=Math.max(peak,Math.abs(v));sum+=v*v;n++;} await new Promise(r=>setTimeout(r,40*S)); }
  log(`${label} rms=${Math.sqrt(sum/n).toFixed(4)} peak=${peak.toFixed(3)} notes=${notes} t=${AMB.engine.ctx.currentTime.toFixed(1)}`);
}
let notes=0;
window.addEventListener('load', async ()=>{
  try{
  const st=AMB.store, C=AMB.chords;
  const degs=[]; AMB.bus.on('chord',c=>degs.push(c.deg));
  log('slots='+document.querySelectorAll('.chord-slot').length+' chips='+document.querySelectorAll('.chord-chip').length+' first chip='+document.querySelector('.chord-chip').textContent);
  // select slot 0 and click chips VI, IV, V
  document.querySelectorAll('.chord-slot')[0].click();
  const chips=document.querySelectorAll('.chord-chip');
  chips[0].click(); chips[5].click(); chips[3].click(); chips[4].click();
  log('custom='+st.get('pad.custom')+' prog='+st.get('pad.prog'));
  st.set('global.tempo',140); st.set('pad.length',1);
  await AMB.ui.play(); await new Promise(r=>setTimeout(r,6000));
  log('played degs='+degs.join(',')+' nowSlot='+[...document.querySelectorAll('.chord-slot')].findIndex(b=>b.classList.contains('now')));
  document.querySelector('[data-c=random]').click(); log('suggested='+st.get('pad.custom'));
  // per-slot duration: slot 0 = 2 bars
  st.set('pad.custom','1 5'); AMB.chords.sel=0; AMB.chords.setBars(2); log('with dur='+st.get('pad.custom')+' bars0='+AMB.seq.chordBars(0)+' bars1='+AMB.seq.chordBars(1));
  log('mode chips='+document.querySelectorAll('.chord-modes .btn').length);

  // --- S6.7: chord names in the key and scale, progressions whose chords follow the scale
  const T=AMB.theory, qa=(s)=>[...document.querySelectorAll(s)], txt=(e)=>e.textContent.replace(/\s+/g,' ').trim();
  { let bad=[]; for (const sc of Object.keys(T.SCALES).filter(n=>T.SCALES[n].length===7)) for (const m of Object.keys(T.PROGS)) { const d=T.progDegrees(m,T.SCALES[sc]); if (!d.length || d.some(x=>T.triad(x,T.SCALES[sc])==='dim')) bad.push(sc+'/'+m); }
    ok(!bad.length, 'aucun accord diminué (♭5) dans les progressions toutes faites, sur les 6 gammes à 7 notes '+bad.join(' ')); }
  st.set('global.key','A'); st.set('global.scale','Éolien (mineur)');
  let modes=qa('.chord-modes .btn').map(txt);
  ok(modes.includes('Épique Am – F – C – G') && modes.includes('Montée Am – C – Dm – Em') && modes.includes('Pop Am – Em – F – Dm') && !modes.some(t=>/I–ii|i–VI|I–IV/.test(t)), 'boutons en la mineur, noms d\'accords : '+modes.join(' | '));
  st.set('global.key','C'); st.set('global.scale','Ionien (majeur)'); modes=qa('.chord-modes .btn').map(txt);
  ok(modes.includes('Pop C – G – Am – F') && modes.includes('Épique Am – F – C – G') && modes.includes('Montée C – Dm – Em – F'), 'en do majeur, « Épique » garde ses accords (vi–IV–I–V), pas de B° : '+modes.join(' | '));
  st.set('global.key','A'); st.set('global.scale','Éolien (mineur)');
  st.set('pad.prog','i–VI–III–VII');
  let cells=qa('.chord-slot:not(.empty)').map(b=>b.querySelector('b').textContent+'/'+b.querySelector('span').textContent);
  ok(cells.join()==='Am7/i,Fmaj7/VI,Cmaj7/III,G7/VII' && !document.querySelector('.chords-auto'), 'cases : la progression jouée, nom en grand, degré en petit ('+cells.join(' ')+')');
  ok(qa('.chord-chip b')[1].textContent==='ii°', 'palette : degré écrit selon la gamme (ii°)');
  C.sel=1; qa('.chord-chip')[6].click();
  ok(st.get('pad.prog')==='Perso' && st.get('pad.custom')==='1 7 3 7', 'éditer une case d\'une progression toute faite : « Mes accords » part d\'elle ('+st.get('pad.custom')+')');

  // --- S6.7: the progression fits its song section
  const SG=AMB.song, head=()=>document.querySelector('.chords-panel .chords-mode').textContent;
  SG.replace({sections:[]}); st.set('pad.prog','i–VI–III–VII','user'); st.set('pad.length',4,'user');
  ok(AMB.seq.chordDurs().join()==='4,4,4,4', 'sans section : 4 mes. par accord, comme avant');
  document.querySelector('[data-s=add]').click();
  ok(SG.sel().bars===8 && AMB.seq.chordDurs().join()==='2,2,2,2' && /tenir dans « Intro » \(8 mes\.\)/.test(head()) && qa('.chord-slot em').slice(0,4).every(e=>e.textContent==='2 mes.'), 'section de 8 mes., 4 accords de 4 mes. : 2 mes. chacun, les 4 sonnent ; le panneau le dit (« '+head()+' »)');
  const bs=document.querySelector('.song-bars'); bs.value='2'; bs.dispatchEvent(new Event('change'));
  ok(/n'en joue que 2/.test(head()) && qa('.chord-slot.unheard').length===2, 'section de 2 mes. : 1 mes. par accord, les 2 derniers grisés (« '+head()+' »)');
  bs.value='4'; bs.dispatchEvent(new Event('change')); st.set('pad.length',2,'user');
  ok(AMB.seq.chordDurs().join()==='1,1,1,1' && SG.sections[0].snap['pad.length']===2, 'section de 4 mes. : 1 mes. par accord');
  const heard=[]; const off=AMB.bus.on('chord',c=>heard.push(c.deg));
  SG.start(); const ctx=AMB.engine.ctx, t1=ctx.currentTime+9;
  while (ctx.currentTime<t1 && heard.length<5) await new Promise(r=>setTimeout(r,50));
  ok(heard.slice(0,4).join()==='0,5,2,6', 'le morceau joue i, VI, III, VII dans la section de 4 mes. ('+heard.join()+')');
  SG.stop(); SG.replace({sections:[]});
  log('DONE');
  }catch(e){log('EXC '+e.stack)}
});
</script></body></html>
