<!doctype html><html><head><meta charset="utf-8"></head><body>
<script src="lib.js"></script>
<script>localStorage.removeItem('ambient.game.sectest');
</script>
<iframe id="f" src="../index.html?gamekey=ambient.game.sectest" style="width:1300px;height:900px"></iframe>
<script>
const ok=(c,m)=>log((c?'ok ':'ERROR fail ')+m);
const f=document.getElementById('f');
f.addEventListener('load', async ()=>{
  try{
  const w=f.contentWindow, d=f.contentDocument, A=w.AMB, G=A.game, S=A.secrets;
  w.addEventListener('error',e=>log('ERROR '+e.message+' @'+e.filename+':'+e.lineno));
  if(!A.engine.ctx) A.engine.ctx={currentTime:0,state:'suspended'};
  let clock=1e6; S.now=()=>clock;
  const ALL=A.tree.NODES.map(n=>n.id);
  const fresh=(nodes=ALL)=>{ G.setMode('path'); G.reset(); for(const n of nodes) if(!G.has(n)) G.s.nodes.push(n); S.reset(); S.state(); A.seq.playing=false; A.store.set('global.tempo',60,'game'); S.toggles().forEach(k=>A.store.set(k,true,'game')); clock+=1e5; };
  let T0=1000;
  const live=(m,t,v=0.85,raw=null)=>A.bus.emit('live',{midi:m,time:t,vel:v,raw});
  const midiRun=(arr,raws,gap=2.5)=>{ T0+=100; arr.forEach((m,i)=>live(m,T0+i*gap,0.25+0.75*raws[i],raws[i])); }; // as js/play.js sends them
  const run=(arr,gap=2.5,vel=0.85)=>{ T0+=100; arr.forEach((m,i)=>live(m,T0+i*gap,Array.isArray(vel)?vel[i]:vel)); };
  const forced=(deg)=>{ A.bus.emit('chord',{time:0,deg,midis:[],forced:true}); };
  const has=(id)=>S.has(id);
  const st=(id)=>S.byId[id];
  ok(S.DEFS.length===9 && !S.byId.gele && new Set(S.DEFS.map(x=>x.id)).size===S.DEFS.length, 'secrets : '+S.DEFS.length+' définitions (plus de Cloche gelée), ids uniques');
  ok(S.DEFS.every(x=>A.tree.byId[x.node] && x.hint1 && x.hint2 && S.OPENS[x.id] && A.tree.byId[S.OPENS[x.id]] && S.OPENS[x.id]!==x.node), 'chaque secret : nœud lié valide, 2 indices, un nœud à ouvrir (table OPENS) distinct');
  ok(new Set(S.DEFS.map(x=>S.OPENS[x.id])).size===S.DEFS.length && S.OPENS.jazz==='h.prog' && S.OPENS.tons==='m.phrase', 'OPENS : un nœud par secret, II-V-I → Progression, par tons → Phrases');
  ok(S.DEFS.filter(x=>x.reward.gift).map(x=>x.reward.gift.opt).sort().join()==='Aube,Givre' && !S.setMirror && !S.setTheme && !S.mirrorOn, 'cadeaux : seulement les timbres Givre et Aube (ni thème LCD, ni clavier miroir)');

  // ---- free mode: nothing detected, nothing shown ----
  G.setMode('free'); S.reset();
  run([60,62,64,66,68]); run([60,61,62,63,64,65]); A.store.set('global.tempo',30,'user'); A.store.set('fx.shimmer',1,'user'); A.store.set('global.time','Flottant','user');
  ok(S.foundCount()===0 && !G.has('m.phrase') && !G.has('h.prog'), 'mode libre : aucune détection, aucun nœud ouvert, aucune récompense');
  ok(S.box && S.box.hidden, 'mode libre : panneau caché (aucun cadeau)');
  A.store.set('global.tempo',66,'game'); A.store.set('fx.shimmer',0.15,'game'); A.store.set('global.time','Pulsé','game');
  ok(!A.SCHEMA.bells.params.wave.options.includes('Givre') && !A.SCHEMA.pad.params.wave.options.includes('Aube'), 'sans cadeau : réglages classiques');

  // ---- par tons (5 notes, +2) ----
  fresh(); run([60,62,64,66]); ok(!has('tons'), 'tons : 4 notes ne suffisent pas');
  fresh(); run([60,62,64,66,67]); ok(!has('tons'), 'tons : geste proche (dernier pas +1) refusé');
  fresh(); run([60,62,64,66,68]); ok(has('tons'), 'tons : 5 notes par tons');
  const nn=G.s.nodes.length; ok(nn===ALL.length && !('shards' in G.s) && S.state().gifts.timbres.some(t=>t.opt==='Givre'), 'tons (tout l\'arbre déjà ouvert) : plus rien à ouvrir, timbre Givre');
  ok(A.SCHEMA.bells.params.wave.options.includes('Givre') && [...d.querySelectorAll('.ctl[data-key="bells.wave"] option')].some(o=>o.value==='Givre'), 'Givre ajouté au schéma et au sélecteur Mélodie');
  A.store.set('bells.wave','Givre','user'); ok(A.store.get('bells.wave')==='Givre', 'Givre sélectionnable');
  const f1=JSON.stringify(S.state().found); run([70,72,74,76,78]); ok(JSON.stringify(S.state().found)===f1, 'tons : une seule fois (pas de 2e récompense)');
  run([61,63,65,67,69]); ok(JSON.stringify(S.state().found)===f1, 'tons : toujours une seule fois, dans une autre tonalité');
  ok(A.lcdMsg.text==='✦ Par tons', 'découverte (arbre complet, rien à ouvrir) : LCD « '+A.lcdMsg.text+' »');
  ok(JSON.parse(localStorage.getItem('ambient.game.sectest')).secrets.found.tons && JSON.parse(localStorage.getItem('ambient.game.sectest')).secrets.gifts.timbres[0].opt==='Givre', 'récompense persistante (localStorage)');
  G.setMode('free'); ok(A.SCHEMA.bells.params.wave.options.includes('Givre') && S.box.hidden, 'cadeau trouvé : le timbre reste en mode libre (pas de panneau : rien à régler)');
  run([60,62,64,66,68]); ok(S.foundCount()===1, 'mode libre : toujours aucune détection');
  // an old save with the removed gifts (LCD theme, mirror keyboard): loads, ignored
  G.s.secrets.gifts.themes=['neon']; G.s.secrets.gifts.mirror=true; G.s.secrets.theme='neon'; G.s.secrets.mirrorOn=true; S.applyGifts(); ok(!d.documentElement.dataset.lcd && S.state().gifts.timbres.length===1, 'ancienne sauvegarde avec thème et miroir : ignorés');
  // reload of an old save: no secrets field at all
  delete G.s.secrets; G.setMode('path'); ok(S.foundCount()===0 && S.list().length===S.DEFS.length, 'ancienne sauvegarde sans champ secrets : OK');
  ok(!A.SCHEMA.bells.params.wave.options.includes('Givre'), 'cadeaux perdus après remise à zéro : liste classique rendue');

  // ---- arpège diminué ----
  fresh(); run([60,63,66,70]); ok(!has('dim'), 'dim : dernier pas +4 refusé');
  fresh(); run([60,63,66]); ok(!has('dim'), 'dim : 3 notes insuffisantes');
  fresh(); run([60,63,66,69]); ok(has('dim') && S.state().gifts.timbres.some(t=>t.opt==='Aube'), 'dim : montée +3 → timbre Aube'); ok(A.SCHEMA.pad.params.wave.options.includes('Aube'), 'Aube au schéma du Pad');
  A.store.set('pad.wave','Aube','user'); ok(A.store.get('pad.wave')==='Aube', 'Aube sélectionnable');
  fresh(); run([69,66,63,60]); ok(has('dim'), 'dim : descente aussi');

  // ---- ii–V–I forcé ----
  fresh(); forced(1); forced(4); forced(3); ok(!has('jazz'), 'jazz : II–V–IV refusé');
  fresh(); forced(4); forced(0); ok(!has('jazz'), 'jazz : V–I seul refusé');
  fresh(); forced(1); A.bus.emit('chord',{time:0,deg:4,midis:[],forced:false}); forced(0); ok(!has('jazz'), 'jazz : un accord naturel ne compte pas comme forcé');
  fresh(); forced(1); forced(4); clock+=25000; forced(0); ok(!has('jazz'), 'jazz : trop lent (>20 s) refusé');
  fresh(); forced(1); forced(4); forced(0); ok(has('jazz') && !S.byId.jazz.reward.gift, 'jazz : II–V–I forcé → trouvé (son nœud, pas de cadeau)');
  { let played=[]; const pd=A.seq.playDegree; A.seq.playDegree=(dg)=>played.push(dg); A.engine.ctx=A.engine.ctx||{};
    d.dispatchEvent(new w.KeyboardEvent('keydown',{code:'KeyS',bubbles:true})); A.seq.playDegree=pd;
    ok(played[0]===1, 'clavier : la touche S joue le degré 1 (plus de clavier miroir)'); }

  // ---- combinaison poétique ----
  const poem=(t,h,m)=>{ A.store.set('fx.shimmer',h,'user'); A.store.set('global.time',m,'user'); A.store.set('global.tempo',t,'user'); };
  fresh(); poem(40,1,'Flottant'); ok(!has('lent'), 'lent : tempo 40 trop rapide'); fresh(); poem(36,0.9,'Flottant'); ok(!has('lent'), 'lent : Halo 90 % insuffisant');
  fresh(); poem(30,1,'Pulsé'); ok(!has('lent'), 'lent : sans Flottant refusé');
  fresh(); poem(30,1,'Flottant'); ok(has('lent') && !d.documentElement.dataset.lcd, 'lent : combinaison → trouvé (trophée, écran inchangé)');
  fresh(); A.store.set('global.tempo',30,'game'); A.store.set('fx.shimmer',1,'game'); A.store.set('global.time','Flottant','game'); ok(!has('lent'), 'lent : réglages posés par le jeu (non « user ») ignorés');

  // ---- sur le battement ----
  A.store.set('global.tempo',60,'game'); A.seq.nextTime=100;
  fresh(); A.seq.playing=true; A.seq.nextTime=100; A.store.set('global.tempo',60,'game');
  const bt=(arr)=>{ S.reset(); arr.forEach((t,i)=>live(60+i*4%7, t)); };
  bt([101.01,102.0,103.02,103.99,105.03,106.0,107.01,108.02]); ok(has('pulse') && !S.byId.pulse.reward.gift, 'pulse : 8 temps parfaits → trouvé (son nœud, pas de cadeau)');
  fresh(); A.seq.playing=true; A.seq.nextTime=100; bt([101.01,102.0,103.02,103.99,105.03,106.0,107.01,108.2]); ok(!has('pulse'), 'pulse : un temps en retard de 200 ms refusé');
  fresh(); A.seq.playing=true; A.seq.nextTime=100; bt([101.01,102.0,103.02,104.99,105.03,106.0,107.01,108.02]); ok(!has('pulse'), 'pulse : un temps sauté refusé');
  fresh(); A.seq.playing=true; A.seq.nextTime=100; bt([101.01,102.0,103.02,103.99,105.03,106.0,107.01]); ok(!has('pulse'), 'pulse : 7 temps insuffisants');
  fresh(); A.seq.playing=false; A.seq.nextTime=100; bt([101.01,102.0,103.02,103.99,105.03,106.0,107.01,108.02]); ok(!has('pulse'), 'pulse : à l\'arrêt, rien');

  ok(!A.garden.chime._sec, 'carillon : plus de surcharge de garden.chime');

  // ---- mesure de silence ----
  const tg=()=>S.toggles(); ok(tg().length>=4, 'silence : '+tg().length+' couches à couper');
  const allOff=()=>tg().forEach(k=>A.store.set(k,false,'user'));
  fresh(); A.seq.playing=true; allOff(); clock+=1000; A.store.set('bells.on',true,'user'); ok(!has('silence'), 'silence : 1 s de silence (< 1 mesure) refusé');
  fresh(); A.seq.playing=true; tg().slice(1).forEach(k=>A.store.set(k,false,'user')); clock+=10000; A.store.set(tg()[1],true,'user'); ok(!has('silence'), 'silence : une couche encore allumée refusé');
  fresh(); A.seq.playing=false; allOff(); clock+=10000; A.store.set('bells.on',true,'user'); ok(!has('silence'), 'silence : à l\'arrêt refusé');
  fresh(); A.seq.playing=true; allOff(); clock+=10000; A.store.set('bells.on',true,'user'); ok(has('silence') && !S.byId.silence.reward.gift, 'silence : tout couper 1 mesure puis rallumer → trouvé (trophée)');
  A.seq.playing=false;

  // ---- MIDI seulement ----
  fresh(); midiRun([60,62,64],[1,0.3,0.85]); ok(!has('velo'), 'velo : dernière note pas assez forte (brute 0,85) refusée');
  fresh(); midiRun([60,62,64],[1,0.4,1]); ok(!has('velo'), 'velo : note du milieu pas assez douce (brute 0,4) refusée');
  fresh(); run([60,62,64],2.5,[0.85,0.5,0.85]); ok(!has('velo'), 'velo : clavier d\'ordinateur (0,85/0,5, sans vélocité brute) jamais');
  fresh(); run([60,62,64],2.5,[1,0.256,1]); ok(!has('velo'), 'velo : vélocité remappée seule (sans brute) ne compte pas');
  fresh(); midiRun([60,62,64],[0.92,0.33,0.95]); ok(has('velo') && !S.byId.velo.reward.gift, 'velo : brute ≥ 0,9 / ≤ 0,35 / ≥ 0,9 → Funambule trouvé (trophée, atteignable)');
  { const pm=A.seq.playMidi, pl=A.seq.playing, args=[]; A.seq.playMidi=(...a)=>args.push(a); A.seq.playing=true;
    A.play.onMidi({data:[0x90,72,127]}); A.play.onMidi({data:[0x90,72,32]}); A.seq.playMidi=pm; A.seq.playing=pl;
    ok(args.length===2 && args[0][2]===1 && Math.abs(args[1][2]-32/127)<1e-9 && Math.abs(args[1][1]-(0.25+0.75*32/127))<1e-9, 'MIDI : vélocité brute transmise à côté de la vélocité remappée ('+args.map(a=>a[1].toFixed(2)+'/'+a[2].toFixed(2)).join(' ')+')'); }
  fresh(); run([60,61,62,63,64],2.5); ok(!has('chroma'), 'chroma : 5 notes insuffisantes');
  fresh(); run([60,61,62,63,64,66],2.5); ok(!has('chroma'), 'chroma : un saut de ton casse la suite');
  fresh(); run([60,62,64,65,67,69],2.5); ok(!has('chroma'), 'chroma : une gamme diatonique n\'est pas chromatique');
  fresh(); run([60,61,62,63,64,65],2.5); ok(has('chroma') && !S.byId.chroma.reward.gift, 'chroma : 6 demi-tons de suite → trouvé (trophée)');
  fresh(); run([65,64,63,62,61,60],2.5); ok(has('chroma'), 'chroma : descendante aussi');

  // ---- le secret facile ----
  fresh(); run([60,64,62,67],1); ok(!has('cinq'), 'cinq : 4 notes insuffisantes');
  fresh(); run([60,64,62,67,65],2.5); ok(!has('cinq'), 'cinq : pauses de 2,5 s refusées');
  fresh(['racine','m.bells']); run([60,64,62,67,65],1); ok(has('cinq') && G.has('t.rec'), 'cinq : 5 notes de suite → Enregistreur ouvert');
  fresh(); run([60,64,62],1); run([67,65],1); ok(!has('cinq'), 'cinq : deux phrases séparées par une pause ne se cumulent pas');
  // S3.1/S3.6: during an Écho (the phrase heard and the notes played back), no secret is detected
  fresh(['racine','m.bells']); A.puzzles.start('p.suite'); A.puzzles.echoUntil=0; run([60,62,64,66,68],1); A.puzzles.stop();
  ok(!has('cinq') && !has('tons') && S.foundCount()===0 && !S.w.length && !G.has('t.rec'), 'pendant un Écho : aucun secret (ni Petite phrase ni Par tons)');
  run([60,62,64,66,68],1); ok(has('cinq') && has('tons'), 'Écho fermé : les mêmes notes trouvent les secrets');

  // ---- indices gradués, liste pour l'arbre ----
  fresh(['racine']); let L=S.list(); ok(L.length===S.DEFS.length && L.every(x=>!x.found && x.title==='???' && x.level===0 && x.hint===''), 'indices : nœud lié non acquis → rien de visible');
  fresh(['racine','m.bells']); L=S.list(); let t=L.find(x=>x.id==='tons');
  ok(t.level===1 && t.hint===st('tons').hint1 && t.title==='???' && !t.found, 'indice 1 (cryptique) dès le nœud acquis');
  ok(L.find(x=>x.id==='jazz').level===0, 'indice 1 : seulement pour les nœuds acquis');
  ok(L.find(x=>x.id==='velo').level===0 && L.find(x=>x.id==='chroma').level===0 && L.find(x=>x.id==='velo').hint==='', 'secrets MIDI : aucun indice tant qu\'aucun clavier MIDI n\'est branché');
  A.bus.emit('act','midiConnect'); L=S.list(); ok(S.state().midi && L.find(x=>x.id==='velo').level===1 && L.find(x=>x.id==='chroma').hint===st('chroma').hint1, 'clavier MIDI branché : leurs indices s\'affichent');
  S.state().secs=99999; ok(S.list().find(x=>x.id==='tons').level===1, 'indice 2 : le temps de jeu ne compte plus (même 99999 s)');
  fresh(['racine','m.bells']); S.state().found={a1:1}; t=S.list().find(x=>x.id==='tons'); ok(t.level===1, 'indice 2 : pas avec 1 secret');
  S.state().found={a1:1,a2:2}; t=S.list().find(x=>x.id==='tons'); ok(S.HINT2.found===2 && t.level===2 && t.hint===st('tons').hint2 && t.title==='???', 'indice 2 (clair) après '+S.HINT2.found+' secrets trouvés');
  fresh(); run([60,62,64,66,68]); t=S.list().find(x=>x.id==='tons'); ok(t.found && t.title==='Par tons' && t.level===3 && /Givre/.test(t.reward) && /Phrases ouvert/.test(t.reward), 'liste : trouvé → titre et récompense');
  ok(!S.box.querySelector('.sc-btn'), 'panneau : plus d\'interrupteurs de cadeaux');
  ok(/Secrets 1\//.test(S.box.querySelector('.sc-head').textContent) && !S.box.hidden && S.box.querySelectorAll('.sc-item').length>=S.DEFS.length, 'panneau « Secrets 1/N » : '+S.box.querySelector('.sc-head').textContent);
  ok(S.box.closest('#treeDlg') && w.getComputedStyle(S.box).position==='static' && S.box.classList.contains('min'), 'panneau des secrets dans l\'écran Arbre, replié, jamais flottant');
  // no timer: no setInterval left in the module, no play-time state
  { const src=await (await fetch('../js/secrets.js')).text().then(t=>t.replace(/\/\/.*$/gm,''));
    ok(!/setInterval|setTimeout/.test(src) && !/\.secs\b/.test(src), 'secrets.js : plus aucun minuteur ni temps de jeu');
    fresh(); A.seq.playing=true; const ids=[]; const si=w.setInterval; w.setInterval=(...a)=>{ids.push(1);return 0;}; await wait(20); w.setInterval=si; A.seq.playing=false; ok(!('secs' in S.state()), 'état : pas de compteur de temps'); }

  // ---- secrets-clés : le nœud s'ouvre directement, prérequis compris ----
  { const nodes=[], unl=[]; const off=A.bus.on('game:unlock',(d)=>unl.push(d.id));
    fresh(['racine','m.bells']); unl.length=0; A.garden.lcd('x'); const ch=[]; const c0=A.garden.chime; A.garden.chime=(k)=>{ch.push(k);};
    ok(!G.has('h.prog'), 'jazz : Progression fermée au départ');
    forced(1); forced(4); forced(0);
    A.garden.chime=c0;
    ok(has('jazz') && G.has('h.prog'), 'jazz : II–V–I → Progression ouverte directement');
    ok(['h.pad','h.key','h.scale','h.pad2','h.prog'].every(n=>G.has(n)), 'prérequis manquants ouverts aussi (Pad, Tonalité, Gammes, Accords riches)');
    ok(unl.join()==='h.pad,h.key,h.scale,h.pad2,h.prog', 'chemin normal : un événement unlock par nœud, prérequis d\'abord ('+unl+')');
    ok(ch.length>=1 && ch.every(k=>k==='unlock'), 'carillon du déblocage normal joué (pas de carillon en plus)');
    ok(A.lcdMsg.text==='✦ Progression ouvert', 'LCD : « '+A.lcdMsg.text+' »');
    ok(A.tree.paramUnlocked('pad.prog'), 'le réglage lié est réellement débloqué');
    // S4.3 node already owned: the secret opens the next node of the path (the current challenge's) instead
    fresh(['racine','m.bells','m.tempo','m.phrase']); A.contracts.refill(); const cur=A.contracts.byId[G.s.active[0]]; run([60,62,64,66,68]);
    ok(has('tons') && cur && G.has(cur.node) && G.s.nodes.filter(n=>n==='m.phrase').length===1 && S.rewardText(st('tons')).startsWith(A.tree.byId[cur.node].name), 'nœud déjà ouvert : le secret ouvre le nœud du défi en cours ('+A.tree.byId[cur.node].name+'), pas de doublon');
    // free mode: no node opened
    fresh(['racine','m.bells']); G.setMode('free'); S.reset(); forced(1); forced(4); forced(0); run([60,62,64,66,68]);
    ok(!G.has('h.prog') && !G.has('m.phrase') && !G.s.nodes.includes('h.key'), 'mode libre : aucun nœud ouvert');
    G.setMode('path'); off && off();
  }

  // ---- S3.8: once the instrument is handed over, a secret not found yet still is: its gift and the LCD, no node ----
  fresh(); G.s.ended=true; const nb=G.s.nodes.length; let opened=0; const offU=(()=>{ const f=()=>opened++; A.bus.on('game:unlock',f); return f; })();
  run([60,62,64,66,68]);
  ok(has('tons') && G.s.nodes.length===nb && !opened && !G.counts(), 'après la remise : Par tons trouvé, pas de nœud, rien d\'autre ne compte');
  ok(A.SCHEMA.bells.params.wave.options.includes('Givre') && A.lcdMsg.text==='✦ Par tons', 'après la remise : cadeau Givre donné, LCD « '+A.lcdMsg.text+' »');
  S.render(); ok(!S.box.hidden && [...S.box.querySelectorAll('.sc-item')].every(e=>e.classList.contains('found')), 'après la remise : le panneau ne montre que les secrets trouvés');
  G.s.ended=false;

  // ---- distinct gestures: one gesture never fires another secret's reward (besides the easy one) ----
  fresh(); run([60,62,64,66,68]); ok(Object.keys(S.state().found).sort().join()==='tons', 'un geste = un seul secret ('+Object.keys(S.state().found)+')');
  fresh(); G.setMode('free'); S.reset(); ok(S.state().found && Object.keys(S.state().found).length===0, 'remise à zéro du parcours : secrets effacés');

  localStorage.removeItem('ambient.game.sectest');
  for (const k of Object.keys(localStorage)) if (k.startsWith('ambient.game.sectest')) localStorage.removeItem(k);
  log('DONE');
  }catch(e){log('EXC '+e.stack)}
});
</script></body></html>
