<!doctype html><html><head><meta charset="utf-8"></head><body>
<!-- Parcours in the app (3/3): the instrument handed over, the real ending (replay at dawn, WAV offered), saved handover, older save. -->
<script src="lib.js"></script>
<script src="gameui-lib.js"></script>
<script>
gameUI(async ({ f, w, d, A, shown, locked, tn, task, lline, buyAll, sdiff, KEY, settle }) => {
  const g=A.game; A.garden.END_MS=150; A.garden.HAND_MS=300; // S5.6: the handover's delays, shortened (logic unchanged)
  // --- S5.6 finishing touches: no « ▶ Lancer le paysage » in the path, the only open layer has no mute, press feedback,
  // the confetti of an earlier party cleared when a window opens; free mode: the big ▶, the mutes, no press feedback
  { const css=(sel,p)=>{ const e=d.querySelector(sel); return e && w.getComputedStyle(e)[p]; }, PE=(t,el)=>el.dispatchEvent(new w.PointerEvent(t,{bubbles:true,pointerId:5}));
    g.reset(); A.tree.applyLocks(); A.perform.setMode('sculpt'); await wait(30);
    const dOn=d.querySelector('.panel[data-sec=drone] > header .tog[data-key="drone.on"]');
    ok(css('#bigPlay','display')==='none' && shown('#play'), 'Parcours : pas de « ▶ Lancer le paysage » sur l\'écran, ▶ Lecture dans la barre');
    ok(A.store.get('drone.on') && dOn.classList.contains('is-solo') && w.getComputedStyle(dOn).display==='none' && d.querySelector('.layer-chips .tog[data-key="drone.on"]').classList.contains('is-solo'), 'Graine : le drone, seule couche ouverte, n\'a pas de coupure (ni dans Sculpter ni dans Écouter)');
    A.store.set('drone.on', false, 'game'); ok(!dOn.classList.contains('is-solo'), 'drone coupé (paysage, ancienne sauvegarde) : sa coupure revient pour le rallumer'); A.store.set('drone.on', true, 'game');
    g.unlock('m.bells'); await wait(30);
    const bOn=d.querySelector('.panel[data-sec=bells] > header .tog[data-key="bells.on"]');
    ok(!dOn.classList.contains('is-solo') && w.getComputedStyle(dOn).display!=='none' && w.getComputedStyle(bOn).display!=='none', 'Mélodie auto ouverte : deux couches, deux coupures');
    const b=d.getElementById('play'); PE('pointerdown',b);
    ok(b.classList.contains('is-pressed') && /press-in/.test(w.getComputedStyle(b).animationName), 'appui : le bouton s\'enfonce (is-pressed) '+b.className+' / '+w.getComputedStyle(b).animationName);
    PE('pointerup',b); ok(!b.classList.contains('is-pressed') && b.classList.contains('is-released') && /press-out/.test(w.getComputedStyle(b).animationName), 'relâché : rebond et lueur (is-released)');
    const sl=d.querySelector('.ctl.sel:not(.is-locked) select'); PE('pointerdown',sl); const kp=sl.closest('.ctl.sel').classList.contains('is-pressed'); PE('pointerup',sl);
    ok(kp, 'un sélecteur aussi (générique : boutons, potentiomètres, sélecteurs, pastilles)');
    A.garden.fx('discovery',{name:'Test'}); await wait(80); const L=d.getElementById('fxLayer');
    const flying=L && !L.hidden && A.garden.confetti.n>0;
    A.garden.showTree(true); await wait(20);
    ok(flying && L.hidden && !A.garden.confetti.n && !L.querySelector('.fx-pop'), 'fenêtre ouverte (Arbre, carnet) : les confettis d\'une fête précédente disparaissent');
    A.garden.showTree(false);
    { const say=A.garden.FX_ON['resp:place']({ id:'musicien', name:'Musicien', nodes:['h.pad','h.drone','h.key'] })[1];
      ok(say.toast==='Tu joues déjà : 3 nœuds prêts → ✦ Ouvrir sur l\'écran du haut', 'placement : le toast résume la file (« '+say.toast+' »)'); }
    await wait(500); g.setMode('free'); await wait(30);
    ok(css('#bigPlay','display')!=='none' && !d.querySelector('.tog.is-solo'), 'mode libre : « ▶ Lancer le paysage » et toutes les coupures, comme avant');
    PE('pointerdown',b); const fp=b.classList.contains('is-pressed'); PE('pointerup',b);
    ok(fp && b.classList.contains('is-released'), 'S7.1 mode libre : le même retour de pression (le mouvement est l\'apparence de l\'app ; son et commandes intacts)');
    g.setMode('path'); g.reset(); A.perform.setMode('listen'); await wait(30); }
  // --- the instrument handed over (G6.3, S3.7): on the instrument, no dialog; the sound stays, the game interface goes
  { buyAll(); await wait(200); // macro positions settle (perform.js syncs them 60 ms after a change)
    ok(A.garden.complete() && !A.game.s.ended && task.dataset.id==='c.morceau' && shown('#lcdTask'), 'arbre complet : le dernier défi d\'abord, « '+task.querySelector('.lcd-task-txt').textContent+' »');
    const snap=JSON.stringify(A.store.stableSnapshot());
    A.bus.emit('act','songRec'); await wait(20);
    ok(A.game.s.ended && A.game.s.contracts.includes('c.morceau') && JSON.parse(localStorage.getItem('ambient.game.uitest')).ended, 'morceau enregistré → remise, état sauvegardé');
    for(let i=0;i<40 && !/INSTRUMENT/.test(d.getElementById('lcdTop').textContent);i++) await wait(50);
    ok(d.getElementById('treeDlg').hidden && /INSTRUMENT EST À TOI/.test(d.getElementById('lcdTop').textContent) && !d.querySelector('.modal:not([hidden])'), 'remise : carillon et message sur le LCD (« '+d.getElementById('lcdTop').textContent+' »), aucune boîte');
    await wait(450);
    ok(!shown('#lcdTask') && !lline.hidden && !/✧/.test(d.getElementById('lcd').textContent), 'S3.7 : remise → la ligne de défi s\'efface, la 2e ligne redevient l\'état du son');
    { const df=sdiff(JSON.parse(snap),A.store.stableSnapshot()); ok(!df, 'remise : son inchangé (snapshot du store) '+df); }
    const nc=A.game.s.contracts.length; A.seq.playing=true; A.store.set('drone.tone',0.31,'user'); A.store.set('drone.tone',0.62,'user'); for(let i=0;i<8;i++) A.bus.emit('live',{midi:60,time:0,vel:1}); A.seq.playing=false; await wait(20);
    ok(!A.game.counts() && A.game.s.contracts.length===nc && !shown('#lcdTask'), 'après la remise : plus rien ne compte ni ne s\'affiche');
    A.garden.showTree(true); await wait(30);
    ok(!d.getElementById('treeDlg').hidden && /instrument est à toi/.test(d.querySelector('#treeDlg .tree-count').textContent) && A.tree.NODES.every(n=>tn(n.id).classList.contains('st-owned')), 'l\'arbre reste consultable : tout ouvert');
    A.garden.showTree(false); ok(!A.garden.checkEnd(), 'remise une seule fois');
    A.game.reset(); }
  // --- review fixes (G6.5): sends, neutral effects
  { A.game.reset(); ['t.son','h.pad'].forEach(i=>A.game.unlock(i));
    ok(!A.tree.paramUnlocked('bells.send') && A.game.has('h.pad') , 'avant Reverb');
    A.game.unlock('e.reverb'); ok(A.tree.paramUnlocked('pad.send') && !A.tree.paramUnlocked('bells.send'), 'Distance d\'une couche seulement si la couche est là');
    A.game.unlock('e.echo'); ok(A.store.get('fx.echo')===A.store.spec('fx.echo').def, 'écho ouvert = on l\'entend (valeur par défaut)');
    A.game.reset(); }
  // --- S4.5w: a real ending — the recorded song is replayed (night → dawn, plants lit by their layer), then handed over and offered
  await A.ui.ensureStarted(); if (A.engine.ctx.state!=='running') await A.engine.ctx.resume(); // (the audio context: the replay decodes the WAV)
  { await wait(300); A.perform.setMode('listen'); w.scrollTo(0,0); window.scrollTo(0,0); buyAll(); await wait(200); // (the Jardin only draws on screen: an opening scrolled down to its controls, this page too)
    const sr=A.engine.ctx.sampleRate, n=Math.round(3*sr), ab=new ArrayBuffer(44+n*4), dv=new DataView(ab), W=(o,x)=>{ for(let i=0;i<x.length;i++) dv.setUint8(o+i,x.charCodeAt(i)); };
    W(0,'RIFF'); dv.setUint32(4,36+n*4,true); W(8,'WAVEfmt '); dv.setUint32(16,16,true); dv.setUint16(20,1,true); dv.setUint16(22,2,true); dv.setUint32(24,sr,true); dv.setUint32(28,sr*4,true); dv.setUint16(32,4,true); dv.setUint16(34,16,true); W(36,'data'); dv.setUint32(40,n*4,true);
    for (let i=0;i<n;i++){ const x=Math.round(Math.sin(i/sr*2*Math.PI*440)*2000); dv.setInt16(44+i*4,x,true); dv.setInt16(46+i*4,x,true); }
    const blob=new w.Blob([ab],{type:'audio/wav'}), GV=A.gardenVisual, dl=[], od=A.rec.download, top=d.getElementById('lcdTop');
    A.rec.download=(b,e)=>dl.push([b,e]);
    A.garden.songTape={t0:5,ev:[{layer:'pad',t:0.3,vel:0.8},{layer:'chord',t:0.2,deg:3},{layer:'bass',t:2.6,vel:0.8}]};
    d.getElementById('viz').scrollIntoView({block:'center'}); await wait(100); // the garden must be on screen to light up (IntersectionObserver)
    A.bus.emit('act','songRec'); const kept=A.garden.keepSong(blob);
    ok(kept && A.game.s.ended && !dl.length, 'morceau enregistré qui finit le Parcours : gardé pour la fin, pas téléchargé tout de suite');
    for (let i=0;i<80 && !GV.replay;i++) await wait(50);
    await wait(350); // the LCD refreshes every 300 ms
    ok(GV.replay && Math.abs(GV.replay.len-3)<0.01 && /TON MORCEAU/.test(top.textContent) && d.getElementById('treeDlg').hidden && !d.querySelector('.modal:not([hidden])'), 'fin : le morceau est relu dans l\'instrument (3 s, en entier), « '+top.textContent+' », aucune boîte '+JSON.stringify([!!A.garden.song,A.garden.handing,!!A.garden.playback,A.engine.ctx.state,A.game.s.ended,!!GV.replay]));
    await wait(850); const dawn=GV.dawnLevel(GV.clock());
    ok(dawn>0.15 && dawn<1 && GV.lit.pad>0 && !GV.lit.bass, 'pendant la lecture : nuit → aube ('+dawn.toFixed(2)+'), le Pad s\'est allumé quand il a joué, la Basse pas encore');
    for (let i=0;i<100 && GV.replay;i++) await wait(50);
    for (let i=0;i<20 && !/INSTRUMENT/.test(top.textContent);i++) await wait(50);
    ok(!GV.replay && /INSTRUMENT EST À TOI/.test(top.textContent) && !dl.length, 'fin de la lecture : « L\'instrument est à toi » sur le LCD');
    await wait(450);
    ok(shown('#lcdTask') && task.dataset.id==='wav' && /Garde ton morceau/.test(task.querySelector('.lcd-task-txt').textContent) && GV.dawnLevel(GV.clock())===1, 'le WAV est proposé sur la ligne du LCD ; le jardin reste à l\'aube');
    task.querySelector('.lcd-task-txt').click(); await wait(20);
    ok(dl.length===1 && dl[0][0]===blob && dl[0][1]==='wav' && !shown('#lcdTask') && !lline.hidden, 'toucher : le WAV est téléchargé, la ligne redevient l\'état du son');
    // ■ Stop during the replay: it stops (short fade), then the handover
    A.game.reset(); buyAll(); await wait(100); A.garden.songTape={t0:5,ev:[{layer:'pad',t:0.3,vel:0.8}]};
    A.bus.emit('act','songRec'); A.garden.keepSong(blob);
    for (let i=0;i<80 && !GV.replay;i++) await wait(50);
    const had=!!GV.replay; A.ui.stop(); await wait(50);
    for (let i=0;i<20 && !/INSTRUMENT/.test(top.textContent);i++) await wait(50);
    ok(had && !GV.replay && !A.garden.playback && /INSTRUMENT EST À TOI/.test(top.textContent), '■ Stop pendant la relecture de fin : elle s\'arrête, puis la remise');
    await wait(450); A.rec.download=od; A.game.reset(); A.perform.setMode('listen'); }
  // --- S3.7: the handover is saved: ↷ on the last contract hands over too; a reload keeps the instrument handed over
  { g.setMode('path'); buyAll(); await wait(200); task.querySelector('.lcd-skip').click(); await wait(600);
    ok(A.game.s.ended && !shown('#lcdTask'), '↷ sur le dernier défi : remise aussi');
    await new Promise(r=>{ f.addEventListener('load',r,{once:true}); w.location.reload(); }); await wait(300);
    const w2=f.contentWindow, d2=f.contentDocument, A2=w2.AMB, vis=(sel)=>{ const e=d2.querySelector(sel); return !!e && e.getClientRects().length>0; };
    ok(A2.game.path && A2.game.s.ended && !vis('#lcdTask') && vis('#treeBtn'), 'sauvegarde rechargée : toujours remis (pas de défi, arbre là)');
    ok(!d2.querySelector('.is-locked') && !A2.game.counts(), 'rechargé : tout l\'instrument ouvert, plus rien ne compte'); // the sound itself is never kept across a reload (both modes)
    A2.game.reset();
    // S4.6: an older save (a success recorded, its node not open) loads with that node ready, « ✦ Ouvrir » on the LCD
    localStorage.setItem('ambient.game.uitest', JSON.stringify({v:1,mode:'path',nodes:['racine','m.bells'],contracts:['k.xy','m.notes'],active:['k.couleur'],prog:{},skipped:[],ended:false}));
    await new Promise(r=>{ f.addEventListener('load',r,{once:true}); w2.location.reload(); }); await wait(300);
    const d3=f.contentDocument, A3=f.contentWindow.AMB, t3=d3.getElementById('lcdTask');
    ok(A3.game.isReady('h.pad') && !A3.game.has('h.pad') && A3.game.has('m.bells') && !t3.hidden && t3.querySelector('.lcd-task-txt').textContent==='✦ Ouvrir : Pad' && !A3.contracts.state().active.length, 'ancienne sauvegarde (réussite sans ouverture) : chargée, Pad prêt, « ✦ Ouvrir : Pad » sur le LCD');
    A3.game.reset(); }
});
</script></body></html>
