<!doctype html><html><head><meta charset="utf-8"></head><body style="margin:0">
<!-- Mode libre intact (G11.4, v1.06): in free mode, play notes, open old #dj / #df / #save links (removed features: ignored);
     afterwards the store (all settings), journal, undo history, share link, body classes and visible UI are identical to the
     snapshot taken before, no game element is visible, and localStorage got no new game key (only the harmless ones listed in HARMLESS). -->
<script src="lib.js"></script><script src="fake-midi.js"></script>
<script>localStorage.removeItem('ambient.game.fri');</script>
<iframe id="f" src="../index.html?gamekey=ambient.game.fri" style="width:1200px;height:800px;border:0"></iframe>
<script>
// Keys the base app may write in free mode, none of them game state (UI preferences, user presets, scenes):
const HARMLESS = ['ambient.seenHelp', 'ambient.mode', 'ambient.view', 'ambient.vizMode', 'ambient.userPresets.v1', 'ambient.scenes.v1'];
const QS = 'gamekey=ambient.game.fri';
const f = document.getElementById('f');
f.addEventListener('load', async () => {
  try {
    const w = f.contentWindow, d = f.contentDocument, A = w.AMB;
    w.addEventListener('error', e => log('ERROR ' + e.message + ' @' + e.filename + ':' + e.lineno));
    const until = async (fn, n = 60) => { for (let i = 0; i < n && !fn(); i++) await wait(50); return fn(); };
    const key = (k) => d.dispatchEvent(new w.KeyboardEvent('keydown', { key: k, code: k, bubbles: true }));
    A.game.setMode('free'); A.garden.welcome(false); await wait(300);
    const LS = () => { const o = {}; for (let i = 0; i < w.localStorage.length; i++) { const k = w.localStorage.key(i); o[k] = w.localStorage.getItem(k); } return o; };
    const vis = (e) => { const r = e.getBoundingClientRect(), cs = w.getComputedStyle(e); return !e.hidden && cs.display !== 'none' && cs.visibility !== 'hidden' && (r.width > 0 || r.height > 0); };
    const share = () => { d.getElementById('share').click(); return w.location.hash; };
    const shot = () => ({
      store: JSON.stringify(A.store.stableSnapshot()),
      journal: JSON.stringify(A.journal ? A.journal.items.map(i => [i.label, i.state]) : []),
      history: A.history.past.length + '/' + A.history.future.length + '/' + JSON.stringify(A.history.past.slice(-3)),
      bodyClasses: [...d.body.classList].sort().join(' '),
      visibleUI: [...d.querySelectorAll('[id]')].filter(vis).map(e => e.id).sort().join(','),
      game: JSON.stringify(A.game.s), playing: String(A.seq.playing),
    });
    const before = shot(), shareBefore = share(), ls0 = LS();
    ok(A.game.s.mode === 'free' && !A.game.path && shareBefore.startsWith('#p='), 'départ : mode libre, lien de partage lu (' + shareBefore.length + ' car.)');
    const undoBefore = A.history.past.length;

    // --- playing the instrument from the keyboard: sound only, no game
    // A–L sound while stopped, once the audio exists (doc promise): through engine.liveInput, past the stop fade
    await A.ui.ensureStarted();
    const g0 = JSON.stringify(A.game.s), keyNotes = [], li = A.engine.liveInput; let liveUsed = 0;
    A.engine.liveInput = function () { liveUsed++; return li.apply(this, arguments); };
    const offK = A.bus.on('live', (x) => keyNotes.push(x.midi));
    key('KeyA'); key('KeyZ'); await wait(60); if (offK) offK(); A.engine.liveInput = li;
    ok(JSON.stringify(A.game.s) === g0, 'notes et accords joués au clavier : rien du jeu ne bouge');
    ok(!A.seq.playing && keyNotes.length === 1 && liveUsed === 1, 'A–L lecture arrêtée : la note sonne par engine.liveInput (' + keyNotes.length + ' note, ' + liveUsed + ' passage)');
    // --- S4.1 the only change allowed in free mode: MIDI (button in the bar, notes heard while stopped); still no game
    const kb = fakeMidi(w), notes = []; A.bus.on('live', (x) => notes.push(x.midi));
    const midiOk = await kb.connect(); kb.on(72, 100); kb.off(72); kb.on(36, 90); kb.on(40, 90); kb.off(36); kb.off(40); await wait(80);
    ok(midiOk && !A.seq.playing && notes.includes(72) && JSON.stringify(A.game.s) === g0, 'MIDI en libre : bouton de la barre, note jouée lecture arrêtée, rien du jeu ne bouge' + (midiOk && notes.includes(72) ? '' : ' (branché ' + midiOk + ', notes ' + notes + ', audio ' + !!A.engine.ctx + ')'));
    // S6.2: the screen is a reflection, never a control: touching it does nothing (here, while stopped)
    { const v = d.getElementById('viz'), r = v.getBoundingClientRect(), PE = (t) => new w.PointerEvent(t, { bubbles: true, pointerId: 9, clientX: r.left + r.width * 0.7, clientY: r.top + r.height * 0.5 });
      v.dispatchEvent(PE('pointerdown')); v.dispatchEvent(PE('pointerup')); await wait(120);
      ok(!A.seq.playing && JSON.stringify(A.game.s) === g0, 'S6.2 : en libre, toucher l\'écran ne lance rien, ne change rien');
      A.seq.playing = true; const l0 = A.store.get('macro.light'), d0 = A.store.get('macro.density');
      v.dispatchEvent(PE('pointerdown')); v.dispatchEvent(PE('pointermove')); v.dispatchEvent(PE('pointerup')); await wait(120); A.seq.playing = false;
      ok(A.store.get('macro.light') === l0 && A.store.get('macro.density') === d0 && w.getComputedStyle(v).cursor !== 'crosshair', 'S6.2 : glisser sur l\'écran pendant la lecture ne bouge aucun réglage, curseur normal'); }

    ok(A.puzzles.onStep(0, A.engine.ctx.currentTime + 0.1, 0.25) === false && !A.puzzles.cur && A.puzzles.view() === null && JSON.stringify(A.game.s) === g0, 'S4.2 : aucune Réponse en libre (pas de phrase marquée sur une mesure)');
    // --- old links of removed features (#dj score of the day, #df cousin challenge): ignored, no exception, nothing stored
    for (const h of ['#dj=eyJ2IjoxfQ~1a2b', '#df=eyJ2IjoxLCJrIjoibSJ9~3c4d', '#dj=', '#df=%%%~1']) { w.location.hash = h; await wait(80); }
    ok(A.game.s.mode === 'free' && !d.querySelector('.modal:not([hidden])'), 'anciens liens #dj / #df : ignorés, aucune boîte, mode libre intact');
    w.history.replaceState(null, '', w.location.pathname + w.location.search); await wait(40);

    // --- afterwards: identical to the snapshot
    await wait(300);
    const after = shot(), shareAfter = share();
    for (const k of Object.keys(before)) ok(before[k] === after[k], 'identique : ' + k + (before[k] === after[k] ? '' : '\n  avant ' + String(before[k]).slice(0, 300) + '\n  après ' + String(after[k]).slice(0, 300)));
    ok(shareAfter === shareBefore, 'lien de partage identique');
    ok(A.history.past.length === undoBefore, 'annulation : aucune entrée ajoutée');
    const GAMEUI = ['treeBtn', 'pads', 'lcdTask', 'treeDlg', 'welcomeDlg'];
    const showing = GAMEUI.filter(id => { const e = d.getElementById(id); return e && vis(e); });
    ok(!showing.length && !d.querySelector('.gain-feed,.tree-badge,#lcdShards'), 'aucun élément de jeu visible (arbre, défi, pastilles) ' + showing.join());
    d.querySelector('.more').open = true; await wait(40);
    ok(vis(d.getElementById('gameMode')), 'menu ⋯ ouvert : la bascule vers le Parcours');
    d.querySelector('.more').open = false;
    d.getElementById('help').click(); await wait(40);
    const hd = d.getElementById('helpDlg'), hp = hd.querySelector('.help-path'), hf = hd.querySelector('.help-free');
    ok(!hd.hidden && (!hp || hp.hidden) && hf && !hf.hidden, 'aide en libre : l\'aide de base seule, pas les niveaux du Parcours');
    hd.querySelector('[data-close]').click(); await wait(40);
    const V = A.visual, seenViz = new Set([V.mode]); for (let i = 0; i < 5; i++) seenViz.add(V.cycleMode());
    while (V.mode !== seenViz.values().next().value) V.cycleMode();
    // S6.7: the dark city (mode id « Jardin ») is the free mode's default visual, a pure reflection: no game drawn on it
    const GV = A.gardenVisual; await wait(100);
    ok(seenViz.has('Jardin') && V.mode === 'Jardin' && GV.active && GV.free && GV.answer(0) === null && GV.dawnLevel(0) === 0 && d.getElementById('vizMode').textContent === 'Ville',
      'visuel : la Ville par défaut en libre, reflet sans jeu (aucune découverte, Réponse ni aube) ; Orbes, Horizon, Spectre au choix (' + [...seenViz].join(', ') + ')');

    // S11.4: the Melody's switch is « Auto »; off, its settings stay lit (they are the keys' sound too)
    { const was = A.store.get('bells.on'), tg = d.querySelector('.panel[data-sec=bells] > header .tog'), ctl = d.querySelector('.panel[data-sec=bells] > .ctls');
      A.store.set('bells.on', false, 'user'); await wait(30);
      ok(/Auto/.test(tg.textContent) && !tg.classList.contains('on') && w.getComputedStyle(ctl).opacity === '1', 'Mélodie : l\'interrupteur s\'appelle « Auto », éteint ses réglages restent allumés (ce sont ceux des touches)');
      A.store.set('bells.on', was, 'user'); await wait(30); }

    // --- localStorage: no new game key
    const ls1 = LS(), added = Object.keys(ls1).filter(k => !(k in ls0)), changed = Object.keys(ls0).filter(k => ls1[k] !== ls0[k]);
    const bad = added.concat(changed).filter(k => !HARMLESS.includes(k));
    ok(!bad.length, 'localStorage : aucune clé de jeu nouvelle ni modifiée (nouvelles : ' + (added.join(', ') || 'aucune') + ' ; modifiées : ' + (changed.join(', ') || 'aucune') + ')');
    log('info clés inoffensives tolérées : ' + HARMLESS.join(', '));

    // --- #save=… (exportable save removed in v1.06): an old link at load is ignored, no exception, no dialog, nothing written
    const load2 = async (hash) => {
      const g2 = document.createElement('iframe'); g2.style.cssText = 'width:1200px;height:800px;border:0';
      g2.src = '../index.html?' + QS + hash;
      const loaded = new Promise(r => g2.addEventListener('load', r)); document.body.append(g2); await loaded; await wait(350);
      return g2;
    };
    for (const code of [OLD_SAVE, 'bnVsbA']) {
      const lsBefore2 = LS(), errs = [];
      const g2 = await load2('#save=' + code), w2 = g2.contentWindow, d2 = g2.contentDocument, A2 = w2.AMB;
      w2.addEventListener('error', e => errs.push(e.message));
      await wait(100);
      const lsAfter2 = LS(), touched = Object.keys(Object.assign({}, lsBefore2, lsAfter2)).filter(k => lsBefore2[k] !== lsAfter2[k] && !HARMLESS.includes(k));
      ok(A2.game.s.mode === 'free' && !d2.querySelector('.modal:not([hidden])') && !errs.length && !touched.length && !('shards' in A2.game.s), 'ancien lien #save (' + code.slice(0, 6) + '…) : ignoré, aucune boîte, aucune clé de jeu écrite (' + (touched.join(', ') || 'aucune') + ')');
      const st2 = JSON.stringify(A2.store.stableSnapshot()), gs2 = JSON.stringify(A2.game.s);
      const why = st2 !== before.store ? ' (réglages : ' + Object.keys(A2.store.stableSnapshot()).filter((k) => JSON.stringify(A2.store.stableSnapshot()[k]) !== JSON.stringify(JSON.parse(before.store)[k])).slice(0, 5).join(', ') + ')' : gs2 !== before.game ? ' (jeu : ' + gs2.slice(0, 300) + ' ≠ ' + before.game.slice(0, 300) + ')' : '';
      ok(st2 === before.store && gs2 === before.game, 'ancien lien #save : réglages et état du jeu inchangés' + why);
      g2.remove();
    }
    localStorage.removeItem('ambient.game.fri');
    done();
  } catch (e) { fail(e); }
});
</script></body></html>
