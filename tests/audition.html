<!doctype html><html><head><meta charset="utf-8"></head><body>
<script>
const TAG=location.pathname.split('/').pop().replace('.html','');
const S=+(new URLSearchParams(location.search).get('s')||0.4);
const log=(m)=>fetch('/__log?'+encodeURIComponent(TAG+'|'+m)).catch(()=>{});
window.onerror=(m,s,l,c,e)=>log('ERROR '+m+' @'+s+':'+l);
window.addEventListener('unhandledrejection',e=>log('REJECT '+(e.reason&&e.reason.stack||e.reason)));
const oe=console.error;console.error=(...a)=>{log('CONSOLE.ERROR '+a.join(' '));oe(...a)};
</script>
<script src="../js/theory.js"></script><script src="../js/params.js"></script><script src="../js/engine.js"></script><script src="../js/sequencer.js"></script><script src="../js/audition.js"></script>
<script>
const ok=(c,m)=>log((c?'ok ':'ERROR fail ')+m);
const wait=(ms)=>new Promise(r=>setTimeout(r,ms));
async function render(events, secs=0.8){
  const sr=22050, oc=new OfflineAudioContext(1, Math.floor(sr*secs), sr);
  AMB.audition.play(events,{ctx:oc, when:0});
  return (await oc.startRendering()).getChannelData(0);
}
const rms=(d)=>Math.sqrt(d.reduce((a,v)=>a+v*v,0)/d.length);
window.addEventListener('load', async ()=>{
  try{
  const A=AMB.audition, bus=[];
  const emit0=AMB.bus.emit; AMB.bus.emit=function(ev,d){ bus.push(ev); return emit0.call(this,ev,d); };
  // --- PRNG
  const r1=A.rng(42), r2=A.rng(42), r3=A.rng(43);
  const s1=[...Array(8)].map(()=>r1()), s2=[...Array(8)].map(()=>r2()), s3=[...Array(8)].map(()=>r3());
  ok(s1.join()===s2.join() && s1.join()!==s3.join() && s1.every(v=>v>=0&&v<1), 'même graine → même suite, autre graine → autre suite');
  const mr=Math.random; A.rng(1)(); ok(Math.random===mr, 'Math.random intact');
  // --- offline render: non-silent, deterministic, A≠B
  const evA=[{t:0,midi:69,dur:0.3,vel:0.8,voice:'sine'},{t:0.3,midi:72,dur:0.3,vel:0.8,voice:'bell'}];
  const evB=[{t:0,midi:69,dur:0.3,vel:0.8,voice:'sine',cents:30},{t:0.3,midi:72,dur:0.3,vel:0.8,voice:'bell'}];
  const a1=await render(evA), a2=await render(evA), b=await render(evB);
  let dAA=0,dAB=0; for(let i=0;i<a1.length;i++){ dAA=Math.max(dAA,Math.abs(a1[i]-a2[i])); dAB=Math.max(dAB,Math.abs(a1[i]-b[i])); }
  ok(rms(a1)>0.02, 'rendu non silencieux rms='+rms(a1).toFixed(3));
  ok(dAA<1e-6 && dAB>0.05, 'même stimulus identique, A≠B (écart '+dAB.toFixed(3)+')');
  for(const v of ['sine','triangle','pluck','bell']){ const d=await render([{t:0,hz:330,dur:0.4,vel:1,voice:v}],0.5); let pk=0; for(const x of d) pk=Math.max(pk,Math.abs(x)); ok(pk>0.05 && pk<0.9, 'voix '+v+' peak='+pk.toFixed(2)); }
  // --- realtime engine: play schedules voices, not on the user's output
  AMB.engine.init();
  const E=AMB.engine; if(E.ctx.state!=='running') await E.ctx.resume();
  ok(E.audIn && E.mixDuck && E.audConv.buffer.duration>0.9 && E.audConv.buffer.duration<1.1, 'bus audition + reverb 1 s + mixDuck');
  const evs=[0,0.1,0.2].map((t,i)=>({t,midi:60+i*4,dur:0.15,voice:'triangle'}));
  const an=E.analyser, buf=new Float32Array(an.fftSize);
  const peakFor=async(ms)=>{ let pk=0; const t0=performance.now(); while(performance.now()-t0<ms){ an.getFloatTimeDomainData(buf); for(const v of buf) pk=Math.max(pk,Math.abs(v)); await wait(30); } return pk; };
  const waitAudio=async(sec)=>{ const c0=E.ctx.currentTime, t0=performance.now(); while(E.ctx.currentTime-c0<sec && performance.now()-t0<8000) await wait(30); };
  const base=await peakFor(200); // the user's chain alone (tape hiss etc.)
  const tp=performance.now(), pr=A.play(evs), dur=pr.dur;
  ok(Math.abs(pr.at-E.ctx.currentTime-0.1)<0.05 && pr.t0>tp+40 && pr.t0<tp+250, 'play renvoie son départ : at='+pr.at.toFixed(3)+' s, t0 = maintenant + '+(pr.t0-tp).toFixed(0)+' ms');
  ok(Math.abs(dur-0.35)<1e-9 && A.lastCount===3 && A.voices.length===3, 'play : '+A.voices.length+' voix, durée='+dur.toFixed(2));
  const pk=await peakFor(450);
  ok(pk<Math.max(base*4, 2e-2), 'rien sur la sortie de l\'utilisateur (analyseur/rec/Figer) peak='+pk.toExponential(1)+' base='+base.toExponential(1));
  A.play(evs); A.stop(); ok(A.voices.length===0, 'stop vide les voix');
  // --- session: freeze Dérive + LFOs, duck
  const st=AMB.store, moved=[]; st.on((k,v,src)=>{ if(src==='evolve'||src==='lfo') moved.push(k); });
  st.set('global.evolve',1); st.set('mod.l1target','fx.space'); st.set('mod.l1depth',1); st.set('mod.l1rate',1);
  A.session(true);
  ok(AMB.seq.frozen && E.ducked && A.active, 'session(on) : gel + atténuation');
  for(let i=0;i<30;i++){ AMB.seq.evolve(); AMB.seq.runLfos(); }
  ok(moved.length===0, 'pendant la manche : ni dérive ni LFO');
  await waitAudio(0.6);
  const g=E.mixDuck.gain.value; ok(g<0.5, 'ambiance atténuée gain='+g.toFixed(3));
  A.session(false);
  for(let i=0;i<30;i++){ AMB.seq.evolve(); AMB.seq.runLfos(); }
  ok(!AMB.seq.frozen && !E.ducked && moved.length>0, 'session(off) : dérive/LFO reprennent ('+moved.length+')');
  st.set('global.volume',0.4); await waitAudio(0.8);
  const av=E.audVol.gain.value; ok(Math.abs(av-0.25)<0.03, 'bus audition suit le volume global gain='+av.toFixed(3));
  st.set('global.volume',0.8); await waitAudio(0.8);
  ok(Math.abs(E.audVol.gain.value-1)<0.03, 'volume par défaut : gain audition = 1');
  ok(bus.length===0, 'aucun événement bus émis '+bus.join(','));
  log('DONE');
  }catch(e){log('EXC '+e.stack)}
});
</script></body></html>
