<!doctype html><html><head><meta charset="utf-8"></head><body>

</script>
<iframe id="f" src="../index.html?gamekey=ambient.game.uitest" style="width:1300px;height:900px"></iframe>
<script>

    ok(pzc.hidden && A.game.s.contracts.includes('p.premier') && A.game.has('t.macros') && /Écho réussi en 2 essais : Grands réglages s'ouvre/.test(d.getElementById('toast').textContent), 'phrase juste : carte fermée, Grands réglages s\'ouvre ('+d.getElementById('toast').textContent+')');
    await wait(1400); A.garden.showTree(false); A.perform.setMode('listen'); A.game.s.nodes=A.game.s.nodes.filter(x=>x!=='t.macros');
    // S3.6: the card's 9 pads play A–L (a phone has no keys); at 390 px the pegs show note by note, nothing overflows
    { f.style.width='390px'; f.style.height='780px'; await wait(250); A.garden.openPuzzle('p.premier'); await wait(20);
      const pads=[...pzc.querySelectorAll('.pz-pads .pz-pad')], pd=A.seq.playDegree, got=[]; A.seq.playDegree=(dg)=>got.push(dg);
      pads[4].dispatchEvent(new w.PointerEvent('pointerdown',{bubbles:true})); A.seq.playDegree=pd;
      const de=d.documentElement, inside=(e)=>e.getBoundingClientRect().right<=de.clientWidth+1 && e.getBoundingClientRect().left>=-1;
      ok(shown('#puzzle .pz-pads') && pads.length===9 && pads.map(b=>b.textContent).join('')==='ASDFGHJKL' && got.join()==='4' && pads.every(inside), 'carte Écho : 9 pastilles A–L, jouables au doigt, dans l\'écran à 390 px');
      const u=P.target().degs; live(mid(u[0])); live(mid(u[1])+2); await wait(20);
      const row=pzc.querySelector('.pz-row:not(.pz-head)'), pg=[...row.querySelectorAll('.pz-peg')];
      ok(pg.map(e=>e.textContent).join(' ')==='✓ ⬇ ·' && pg.every(inside) && de.scrollWidth<=de.clientWidth+1, '390 px : pions note par note ('+pg.map(e=>e.textContent).join(' ')+'), pas de débordement');
      A.garden.closePuzzle(); f.style.width='1300px'; f.style.height='900px'; await wait(200); }
    A.garden.openPuzzle('p.premier'); A.game.setMode('free'); await wait(20); ok(pzc.hidden && !P.current, 'passage en libre : carte Écho fermée');
    A.game.setMode('path'); A.game.reset(); }
  // --- S4.4 touch pads: under the screen once the Melody is owned, play like A–L (held, multitouch), long press = chord
  { A.game.reset(); A.perform.setMode('listen'); await wait(30);
    const bar=d.getElementById('pads'), pads=[...bar.querySelectorAll('.pad')], PE=(t,id)=>new w.PointerEvent(t,{bubbles:true,pointerId:id,pointerType:'touch'});
    ok(bar.hidden && !shown('#pads'), 'pastilles : cachées avant la Mélodie auto');
    A.game.unlock('m.bells'); await wait(1500); A.garden.showTree(false); A.perform.setMode('listen'); await wait(30);
    const stage=d.querySelector('.stage').getBoundingClientRect(), br=bar.getBoundingClientRect();
    ok(!bar.hidden && pads.length===9 && A.play.PADS.length===9 && br.top>=stage.bottom-1 , 'pastilles : 9, sous l\'écran, dès la Mélodie auto');
    const sp=A.seq.playMidi, rel=[], lives=[]; A.bus.on('live',e=>lives.push(e.midi)); A.seq.playing=true;
    A.seq.playMidi=(m,v,r,h)=>{ A.bus.emit('live',{midi:m,time:0,vel:v,raw:r}); return {id:m,midi:m,release:()=>{}}; };
    const eo=A.seq.endLive; A.seq.endLive=(h)=>rel.push(h.midi);
    { const st=A.contracts.state(A.game); st.active=['m.notes']; st.prog['m.notes']={n:0}; }
    const n0=0;
    pads[2].dispatchEvent(PE('pointerdown',1)); pads[6].dispatchEvent(PE('pointerdown',2)); await wait(20);
    ok(lives.length===2 && lives[0]!==lives[1] && A.play.held===2 && pads[2].classList.contains('on') && pads[6].classList.contains('on'), 'multitouch : 2 doigts = 2 notes tenues');
    pads[2].dispatchEvent(PE('pointerup',1)); await wait(10);
    ok(rel.length===1 && A.play.held===1 && !pads[2].classList.contains('on') && pads[6].classList.contains('on'), 'un doigt levé : sa note finit, l\'autre tient');
    pads[6].dispatchEvent(PE('pointercancel',2)); await wait(10);
    ok(rel.length===2 && A.play.held===0, 'pointercancel : note relâchée');
    ok(((A.game.s.prog['m.notes']||{}).n||0)===n0+2 || A.game.s.contracts.includes('m.notes'), 'une pastille compte pour « Joue 6 notes » ('+(((A.game.s.prog['m.notes']||{}).n||0)-n0)+')');
    const ch=[], fc=A.seq.forceChord; A.seq.forceChord=(dg)=>ch.push(dg); A.game.unlock('h.pad');
    pads[3].dispatchEvent(PE('pointerdown',3)); await wait(250); const early=ch.length; await wait(350);
    ok(early===0 && ch.join()==='3' && pads[3].classList.contains('chord'), 'appui long : l\'accord du degré (pas avant)');
    pads[3].dispatchEvent(PE('pointerup',3)); A.seq.forceChord=fc; A.seq.playMidi=sp; A.seq.endLive=eo; A.seq.playing=false;
    // 390 px: at least 44 px under the thumb, nothing wider than the screen
    f.style.width='390px'; f.style.height='780px'; await wait(250);
    const de=d.documentElement, r2=pads.map(b=>b.getBoundingClientRect());
    ok(r2.every(r=>r.width>=44 && r.height>=44 && r.right<=de.clientWidth+1 && r.left>=-1) && de.scrollWidth<=de.clientWidth+1, '390 px : pastilles ≥ 44 px, dans l\'écran ('+Math.round(Math.min(...r2.map(r=>r.width)))+'×'+Math.round(Math.min(...r2.map(r=>r.height)))+')');
    f.style.width='1300px'; f.style.height='900px'; await wait(200);
    A.garden.openPuzzle('p.premier'); await wait(20); ok(!shown('#pads'), 'carte Écho ouverte : la barre cède la place aux pastilles de la carte'); A.garden.closePuzzle();
    A.game.setMode('free'); await wait(30); ok(bar.hidden && !shown('#pads'), 'mode libre (tactile ou non) : aucune pastille');
    A.game.setMode('path'); A.game.reset(); }
  // --- actions on success (G7.2): a cancelled save emits nothing, a real one does (contracts count it)
  { A.game.reset(); ['t.son','t.journal'].forEach(i=>A.game.unlock(i)); const acts=[]; A.bus.on('act',id=>acts.push(id));
    const op=w.prompt; w.prompt=()=>null; d.getElementById('save').click(); await wait(20);
    ok(!acts.includes('save'), 'Sauver annulé : aucune action');
    w.prompt=()=>'Test G7'; d.getElementById('save').click(); await wait(20); w.prompt=op;
    ok(acts.includes('save'), 'Sauver réussi : action émise');
    A.game.unlock('t.rec'); const C=A.contracts; C.state(A.game).active=['k.enreg'];
    A.bus.emit('rec:done', 12); ok(!A.game.s.contracts.includes('k.enreg'), 'enregistrement de 12 s : défi pas réussi');
    A.bus.emit('rec:done', 31); ok(A.game.s.contracts.includes('k.enreg') && A.game.has('t.share'), 'enregistrement réel de 31 s : défi réussi, Partage ouvert');
    await wait(1400); A.garden.showTree(false);
    A.game.reset(); }
  // --- feedback (G6.2)
  A.game.unlock('e.reverb'); await wait(400);
  ok(/REVERB OUVERT/.test(d.getElementById('lcdTop').textContent) && d.getElementById('lcdTop').classList.contains('lcd-flash'), 'LCD : « reverb ouvert » '+d.getElementById('lcdTop').textContent);
  await A.ui.ensureStarted(); const ctx=A.engine.ctx; if (ctx.state!=='running') await ctx.resume();
  ok(ctx.state!=='running' || A.garden.chime('unlock')===4 && A.garden.chime('solve')===6, 'carillon joué ('+ctx.state+')');
  A.game.setMode('free'); ok(A.garden.chime('unlock')===0, 'pas de carillon en mode libre'); A.game.setMode('path');
  A.ui.stop && A.ui.stop();
  // --- sound locking (G1.5)
  const St=A.store, g=A.game;
  g.setMode('free'); St.set('fx.echo',0.6,'user'); St.set('pad.on',true,'user');
  g.setMode('path'); g.reset(); await wait(50);
  ok(St.get('pad.on')===false && St.get('fx.echo')===0 && St.get('global.evolve')===0 && St.get('drone.on')===true, 'verrouillé = neutre (pad muet, pas d\'écho), drone joue');
  St.set('pad.on',true,'user'); A.ui.applyPatch({'pad.on':true,'fx.echo':0.8,'drone.tone':0.9});
  ok(St.get('pad.on')===false && St.get('fx.echo')===0 && Math.abs(St.get('drone.tone')-0.9)<0.02, 'presets/utilisateur ne touchent pas le verrouillé '+St.get('drone.tone'));
  g.unlock('h.pad'); ok(St.get('pad.on')===true, 'ouvrir le Pad le fait jouer');
  g.setMode('free'); ok(Math.abs(St.get('fx.echo')-0.6)<0.02 && St.get('pad.on')===true, 'retour en libre : son libre rendu');
  St.set('pad.on',false,'user'); ok(St.get('pad.on')===false, 'libre : tout modifiable');
  g.setMode('path'); ok(St.get('fx.echo')===0 && St.get('pad.on')===true, 'retour au parcours : son du parcours rendu');
  // --- S4.3 no currency anywhere: no « +n ✧ » note, no counter, nothing to buy
  g.setMode('path'); await wait(20); A.contracts.finish(A.game.s.active[0]); await wait(1500); A.garden.showTree(true); await wait(20);
  ok(!d.getElementById('fx') && !A.juice && !d.getElementById('gainFeed') && !/✧|éclat/.test(d.body.innerText), 'un défi réussi : aucune note « +n ✧ », aucun ✧ ni « éclat » à l\'écran');
  A.garden.showTree(false);
  // S3.8: the path help is short and says how secrets work now (a node opened, hint 2 after 2 secrets, never with time)
  { d.getElementById('help').click(); const hp=d.querySelector('#helpDlg .help-path'), tx=hp.textContent;
    ok(!hp.hidden && hp.querySelectorAll('.help-grid h4').length===4 && /ouvre un nœud/.test(tx) && /après 2 secrets/.test(tx) && /Écho/.test(tx) && !/avec le temps/.test(tx), 'aide du Parcours : 4 rubriques, secrets-clés, indice 2 après 2 secrets, Écho');
    d.querySelector('#helpDlg [data-close]').click(); }
  g.setMode('free'); await wait(400); ok(!shown('#treeBtn') && !shown('#lcdTask') && !d.body.classList.contains('jargon-off'), 'pas d\'arbre ni de défi en libre, l\'écran garde tonalité et tempo');
  // --- S3.7: the handover is saved: ↷ on the last contract hands over too; a reload keeps the instrument handed over
  { g.setMode('path'); buyAll(); await wait(200); task.querySelector('.lcd-skip').click(); await wait(3300);
    ok(A.game.s.ended && !shown('#lcdTask'), '↷ sur le dernier défi : remise aussi');
    await new Promise(r=>{ f.addEventListener('load',r,{once:true}); w.location.reload(); }); await wait(300);
    const w2=f.contentWindow, d2=f.contentDocument, A2=w2.AMB, vis=(sel)=>{ const e=d2.querySelector(sel); return !!e && e.getClientRects().length>0; };
    ok(A2.game.path && A2.game.s.ended && !vis('#lcdTask') && vis('#treeBtn'), 'sauvegarde rechargée : toujours remis (pas de défi, arbre là)');
    ok(!d2.querySelector('.is-locked') && !A2.game.counts(), 'rechargé : tout l\'instrument ouvert, plus rien ne compte'); // the sound itself is never kept across a reload (both modes)
    A2.game.reset(); }
  localStorage.removeItem('ambient.game.uitest');
  for (const k of Object.keys(localStorage)) if (k.startsWith('ambient.game.uitest')) localStorage.removeItem(k);
  log('DONE');
  }catch(e){log('EXC '+e.stack)}
});
