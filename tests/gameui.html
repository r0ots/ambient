  pzc.querySelector('.pz-ab').click(); await wait(20); ok(/Revenir/.test(pzc.querySelector('.pz-ab').textContent) && pzc.querySelector('.pz-ok').disabled && A.store.get('bells.wave')==='Verre', 'écoute de la cible');
  ok(d.body.classList.contains('pz-veil') && d.querySelector('[data-key="bells.wave"]').classList.contains('pz-veiled'), 'cible : valeurs masquées sur les réglages');
  ok(A.store.stableSnapshot()['bells.wave']==='Cloche', 'instantanés (journal, annuler, partage) = mon son, pas la cible');
  pzc.querySelector('.pz-ab').click(); await wait(20); ok(A.store.get('bells.wave')==='Cloche' && !d.querySelector('.pz-veiled'), 'retour à mon son');

  pzc.querySelector('.pz-ok').click(); await wait(20);
  { const rows=pzc.querySelectorAll('.pz-row:not(.pz-head)'), pegs=[...rows[0].querySelectorAll('.pz-peg')], tip=(k)=>pegs.find(p=>p.dataset.k===k);
    ok(!A.game.s.puzzles.includes('p.composer') && rows.length===1 && pegs.length===4 && pzc.querySelectorAll('.pz-head span').length===5, 'échec → 1 ligne d\'essai, 4 pions nommés');
    ok(tip('bells.wave').classList.contains('far') && /autre option/.test(tip('bells.wave').title) && /autre/.test(tip('bells.wave').textContent)

    ok(/Pas encore : 0 juste, 1 proche\. 5 essais restants/.test(pzc.querySelector('.pz-hint').textContent) && /2\/6/.test(pzc.querySelector('.pz-ok').textContent), 'état : '+pzc.querySelector('.pz-hint').textContent); }
  A.store.setMany({'bells.wave':'Verre','bells.range':0.73,'bells.tone':0.22,'drone.tone':0.8},'user'); await wait(20);
  ok(!pzc.querySelector('.pz-ok').classList.contains('ready') && pzc.querySelector('.pz-gauge').hidden, 'à la cible : rien ne s\'allume sans aide (il faut valider)');
  pzc.querySelector('.pz-ok').click(); await wait(40);
  ok(A.game.s.puzzles.includes('p.composer') && pzc.hidden && !d.getElementById('treeDlg').hidden && tn('c.seq').classList.contains('st-available') && A.mode==='listen', 'résolue → arbre rouvert, nœud achetable, écran revenu en Écouter');
  ok(/2 essais/.test(d.getElementById('toast').textContent) && !/★/.test(d.getElementById('toast').textContent) && pzEarn.join()==='p.composer:25', 'résolue en 2 essais, ✧ 25, sans étoiles : '+d.getElementById('toast').textContent);
  // replay from the tree's puzzle list: a new target for the same controls, no ✧ again
  { const rb=d.querySelector('.tree-puzzles [data-pz="p.composer"]'); ok(rb && /◈ Boîte à musique ✓/.test(rb.textContent) && /Énigmes 1\/12/.test(d.querySelector('.tree-puzzles').textContent), 'liste des énigmes dans l\'arbre : '+(rb&&rb.textContent));
    rb.click(); await wait(30); const t2=A.puzzles.target();
    ok(!pzc.hidden && A.mode==='sculpt' && JSON.stringify(t2)!==JSON.stringify(FIX) && Object.keys(t2).join()===Object.keys(FIX).join(), 'rejouer : nouvelle cible pour les mêmes réglages');
    pzc.querySelector('.pz-x').click(); await wait(20); ok(pzc.hidden && A.mode==='listen', 'fermer : l\'écran revient au mode d\'avant');
    rb.click(); await wait(20); A.store.setMany(t2,'user'); pzc.querySelector('.pz-ok').click(); await wait(30);
    ok(pzc.hidden && pzEarn.length===1 && /1 essai/.test(d.getElementById('toast').textContent), 'rejouée (même cible tant que l\'essai dure), pas de ✧ : '+d.getElementById('toast').textContent); A.garden.showTree(false); }
  // 6 failed validations → the gate opens anyway, without ✧
  { A.game.earn(200,'test'); A.tree.buy('h.key'); A.garden.showTree(true); await wait(20);
    tn('h.scale').click(); await wait(30); ok(!pzc.hidden && /Autre lumière/.test(pzc.textContent), 'porte « Gammes » → énigme');
    const t=A.puzzles.target(); A.store.setMany(Object.fromEntries(Object.entries(t).map(([k,v])=>[k, typeof v==='number' ? (v>0.5?0:1) : A.store.spec(k).options.find(o=>o!==v)])),'user');
    for (let i=0;i<5;i++) pzc.querySelector('.pz-ok').click();
    ok(pzc.querySelectorAll('.pz-row:not(.pz-head)').length===5 && /1 essai restant/.test(pzc.querySelector('.pz-hint').textContent), '5 lignes, 1 essai restant');
    pzc.querySelector('.pz-ok').click(); await wait(40);
    ok(pzc.hidden && !d.getElementById('treeDlg').hidden && tn('h.scale').classList.contains('st-available') && !A.game.s.puzzles.includes('p.gamme') && pzEarn.length===1, '6 échecs → porte ouverte, sans ✧');
    ok(/la porte s'ouvre quand même/.test(d.getElementById('toast').textContent) && d.querySelector('.tree-puzzles [data-pz="p.gamme"]'), 'message bienveillant, énigme à rejouer'); }
  // help: the live gauge (for the son), the ✧ of the first resolution still come
  { d.querySelector('.tree-puzzles [data-pz="p.gamme"]').click(); await wait(30);
    const hb=pzc.querySelector('.pz-help input'); hb.click(); await wait(20);
    ok(!pzc.querySelector('.pz-gauge').hidden && /%/.test(pzc.querySelector('.pz-pct').textContent), 'aide → jauge en direct '+pzc.querySelector('.pz-pct').textContent);
    A.store.setMany(A.puzzles.target(),'user'); await wait(20); ok(pzc.querySelector('.pz-ok').classList.contains('ready'), 'aide : Valider s\'allume à ≥ 90 %');
    pzc.querySelector('.pz-ok').click(); await wait(40);
    ok(A.game.s.puzzles.includes('p.gamme') && pzEarn.includes('p.gamme:20'), 'aide → résolue, ✧ 20');
    A.puzzles.setHelp(false); A.garden.showTree(false); }
  // puzzles without a gate: same card, named controls from the first validation
  A.game.earn(500,'test'); A.tree.buy('h.scale'); A.garden.showTree(true); await wait(30);
  const bb=[...d.querySelectorAll('.tree-puzzles .btn')]; ok(bb.some(b=>/Quelle couleur.*✧ 25/.test(b.textContent)), 'énigme sans porte proposée dans l\'arbre');
  bb.find(b=>/Quelle couleur/.test(b.textContent)).click(); await wait(30);
  ok(!pzc.hidden && /Joue sur : Global · Tonalité, Global · Gamme/.test(pzc.querySelector('.pz-keys').textContent), 'réglages nommés dès le début');
  pzc.querySelector('.pz-ok').click(); await wait(20);
  ok(pzc.querySelector('.pz-head') && /Tonalité/.test(pzc.querySelector('.pz-row:not(.pz-head) .pz-peg').title), 'pions nommés dès le 1er essai');
  A.garden.closePuzzle();
  // --- sound locking (G1.5)
  const St=A.store, g=A.game;
  g.setMode('free'); St.set('fx.echo',0.6,'user'); St.set('pad.on',true,'user');
  g.setMode('path'); g.reset(); await wait(50);
  ok(St.get('pad.on')===false && St.get('fx.echo')===0 && St.get('global.evolve')===0 && St.get('drone.on')===true, 'verrouillé = neutre (pad muet, pas d\'écho), drone joue');
  St.set('pad.on',true,'user'); A.ui.applyPatch({'pad.on':true,'fx.echo':0.8,'drone.tone':0.9});
  ok(St.get('pad.on')===false && St.get('fx.echo')===0 && Math.abs(St.get('drone.tone')-0.9)<0.02, 'presets/utilisateur ne touchent pas le verrouillé '+St.get('drone.tone'));
  g.earn(50,'t'); A.tree.buy('h.pad'); ok(St.get('pad.on')===true, 'acheter le Pad le fait jouer');
  g.setMode('free'); ok(Math.abs(St.get('fx.echo')-0.6)<0.02 && St.get('pad.on')===true, 'retour en libre : son libre rendu');
  St.set('pad.on',false,'user'); ok(St.get('pad.on')===false, 'libre : tout modifiable');
  g.setMode('path'); ok(St.get('fx.echo')===0 && St.get('pad.on')===true, 'retour au parcours : son du parcours rendu');

  g.setMode('path'); await wait(20); A.game.earn(4,'gain'); await wait(20);
  ok(!d.getElementById('fx') && !A.juice && /\+4 ✧/.test(d.getElementById('gainFeed').textContent), 'gain d\'éclats → note « +4 ✧ » sous le LCD, pas de canvas #fx');
  A.garden.showTree(true); A.game.s.shards=0; tn('t.rec').click(); ok(true, 'refus sans erreur'); A.garden.showTree(false);
  // S3.8: the path help is short and says how secrets work now (a node opened, hint 2 after 2 secrets, never with time)
  { d.getElementById('help').click(); const hp=d.querySelector('#helpDlg .help-path'), tx=hp.textContent;
    ok(!hp.hidden && hp.querySelectorAll('.help-grid h4').length===4 && /ouvre un nœud/.test(tx) && /après 2 secrets/.test(tx) && /Écho/.test(tx) && !/avec le temps/.test(tx), 'aide du Parcours : 4 rubriques, secrets-clés, indice 2 après 2 secrets, Écho');

  g.setMode('free'); ok(!shown('#treeBtn') && !shown('#lcdShards') && !shown('#contracts'), 'pas d\'arbre, d\'éclats ni de contrats en libre');

  { g.setMode('path'); buyAll(); await wait(200); task.querySelector('.lcd-skip').click(); await wait(3300);

  localStorage.removeItem('ambient.game.uitest');
  for (const k of Object.keys(localStorage)) if (k.startsWith('ambient.game.uitest')) localStorage.removeItem(k);
  log('DONE');
  }catch(e){log('EXC '+e.stack)}
});
