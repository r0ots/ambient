<!doctype html><html><head><meta charset="utf-8"></head><body>
<!-- Parcours in the app (1/3): welcome, tree map, ready → open, locks, the challenge on the LCD, jargon. Others: gameui-play.html, gameui-end.html. -->
<script src="lib.js"></script>
<script src="gameui-lib.js"></script>
<script>
gameUI(async ({ f, w, d, A, shown, locked, tn, task, lline, buyAll, sdiff, KEY, settle }) => {
  ok(!d.body.classList.contains('game') && !d.querySelector('.is-locked'), 'mode non choisi : rien de verrouillé');

  d.getElementById('gameMode').click(); ok(A.game.s.mode==='free', 'bascule ⋯ → libre'); d.getElementById('gameMode').click();
  ok(d.body.classList.contains('game'), 'body.game');
  ok(shown('#treeBtn'), 'bouton Arbre visible en parcours'); d.getElementById('treeBtn').click(); await wait(50);

  { const miss=A.tree.NODES.flatMap(n=>n.req.map(r=>[r,n.id])).filter(([r,n])=>!d.querySelector('#treeDlg .tree-link[data-from="'+r+'"][data-to="'+n+'"]'));
    ok(!miss.length && d.querySelectorAll('#treeDlg .tree-link.x').length>0 && d.querySelector('#treeDlg svg.tree-links'), 'G11.1 : un lien SVG par prérequis, liens entre branches compris'+(miss.length?' manquants '+miss.join(' '):''));
    ok(d.querySelector('.tree-link[data-from="racine"][data-to="h.pad"]').classList.contains('available') && d.querySelector('.tree-link[data-from="h.pad"][data-to="h.key"]').classList.contains('locked'), 'liens : disponible / verrouillé');

  tn('h.pad').dispatchEvent(new w.MouseEvent('mouseover',{bubbles:true})); ok(tn('racine').classList.contains('is-req') && tn('h.key').classList.contains('is-dep'), 'survol : prérequis et suites surlignés');

  tn('h.pad').click(); ok(!A.game.has('h.pad') && /Joue 6 notes/.test(d.querySelector('#treeDlg .tree-info .ti-o').textContent), 'clic sur un nœud à ouvrir : la fiche dit ce qui l\'ouvre, rien d\'acheté');

  { const pe=(t,el,o)=>el.dispatchEvent(new w.PointerEvent(t,Object.assign({bubbles:true,pointerId:7,pointerType:'touch',isPrimary:true},o)));

    map.dispatchEvent(new w.WheelEvent('wheel',{bubbles:true,cancelable:true,deltaY:-200,clientX:600,clientY:400})); ok(v.k>k0 && /scale/.test(d.querySelector('.tree-stage').style.transform), 'molette : zoom '+k0.toFixed(2)+' → '+v.k.toFixed(2));

    const tx0=v.tx; pe('pointerdown',tn('h.key'),{clientX:300,clientY:300}); pe('pointermove',tn('h.key'),{clientX:380,clientY:330}); pe('pointerup',tn('h.key'),{clientX:380,clientY:330}); tn('h.key').dispatchEvent(new w.MouseEvent('click',{bubbles:true,detail:1}));
    ok(v.tx>tx0+40 && A.garden.sel==='h.pad', 'glisser : la carte suit le doigt, pas de sélection en fin de glissé ('+Math.round(tx0)+' → '+Math.round(v.tx)+')');

  // S4.6 + G8.5: a challenge won makes its node READY — a chime, « ✦ Ouvrir : Pad » pulsing on the LCD, the tree says « prêt »;

  ok(odlg.hidden && A.game.has('h.pad') && A.garden.seq && !d.getElementById('treeDlg').hidden && d.querySelector('.tree-glow.lit[data-from="racine"][data-to="h.pad"]') && tn('h.pad').classList.contains('is-buying'), '« Ouvrir » → la séquence : l\'arbre s\'ouvre, lien racine→Pad qui s\'allume');

  const padP=d.querySelector('.panel[data-sec=pad]'), nf=d.querySelector('.is-new-first');

  { const GV=A.gardenVisual; d.getElementById('viz').scrollIntoView({block:'center'}); await wait(150);
    const pp=GV.plants.find(p=>p.id==='pad'), lk=GV.look(k=>A.store.get(k)).pad;
    ok(pp && GV.growth('pad', GV.clock())>0.99 && pp.look && Math.abs(pp.look.size-lk.size)<0.02 && Math.abs(pp.sz-GV.sizeK('pad', lk.size))<0.03, 'Pad ouvert par la carte : sa plante a poussé et montre ses réglages (taille ×'+(pp&&pp.sz||0).toFixed(2)+')');
    const nw=[...padP.querySelectorAll('.is-new')].find(e=>/^pad\.(?!on$)/.test(e.dataset.key||'')||e.querySelector('[data-key^="pad."]:not([data-key="pad.on"])')), key=nw&&(nw.dataset.key||nw.querySelector('[data-key^="pad."]:not([data-key="pad.on"])').dataset.key);
    GV.kicks={}; nw.dispatchEvent(new w.Event('change',{bubbles:true})); // (a synthetic pointerdown on a knob asks for a pointer capture)
    const sp=A.SCHEMA.pad.params[key.split('.')[1]], v=A.store.get(key), nv=sp.options?sp.options.find(o=>o!==v):(v>(sp.min+sp.max)/2?sp.min:sp.max);
    A.store.set(key, nv, 'user'); await wait(120);
    ok(!nw.classList.contains('is-new') && GV.kicks.pad && !GV.kicks.bells && (pp.hot>0.3 || GV.reduced), 'toucher un contrôle « Nouveau » du Pad ('+key+') : le halo s\'éteint, la plante du Pad réagit (impulsion, mise en évidence '+(pp.hot||0).toFixed(2)+')');
    A.store.set(key, v, 'preset'); }
  // a click during the sequence fast-forwards it; the highlight lasts NEW_MS at most (shortened here); reduced motion = final state at once
  { A.tree.NEW_MS=300; A.contracts.finish('h.forcer'); await wait(30); ok(A.game.isReady('h.drone') && !A.garden.seq, 'Drone qui suit prêt');
    A.garden.openNode('h.drone'); ok(A.garden.seq && A.game.has('h.drone'), 'ouvert → séquence lancée');
    d.querySelector('#treeDlg .tree-card').click(); ok(!A.garden.seq && d.getElementById('treeDlg').hidden && !d.querySelector('#treeDlg .is-buying, #treeDlg .is-born, #treeDlg .tree-glow.lit') && d.querySelector('[data-key="drone.follow"].is-new'), 'clic pendant la séquence : accélérée jusqu\'à la fin, le nouveau réglage arrive');
    await wait(450); ok(!d.querySelector('.is-new'), 'surbrillance terminée après NEW_MS (8 s au plus, ici 0,3 s) sans toucher'); A.tree.NEW_MS=8000;
    // the queue: two nodes ready, the button says how many; they open one after the other
    A.contracts.finish('h.son'); A.game.ready('e.reverb', 'm.monte'); await wait(20);
    ok(ltx.textContent==='✦ Ouvrir : Accords riches' && lt.querySelector('.lcd-task-n').textContent==='2 prêts' && !A.contracts.state().active.length, 'file : « ✦ Ouvrir : Accords riches » · « 2 prêts »');
    ltx.click(); await wait(20); ok(/^Ensuite : [^,]+\.$/.test(odlg.querySelector('.open-more').textContent) && odlg.querySelector('.open-all').hidden, 'la carte dit lequel attend ensuite (« '+odlg.querySelector('.open-more').textContent+' »), pas de « Tout ouvrir » pour 2');
    A.garden.showTree(true); await wait(20); A.garden.reduced=true; odlg.querySelector('.open-go').click();
    ok(A.game.has('h.pad2') && tn('h.pad2').classList.contains('st-owned') && !tn('h.pad2').classList.contains('is-born') && !d.querySelector('#treeDlg .tree-glow.lit') && !d.getElementById('treeDlg').hidden, 'mouvement réduit : état final tout de suite, sans animation');
    await wait(800); ok(d.getElementById('treeDlg').hidden && !A.garden.seq, 'mouvement réduit : puis fermeture'); A.garden.reduced=false;
    ok(ltx.textContent==='✦ Ouvrir : Reverb' && !lt.querySelector('.lcd-task-n').textContent && !A.contracts.state().active.length, 'puis le suivant de la file : « ✦ Ouvrir : Reverb », toujours pas de défi');
    A.garden.openNode('e.reverb'); await wait(20); for (let i=0;i<60 && A.garden.seq;i++) await wait(40);
    ok(A.game.has('e.reverb') && !lt.classList.contains('ready') && A.contracts.state().active.length===1, 'file vide : le défi suivant revient');
    A.game.reset(); A.game.unlock('h.pad'); }
  // G11.1: at 390 px the map pans / zooms inside the card, nothing overflows horizontally
  { f.style.width='390px'; f.style.height='844px'; await wait(200); A.garden.showTree(true); await wait(80);
    const de=d.documentElement, card=d.querySelector('#treeDlg .tree-card'), map=d.querySelector('#treeDlg .tree-map');
    ok(de.scrollWidth<=de.clientWidth && card.getBoundingClientRect().right<=de.clientWidth && map.clientWidth<=card.clientWidth && A.garden.view.k>=0.45 && A.garden.treeLayout().nar && (A.garden.fitTree(true), A.garden.treeLayout().W*A.garden.view.k<=map.clientWidth+1 && A.garden.treeLayout().H*A.garden.view.k<=map.clientHeight+1), '390 px : aucun débordement ('+de.scrollWidth+'/'+de.clientWidth+'), S5.7 éventail étroit, ouvre à k≥0,45, ⤢ = toute la carte (zoom '+A.garden.view.k.toFixed(2)+')'); A.garden.fitTree();
    ok(/^\d+\/32$/.test(d.querySelector('.tree-count').textContent) && card.getBoundingClientRect().bottom<=de.clientHeight+1, '390 px : nœuds ouverts '+d.querySelector('.tree-count').textContent+', carte dans l\'écran');
    A.garden.showTree(false); f.style.width='1300px'; f.style.height='900px'; await wait(200); A.garden.showTree(true); await wait(30); }
  d.querySelector('#treeDlg [data-close]').click(); ok(d.getElementById('treeDlg').hidden, 'fermeture');
  ok(!locked('#play') && !locked('[data-key="drone.vol"]') && !locked('[data-mode=sculpt]'), 'racine visible (lecture, drone, Sculpter)');
  ok(locked('#dice') && locked('[data-key="fx.echo"]') && locked('[data-mode=compose]') && locked('#scenes') && locked('.recgrp'), 'le reste caché');
  ok(locked('.panel[data-sec=fx]') && locked('.panel[data-sec=bells]') && !locked('.panel[data-sec=drone]') && locked('.chords-panel'), 'panneaux vides cachés');

  ok(shown('.panel[data-sec=drone]') && shown('[data-key="drone.tone"]') && !shown('[data-key="drone.wave"]'), 'Sculpter : seul le drone de base');

  A.game.unlock('m.bells'); ok(A.game.unlock('c.seq'), 'Mélodie écrite ouverte'); await wait(50);
  ok(!locked('[data-mode=compose]') && !locked('.roll-wrap') && !locked('.slot-tabs') && !locked('.roll-wrap [data-act=liverec]') && !locked('[data-key="seq.arpDir"]') && locked('[data-key="bass.wave"]') && locked('.song-panel'), 'S3.5 : Mélodie écrite = piano roll, motifs, arpège et Rec live ; Rythme et Morceau encore fermés');
  A.game.setMode('free'); await wait(50);

  ok(A.mode==='listen', 'mode verrouillé → retour Écouter');

  ok(!A.tree.byId['c.midi'] && !locked('#midi') && /Clavier MIDI/.test(A.tree.grantsText('racine')), 'S5.7 : le MIDI dès la Graine (sa note est le premier défi), pas de nœud MIDI');
  A.game.unlock('m.bells'); await wait(20);

  // --- the challenge on the LCD (v1.06): one at a time on the 2nd line, ↷ = next, a tap = how to do it
  // S5.7: the first one is « Joue une note »; no jargon yet. S6.2: no glide on the screen, a MIDI CC still reaches the drone's colour
  A.game.reset(); A.perform.setMode('listen'); A.lcdMsg=null; await wait(400);
  ok(!d.getElementById('contracts') && shown('#lcdTask') && lline.hidden && /Joue une note/.test(task.textContent) && /·/.test(task.querySelector('.lcd-task-n').textContent) && !/✧/.test(task.textContent), 'premier défi sur la 2e ligne du LCD, sans ✧ : '+task.textContent);
  ok(d.body.classList.contains('jargon-off') && d.getElementById('lcdTop').textContent==='JUNOJUNO' && w.getComputedStyle(d.getElementById('hudInfo')).visibility==='hidden' && w.getComputedStyle(d.getElementById('chordName')).visibility==='hidden', 'début : ni nom de paysage, ni tonalité, gamme, tempo ou accord à l\'écran (« '+d.getElementById('lcdTop').textContent+' »)');

  for (const x of [0.1,0.9,0.2,0.8]) { A.perform.setMacro('macro.light', x); A.perform.setMacro('macro.density', 0.5); }
  ok(A.store.get('drone.tone')!==tone0 && A.store.get('macro.light')===mac0 && locked('.macros [data-key="macro.light"]') && !A.game.isReady('m.bells'), 'un CC MIDI dès la Graine : la couleur du drone suit, les grands réglages restent fermés ; ce n\'est pas un défi');
  A.bus.emit('live',{midi:62,time:0,vel:0.8,raw:null}); ok(A.game.isReady('m.bells'), 'S5.7 : une note jouée → Mélodie prête');

  // S4.2: a gate opened by a Réponse on the LCD; a tap says how (no card any more)
  { const st=A.contracts.state(); A.game.unlock('t.son'); st.active=['p.premier']; A.garden.renderContracts(); await wait(20);
    ok(/↺ Réponse : Premier reflet/.test(task.textContent) && /3 ♪/.test(task.querySelector('.lcd-task-n').textContent), 'une porte à Réponse sur le LCD : '+task.textContent);
    task.querySelector('.lcd-task-txt').click(); await wait(30);
    ok(!d.getElementById('puzzle') && !d.querySelector('.pz-pads, .puzzle-card') && task.classList.contains('help') && /À toi/.test(task.textContent) && /3 notes justes/.test(task.textContent), 'toucher : l\'aide sur le LCD, aucune carte ('+task.querySelector('.lcd-task-txt').textContent.slice(0,60)+'…)');
    task.querySelector('.lcd-task-txt').click(); }
  A.seq.playing=false;
  A.game.setMode('free'); await wait(20); ok(!shown('#lcdTask') && !lline.hidden, 'mode libre : la 2e ligne redevient l\'état du son'); A.game.setMode('path'); await wait(20);
  // 390 px: the contract stays in the LCD, nothing floats over the macros
  { f.style.width='390px'; f.style.height='844px'; await wait(250); A.perform.setMode('listen'); A.game.unlock('t.son'); A.game.unlock('t.macros'); await wait(100);
    const R=(e)=>e.getBoundingClientRect(), mac=d.getElementById('macros'), lr=R(d.getElementById('lcd')), de=d.documentElement;
    const over=[...d.querySelectorAll('body *')].filter(e=>{ const cs=w.getComputedStyle(e); return (cs.position==='fixed') && e.getClientRects().length && !e.hidden && cs.display!=='none' && cs.visibility!=='hidden' && cs.pointerEvents!=='none' && e.id!=='toast' && !e.closest('.stage'); /* (S8.3: the city is the fixed background, under everything; checked below) */ }).filter(e=>{ const a=R(e), m=R(mac); return a.width && a.height && a.left<m.right && a.right>m.left && a.top<m.bottom && a.bottom>m.top; });
    const kr=R(mac.querySelector('.knob')), top=d.elementFromPoint(kr.left+kr.width/2, kr.top+kr.height/2);
    ok(shown('#macros') && !!top && !!top.closest('#macros') && lr.right<=de.clientWidth+1 && task.getBoundingClientRect().bottom<=lr.bottom+1 && !over.length, '390 px : contrat dans le LCD, rien ne recouvre les macros '+over.map(e=>e.id||e.className).join());
    f.style.width='1300px'; f.style.height='900px'; await wait(200); }
}, { choose: false });
</script></body></html>
