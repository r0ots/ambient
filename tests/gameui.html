<!doctype html><html><head><meta charset="utf-8"></head><body>
<script>
const TAG=location.pathname.split('/').pop().replace('.html','');
const S=+(new URLSearchParams(location.search).get('s')||0.4);
const log=(m)=>fetch('/__log?'+encodeURIComponent(TAG+'|'+m)).catch(()=>{});
const wait=(ms)=>new Promise(r=>setTimeout(r,ms));
window.onerror=(m,s,l)=>log('ERROR '+m+' @'+s+':'+l);
localStorage.removeItem('ambient.game.uitest');
</script>
<iframe id="f" src="../index.html?gamekey=ambient.game.uitest" style="width:1300px;height:900px"></iframe>
<script>
const ok=(c,m)=>log((c?'ok ':'ERROR fail ')+m);
const f=document.getElementById('f');
f.addEventListener('load', async ()=>{
  try{
  const w=f.contentWindow, d=f.contentDocument, A=w.AMB;
  w.addEventListener('error',e=>log('ERROR '+e.message+' @'+e.filename+':'+e.lineno));
  const shown=(sel)=>{ const e=d.querySelector(sel); return !!e && w.getComputedStyle(e).display!=='none' && !e.closest('.is-locked'); };
  const locked=(sel)=>{ const e=d.querySelector(sel); return !!e && !!e.closest('.is-locked'); };
  ok(!d.body.classList.contains('game') && !d.querySelector('.is-locked'), 'mode non choisi : rien de verrouillé');
  ok(!d.getElementById('welcomeDlg').hidden, 'accueil affiché à la 1re visite');
  d.querySelector('[data-choose=path]').click(); await wait(50);
  ok(A.game.s.mode==='path' && d.getElementById('welcomeDlg').hidden && /libre/.test(d.getElementById('gameMode').textContent), 'choix Parcours → dialogue fermé, bascule « mode libre » dans ⋯');
  d.getElementById('gameMode').click(); ok(A.game.s.mode==='free', 'bascule ⋯ → libre'); d.getElementById('gameMode').click();
  ok(d.body.classList.contains('game'), 'body.game');
  ok(shown('#treeBtn'), 'bouton Arbre visible en parcours'); d.getElementById('treeBtn').click(); await wait(50);
  const tn=(id)=>d.querySelector('.tree-node[data-id="'+id+'"]');
  ok(!d.getElementById('treeDlg').hidden && d.querySelectorAll('.tree-node').length===A.tree.NODES.length && d.querySelectorAll('.tree-col').length===5, 'écran Arbre : 5 branches, tous les nœuds');
  ok(tn('racine').classList.contains('st-owned') && tn('h.pad').classList.contains('st-available') && tn('h.scale').classList.contains('st-locked'), 'états acquis / disponible / verrouillé');
  tn('h.scale').click(); ok(!A.game.has('h.scale') && !d.getElementById('treeDlg').hidden, 'clic sur verrouillé : rien');
  tn('h.pad').click(); ok(!A.game.has('h.pad') && /manque/.test(d.getElementById('toast').textContent), 'pas assez d\'éclats : refus '+d.getElementById('toast').textContent);
  A.game.earn(10,'t'); A.perform.setMode('listen'); tn('h.pad').click(); await wait(80);
  ok(A.game.has('h.pad') && A.game.s.shards===0 && d.getElementById('treeDlg').hidden, 'achat au clic, arbre fermé');
  ok(A.mode==='sculpt' && d.querySelector('.panel[data-sec=pad] .is-new'), 'révélé : mode Sculpter, réglages du Pad en surbrillance');
  d.getElementById('treeBtn').click(); await wait(30);
  d.querySelector('#treeDlg [data-close]').click(); ok(d.getElementById('treeDlg').hidden, 'fermeture');
  ok(!locked('#play') && !locked('[data-key="drone.vol"]') && !locked('[data-mode=sculpt]'), 'racine visible (lecture, drone, Sculpter)');
  ok(locked('#dice') && locked('[data-key="fx.echo"]') && locked('[data-mode=compose]') && locked('#scenes') && locked('.recgrp'), 'le reste caché');
  ok(locked('.panel[data-sec=fx]') && locked('.panel[data-sec=bells]') && !locked('.panel[data-sec=drone]') && locked('.chords-panel'), 'panneaux vides cachés');
  A.perform.setMode('sculpt'); await wait(50);
  ok(shown('.panel[data-sec=drone]') && shown('[data-key="drone.tone"]') && !shown('[data-key="drone.wave"]'), 'Sculpter : seul le drone de base');
  A.game.earn(100,'test'); ok(A.game.has('h.pad') && A.tree.buy('t.son'), 'achats'); await wait(50);
  ok(shown('.panel[data-sec=pad]') && shown('[data-key="drone.wave"]') && !shown('[data-key="pad.attack"]'), 'achat → réglages révélés');
  A.game.earn(100,'test'); A.game.solve('p.composer'); A.tree.buy('m.bells'); ok(A.tree.buy('c.seq'), 'Mélodie écrite achetée'); await wait(50);
  ok(!locked('[data-mode=compose]') && !locked('.roll-wrap') && locked('.slot-tabs') && locked('.song-panel'), 'Composer ouvert, motifs/morceau encore fermés');
  A.game.setMode('free'); await wait(50);
  ok(!d.body.classList.contains('game') && d.querySelectorAll('.is-locked').length===0, 'mode libre : appli intacte');
  A.game.setMode('path'); A.game.reset(); A.perform.setMode('compose'); A.tree.applyLocks(); await wait(50);
  ok(A.mode==='listen', 'mode verrouillé → retour Écouter');
  // --- sound locking (G1.5)
  const St=A.store, g=A.game;
  g.setMode('free'); St.set('fx.echo',0.6,'user'); St.set('pad.on',true,'user');
  g.setMode('path'); g.reset(); await wait(50);
  ok(St.get('pad.on')===false && St.get('fx.echo')===0 && St.get('global.evolve')===0 && St.get('drone.on')===true, 'verrouillé = neutre (pad muet, pas d\'écho), drone joue');
  St.set('pad.on',true,'user'); A.ui.applyPatch({'pad.on':true,'fx.echo':0.8,'drone.tone':0.9});
  ok(St.get('pad.on')===false && St.get('fx.echo')===0 && Math.abs(St.get('drone.tone')-0.9)<0.02, 'presets/utilisateur ne touchent pas le verrouillé '+St.get('drone.tone'));
  g.earn(50,'t'); A.tree.buy('h.pad'); ok(St.get('pad.on')===true, 'acheter le Pad le fait jouer');
  g.setMode('free'); ok(Math.abs(St.get('fx.echo')-0.6)<0.02 && St.get('pad.on')===true, 'retour en libre : son libre rendu');
  St.set('pad.on',false,'user'); ok(St.get('pad.on')===false, 'libre : tout modifiable');
  g.setMode('path'); ok(St.get('fx.echo')===0 && St.get('pad.on')===true, 'retour au parcours : son du parcours rendu');
  g.setMode('free'); ok(!shown('#treeBtn'), 'pas de bouton Arbre en libre');
  localStorage.removeItem('ambient.game.uitest');
  for (const k of Object.keys(localStorage)) if (k.startsWith('ambient.game.uitest')) localStorage.removeItem(k);
  log('DONE');
  }catch(e){log('EXC '+e.stack)}
});
</script></body></html>
