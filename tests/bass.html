<script>
const params=new URLSearchParams(location.search);
async function measure(label, secs){
  const an=AMB.engine.analyser, buf=new Float32Array(an.fftSize);
  let peak=0,sum=0,n=0; const t0=performance.now();
  while(performance.now()-t0<secs*1000){ an.getFloatTimeDomainData(buf); for(const v of buf){peak=Math.max(peak,Math.abs(v));sum+=v*v;n++;} await new Promise(r=>setTimeout(r,40*S)); }
  log(`${label} rms=${Math.sqrt(sum/n).toFixed(4)} peak=${peak.toFixed(3)} notes=${notes} t=${AMB.engine.ctx.currentTime.toFixed(1)}`);
}
let notes=0;
window.addEventListener('load', async ()=>{
  try{
  const st=AMB.store, B=AMB.bassSeq;
  const got=[]; AMB.bus.on('note',n=>{ if(n.layer==='bass') got.push(n.midi); });
  log('cells='+document.querySelectorAll('[aria-label^="Basse"]').length);
  ['drone','pad','bells','grains','texture'].forEach(l=>st.set(l+'.on',false));
  st.set('pad.prog','I–V–vi–IV'); st.set('pad.length',1); st.set('global.tempo',140);
  document.querySelector('[data-b=Marche]').click();
  log('on='+st.get('bass.on')+' pattern='+st.get('bass.pattern'));
  await AMB.ui.play(); await new Promise(r=>setTimeout(r,4000));
  await measure('bass notes='+got.length+' midis='+got.slice(0,8).join(','),1);
  log('DONE');
  }catch(e){log('EXC '+e.stack)}
});
