<!doctype html><html><head><meta charset="utf-8"></head><body style="margin:0">
<!-- Arcade cabinet (v0.99 fixes): the round starts the audio, refuses to start while recording, inert app, focus back, MIDI muted. -->
<script src="lib.js"></script>
<script>localStorage.removeItem('ambient.game.arcui'); localStorage.removeItem('ambient.arcade.arcui');</script>
<iframe id="f" src="../index.html?gamekey=ambient.game.arcui&arcadekey=ambient.arcade.arcui" style="width:1200px;height:800px;border:0"></iframe>
<script>
const f=document.getElementById('f');
f.addEventListener('load', async ()=>{
  try{
  const w=f.contentWindow, d=f.contentDocument, A=w.AMB, AR=A.arcade, U=A.arcadeUI, dlg=d.getElementById('arcadeDlg');
  w.addEventListener('error',e=>log('ERROR '+e.message+' @'+e.filename+':'+e.lineno));
  A.game.setMode('free'); A.garden.welcome(false);
  const cart=()=>d.querySelector('.arc-cart[data-game=hautbas]');
  // --- opening: the rest of the app is inert, the cabinet is not
  d.getElementById('arcadeBtn').focus(); d.getElementById('arcadeBtn').click(); await wait(30);
  ok(AR.open && !dlg.hidden && d.getElementById('play').closest('[inert]') && d.getElementById('arcadeBtn').closest('[inert]') && !dlg.closest('[inert]'), 'borne ouverte : reste de l\'appli inert, borne active');
  // --- MIDI muted for the app as soon as the cabinet is open (no round yet)
  { let calls=0; const pm=A.seq.playMidi, pl=A.seq.playing; A.seq.playMidi=()=>calls++; A.seq.playing=true;
    A.play.onMidi({data:[0x90,72,100]}); A.seq.playMidi=pm; A.seq.playing=pl; ok(calls===0 && !AR.active, 'borne ouverte (menu) : le MIDI ne joue pas dans l\'appli'); }
  // --- a round never starts while recording
  const rec0=A.rec.recording; A.rec.recording=()=>true;
  cart().click(); await wait(60);
  const msg=d.querySelector('.arc-msg');
  ok(!AR.active && !msg.hidden && /Enregistrement en cours/.test(msg.textContent) && !dlg.querySelector('.arc-menu').hidden, 'enregistrement en cours : pas de manche, message clair (« '+msg.textContent.slice(0,40)+'… »)');
  A.rec.recording=rec0;
  // --- the round starts the audio (never a silent round)
  ok(!A.engine.ctx || A.engine.ctx.state!=='running', 'audio pas encore démarré ('+(A.engine.ctx?A.engine.ctx.state:'aucun contexte')+')');
  cart().click(); await wait(250);
  ok(AR.active && A.engine.ctx && A.engine.ctx.state==='running' && msg.hidden, 'cartouche : audio démarré avant la manche ('+(A.engine.ctx&&A.engine.ctx.state)+'), message effacé');
  AR.end({abort:true}); U.menu(); await A.engine.ctx.suspend();
  cart().click(); await wait(250);
  ok(AR.active && A.engine.ctx.state==='running', 'contexte suspendu : repris au lancement de la manche');
  // --- closing: nothing inert left, focus back on the Arcade button
  U.close(); await wait(20);
  ok(!AR.active && dlg.hidden && !AR.open && !d.querySelector('[inert]') && d.activeElement===d.getElementById('arcadeBtn'), 'fermeture : plus rien d\'inert, focus rendu au bouton Arcade');
  // closing while the audio starts: no round behind a closed cabinet
  d.getElementById('arcadeBtn').click(); await wait(20); await A.engine.ctx.suspend(); cart().click(); U.close(); await wait(250);
  ok(!AR.active && !AR.round, 'fermée pendant le démarrage audio : aucune manche ne démarre derrière');
  // --- plugin prepare(api): runs before arcade.start (off the clock), gets the keys; then the plugin's reveal pause
  { let P=null; const until=async(f)=>{ for(let i=0;i<60&&!f();i++) await wait(50); };
    AR.register({id:'t.prep', title:'Prep', reveal:1600, make:(rng)=>({v:rng.int(3)}), choices:()=>[0,1,2].map(v=>({value:v,label:String(v)})), check:(ch,a)=>({ok:a===ch.v}),
      prepare:(api)=>new Promise((res)=>{ P={api, res, keys:''}; api.onKey((e)=>{ P.keys+=e.code; return true; }); }) });
    U.open(); U.start('t.prep'); await until(()=>P);
    ok(P && !AR.active && !AR.round && U.screen==='play' && P.api.stage===dlg.querySelector('.arc-stage') && AR.prep && !P.api.cancelled(), 'prepare(api) avant la manche : aucun chrono, scène fournie');
    w.dispatchEvent(new w.KeyboardEvent('keydown',{code:'KeyA',key:'a',bubbles:true})); ok(P.keys==='KeyA', 'pendant prepare : touches routées au plugin');
    const tRes=w.performance.now(); P.res(); await until(()=>AR.active);
    ok(AR.active && !AR.prep && AR.round.t0>=tRes-5 && AR.timeLeft()>74000, 'prepare résolu → la manche démarre ensuite, chrono complet ('+(AR.timeLeft()/1000).toFixed(1)+' s)');
    await wait(400); const good=AR.round.ch.v; U.pick(good); const lock=U.lockUntil-Date.now();
    ok(lock>1800 && lock<=1950, 'réponse : défi suivant après le reveal du plugin (1600 + 350 de rendu = '+lock+' ms ; 450 + 350 sans hook)');
    U.menu(); P=null; U.start('t.prep'); await until(()=>P); const P2=P;
    w.dispatchEvent(new w.KeyboardEvent('keydown',{key:'Escape',code:'Escape',bubbles:true}));
    ok(P2.api.cancelled() && U.screen==='menu' && !AR.prep, 'Échap pendant prepare : annulé, retour au menu');
    P2.res(); await wait(60); ok(!AR.active && !AR.round, 'prepare annulé : aucune manche ne démarre');
    U.close(); delete AR.byId['t.prep']; AR.games.splice(AR.games.findIndex(g=>g.id==='t.prep'),1); }
  // --- v1.02: the sustain pedal never sticks across the cabinet (reset on open and close)
  U.open(); AR.cc({cc:64, value:1}); const held=AR.sustain; U.close(); const afterClose=AR.sustain;
  AR.sustain=true; U.open(); const afterOpen=AR.sustain; U.close();
  ok(held && !afterClose && !afterOpen, 'sustain (CC64) remis à false à la fermeture et à l\'ouverture de la borne');
  // --- R1: one end-of-round hook, onEnd per call (true = the caller keeps its own screen)
  { const until=async(f)=>{ for(let i=0;i<60&&!f();i++) await wait(50); };
    ok(!('after' in U), 'plus d\'emplacement global arcadeUI.after');
    let got=[]; U.open(); U.start('hautbas',{onEnd:(d)=>{ got.push(d); U.show('menu'); return true; }}); await until(()=>AR.active);
    AR.end(); await wait(10);
    ok(got.length===1 && !got[0].abort && U.screen==='menu', 'onEnd → true : l\'appelant garde son écran (pas d\'écran de fin)');
    got=[]; U.start('hautbas',{onEnd:(d)=>{ got.push(d); }}); await until(()=>AR.active);
    AR.end(); await wait(10);
    ok(got.length===1 && U.screen==='end', 'onEnd sans true : écran de fin de la borne');
    got=[]; U.start('hautbas',{onEnd:(d)=>{ got.push(d); return true; }}); await until(()=>AR.active);
    U.menu(); await wait(10);
    ok(got.length===1 && got[0].abort && U.screen==='menu', 'manche quittée : onEnd reçoit l\'abandon, une seule fois');
    // a recording refuses a caller's round on its own screen: false, nothing changed (the caller shows its message)
    U.show('daily'); const rec1=A.rec.recording; A.rec.recording=()=>true;
    const res=await U.start('hautbas',{onEnd:()=>true});
    ok(res===false && U.screen==='daily' && !AR.active, 'enregistrement : start → false, l\'écran de l\'appelant reste (rien d\'écrit)');
    A.rec.recording=rec1; U.close(); }
  localStorage.removeItem('ambient.game.arcui'); localStorage.removeItem('ambient.arcade.arcui');
  done();
  }catch(e){ fail(e); }
});
</script></body></html>
