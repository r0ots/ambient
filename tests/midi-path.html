<!doctype html><html><head><meta charset="utf-8"></head><body style="margin:0">
<!-- MIDI path of the app and the mini-games (G9b.1), driven by the fake MIDI keyboard (tests/fake-midi.js):
     free mode → the app plays the note; cabinet open → the app plays nothing; « Réponds » round → onMidi / onMidiOff
     reach the plugin and the notes are graded. Same entry point as a real keyboard (input.onmidimessage). -->
<script src="lib.js"></script><script src="fake-midi.js"></script>
<script>localStorage.removeItem('ambient.game.midipath'); localStorage.removeItem('ambient.arcade.midipath');</script>
<iframe id="f" src="../index.html?gamekey=ambient.game.midipath&arcadekey=ambient.arcade.midipath" style="width:1200px;height:800px;border:0"></iframe>
<script>
const f = document.getElementById('f'), T0 = performance.now();
f.addEventListener('load', async () => {
  try {
    const w = f.contentWindow, d = f.contentDocument, A = w.AMB, AR = A.arcade, U = A.arcadeUI;
    w.addEventListener('error', (e) => log('ERROR ' + e.message + ' @' + e.filename + ':' + e.lineno));
    const until = async (fn, n = 80) => { for (let i = 0; i < n && !fn(); i++) await wait(25); return fn(); };
    A.game.setMode('free'); A.garden.welcome(false);
    const kb = fakeMidi(w);
    ok(await kb.connect() && kb.asked === 1 && /MIDI · 1/.test(d.getElementById('midi').textContent), 'faux clavier branché par le bouton MIDI (onmidimessage = ' + (kb.input.onmidimessage === A.play.onMidi ? 'AMB.play.onMidi' : '?') + ')');
    // spies on the app side (they call through)
    const app = { notes: [], chords: [], live: [], macros: [] };
    const pm = A.seq.playMidi, fc = A.seq.forceChord, sm = A.perform.setMacro;
    A.seq.playMidi = function (...a) { app.notes.push(a); return pm.apply(this, a); };
    A.seq.forceChord = function (...a) { app.chords.push(a); return fc.apply(this, a); };
    A.perform.setMacro = function (...a) { app.macros.push(a); return sm.apply(this, a); };
    A.bus.on('live', (x) => app.live.push(x));
    const reset = () => { app.notes = []; app.chords = []; app.live = []; app.macros = []; };

    // --- free mode, playing: the app plays the note (velocity remapped, raw velocity on 'live')
    await A.ui.play(); await until(() => A.seq.playing);
    kb.on(72, 100); kb.off(72); kb.on(40, 90); kb.off(40, undefined, { zero: true }); kb.cc(74, 127);
    const n = app.notes[0], raw = 100 / 127;
    ok(A.seq.playing && app.notes.length === 1 && n[0] === 72 && Math.abs(n[1] - (0.25 + 0.75 * raw)) < 1e-9 && Math.abs(n[2] - raw) < 1e-9, 'mode libre : note 72 jouée par l\'appli (vélocité entendue ' + n[1].toFixed(2) + ', brute ' + n[2].toFixed(2) + ')');
    ok(app.live.length === 1 && app.live[0].midi === 72 && Math.abs(app.live[0].raw - raw) < 1e-9 && app.chords.length === 1 && app.macros.length === 1 && app.macros[0][0] === 'macro.light', 'mode libre : événement live (vélocité brute), note grave → accord, CC74 → Lumière');

    // --- cabinet open (menu): the app plays nothing, CCs ignored
    reset(); d.getElementById('arcadeBtn').click(); await wait(20);
    kb.on(72, 100); kb.on(40, 100); kb.off(72); kb.cc(74, 10);
    ok(AR.open && !AR.active && app.notes.length + app.chords.length + app.live.length + app.macros.length === 0, 'borne ouverte : l\'appli ne joue rien (ni note, ni accord, ni CC)');

    // --- a « Réponds » round: note-on / note-off go to the plugin, the notes are graded
    const g = AR.byId.reponds;
    A.latency.data = { v: 1, dev: {}, any: 0, midi: 0 }; // already calibrated (global latency, js/latency.js: no calibration, nothing saved)
    const ons = [], offs = [], answers = [];
    const om = g.onMidi; g.onMidi = function (...a) { ons.push(a[1]); return om.apply(this, a); };
    g.onMidiOff = function (ch, m) { offs.push(m); };
    A.bus.on('arcade:answer', (x) => answers.push(x));
    AR.stats('reponds').d = 0; // easy: 2–3 notes on the beats
    d.querySelector('.arc-cart[data-game=reponds]').click();
    await until(() => AR.active && AR.round.ch && g.st(AR.round.ch).mode !== 'idle');
    const ch = AR.round.ch, s = g.st(ch), clock = AR.clock.now; let off = 0;
    AR.clock = { now: () => clock() + off }; // fast-forward the round's clock (the plugin judges from it)
    off = s.t0 + g.respStart(ch) - clock() + 5; // now at the start of the response bar
    await until(() => s.mode === 'answer' || s.mode === 'listen', 20);
    const rs = s.t0 + g.respStart(ch);
    ch.notes.forEach((nt) => { const t = rs + nt.t; kb.on(ch.root + nt.semi, 96, t); kb.off(ch.root + nt.semi, t + 120); });
    ok(ons.length === ch.notes.length && ons.every((m, i) => m.midi === ch.root + ch.notes[i].semi && Math.abs(m.vel - 96 / 127) < 1e-9 && m.time === rs + ch.notes[i].t), 'manche Réponds : onMidi reçu ×' + ons.length + ' (hauteur, vélocité brute, horodatage MIDI)');
    ok(offs.length === ch.notes.length && offs.every((m, i) => m.midi === ch.root + ch.notes[i].semi && m.time === rs + ch.notes[i].t + 120), 'manche Réponds : onMidiOff reçu ×' + offs.length);
    ok(s.hits.length === ch.notes.length && s.live && s.live.grades.every((x) => x === 'perfect'), 'notes notées : ' + s.hits.length + ' frappes, ' + (s.live ? s.live.grades.join(' ') : '—'));
    ok(app.notes.length + app.chords.length + app.live.length === 0, 'pendant la manche : l\'appli ne joue pas les notes');
    off += ch.bar + ch.win.match + 600; // past the response bar: judged, then sent
    await until(() => answers.length > 0, 40);
    ok(answers.length === 1 && answers[0].ok && answers[0].bonus === 1 && answers[0].pts > 0, 'réponse jouée au faux clavier : juste, tout « parfait » (+' + (answers[0] && answers[0].pts) + ')');
    AR.clock = { now: clock }; delete g.onMidiOff; g.onMidi = om; A.latency.reset();

    // --- cabinet closed: the app plays MIDI again
    U.close(); await wait(20); reset();
    kb.on(67, 64);
    ok(!AR.open && app.notes.length === 1 && app.notes[0][0] === 67 && app.live.length === 1, 'borne fermée : l\'appli rejoue la note');
    A.seq.playMidi = pm; A.seq.forceChord = fc; A.perform.setMacro = sm; A.ui.stop();
    localStorage.removeItem('ambient.game.midipath'); localStorage.removeItem('ambient.arcade.midipath');
    log('durée ' + ((performance.now() - T0) / 1000).toFixed(1) + ' s');
    done();
  } catch (e) { fail(e); }
});
</script></body></html>
