<!doctype html><html><head><meta charset="utf-8"></head><body style="margin:0">
<!-- « Défie ton cousin » (G10.3): links (malformed, forged), Réponds duel (same motif for both, sender must succeed first,
     ghost round), Mastermind duel (seeded target and start, pegs, own sound restored), reply link → comparison, free mode. -->
<script src="lib.js"></script>
<script>['game','arcade','daily','duel'].forEach(k=>localStorage.removeItem('ambient.'+k+'.dut')); localStorage.removeItem('ambient.reponds.dut');</script>
<iframe id="f" src="../index.html?gamekey=ambient.game.dut&arcadekey=ambient.arcade.dut&dailykey=ambient.daily.dut&duelkey=ambient.duel.dut" style="width:1200px;height:800px;border:0"></iframe>
<script>
const f=document.getElementById('f');
f.addEventListener('load', async ()=>{
  try{
  const t0=performance.now();
  const w=f.contentWindow, d=f.contentDocument, A=w.AMB, AR=A.arcade, U=A.arcadeUI, DY=A.daily, DU=A.duel, L=DY.link, S=A.store;
  w.addEventListener('error',e=>log('ERROR '+e.message+' @'+e.filename+':'+e.lineno));
  w.AMB_REPONDS_KEY='ambient.reponds.dut'; AR.byId.reponds.setLat('any',0); // already calibrated: no prepare step
  const until=async(fn,n=80)=>{ for(let i=0;i<n&&!fn();i++) await wait(50); return fn(); };
  const setHash=async(h)=>{ w.location.hash=h; await wait(80); };
  const q=(s)=>d.querySelector('.arc-duel '+s);
  // --- parse: valid, forged, malformed
  const R={v:1,k:'r',sd:123456,d:0.45,n:'Léo',s:900,p:'m'}, M={v:1,k:'m',th:'p.premier',sd:42,n:'Léo',s:DU.mmScore(2,3),p:'m',t:2,l:3};
  ok(DU.parse(L.decode(L.encode(R))) && DU.parse(L.decode(L.encode(M))), 'liens de duel Réponds et Mastermind : aller-retour lisible');
  ok(DU.parse({...M,s:6000})===null && DU.parse({...M,th:'p.inconnue'})===null && DU.parse({...R,d:2})===null && DU.parse({...R,s:99999})===null && DU.parse({...R,sd:-1})===null && DU.parse({...R,k:'x'})===null, 'falsifiés / hors bornes (score Mastermind incohérent, thème inconnu, niveau 2, score géant, graine négative) → rejetés');
  let threw=false; try{ ['', 'x~y', '~', null, 'e30~'+L.sign('e30'), 'W10~'+L.sign('W10')].forEach(j=>{ if(DU.parse(L.decode(j))) throw new Error('accepté '+j); }); }catch(e){ threw=e.message; }
  ok(!threw, 'liens malformés : aucune exception'+(threw?' — '+threw:''));
  // --- Mastermind target: deterministic from the seed, start ≠ target
  const m1=DU.draw('p.premier',42), m2=DU.draw('p.premier',42), m3=DU.draw('p.premier',43);
  ok(JSON.stringify(m1)===JSON.stringify(m2) && JSON.stringify(m1)!==JSON.stringify(m3) && m1.keys.every(k=>A.puzzles.keyScore(k,m1.start[k],m1.target[k])<A.puzzles.PASS), 'énigme de duel : même graine → même cible et même départ ; départ jamais déjà juste ('+m1.keys.join(', ')+')');

  // --- free mode: a duel link proposes the path, nothing stored
  A.game.setMode('free'); A.garden.welcome(false);
  await setHash('#df='+L.encode(R));
  const dlg=d.getElementById('cousinDlg');
  ok(dlg && !dlg.hidden && /Léo te défie/.test(dlg.textContent) && !localStorage.getItem(DU.key), 'lien de défi en mode libre : proposition de Parcours, rien d\'enregistré');
  dlg.querySelector('[data-cz=no]').click(); await wait(20);
  ok(A.game.s.mode==='free' && U.dlg.hidden && !/df=/.test(w.location.hash), '« Plus tard » : reste en mode libre, lien effacé');

  // --- path: sender, Réponds
  A.game.setMode('path'); A.game.earn(200,'test'); ['t.son','h.pad'].forEach(i=>A.tree.buy(i));
  let T=1e6; const clk=AR.clock.now; AR.clock.now=()=>T;
  const st0=localStorage.getItem('ambient.arcade.dut');
  U.open(); await wait(20);
  d.querySelector('.arc-dj-open[data-du=open]').click(); await wait(20);
  ok(U.screen==='duel' && q('[data-du=kind][data-k=r]') && q('[data-du=kind][data-k=m]'), 'écran « Défie ton cousin » : Réponds en jouant ou énigme Mastermind');
  q('[data-du=lvl][data-d="0.45"]').click(); await wait(10);
  const sd=DU.draft.sd;
  ok(q('[data-du=try]') && !q('[data-du=share]'), 'motif tiré : « Réussir mon défi », pas encore de lien');
  q('[data-du=try]').click(); await until(()=>AR.active);
  const ch1=JSON.stringify(AR.round.ch.notes);
  ok(AR.round.game.id==='reponds' && AR.round.seed===sd && AR.round.fixed && AR.round.ghost && AR.round.count===1 && AR.round.d0===0.45 && /TON DÉFI/.test(d.querySelector('.arc-game').textContent), 'mon défi : manche Réponds, graine du motif, niveau figé 45 %, une mesure');
  AR.answer({hits:[]}); await wait(40);
  ok(U.screen==='duel' && DU.view==='made' && !q('[data-du=share]') && q('[data-du=retry]'), 'raté : pas de lien, « Réessayer »');
  q('[data-du=retry]').click(); await until(()=>AR.active);
  const notes=AR.round.ch.notes;
  ok(JSON.stringify(notes)===ch1, 'réessayer : le même motif');
  AR.answer({hits:notes.map(n=>({t:n.t,pc:n.pc}))}); await wait(40);
  const mine=DU.s.mine['r:'+sd+':0.45'];
  ok(DU.view==='made' && mine && mine.ok && mine.s>0 && q('[data-du=share]'), 'réussi ('+(mine&&mine.s)+') : le lien peut partir');
  ok(localStorage.getItem('ambient.arcade.dut')===st0, 'manches de duel fantômes : niveau et records de Réponds intacts');
  q('.arc-dj-name').value='Max'; q('[data-du=share]').click(); await wait(60);
  const txt=q('.arc-dj-link').value, lk=/#df=(\S+)/.exec(txt), sent=lk&&DU.parse(L.decode(lk[1]));
  ok(sent && sent.n==='Max' && sent.sd===sd && sent.d===0.45 && sent.s===mine.s && /^Je te défie/.test(txt), 'lien envoyé : « '+txt.split(' http')[0]+' »');

  // --- receiver (another player = fresh duel state): same motif, comparison, reply link
  DU.s.mine={};
  const prof0=A.game.s.profile; A.game.s.profile='decouverte'; // the cousin is the kid (raw profile, js/game.js)
  await setHash('#df='+lk[1]);
  ok(U.screen==='duel' && DU.view==='take' && /Max/.test(q('.arc-dj-line').textContent) && q('[data-du=take]'), 'lien ouvert en Parcours : écran du défi de Max, « Relever le défi »');
  q('[data-du=take]').click(); await until(()=>AR.active);
  ok(JSON.stringify(AR.round.ch.notes)===ch1 && /DÉFI DE MAX/.test(d.querySelector('.arc-game').textContent), 'le cousin reçoit exactement le même motif');
  const half=AR.round.ch.notes.map((n,i)=>({t:n.t+(i%2?60:0),pc:n.pc}));
  AR.answer({hits:half}); await wait(40);
  const res=DU.result;
  ok(DU.view==='taken' && res.me.p==='k' && res.me.r===DY.rel(res.me.s,'k') && /gagne|Égalité/.test(q('.arc-dj-big').textContent), 'comparaison au score relatif : toi (découverte) '+res.me.s+' → '+res.me.r+' contre Max '+sent.s+' — « '+q('.arc-dj-big').textContent+' »');
  const first=res.me.s;
  q('[data-du=take]').click(); await until(()=>AR.active); AR.answer({hits:[]}); await wait(40);
  ok(DU.result.me.s===first && /premier essai/.test(q('.arc-dj-note').textContent), 'rejouer : seul le premier essai compte');
  A.game.s.profile=prof0;

  // --- Mastermind duel: the player's sound is restored after
  DU.s.mine={};
  const before=JSON.stringify(m1.keys.map(k=>S.get(k)));
  U.menu(); d.querySelector('.arc-dj-open[data-du=open]').click(); await wait(10);
  q('[data-du=kind][data-k=m]').click(); await wait(10);
  const sel=q('.arc-du-theme'); sel.value='p.premier'; sel.dispatchEvent(new Event('change',{bubbles:true})); await wait(10);
  q('[data-du=try]').click(); await wait(20);
  const MM=DU.mm;
  ok(MM && U.screen==='duel' && DU.view==='mm' && MM.keys.every(k=>S.get(k)===MM.start[k]) && d.querySelectorAll('.arc-duel [data-mm]').length===MM.keys.length, 'énigme de duel : son de départ appliqué, un contrôle par réglage');
  q('[data-du=target]').click(); await wait(10);
  ok(MM.listens===1 && MM.keys.every(k=>S.get(k)===MM.target[k]), '▶ cible : on entend la cible (1 écoute)');
  q('[data-du=mine]').click(); q('[data-du=validate]').click(); await wait(10);
  ok(MM.tries.length===1 && d.querySelectorAll('.arc-mm-row').length===1 && d.querySelectorAll('.arc-mm-peg').length===MM.keys.length, 'validation : une ligne de pions ✓ ≈ ✗ ⬆⬇');
  MM.keys.forEach(k=>{ const el=q(`[data-mm="${k}"]`); el.value=String(MM.target[k]); el.dispatchEvent(new Event('input',{bubbles:true})); });
  q('[data-du=validate]').click(); await wait(20);
  const mm=Object.values(DU.s.mine)[0];
  ok(!DU.mm && DU.view==='made' && mm && mm.ok && mm.t===2 && mm.s===DU.mmScore(2,1) && q('[data-du=share]'), 'trouvée en 2 validations : réussi ('+mm.s+'), lien disponible');
  ok(JSON.stringify(m1.keys.map(k=>S.get(k)))===before, 'fin de l\'énigme : le son du joueur revient tel quel');
  // leaving a Mastermind in the middle (Échap → menu) also restores the sound
  DU.view='make'; DU.draft={k:'m',th:'p.premier',sd:7}; DU.kind='m'; DU.render(); q('[data-du=try]').click(); await wait(10);
  w.dispatchEvent(new w.KeyboardEvent('keydown',{key:'Escape',code:'Escape',bubbles:true})); await wait(20);
  ok(!DU.mm && U.screen==='menu' && JSON.stringify(m1.keys.map(k=>S.get(k)))===before, 'Échap pendant l\'énigme : retour au menu, son du joueur rendu');
  // malformed / forged duel links in path mode: message, no exception, nothing changes
  const v0=DU.view; await setHash('#df=AAAA~zz'); await setHash('#df='+L.encode({...M,s:6000}));
  ok(!/df=/.test(w.location.hash) && U.screen==='menu', 'liens abîmé et falsifié en Parcours : ignorés, rien ne s\'ouvre');
  U.close(); AR.clock.now=clk;
  ['game','arcade','daily','duel'].forEach(k=>localStorage.removeItem('ambient.'+k+'.dut')); localStorage.removeItem('ambient.reponds.dut');
  log('durée '+((performance.now()-t0)/1000).toFixed(1)+' s');
  done();
  }catch(e){ fail(e); }
});
</script></body></html>
